  <text x="560" y="575" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#94A3B8">INSTRUCTIONS POUR CLAUDE CODE</text>
  <text x="560" y="625" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0F1B2D">Ne pas réinterpréter. Intégrer ces SVG fidèlement.</text>
  <text x="560" y="670" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">• Bleu accent : #2563FF</text>
  <text x="560" y="710" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">• Encre : #0F1B2D</text>
  <text x="560" y="750" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">• K : fût sombre + diagonale haute bleue + diagonale basse sombre</text>
  <text x="560" y="790" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">• X : proche de “i”, branche / bleue, pas d’effet « Kanvi X »</text>
