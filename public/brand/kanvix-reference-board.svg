  <text x="80" y="150" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#0F1B2D">Logo Kanvix — proposition à intégrer</text>
  <text x="80" y="198" font-family="Inter, Arial, sans-serif" font-size="24" fill="#475569">K distinctif avec diagonale bleue, x final intégré, wordmark lisible en un seul bloc.</text>

