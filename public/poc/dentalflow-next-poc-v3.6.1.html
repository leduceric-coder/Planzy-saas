function renderNav(){const nav=$('#side-nav');if(!nav)return;const open=!!state.toolsOpen;const childActive=toolsActive();const gear='<svg viewBox="0 0 24 24" fill="none"><path d="M12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4ZM19 12a7.5 7.5 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4.8L9.3 6a8 8 0 0 0-1.8 1l-2.4-1-2 3.4 2 1.5a7.5 7.5 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.8 1l.3 3h4.8l.3-3a8 8 0 0 0 1.8-1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';nav.innerHTML=PRIMARY_NAV.map(navItemHTML).join('')+`<button class="side-item nav-tools-toggle${open?' open':''}${childActive?' child-active':''}" id="nav-tools-toggle" type="button" aria-expanded="${open?'true':'false'}" aria-controls="nav-tools" title="Outils">${gear}<span>Outils</span><span class="nav-tools-caret" aria-hidden="true">›</span></button><div class="nav-tools${open?' open':''}" id="nav-tools" role="group" aria-label="Outils">${TOOLS_NAV.map(navItemHTML).join('')}</div>`;updateNav();updateNotif()}

function alertItems(){return getAttentionOrders().map(o=>{const scan=lastScan(o);const [label]=statusInfo(o.status);const color=isOrderLate(o)?'red':isOrderBlocked(o)?'orange':'blue';const reason=isOrderLate(o)?'Retard':isOrderBlocked(o)?'Bloquée':isScanExpected(o)?'Scan attendu':'À livrer aujourd\x27hui';const detail=isOrderLate(o)?`Échéance ${h(o.due)}`:isOrderBlocked(o)?'Validation requise':scan?`Dernier scan ${fmtTime(scan.at)}`:'Scan attendu';const location=scan?`${h(scan.station)} · ${h(scan.tech)} · scan ${fmtTime(scan.at)}`:'Localisation non confirmée';return {id:o.id,color,label,title:o.id,reason,detail,location,order:o}})}

function renderCompareBars(){const cur=weeklyCompare.current,prev=weeklyCompare.previous,labels=weeklyCompare.labels;const maxV=Math.max(...cur,...prev,1);const step=maxV>60?20:10;const axMax=Math.max(Math.ceil(maxV/step)*step,step);const marks=[axMax,Math.round(axMax*2/3),Math.round(axMax/3),0];const n=labels.length;return `<div class="chart2"><div class="chart2-body"><div class="chart2-axis">${marks.map(m=>`<span>${m}</span>`).join('')}</div><div class="chart2-plot" style="--n:${n}">${labels.map((l,i)=>`<div class="chart2-col cmp"><div class="cmp-pair"><div class="chart2-bar cur" style="height:${(cur[i]/axMax*100).toFixed(1)}%"><span class="bar-tip">${cur[i]}</span></div><div class="chart2-bar prev" style="height:${(prev[i]/axMax*100).toFixed(1)}%"><span class="bar-tip">${prev[i]}</span></div></div></div>`).join('')}</div></div><div class="chart2-days"><span></span><div class="days-inner" style="--n:${n}">${labels.map(l=>`<span class="day2">${h(l)}</span>`).join('')}</div></div></div>`}
function renderWatch(){return getAttentionOrders({limit:3}).map(o=>{const sigs=orderSignals(o);const primary=sigs[0]||{key:'info',label:'À surveiller',color:'blue'};const aColor=primary.color;const ico=(primary.key==='late'||primary.key==='blocked')?'warn':'info';const [label,color]=orderStatusInfo(o);const loc=locationText(o);const tech=technicianText(o);const time=scanTimeText(o);const n=sigs.length-1;const sub=n>0?(n>1?`+${n} autres signaux`:`+1 autre signal`):(primary.key==='late'?`Échéance ${h(o.due)}`:primary.key==='blocked'?'Validation requise':'À effectuer dans DentalFlow Scan');const right=`<strong class="${primary.color}">${primary.label}</strong><span>${sub}</span>`;return `<div class="watch-item watch-${aColor}" data-order="${h(o.id)}"><div class="alert-ico ${aColor}">${icon(ico)}</div><div class="watch-main"><b>${h(o.id)}</b><span class="pill ${color}">${label}</span><div class="watch-sub">${h(o.type)} · ${h(o.cabinet)}</div><div class="watch-meta">${loc}${lastScan(o)?` · ${tech} · scan ${time}`:''}</div></div><div class="watch-status">${right}</div><div class="chev">›</div></div>`}).join('')}
function renderFlow(st){const count=state.orders.filter(o=>effectiveStation(o)===st).length;const color=st==='Usinage'?COLORS.orange:st==='Céramique'?COLORS.green:st==='Prêtes'?COLORS.gray:COLORS.blue;return `<div class="flow-row" data-view="production" data-station="${h(st)}"><span class="dot-flow" style="background:${color}"></span><b>${h(st)}</b><span><span class="flow-num" style="color:${st==='Usinage'?COLORS.orange:'inherit'}">${count}</span></span></div>`}

function chartBars(vals,labels){const maxV=Math.max(...vals,1);const step=maxV>400?200:maxV>150?50:maxV>60?20:10;const axMax=Math.max(Math.ceil(maxV/step)*step,step);const marks=[axMax,Math.round(axMax*2/3),Math.round(axMax/3),0];const n=vals.length;return `<div class="chart2"><div class="chart2-body"><div class="chart2-axis">${marks.map(m=>`<span>${m}</span>`).join('')}</div><div class="chart2-plot" style="--n:${n}">${vals.map(v=>`<div class="chart2-col"><div class="chart2-bar" style="height:${(v/axMax*100).toFixed(1)}%"><span class="bar-tip">${v}</span></div></div>`).join('')}</div></div><div class="chart2-days"><span></span><div class="days-inner" style="--n:${n}">${labels.map(l=>`<span class="day2">${h(l)}</span>`).join('')}</div></div></div>`}
function renderDonutLegend(d,total){const cats=[['active','En production',d.active,'blue'],['ready','Prêtes',d.ready,'green'],['blocked','Bloquées',d.blocked,'orange'],['completed','Terminées',d.completed,'red']];return `<div class="legend">${cats.map(r=>{const p=total?Math.round(r[2]/total*100):0;return `<div class="legend-row" data-donut-cat="${r[0]}" data-count="${r[2]}" data-label="${h(r[1])}" data-pct="${p}" onmouseover="donutHover(this)" onmouseout="donutReset()"><span class="dot-flow" style="background:var(--${r[3]})"></span><span>${r[1]}</span><b>${r[2]}</b></div>`}).join('')}</div>`}
function renderDonut(){const d=orderDistribution();const total=d.active+d.ready+d.blocked+d.completed;const segs=[['active','En production','blue',d.active],['ready','Prêtes','green',d.ready],['blocked','Bloquées','orange',d.blocked],['completed','Terminées','red',d.completed]];let acc=0;const arcs=segs.filter(s=>s[3]>0).map(s=>{const pct=total?s[3]/total*100:0;const off=25-acc;acc+=pct;const p=total?Math.round(s[3]/total*100):0;return `<circle class="donut-seg" data-donut-cat="${s[0]}" data-count="${s[3]}" data-label="${h(s[1])}" data-pct="${p}" r="15.915" cx="21" cy="21" fill="none" stroke="var(--${s[2]})" stroke-width="5" stroke-dasharray="${pct.toFixed(2)} ${(100-pct).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" onmouseover="donutHover(this)" onmouseout="donutReset()"/>`}).join('');const ring=total?arcs:'<circle r="15.915" cx="21" cy="21" fill="none" stroke="#d7dce6" stroke-width="5"/>';return `<div class="donut-layout"><div class="donut-svg-wrap"><svg viewBox="0 0 42 42" class="donut-svg">${ring}</svg><div class="donut-center" id="donut-center" data-total="${total}">${total}<span>Total</span></div></div>${renderDonutLegend(d,total)}</div>`}
function donutHover(el){const c=document.getElementById('donut-center');if(!c)return;const cat=el.dataset.donutCat;c.innerHTML=`${el.dataset.count}<span>${el.dataset.label} · ${el.dataset.pct}%</span>`;document.querySelectorAll('[data-donut-cat]').forEach(x=>{x.classList.toggle('dim',x.dataset.donutCat!==cat);x.classList.toggle('sel',x.dataset.donutCat===cat)})}

/* DnD limité à la réorganisation du FLUX (colonnes). Les commandes ne se déplacent jamais à la main. */

board.addEventListener('blur',e=>{const nm=e.target.closest('[data-stage-name]');if(nm)renameStage(nm.dataset.stageName,nm.textContent)},true);

function stockStatus(it){if(it.qty<=it.min)return['Critique','red'];if(it.qty<=it.min*2)return['Moyen','orange'];return['Bon','green']}
function stockPct(it){return it.capacity?Math.round(it.qty/it.capacity*100):0}
function stockSummary(){const s={units:0,refs:state.stock.length,critical:0,transit:0};state.stock.forEach(it=>{s.units+=it.qty;if(stockStatus(it)[1]==='red')s.critical++;if(it.incoming>0)s.transit++});return s}
function renderStock(){setPageMeta('Stocks','Gestion des matières premières et consommables');const sum=stockSummary();const cards=state.stock.map(it=>{const[label,color]=stockStatus(it);const pct=stockPct(it);return `<article class="card stock-item"><div class="stock-item-head"><div><div class="stock-name">${h(it.name)}</div><div class="stock-ref">${h(it.id)}</div></div><span class="stock-badge ${color}">${pct}%</span></div><div class="stock-bar"><span style="width:${pct}%;background:var(--${color})"></span></div><div class="stock-foot"><span><b>${it.qty}</b> / ${it.capacity} ${h(it.unit)}${it.incoming>0?` · <span class="stock-transit">+${it.incoming} en transit</span>`:''}</span><span class="stock-state ${color}">${label}</span></div><div class="stock-adjust"><button class="stock-step" data-stock-adj data-id="${h(it.id)}" data-delta="-1" aria-label="Retirer une unité">−</button><button class="stock-step" data-stock-adj data-id="${h(it.id)}" data-delta="1" aria-label="Ajouter une unité">+</button><button class="stock-edit-btn" data-stock-edit data-id="${h(it.id)}">Ajuster</button></div></article>`}).join('');$('#view-root').innerHTML=`<section class="grid stock-kpis"><article class="card stock-kpi"><div class="stock-kpi-ico green">${icon('cube')}</div><div><div class="stock-kpi-num">${sum.units}</div><div class="stock-kpi-label">Unités en stock · ${sum.refs} références</div></div></article><article class="card stock-kpi"><div class="stock-kpi-ico orange">${icon('warn')}</div><div><div class="stock-kpi-num">${sum.critical}</div><div class="stock-kpi-label">Stock critique</div></div></article><article class="card stock-kpi"><div class="stock-kpi-ico blue">${icon('truck')}</div><div><div class="stock-kpi-num">${sum.transit}</div><div class="stock-kpi-label">En transit</div></div></article></section><div class="stock-head"><h2 class="stock-head-title">Articles</h2><button class="primary stock-new" id="new-stock-btn"><span>＋</span><span>Nouvel article</span></button></div><section class="grid stock-grid">${cards}</section>`}

function adjustStock(id,delta){const it=state.stock.find(x=>x.id===id);if(!it)return;const before=it.qty;it.qty=Math.max(0,Math.min(it.capacity,it.qty+delta));if(it.qty===before)return;logAudit(it.id,'Stock',`Ajustement stock : ${delta>0?'+':''}${it.qty-before} ${it.unit} (→ ${it.qty}/${it.capacity})`);save();render()}

function submitStockForm(data){const qty=Math.max(0,parseInt(data.qty,10)||0);const capacity=Math.max(1,parseInt(data.capacity,10)||1);const min=Math.max(0,parseInt(data.min,10)||0);const incoming=Math.max(0,parseInt(data.incoming,10)||0);const id=String(data.ref||'').trim().toUpperCase();const existing=state.stock.find(x=>x.id===id);if(existing){existing.name=data.name||existing.name;existing.unit=data.unit||existing.unit;existing.qty=Math.min(qty,capacity);existing.capacity=capacity;existing.min=min;existing.incoming=incoming;logAudit(existing.id,'Stock',`Article mis à jour : ${existing.qty}/${existing.capacity} ${existing.unit}`);showToast(`${existing.id} mis à jour`)}else{if(!id){showToast('Référence requise');return}state.stock.push({id,name:data.name||id,unit:data.unit||'unités',qty:Math.min(qty,capacity),capacity,min,incoming});logAudit(id,'Stock',`Nouvel article créé : ${Math.min(qty,capacity)}/${capacity} ${data.unit||'unités'}`);showToast(`${id} ajouté au stock`)}save();closeSidePanel();state.view='stock';render()}
function auditEvents(){const live=[];state.scanEvents.filter(e=>e.event==='Scan').forEach(e=>live.push({at:new Date(e.at).getTime(),type:'Scan',orderId:e.orderId,actor:e.tech||'Système',detail:`Scan enregistré — ${e.station}`}));(state.historyEvents||[]).forEach(e=>live.push({at:new Date(e.at).getTime(),type:e.type||'Statut',orderId:e.orderId,actor:'Système',detail:e.detail||e.type||''}));seedAuditLog.forEach(e=>live.push({at:Clock.now().getTime()-e.daysAgo*86400000,type:e.type,orderId:e.orderId,actor:e.actor,detail:e.detail}));return live.sort((a,b)=>b.at-a.at)}

function fmtAuditDate(ts){const d=new Date(ts);const days=Math.round((Clock.now().getTime()-ts)/86400000);const time=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;if(days<=0)return `Aujourd’hui ${time}`;if(days===1)return `Hier ${time}`;return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${time}`}
function renderAuditTable(events){if(!events.length)return '<div class="empty">Aucun événement sur cette période.</div>';const ar=k=>state.auditSortKey===k?`<span class="sort-ar">${state.auditSortDir==='asc'?'▲':'▼'}</span>`:'';return `<div class="table-wrap"><table class="orders-table audit-table"><colgroup><col style="width:16%"><col style="width:13%"><col style="width:18%"><col style="width:15%"><col style="width:38%"></colgroup><thead><tr><th data-audit-sort="at">Date${ar('at')}</th><th data-audit-sort="type">Type${ar('type')}</th><th data-audit-sort="orderId">Commande / Réf.${ar('orderId')}</th><th data-audit-sort="actor">Acteur${ar('actor')}</th><th>Détail</th></tr></thead><tbody>${events.map(e=>`<tr><td class="muted">${fmtAuditDate(e.at)}</td><td><span class="pill ${auditTypeColor(e.type)}">${h(e.type)}</span></td><td><b>${h(e.orderId)}</b></td><td>${h(e.actor)}</td><td class="muted audit-detail" title="${h(e.detail)}">${h(e.detail)}</td></tr>`).join('')}</tbody></table></div>`}
function auditRows(){const period=reportPeriods[state.reportPeriod]||reportPeriods['30d'];let ev=auditInPeriod(period.days).filter(auditMatch);if(state.auditType&&state.auditType!=='all')ev=ev.filter(e=>e.type===state.auditType);const k=state.auditSortKey||'at';const dir=state.auditSortDir==='asc'?1:-1;return ev.slice().sort((a,b)=>{if(k==='at')return (a.at-b.at)*dir;const va=String(a[k]||'').toLowerCase(),vb=String(b[k]||'').toLowerCase();return va<vb?-dir:va>vb?dir:0})}
function renderAuditWrap(){const ev=auditRows();const per=10;const pages=Math.max(1,Math.ceil(ev.length/per));if((state.auditPage||0)>=pages)state.auditPage=pages-1;if((state.auditPage||0)<0)state.auditPage=0;const page=state.auditPage||0;const slice=ev.slice(page*per,page*per+per);const period=reportPeriods[state.reportPeriod]||reportPeriods['30d'];const types=[...new Set(auditInPeriod(period.days).map(e=>e.type))];const chips=`<button class="audit-chip ${(!state.auditType||state.auditType==='all')?'active':''}" data-audit-type="all">Tous</button>`+types.map(t=>`<button class="audit-chip ${state.auditType===t?'active':''}" data-audit-type="${h(t)}">${h(t)}</button>`).join('');const pager=`<div class="audit-pager"><button class="pg-btn" data-audit-page="prev" ${page<=0?'disabled':''}>‹ Précédent</button><span class="pg-info">Page ${page+1} / ${pages} · ${ev.length} entrée${ev.length>1?'s':''}</span><button class="pg-btn" data-audit-page="next" ${page>=pages-1?'disabled':''}>Suivant ›</button></div>`;return `<div class="audit-tools">${chips}</div>${renderAuditTable(slice)}${ev.length>per?pager:''}`}
function renderReports(){setPageMeta('Rapports','Indicateurs et journal d’audit du laboratoire');const period=reportPeriods[state.reportPeriod]||reportPeriods['30d'];const events=auditInPeriod(period.days);const scans=events.filter(e=>e.type==='Scan').length;const blocks=events.filter(e=>e.type==='Blocage'||/bloqu/i.test(e.detail)).length;const delivered=events.filter(e=>e.type==='Livraison').length;const onTime=events.filter(e=>e.type==='Livraison'&&/à temps/i.test(e.detail)).length;const rate=delivered?Math.round(onTime/delivered*100):0;const seg=Object.entries(reportPeriods).map(([k,v])=>`<button class="seg ${state.reportPeriod===k?'active':''}" data-report-period="${k}">${v.label}</button>`).join('');const proof=`<div class="kpi-proof">${period.label}</div>`;$('#view-root').innerHTML=`

function weekStripHTML(o){const start=weekStartOf(Clock.now());const due=orderDueDateCanonical(o);const names=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];const today=Clock.now();today.setHours(0,0,0,0);let cells='';for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const isToday=d.getTime()===today.getTime();const isDue=due&&d.getFullYear()===due.getFullYear()&&d.getMonth()===due.getMonth()&&d.getDate()===due.getDate();cells+=`<div class="week-day${isToday?' today':''}${isDue?' due':''}"><div class="wd-n">${names[i]}</div><div class="wd-d">${d.getDate()}</div>${isDue?'<div class="wd-tag">Échéance</div>':isToday?'<div class="wd-tag" style="color:var(--blue)">Auj.</div>':''}</div>`}return `<section class="trace-summary"><h3>Cette semaine</h3><div class="week-strip">${cells}</div><div class="mini-sub" style="margin-top:8px">${due?'Échéance de la commande : '+h(o.due):'Échéance non datée'}</div></section>`}
/* _renderQuickView — fiche commande = centre de consultation (§133 du
   mandat) : Patient / Travail / Empreinte / Production / Bon de suivi /
   Reprises / Tarif / Messages. Actions CONTEXTUELLES (§134), jamais 12
   boutons d'un coup : attente empreinte → Confirmer réception ; prête à
   démarrer → Imprimer le bon ; en production → actions de suivi ; livrée →
   Reprise. */
function _renderQuickView(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const [label,color]=orderStatusInfo(o);
  const pk=primaryStatusKey(o);
  const extraPills=orderSignals(o).filter(s=>s.key!==pk).map(s=>` <span class="pill ${s.color}">${s.label}</span>`).join('');
  const scan=lastScan(o);const planned=plannedNextStage(o);const msgCount=unreadIncomingCount(o.id);
  const pname=displayPatient(o,'lab');
  const dentist=dentistNameById(o.dentistId);
  const awaitingImpression=o.impressionMode==='PHYSICAL'&&!o.physicalImpressionReceivedAt;
  const readyToStart=isReadyToStartTracking(o)&&!o.trackingStartedAt;
  const delivered=isOrderCompleted(o);
  const cancelled=isOrderCancelled(o);
  const impressionLine=o.impressionMode==='PHYSICAL'?(o.physicalImpressionReceivedAt?`Physique · reçue ${fmtEventDateShort(o.physicalImpressionReceivedAt)}`:'Physique · en attente de réception'):'Numérique';
  const trackingLine=o.trackingStartedAt?`Démarré ${fmtEventDateShort(o.trackingStartedAt)} · ${o.trackingSheetPrintCount||1} impression${(o.trackingSheetPrintCount||1)>1?'s':''}`:'Pas encore démarré';
  const reworksHTML=(o.reworks&&o.reworks.length)?`<section class="trace-summary"><h3>Reprises (${o.reworks.length})</h3>${o.reworks.map((r,i)=>`<div class="mini-card" style="margin-bottom:6px"><div class="mini-label">Reprise ${i+1} — ${h((r.reason||'Autre'))}</div><div class="mini-value" style="font-size:13px">${h(r.notes||'—')}</div><div class="mini-sub">Reprise à l'étape « ${h(labelForStageId(r.restartStageId)||'—')} » · ${h(fmtEventDateShort(r.createdAt))}${r.priceAdjustment?` · Supplément ${moneyFmt(r.priceAdjustment)}`:''}</div></div>`).join('')}</section>`:'';
  const priceHTML=o.priceSnapshot?`<section class="trace-summary"><h3>Tarif</h3><div class="mini-card"><div class="mini-label">${h(o.priceSnapshot.serviceLabel)}</div><div class="mini-value">${moneyFmt(o.priceSnapshot.total)}</div><div class="mini-sub">${o.priceSnapshot.pricingMode==='PER_TOOTH'?`${moneyFmt(o.priceSnapshot.basePrice)}/dent × ${o.priceSnapshot.toothCount||1}`:'Forfait'}${(o.reworks||[]).some(r=>r.priceAdjustment)?' + suppléments reprises':''}</div></div></section>`:'';
  let primaryAction;
  if(cancelled)primaryAction='';
  else if(awaitingImpression)primaryAction=`<button class="big-primary" data-confirm-impression="${h(o.id)}" style="grid-column:1/-1">Confirmer la réception de l'empreinte</button>`;
  else if(readyToStart)primaryAction=`<button class="big-primary" data-print-tracking="${h(o.id)}" style="grid-column:1/-1">Imprimer le bon de suivi</button>`;
  else if(delivered)primaryAction=`<button class="big-primary" data-panel="reworkForm" data-trace-order="${h(o.id)}">Enregistrer une reprise</button><button class="secondary" data-print-fiche="${h(o.id)}">Bon de suivi</button>`;
  else primaryAction=`<button class="secondary" data-print-fiche="${h(o.id)}">Imprimer le bon</button><button class="secondary" data-panel="reworkForm" data-trace-order="${h(o.id)}">Reprise</button>`;
  const cancelAction=(!cancelled&&!delivered)?`<button class="secondary" data-open-cancel="${h(o.id)}">Annuler la commande</button>`:'';
  $('#quick-body').innerHTML=`<div class="quick-head"><div><h2 id="quick-title">${h(pname)} <span class="pill ${color}">${label}</span>${extraPills}</h2><div class="quick-sub">${h(o.id)} · ${h(o.type)} · ${h(o.cabinet)}${dentist!=='—'?' · Dr '+h(dentist):''}</div></div><button class="quick-close" id="quick-close" aria-label="Fermer">×</button></div><section class="quick-grid"><div class="mini-card"><div class="mini-label">Patient</div><div class="mini-value">${h(pname)}</div><div class="mini-sub">${h(o.patientRef)}</div></div><div class="mini-card"><div class="mini-label">Échéance</div><div class="mini-value">${h(o.due)}</div><div class="mini-sub ${isOrderLate(o)?'danger':''}">${isOrderLate(o)?'En retard':'Dans les temps'}</div></div><div class="mini-card"><div class="mini-label">Empreinte</div><div class="mini-value">${h(impressionLine)}</div></div><div class="mini-card"><div class="mini-label">Bon de suivi</div><div class="mini-value">${h(trackingLine)}</div></div><div class="mini-card"><div class="mini-label">Localisation confirmée</div><div class="mini-value">${locationText(o)}</div><div class="mini-sub">${scan?'Dernier scan réel':'Aucun scan enregistré'}</div></div><div class="mini-card"><div class="mini-label">Prochaine étape prévue</div><div class="mini-value">${planned?h(planned):'—'}</div><div class="mini-sub">Planification</div></div><div class="mini-card"><div class="mini-label">Technicien confirmé</div><div class="mini-value">${technicianText(o)}</div><div class="mini-sub">${scan?`Scan ${fmtTime(scan.at)}`:'Aucun scan'}</div></div><div class="mini-card"><div class="mini-label">Dernier scan</div><div class="mini-value">${scan?fmtTime(scan.at):'Aucun scan enregistré'}</div><div class="mini-sub">${scan?h(effectiveStation(o)):'Localisation non confirmée'}</div></div></section>${weekStripHTML(o)}${reworksHTML}${priceHTML}<section class="trace-summary"><h3>Dernier scan confirmé</h3>${scan?`<div class="mini-card"><div class="mini-label">Poste</div><div class="mini-value">${h(effectiveStation(o))}</div><div class="mini-sub">${h(scanTechName(scan))} · ${fmtTime(scan.at)}</div></div>`:'<div class="empty">Aucun scan enregistré</div>'}<div class="mini-sub" style="margin-top:12px">L’historique complet des scans est disponible via « Traçabilité ».</div></section><div class="order-qr"><div class="order-qr-code">${qrSvg(o.id)}</div><div class="order-qr-info"><div class="mini-label">QR de production</div><div class="mini-value">${h(o.id)}</div><div class="mini-sub">À scanner à chaque changement de poste.</div></div></div><div class="quick-actions" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${primaryAction}<button class="secondary" data-panel="messages" data-focus-thread="${h(o.id)}">Messages (${msgCount})</button><button class="secondary" data-panel="trace" data-trace-order="${h(o.id)}">Traçabilité</button>${cancelAction}</div>`;$('#quick-layer').classList.add('open');setTimeout(()=>$('#quick-close')?.focus(),0);
}

/* printFiche — BON DE SUIVI, document central qui accompagne physiquement
   la boîte de production jusqu'à la fin (V3.6 §46-50, remplace la "fiche
   commande" V3.5.2 avec un contenu enrichi). Le nom du patient apparaît
   désormais sur le papier PAR DÉFAUT (§9/§47 : "Le retour terrain invalide
   la règle d'anonymisation systématique") — sauf commande anonymisée, où
   seul patientRef apparaît, via le même displayPatient() canonique utilisé
   à l'écran. Le QR, lui, reste et reste STRICTEMENT order.id (§12/§48) —
   jamais patientRef, jamais le nom : le scanner n'a besoin que de
   reconnaître la commande, jamais d'une identité sur le flux de scan. */
function fmtEventDateShort(iso){if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function printFiche(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;

  const reworkRows=(o.reworks||[]).map((r,i)=>`<tr><td>${h(fmtEventDateShort(r.createdAt))}</td><td>Reprise ${i+1} — ${h(r.reason||'')}</td><td>${h(r.notes||'')}</td></tr>`).join('');

  area.innerHTML=`<div class="fiche"><div class="fiche-head"><div><div class="fiche-brand">DentalFlow</div><h1>Bon de suivi</h1></div><div class="fiche-code">${h(o.id)}</div></div><div class="fiche-grid"><div><div class="fk">Commande</div><div class="fv">${h(o.id)}</div></div><div><div class="fk">Patient</div><div class="fv">${h(pname)}</div></div><div><div class="fk">Référence DentalFlow</div><div class="fv">${h(o.patientRef)}</div></div><div><div class="fk">Cabinet</div><div class="fv">${h(o.cabinet)}</div></div><div><div class="fk">Dentiste</div><div class="fv">${h(dentist)}</div></div><div><div class="fk">Prestation</div><div class="fv">${h(o.type)}</div></div><div><div class="fk">Dents</div><div class="fv">${h(teethLine)}</div></div><div><div class="fk">Teinte</div><div class="fv">${h(o.shade||'—')}</div></div><div><div class="fk">Empreinte</div><div class="fv">${h(impressionLine)}</div></div><div><div class="fk">Statut</div><div class="fv">${h(label)}</div></div><div><div class="fk">Livraison demandée</div><div class="fv">${h(o.due)}</div></div></div><div class="fiche-qr"><div class="fk" style="margin-bottom:2px">QR de production</div>${qrSvg(o.id)}<div class="fiche-qr-label">${h(o.id)}<br><span>À scanner à chaque changement de poste.</span></div></div><h3 class="block-title" style="margin-top:16px">Suivi / Reprises</h3><table class="print-audit"><thead><tr><th>Date</th><th>Étape / reprise</th><th>Observation</th></tr></thead><tbody>${reworkRows}${blankRows}</tbody></table><div class="fiche-foot">Émis le ${Clock.now().toLocaleDateString('fr-FR')} · DentalFlow — POC${(o.trackingSheetPrintCount||0)>1?` · Impression n°${o.trackingSheetPrintCount}`:''}</div></div>`;
  window.print();

   jamais de scan QR à la Réception — le geste réel est l'IMPRESSION du bon,
   qui ne peut avoir lieu tant qu'une empreinte physique attendue n'a pas
   été confirmée reçue. */
function isReadyToStartTracking(o){return !(o.impressionMode==='PHYSICAL'&&!o.physicalImpressionReceivedAt)}
function confirmPhysicalImpressionReceipt(id){
  const o=state.orders.find(x=>x.id===id);if(!o||o.physicalImpressionReceivedAt)return;
  o.physicalImpressionReceivedAt=Clock.iso();
  o.physicalImpressionReceivedBy='Responsable labo';
  logAudit(id,'Empreinte',`Empreinte physique de ${id} confirmée reçue.`);
  save();render();openQuickView(id);showToast('Empreinte physique confirmée');

function printTrackingSheet(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  if(!isReadyToStartTracking(o)){showToast('Confirmez d’abord la réception de l’empreinte.');return}
  const firstPrint=!o.trackingStartedAt;
  if(firstPrint){
    o.trackingStartedAt=Clock.iso();
    o.trackingSheetFirstPrintedAt=o.trackingStartedAt;
    o.trackingSheetPrintCount=1;
    if(!o.station)o.station='Réception';
    logAudit(id,'Suivi',`Premier bon de suivi imprimé pour ${id} — suivi de production démarré.`);
  }else{
    o.trackingSheetPrintCount=(o.trackingSheetPrintCount||1)+1;

/* ===== V3.6 Partie J — Reprises (§51-56 du mandat) =====
   Une commande livrée/terminée qui revient au laboratoire NE crée jamais de
   nouvelle commande : même CMD-xxxx conservé, l'historique des scans du
   cycle précédent n'est JAMAIS effacé (createRework() ne touche pas
   scanEvents) — la reprise est simplement ajoutée à order.reworks[] et la
   commande redevient active. Le QR (order.id) continue de fonctionner à
   l'identique puisque l'identifiant ne change jamais. */
function reworkReasonOptionsHTML(selected){return REWORK_REASONS.map(r=>`<option${r===selected?' selected':''}>${h(r)}</option>`).join('')}
function createRework(orderId,data){
  const o=state.orders.find(x=>x.id===orderId);
  if(!o)return null;
  if(!Array.isArray(o.reworks))o.reworks=[];
  const rework={
    id:'RWK-'+randToken(8),createdAt:Clock.iso(),
    reason:REWORK_REASONS.includes(data.reason)?data.reason:'Autre',
    notes:String(data.notes||'').trim(),
    restartStageId:data.restartStageId||null,
    requestedByDentistId:o.dentistId||null,
    priceAdjustment:Math.max(0,+data.priceAdjustment||0),
    status:'open',completedAt:null
  };
  o.reworks.push(rework);
  /* Réouvre la production SANS toucher aux scans déjà enregistrés. */
  o.status='progress';
  o.productionState='active';
  o.flags=Object.assign({late:false,blocked:false,scanExpected:false},o.flags||{});
  o.flags.late=false;o.flags.blocked=false;o.flags.scanExpected=false;

const MONTH_KEYS=['janv','fevr','mars','avr','mai','juin','juil','aout','sept','oct','nov','dec'];
/* orderDueDate — parser CANONIQUE unique de l'échéance textuelle o.due
   (V3.5.2 Partie B). Toute fonction qui a besoin d'une Date à partir d'une
   commande doit passer par ici — ne jamais reparser la chaîne ailleurs.
   Ordre des tests IMPORTANT : "après-demain" contient la sous-chaîne
   "demain", donc le test après-demain doit toujours précéder le test
   demain (§12 du mandat), sans quoi "Après-demain" serait lu comme J+1. Si
   le texte contient une heure explicite (14:30 ou 14h30), elle est utilisée
   telle quelle ; sinon on retient une heure canonique de fin de journée
   (23:59) — jamais 00:00, qui ferait paraître en retard une commande due
   plus tard le jour même. isOrderLate() reste indépendant (flag figé au
   seed, jamais dérivé d'une date) : aucune incohérence possible entre les

function orderDueDate(o){

  if(/demain/.test(low))return shiftDays(1);
  if(/aujourd/.test(low))return shiftDays(0);
  let m=low.match(/il y a\s+(\d+)\s*jours?/);
  if(m)return shiftDays(-parseInt(m[1],10));
  if(/\bhier\b/.test(low))return shiftDays(-1);
  m=low.match(/dans\s+(\d+)\s*jours?/);
  if(m)return shiftDays(parseInt(m[1],10));
  m=low.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return applyTime(new Date(parseInt(m[3],10),parseInt(m[2],10)-1,parseInt(m[1],10)));

  if(m){
    const day=parseInt(m[1],10);const mon=m[2];const explicitYear=m[3]?parseInt(m[3],10):null;

      let d=new Date(explicitYear||base.getFullYear(),mi,day);
      if(!explicitYear&&d.getTime()<base.getTime()-1000*60*60*24*200)d=new Date(base.getFullYear()+1,mi,day);
      return applyTime(d);
    }
  }
  return null;
}

function openMonthCalendar(){const scenario=state.calMode==='whatif';const leaves=scenario?whatIfLeaves():[];buildOrderBook();const off=state.chargeMonth||0;const base=Clock.now();base.setDate(1);base.setMonth(base.getMonth()+off);const year=base.getFullYear(),month=base.getMonth();const title=base.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});const firstW=(new Date(year,month,1).getDay()+6)%7;const dcount=new Date(year,month+1,0).getDate();const dailyBase=grossWeeklyCapacity()/5||1;const counts={};ORDER_BOOK.forEach(d=>{if(d.getFullYear()===year&&d.getMonth()===month)counts[d.getDate()]=(counts[d.getDate()]||0)+1});const today=Clock.now();today.setHours(0,0,0,0);let cells='';for(let i=0;i<firstW;i++)cells+='<div class="chg-cell empty"></div>';for(let dd=1;dd<=dcount;dd++){const cur=new Date(year,month,dd);cur.setHours(0,0,0,0);const wd=cur.getDay();const wknd=wd===0||wd===6;const load=counts[dd]||0;const lost=wknd?0:dayLeaveLoss(cur,leaves);const cap=Math.max(0,dailyBase-lost);const ratio=cap?load/cap:(load?2:0);const col=load===0?'var(--line)':ratio<0.9?'var(--green)':ratio<=1.05?'var(--orange)':'var(--red)';const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===dd;const absent=scenario&&lost>0;cells+=`<div class="chg-cell${wknd?' wknd':''}"${isToday?' style="border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)"':''}><div class="chg-d">${dd}${absent?' <span title="Congé simulé" style="color:var(--accent)">●</span>':''}</div>${wknd?'':`<div class="chg-load" style="color:${load?col:'var(--muted)'}">${load||'·'}</div><div class="chg-bar" style="background:${col};opacity:${load?1:.35}"></div>`}</div>`}const totalCells=firstW+dcount;for(let i=totalCells;i<42;i++)cells+='<div class="chg-cell empty"></div>';const legendExtra=scenario?`<span><i style="background:var(--accent)"></i>Jour avec congé simulé</span>`:'';const sub=scenario?`${h(title)} · scénario What‑If (${leaves.length} congé${leaves.length>1?'s':''} simulé${leaves.length>1?'s':''})`:`${h(title)} · charge quotidienne (échéances du carnet)`;$('#quick-body').innerHTML=`<div class="quick-head"><div><h2 id="quick-title">${scenario?'Calendrier du scénario':'Plan de charge — calendrier'}</h2><div class="quick-sub">${sub}</div></div><button class="quick-close" id="quick-close" aria-label="Fermer">×</button></div><div style="display:flex;gap:8px;margin:4px 0 8px"><button class="ghost" data-charge-month="-1">‹ Mois préc.</button><button class="ghost" data-charge-month="1">Mois suiv. ›</button></div><div class="chg-cal"><div class="chg-h">L</div><div class="chg-h">M</div><div class="chg-h">M</div><div class="chg-h">J</div><div class="chg-h">V</div><div class="chg-h">S</div><div class="chg-h">D</div>${cells}</div><div class="chg-legend"><span><i style="background:var(--green)"></i>Sous la capacité</span><span><i style="background:var(--orange)"></i>À pleine charge</span><span><i style="background:var(--red)"></i>Surcharge</span>${legendExtra}</div>`;$('#quick-layer').classList.add('open')}

function isStaffMode(){return new URLSearchParams(location.search).get('mode')==='staff'}
const ANNUAL_LEAVE=25;
/* ===================== STAFF — poste dérivé de l'identité ===================== */
/* Chaque identifiant collaborateur est associé à UN poste. Aucun choix manuel. */
/* Statut de l'affectation poste d'un collaborateur :
   'ok'       → assignedStageId pointe un poste actif ;
   'inactive' → le poste existe mais a été désactivé (affectation conservée) ;
   'none'     → aucune affectation, ou identifiant orphelin (poste supprimé/inconnu).
   Jamais de repli arbitraire vers un poste (ex. Réception). */
function getAssignedStageStatus(user){
  if(!user||!user.assignedStageId)return {status:'none',def:null};
  const d=stageDefById(user.assignedStageId);
  if(!d)return {status:'none',def:null};
  if(d.active===false)return {status:'inactive',def:d};
  return {status:'ok',def:d};
}
function getAssignedStage(user){const s=getAssignedStageStatus(user);return s.status==='ok'?s.def:null}
/* Validation au chargement : ne corrige que les cas sûrs (identifiant orphelin
   → réaligné sur la valeur de référence demoUsers, si elle-même valide dans le
   flux courant). Un poste désactivé reste tel quel (affectation conservée,
   scan bloqué avec message adapté) — jamais de réattribution automatique. */
function validateUserStageAssignments(){
  (state.users||[]).forEach(u=>{
    if(!u.assignedStageId)return;
    if(stageDefById(u.assignedStageId))return; // id valide (actif ou désactivé) : rien à faire
    const defaults=demoUsers.find(d=>d.id===u.id);
    if(defaults&&defaults.assignedStageId&&stageDefById(defaults.assignedStageId)){
      u.assignedStageId=defaults.assignedStageId;
    }
  });
}
/* Collaborateurs proposés dans le sélecteur Staff = profils configurés comme
   personnel de scan (un assignedStageId leur a été attribué), qu'il soit
   actuellement actif ou désactivé — sinon un poste désactivé (§6) redeviendrait
   invisible au lieu d'afficher son message dédié. Pas de repli vers l'équipe
   entière : un profil sans aucune affectation (Eric, Sophie, ou une
   affectation orpheline non réparable) n'est jamais proposé. */
function staffEligibleUsers(){return (state.users||[]).filter(u=>getAssignedStageStatus(u).status!=='none')}
/* Compteurs de congés par collaborateur (démo).
   leaveUsedYTD = jours déjà consommés avant les absences visibles dans le
   calendrier de démonstration (state.absences) ; le compteur affiché cumule
   les deux pour rester cohérent quand une nouvelle demande est approuvée. */
function getLeaveMetrics(userId){const u=(state.users||[]).find(x=>x.id===userId)||{};const allowance=u.leaveAllowance||ANNUAL_LEAVE;const used=(u.leaveUsedYTD||0)+leaveTaken(userId);const pending=leavePending(userId);return {allowance,used,pending,remaining:Math.max(0,allowance-used)}}
function bizDays(fromStr,toStr){let d=new Date(fromStr);const end=new Date(toStr);if(isNaN(d)||isNaN(end)||end<d)return 0;let n=0;while(d<=end){const w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1)}return n}
function leaveTaken(uid){return state.absences.filter(a=>a.userId===uid&&(a.reason||'').toLowerCase().indexOf('formation')<0).reduce((s,a)=>s+bizDays(a.from,a.to),0)}
function leavePending(uid){return (state.leaveRequests||[]).filter(r=>r.userId===uid&&r.status==='pending').reduce((s,r)=>s+bizDays(r.from,r.to),0)}
function submitLeaveRequest(uid,from,to,reason){if(!uid||!from||!to)return showToast('Champs requis');if(new Date(to)<new Date(from))return showToast('Dates invalides');const id='L'+Date.now().toString(36);state.leaveRequests.push({id,userId:uid,from,to,reason:reason||'Congés',status:'pending'});const u=state.users.find(x=>x.id===uid);logAudit(uid,'Utilisateur',`Demande de congés : ${u?u.name:''} (${from} → ${to})`);save()}
function approveLeave(id){const r=(state.leaveRequests||[]).find(x=>x.id===id);if(!r||r.status==='approved')return;r.status='approved';if(!state.absences.some(a=>a.id==='AB-'+id))state.absences.push({id:'AB-'+id,userId:r.userId,from:r.from,to:r.to,reason:r.reason||'Congés'});const u=state.users.find(x=>x.id===r.userId);logAudit(r.userId,'Utilisateur',`Congés approuvés : ${u?u.name:''} (${r.from} → ${r.to})`);save();render();showToast('Congés approuvés')}
function refuseLeave(id){const r=(state.leaveRequests||[]).find(x=>x.id===id);if(!r)return;r.status='refused';save();render();showToast('Demande refusée')}

function findArticle(idOrRef,s=state){return (s.articles||[]).find(a=>a.id===idOrRef||a.reference===idOrRef)||(s.articles||[]).find(a=>normId(a.label)===normId(idOrRef))}
function articleLabel(id,s=state){const a=findArticle(id,s);return a?a.label:id}
function supplierName(id,s=state){if(!id)return 'Fournisseur inconnu';const sp=(s.suppliers||[]).find(x=>x.id===id);return sp?sp.name:id}
function supplierById(id,s=state){return (s.suppliers||[]).find(x=>x.id===id)||null}
function tariffsForArticle(articleId,s=state){return (s.articleSuppliers||[]).filter(x=>x.articleId===articleId&&x.active!==false).map(x=>({...x,supplier:supplierById(x.supplierId,s)})).filter(x=>x.supplier&&x.supplier.active!==false)}
function preferredTariff(articleId,s=state){const list=tariffsForArticle(articleId,s);return list.find(x=>x.preferred)||list[0]||null}
function physicalStock(articleId,s=state){return (s.stockMovements||[]).filter(m=>m.articleId===articleId).reduce((sum,m)=>sum+(+m.qty||0),0)}

   réellement consommées (StockMovement CONSUMPTION portant la consumptionKey de cette

   V3.6.1 (§21) : la clé de consommation intègre désormais le cycle actif
   (INITIAL ou reprise en cours, voir activeReworkForOrder/consumeForScan) —

function knownDemand(articleId,h,s=state){h=+h||0;let total=0;const target=addLabWorkingDays(today(),h);(s.orders||[]).forEach(o=>{if(isOrderCompleted&&isOrderCompleted(o))return;if(isOrderCancelled&&isOrderCancelled(o))return;const cycleId=(activeReworkForOrder(o)||{}).id||'INITIAL';const bom=BILL_OF_MATERIALS[o.type]||[];bom.filter(b=>b.articleId===articleId).forEach(b=>{const key=`${o.id}::${b.articleId}::${b.consumeAtStageId}::${cycleId}`;const consumed=(s.stockMovements||[]).some(m=>m.type==='CONSUMPTION'&&m.consumptionKey===key);if(consumed)return;const d=orderDueDateCanonical(o);if(!d||d<=target)total+=b.qty})});return total}
function baselineDemand(article,h){return dailyDemand(article)*(+h||0)}
function expectedDemand(articleId,h,s=state){const a=findArticle(articleId,s);if(!a)return 0;return Math.max(knownDemand(articleId,h,s),baselineDemand(a,h))}
function incomingArrivingWithin(articleId,h,s=state){return incomingStock(articleId,s,h)}
function projectedStock(articleId,h,s=state){return physicalStock(articleId,s)+incomingArrivingWithin(articleId,h,s)-expectedDemand(articleId,h,s)}
function stockoutWorkingDays(articleId,s=state,maxH=260){for(let h=0;h<=maxH;h++){if(projectedStock(articleId,h,s)<0)return h}return null}
function stockoutAt(articleId,s=state){const h=stockoutWorkingDays(articleId,s);return h==null?null:addLabWorkingDays(today(),h)}
function reservedStock(articleId,s=state){return knownDemand(articleId,999,s)}
function availableStock(articleId,s=state){return physicalStock(articleId,s)-reservedStock(articleId,s)}

function slowMovingStock(articleId,s=state){

  const cov=coverageDays(availableStock(articleId,s),dailyDemand(a));
  const overCoverage=cov>(s.engineSettings?.dormantCoverageDays??ENGINE_DEFAULTS.dormantCoverageDays);
  const window=(s.engineSettings?.dormantNoConsumptionDays??ENGINE_DEFAULTS.dormantNoConsumptionDays)*86400000;

/* parseGS1Code — supporte le format parenthésé lisible "(01)...(17)...(10)..."

   à longueur variable (10=LOT, 21=SERIAL). AI fixes : 01=GTIN (14), 11/17=
   date YYMMDD (6). AI 10 n'est JAMAIS traitée à longueur fixe (§60). */
function parseGS1Code(raw){
  if(!raw)return null;
  let s=String(raw).trim();
  s=s.replace(/^\]\w\d/,''); // identifiant de symbologie (]d2, ]Q3, ]e0…) si présent

   même : elle porte l'information dans lotAllocations[] (une allocation par

/* allocateLotsFEFO — First Expired First Out : lots sans date de péremption
   traités en dernier recours (Infinity), départage par date de réception la
   plus ancienne. Un lot expiré n'est JAMAIS sélectionné automatiquement
   (§61) — expiredAlert signale que seuls des lots expirés restaient. */
function allocateLotsFEFO(articleId,qty,s=state){
  qty=Math.abs(+qty||0);
  const now=Clock.now();
  const lots=(s.stockLots||[]).filter(l=>l.articleId===articleId);
  const withQty=lots.map(l=>({lot:l,avail:lotAvailableQty(l.id,s)})).filter(x=>x.avail>0);
  const nonExpired=withQty.filter(x=>!x.lot.expiryAt||new Date(x.lot.expiryAt)>=now);
  nonExpired.sort((a,b)=>{
    const ea=a.lot.expiryAt?new Date(a.lot.expiryAt).getTime():Infinity;
    const eb=b.lot.expiryAt?new Date(b.lot.expiryAt).getTime():Infinity;
    if(ea!==eb)return ea-eb;
    const ra=a.lot.receivedAt?new Date(a.lot.receivedAt).getTime():0;

/* ===== V3.6 Partie N — Annulation de commande + retour stock JAMAIS automatique =====
   cancelOrder() ne touche jamais aux mouvements de stock : sans matière
   consommée, la réservation disparaît simplement via knownDemand() (qui
   exclut désormais les commandes annulées, comme les livrées). Avec matière
   déjà sortie, seul un choix explicite et modifiable par ligne déclenche un
   StockMovement RETURN — jamais une déduction automatique. */
function hasConsumedMaterialForOrder(orderId,s=state){return (s.stockMovements||[]).some(m=>m.type==='CONSUMPTION'&&m.sourceId===orderId)}
/* returnableQtyForOrderArticle — V3.6.1 hotfix (§11-18) : plafond canonique
   au niveau moteur, jamais un simple attribut max côté HTML. Consommé =
   somme de TOUTES les CONSUMPTION liées à cette commande pour cet article
   (tous cycles confondus — initial et reprises, voir Partie C). Déjà
   retourné = somme des RETURN déjà émis pour cette même commande/article.
   Le solde ne peut jamais être fabriqué : impossible de retourner plus que
   ce qui a réellement été sorti, même en appelant la fonction plusieurs
   fois (chaque appel recalcule le plafond en tenant compte des retours déjà
   effectués). */
function totalConsumedForOrderArticle(orderId,articleId,s=state){return (s.stockMovements||[]).filter(m=>m.type==='CONSUMPTION'&&m.sourceId===orderId&&m.articleId===articleId).reduce((sum,m)=>sum+Math.abs(+m.qty||0),0)}
function totalReturnedForOrderArticle(orderId,articleId,s=state){return (s.stockMovements||[]).filter(m=>m.type==='RETURN'&&m.sourceType==='cancelledOrder'&&m.sourceId===orderId&&m.articleId===articleId).reduce((sum,m)=>sum+Math.abs(+m.qty||0),0)}
function returnableQtyForOrderArticle(orderId,articleId,s=state){return Math.max(0,totalConsumedForOrderArticle(orderId,articleId,s)-totalReturnedForOrderArticle(orderId,articleId,s))}
function consumedMaterialByArticle(orderId,s=state){
  const out={};
  (s.stockMovements||[]).filter(m=>m.type==='CONSUMPTION'&&m.sourceId===orderId).forEach(m=>{out[m.articleId]=(out[m.articleId]||0)+Math.abs(+m.qty||0)});
  return out;
}
function cancelOrder(orderId){
  const o=state.orders.find(x=>x.id===orderId);
  if(!o||isOrderCompleted(o)||isOrderCancelled(o))return;
  o.status='cancelled';o.productionState='cancelled';
  logAudit(orderId,'Annulation',`Commande ${orderId} annulée.`);
}
function openCancelFlow(orderId){
  const o=state.orders.find(x=>x.id===orderId);
  if(!o||isOrderCompleted(o)||isOrderCancelled(o))return;
  if(!hasConsumedMaterialForOrder(orderId)){
    cancelOrder(orderId);save();render();openQuickView(orderId);showToast('Commande annulée');
    return;
  }
  openSidePanel('cancelForm',orderId);
}
/* La quantité retournable EST suggérée (= quantité sortie) mais reste
   éditable ligne par ligne, jamais imposée (§65-67 du mandat). */
function renderCancelFormPanel(){
  const o=state.orders.find(x=>x.id===state.sidePanelOrderId);
  if(!o){$('#side-panel-head').innerHTML=`<div class="side-panel-title"><div><h2>Annulation</h2></div><button class="close" id="side-close">×</button></div>`;$('#side-panel-body').innerHTML='<div class="empty">Commande introuvable</div>';$('#side-layer').classList.add('open');return}
  const consumed=consumedMaterialByArticle(o.id);
  const rows=Object.entries(consumed).map(([articleId,qty])=>{const returnable=returnableQtyForOrderArticle(o.id,articleId);return `<div class="field"><label>${h(articleLabel(articleId))} — ${qty} sorti(s)${returnable<qty?` · ${qty-returnable} déjà retourné(s)`:''}</label><input type="number" name="ret_${h(articleId)}" min="0" max="${returnable}" step="1" value="${returnable}" /></div>`}).join('');
  $('#side-panel-head').innerHTML=`<div class="side-panel-title"><div><h2>Annuler ${h(o.id)}</h2><div class="side-panel-sub">Des matières ont déjà été sorties pour cette commande.</div></div><button class="close" id="side-close" aria-label="Fermer">×</button></div>`;

  $('#side-layer').classList.add('open');

/* confirmCancelWithReturn — V3.6.1 hotfix (§11-18) : le plafond de retour
   est un invariant MOTEUR, jamais seulement un attribut max HTML. Toute
   ligne demandant plus que returnableQtyForOrderArticle() est REFUSÉE
   intégralement (aucun StockMovement créé pour AUCUNE ligne, transactionnel
   — pas de clamp silencieux). cancelOrder() reste idempotent (aucun
   deuxième ActivityEvent "Commande annulée" si déjà annulée) mais un appel
   ultérieur reste autorisé à traiter des retours complémentaires légitimes
   — le plafond, recalculé à chaque appel à partir des retours déjà
   enregistrés, rend structurellement impossible de jamais fabriquer du
   stock en rappelant cette fonction plusieurs fois. */
function confirmCancelWithReturn(orderId,returnsByArticle){
  const o=state.orders.find(x=>x.id===orderId);
  if(!o)return {success:false,reason:'ORDER_NOT_FOUND'};
  const requests=Object.entries(returnsByArticle).map(([articleId,rawQty])=>({articleId,qty:Math.max(0,Math.round(+rawQty||0))})).filter(r=>r.qty>0);
  for(const {articleId,qty} of requests){
    const returnable=returnableQtyForOrderArticle(orderId,articleId);
    if(qty>returnable){
      showToast(`Retour refusé : ${qty} dépasse la quantité consommée non encore retournée (${returnable}) pour ${articleLabel(articleId)}.`);
      return {success:false,reason:'RETURN_EXCEEDS_CONSUMED',articleId,requested:qty,returnable};
    }
  }
  cancelOrder(orderId); // idempotent — ActivityEvent "Commande annulée" une seule fois, distinct de "Matière retournée en stock"
  requests.forEach(({articleId,qty})=>{
    const consumedMovs=state.stockMovements.filter(m=>m.type==='CONSUMPTION'&&m.sourceId===orderId&&m.articleId===articleId);
    let remaining=qty;const allocations=[];
    consumedMovs.forEach(m=>{(m.lotAllocations||[]).forEach(a=>{if(remaining<=0)return;const take=Math.min(a.qty,remaining);if(take>0){allocations.push({lotId:a.lotId,qty:take});remaining-=take}})});
    const mv={id:uid('MOV'),at:Clock.iso(),articleId,type:'RETURN',qty,reason:`Retour en stock — annulation ${orderId}`,sourceType:'cancelledOrder',sourceId:orderId,consumptionKey:null,userId:'U1'};
    if(allocations.length)mv.lotAllocations=allocations;
    state.stockMovements.push(mv);
    logAudit(orderId,'Stock',`Matière retournée en stock : ${qty} ${articleLabel(articleId)} (annulation ${orderId}).`);
  });
  save();closeSidePanel();render();openQuickView(orderId);showToast('Annulation enregistrée');
  return {success:true};
}
/* ===== V3.6 Partie O/P/Q — Prestations, priceSnapshot déjà figé à la
   création (buildOrderFromInput), CA (computeRevenueKPIs, base script) et
   module Factures. Une facture émise est un fait historique : ses lignes
   sont une COPIE de priceSnapshot au moment de la création de facture,
   jamais une référence vivante — un changement de tarif catalogue après
   coup ne l'altère jamais rétroactivement (§92-93). Aucune règle de TVA ou
   de comptabilité réelle n'est inventée : uniquement des montants
   configurés (§103, "PAS DE FEATURE CREEP"). */
function invoiceStatusLabel(s){return {DRAFT:'Brouillon',ISSUED:'Émise',SENT:'Envoyée',PAID:'Réglée',CANCELLED:'Annulée'}[s]||s}
/* isOrderAvailableForNewInvoice — V3.6.1 hotfix (§41-43) : une commande déjà
   présente dans UNE facture non annulée (DRAFT compris) n'est plus jamais
   sélectionnable pour une SECONDE facture — même si, économiquement, son
   montant reste dans « À facturer » tant que cette première facture n'est
   pas émise (voir computeRevenueKPIs). Ces deux notions sont volontairement
   distinctes (§41). */
function isOrderAvailableForNewInvoice(orderId,s=state){
  const o=(s.orders||[]).find(x=>x.id===orderId);
  if(!o)return false;
  if(isOrderCancelled(o))return false;
  if(!isOrderCompleted(o))return false;
  if(!o.priceSnapshot)return false;
  return !(s.invoices||[]).some(inv=>inv.status!=='CANCELLED'&&(inv.orderIds||[]).includes(orderId));

function ordersReadyToInvoice(s=state){return (s.orders||[]).filter(o=>isOrderAvailableForNewInvoice(o.id,s))}
function invoiceLinesForOrders(orderIds,s=state){
  const lines=[];
  orderIds.forEach(id=>{
    const o=(s.orders||[]).find(x=>x.id===id);
    if(!o||!o.priceSnapshot)return;
    lines.push({orderId:o.id,label:`${o.priceSnapshot.serviceLabel} — ${o.id}`,amount:o.priceSnapshot.total});
    (o.reworks||[]).forEach((r,i)=>{if(r.priceAdjustment)lines.push({orderId:o.id,label:`Reprise ${i+1} (${r.reason||'Autre'}) — ${o.id}`,amount:r.priceAdjustment})});
  });

}
/* createInvoice — V3.6.1 hotfix (§49-54) : les invariants métier sont
   désormais appliqués AU NIVEAU MOTEUR, jamais seulement par l'UI (qui ne
   propose déjà que des commandes éligibles, mais rien n'empêchait un appel
   direct de la fonction de contourner ces règles). Échec = AUCUNE Invoice
   créée, retour structuré {success:false,reason}. */
function createInvoice(orderIds){
  orderIds=(orderIds||[]).filter(Boolean);
  if(!orderIds.length){showToast('Sélectionnez au moins une commande');return {success:false,reason:'EMPTY_SELECTION'}}
  const orders=[];
  for(const id of orderIds){
    const o=state.orders.find(x=>x.id===id);
    if(!o){showToast(`Commande ${id} introuvable`);return {success:false,reason:'ORDER_NOT_FOUND',orderId:id}}
    if(isOrderCancelled(o)){showToast(`${id} est annulée — impossible de facturer`);return {success:false,reason:'ORDER_CANCELLED',orderId:id}}
    if(!isOrderCompleted(o)){showToast(`${id} n'est pas encore livrée — impossible de facturer`);return {success:false,reason:'ORDER_NOT_DELIVERED',orderId:id}}
    if(!isOrderAvailableForNewInvoice(id)){showToast(`${id} est déjà rattachée à une facture`);return {success:false,reason:'ORDER_ALREADY_INVOICED',orderId:id}}
    orders.push(o);
  }
  const cabinet=orders[0].cabinet;
  if(!orders.every(o=>o.cabinet===cabinet)){showToast('Toutes les commandes sélectionnées doivent appartenir au même cabinet');return {success:false,reason:'MULTIPLE_CABINETS'}}
  const dentistId=orders[0].dentistId||null;
  const lines=invoiceLinesForOrders(orderIds);
  const total=lines.reduce((s,l)=>s+(+l.amount||0),0);
  const inv={id:'FAC-'+randToken(6),cabinet,dentistId,orderIds:orderIds.slice(),lines,subtotal:total,total,status:'DRAFT',createdAt:Clock.iso(),issuedAt:null,sentAt:null,paidAt:null};
  state.invoices=state.invoices||[];
  state.invoices.push(inv);
  logAudit(inv.id,'Facture',`Facture ${inv.id} créée pour ${cabinet} — ${moneyFmt(total)} (${orderIds.length} commande${orderIds.length>1?'s':''}).`);

}

   V3.4.x (mêmes filtres, mêmes calculs), simplement extrait de son ancienne
   barre d'onglets interne devenue inutile (les 4 onglets sont maintenant au
   niveau de la page). */
function renderSupplyStockTab(){
  const filters=[['all','Tous'],['watch','À surveiller'],['low','Stock faible'],['dormant','Dormants']];
  function articleState(a){const phys=physicalStock(a.id),inc=incomingStock(a.id),need=reservedStock(a.id),proj=projectedStock(a.id,3),avail=availableStock(a.id);let c='green',lbl='Bon';if(proj<a.safetyStock){c='red';lbl='Critique'}else if(phys<=a.safetyStock*2){c='orange';lbl='À surveiller'}return {phys,inc,need,proj,avail,c,lbl,cov:coverageDays(avail,dailyDemand(a))}}
  let arts=(state.articles||[]);const sf=state.stockFilter||'all';
  if(sf==='watch')arts=arts.filter(a=>articleState(a).c!=='green');
  if(sf==='low')arts=arts.filter(a=>physicalStock(a.id)<=a.safetyStock);
  if(sf==='dormant')arts=arts.filter(a=>slowMovingStock(a.id));
  const cards=arts.map(a=>{const st=articleState(a);const pct=a.capacity?Math.max(0,Math.min(100,Math.round(st.phys/a.capacity*100))):0;return `<article class="card stock-item" data-stock-article="${h(a.id)}" style="cursor:pointer"><div class="stock-item-head"><div><div class="stock-name">${h(a.label)}</div><div class="stock-ref">${h(a.reference)}</div></div><span class="stock-badge ${st.c}">${h(st.lbl)}</span></div><div class="stock-bar"><span style="width:${pct}%;background:var(--${st.c})"></span></div><div class="stock-foot"><span><b>${st.avail}</b> disponible · <span class="stock-transit">${st.inc} en commande</span> · besoin ${st.need}</span><span class="stock-state ${st.c}">${h(st.lbl)}</span></div></article>`}).join('');
  return `<div class="filters" style="justify-content:space-between"><div style="display:flex;gap:8px;flex-wrap:wrap">${filters.map(f=>`<button class="filter ${sf===f[0]?'active':''}" data-stock-filter="${f[0]}">${h(f[1])}</button>`).join('')}</div><button class="secondary" data-open-stock-scan>Scanner une réception</button></div><section class="grid stock-grid">${cards||'<div class="empty">Aucun article pour ce filtre.</div>'}</section>`;
}

`:`<button class="big-primary" data-approve-proposal="${h(p.id)}">${p.recommendedAction==='WAIT'?'Commander quand même':'Commander'} ${money(p.total||0)}</button>`}</div>`;
  $('#side-layer').classList.add('open');

function submitSupplierForm(data){
  const name=String(data.sname||'').trim();
  if(!name){showToast('Nom requis');return}
  const leadTimeDays=Math.max(0,Math.round(Number(data.slead))||0);
  const shippingCost=Math.max(0,Number(data.sship)||0);
  const minimumOrder=Math.max(0,Number(data.smin)||0);
  const francoRaw=String(data.sfranco||'').trim();
  const freeShippingThreshold=francoRaw===''?null:Math.max(0,Number(francoRaw)||0);
  const contactName=String(data.scontact||'').trim();
  const email=String(data.semail||'').trim();
  const phone=String(data.sphone||'').trim();
  const website=String(data.swebsite||'').trim();
  const notes=String(data.snotes||'').trim();
  const sid=data.sid;
  if(sid){
    const sp=supplierById(sid);if(!sp)return;
    Object.assign(sp,{name,contactName,email,phone,website,leadTimeDays,shippingCost,freeShippingThreshold,minimumOrder,notes});
    logActivity({type:'PURCHASE',severity:'INFO',source:'USER_ACTION',entityType:'Supplier',entityId:sp.id,title:'Fournisseur modifié',message:`${sp.name} mis à jour.`});
    reconcileProposals(state);save();showToast(`${sp.name} mis à jour`);
    state.sidePanelOrderId=sp.id;renderSupplierDetail(sp.id);
  }else{
    const id=nextSupplierId();
    const sp={id,name,active:true,leadTimeDays,freeShippingThreshold,shippingCost,minimumOrder,notes,contactName,email,phone,website};
    state.suppliers.push(sp);
    logActivity({type:'PURCHASE',severity:'INFO',source:'USER_ACTION',entityType:'Supplier',entityId:sp.id,title:'Fournisseur créé',message:`${sp.name} ajouté.`});
    save();showToast(`${sp.name} ajouté`);
    state.sidePanelOrderId=sp.id;renderSupplierDetail(sp.id);
  }
}
/* setSupplierActive — suspension canonique (§37-38 du mandat) : aucune

/* submitTariffForm — respecte l'invariant existant (V3.4.x) : au plus un
   ArticleSupplier actif preferred=true par article. Réutilise exactement la
   même règle que l'import de tarifs (applyImportRows) : passer preferred
   retire automatiquement preferred des autres tarifs actifs de cet article. */
function submitTariffForm(data){
  const supplierId=data.tsupplier,articleId=data.tarticle;
  const sp=supplierById(supplierId),article=findArticle(articleId);
  if(!sp||!article){showToast('Fournisseur ou article invalide');return}
  const unitPrice=Number(data.tprice);
  if(!Number.isFinite(unitPrice)||unitPrice<0){showToast('Prix invalide');return}

/* Scénarios WAIT -> ORDER_NOW et retour au fournisseur préféré.
   Fixture isolée (§39) : le carnet réel de commandes du POC varie et ne doit
   jamais être un paramètre caché du moteur — on construit donc un jeu de
   VRAIES commandes contrôlé, on l'exécute avec le moteur générique tel quel
   (aucune branche spécifique à un article ou à un scénario), puis on restaure
   l'état exact. Les assertions portent sur des invariants structurels
   (bascule de fournisseur, hausse de quantité, dismissal) et non sur des
   constantes numériques recopiées d'une spec. */
function purchaseFixtureFor(articleId,fn){
  const bak=cloneDeep(serializableState());
  try{
    state.purchaseScenarioUrgent=false;
    state.orders=[];
    state.purchaseOrders=[];
    state.purchaseProposals=[];
    // Neutralise tous les AUTRES articles (une proposition regroupe tout le
    // panier d'un même fournisseur préféré — §1 du corrigendum — donc sans
    // cela l'urgence propre d'un autre article contaminerait le scénario)
    // en les remontant à une couverture confortable, puis ramène l'article
    // testé à un stock bas et contrôlé pour que le scénario soit
    // reproductible quel que soit le seed courant.
    (state.articles||[]).forEach(a=>{
      const target=a.id===articleId?2:Math.max(3*(a.safetyStock||0),10);
      const cur=physicalStock(a.id);
      if(cur!==target)state.stockMovements.push({id:uid('MOV'),at:Clock.iso(),articleId:a.id,type:'ADJUSTMENT',qty:target-cur,reason:'Fixture test achats',sourceType:'test',sourceId:'FIXTURE',consumptionKey:null,userId:null});
    });
    const out=fn();
    Object.assign(state,{...state,...bak});
    return out;
  }catch(e){Object.assign(state,{...state,...bak});return {pass:false,error:e.message}}
}

/* V3.6 Partie A (§9/§47) : "Le retour terrain invalide la règle d'anonymisation
   systématique" — le nom patient est désormais visible PAR DÉFAUT (fiche +
   Quick View), sauf commande explicitement anonymisée (order.anonymized=true),

   visible / nom masqué selon `anonymized`, plutôt qu'un seul cas figé. */

  const o=state.orders.find(x=>x.id===id);
  const originalQr=qrSvg;const seen=[];
  qrSvg=function(text){seen.push(text);return originalQr(text)};

  let printHtmlVisible='',quickHtmlVisible='',printHtmlAnon='',quickHtmlAnon='';
  try{

    printHtmlAnon=document.getElementById('print-area')?document.getElementById('print-area').innerHTML:'';
    quickHtmlAnon=document.getElementById('quick-body')?document.getElementById('quick-body').innerHTML:'';
  }finally{qrSvg=originalQr;window.print=originalPrint}
  const onlyOrderId=seen.length>0&&seen.every(t=>t===id);
  const nameVisibleByDefault=printHtmlVisible.includes('Marie')&&printHtmlVisible.includes('Dupont')&&quickHtmlVisible.includes('Marie')&&quickHtmlVisible.includes('Dupont');
  const nameHiddenWhenAnonymized=!printHtmlAnon.includes('Marie')&&!printHtmlAnon.includes('Dupont')&&!quickHtmlAnon.includes('Marie')&&!quickHtmlAnon.includes('Dupont');

  const hasPrimaryAction=(quickHtmlVisible.includes(`data-print-tracking="${id}"`)||quickHtmlVisible.includes(`data-print-fiche="${id}"`));
  delete state.cabinetPatients[id];

  const ql=document.getElementById('quick-layer');if(ql)ql.classList.remove('open');
  const qb=document.getElementById('quick-body');if(qb)qb.innerHTML='';
  const area=document.getElementById('print-area');if(area)area.innerHTML='';
  Object.assign(state,{...state,...bak});
  return {onlyOrderId,nameVisibleByDefault,nameHiddenWhenAnonymized,hasPatientRefOnPrintAnon,hasPatientRefOnPrintVisible,hasOrderIdOnPrint,hasQrSvgOnPrint,hasQrOnQuick,hasPrimaryAction,seen,pass:onlyOrderId&&nameVisibleByDefault&&nameHiddenWhenAnonymized&&hasPatientRefOnPrintAnon&&hasPatientRefOnPrintVisible&&hasOrderIdOnPrint&&hasQrSvgOnPrint&&hasQrOnQuick&&hasPrimaryAction};
});
