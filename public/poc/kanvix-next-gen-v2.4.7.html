        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 11px;
      }
      .ai-btn,
      .ai-actions button {
        border: 1px solid var(--border);
        background: var(--surface-subtle);
        color: var(--text);
        border-radius: 8px;
        min-height: 34px;
        padding: 7px 11px;
        font-weight: 600;
        font-size: 12.5px;
      }
      .ai-btn:hover,
      .ai-actions button:hover {
        background: var(--surface-muted);
        border-color: var(--border-strong);
      }
      .ai-btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .ai-btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .ai-btn-danger {
        background: var(--danger-soft);
        border-color: var(--danger-border);
        color: var(--danger-ink);
      }
      .ai-btn:active {
        transform: translateY(1px);
      }
      .ai-btn:disabled,
      .ai-actions button:disabled,
      .ai-suggestions button:disabled,
      .ai-header button:disabled,
      .ai-history-item:disabled {
        background: var(--surface-muted);
        color: var(--text-tertiary);
        border-color: var(--border-light);
        cursor: not-allowed;
      }
      .ai-history-item {
        display: grid;
        gap: 3px;
        width: 100%;
        margin: 0 0 8px;
        padding: 11px 12px;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface-subtle);
        color: var(--text);
      }
      .ai-history-item small {
        color: var(--text-secondary);
      }
      .ai-history-item:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .ai-history-link {
        display: inline-flex;
        align-items: center;
        border: 1px solid transparent;
        background: transparent;
        color: var(--accent);
        padding: 8px 4px;
        border-radius: 7px;
        font-weight: 500;
        text-align: left;
      }
      .ai-history-link:hover {
        background: var(--accent-soft);
        border-color: var(--border);
        color: var(--accent-ink);
      }
      .ai-compose {
        display: grid;
        grid-template-columns: 1fr 40px;
        gap: 9px;
        padding: 14px 18px 18px;
        border-top: 1px solid var(--border-light);
        background: var(--surface);
      }
      .ai-compose textarea {
        resize: none;
        max-height: 110px;
        border: 1px solid var(--border);
        background: var(--surface-subtle);
        color: var(--text);
        border-radius: 10px;
        padding: 11px 12px;
      }
      .ai-compose textarea::placeholder {
        color: var(--text-tertiary);
      }
      .ai-compose button {
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 16px;
      }
      .ai-compose button:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .ai-scenario {
        padding: 13px 0;
        border-top: 1px solid var(--border-light);
      }
      .ai-scenario h3 {
        font-size: 14px;
        color: var(--text);
      }
      .ai-scenario h3 small {
        display: inline-block;
        margin-left: 8px;
        padding: 3px 6px;
        border-radius: 5px;
        background: var(--accent);
        color: #fff;
        font-size: 9px;
        letter-spacing: 0.08em;
      }
      .ai-scenario.recommended {
        margin-inline: -10px;
        padding-inline: 10px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--accent-soft);
      }
      .ai-scenario dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 5px;
        margin: 8px 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .ai-scenario dd {
        margin: 0;
        color: var(--text);
      }
      @keyframes aiIn {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }

      /* ---------------- Artisan (usage smartphone) ---------------- */
      /* Le mode Artisan est un usage smartphone EXCLUSIF. Sur desktop, on
         simule donc un cadre « téléphone » (460px) centré — pour la
         conversation ET toute page conducteur atteinte depuis elle (Documents…).
         Sidebar masquée : la seule sortie est le bandeau de retour. */
      .artisan-body .sidebar,
      .artisan-body .add {
        display: none;
      }
      .artisan-body .shell {
        display: block;
        background: var(--surface-subtle);
      }
      .artisan-body .main {
        max-width: 460px;
        min-height: 100vh;
        padding: 0;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--border-light);
      }
      /* Conversation = chat plein cadre (padding 0). Une page conducteur
         consultée depuis la conversation reçoit un padding « mobile ». */
      .artisan-body:not(.artisan-page) .page {
        padding: 18px 16px 84px;
      }
      /* Le cadre 460px est plus étroit que le point de rupture mobile (720px),
         mais les media queries se basent sur le VIEWPORT réel — sur desktop
         elles ne s'appliquent donc pas. On force ici la mise en page mobile à
         l'intérieur du cadre artisan, quelle que soit la largeur du navigateur,
         pour que les pages (Documents…) respectent le format smartphone. */
      .artisan-body .header {
        flex-direction: column;
        gap: 8px;
      }
      .artisan-body .context {
        text-align: left;
      }
      .artisan-body .lib-controls {
        gap: 10px;
      }
      .artisan-body .search-field {
        min-width: 100%;
      }
      .artisan-body .scope-select {
        flex: 1;
        min-width: 0;
      }
      .artisan-body .card-grid,
      .artisan-body .photos {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .artisan-body .chips {
        margin: 0 -16px 16px;
        padding: 0 16px;
        flex-wrap: nowrap;
        overflow-x: auto;
      }
      /* Bandeau de retour quand l'artisan consulte une page conducteur
         (ex. Documents du chantier) — seul chemin de retour, sidebar masquée.
         Pleine largeur du cadre (le padding vit sur .page, pas sur .main). */
      .artisan-away-bar {
        position: sticky;
        top: 0;
        z-index: 8;
        padding: 12px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border-light);
      }
      .artisan-away-bar .link {
        font-size: 13px;
      }
      /* ---------------- Mode Chantier (conducteur, smartphone-first) ---------------- */
      .field-body .sidebar,
      .field-body .add {
        display: none;
      }
      .field-body .shell {
        display: block;
        background: var(--surface-subtle);
      }
      .field-body .main {
        max-width: 480px;
        margin: 0 auto;
        padding: 0;
        min-height: 100vh;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--border-light);
      }
      .field-body .page {
        padding: 0;
      }
      .field-wrap {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .field-header {
        position: sticky;
        top: 0;
        z-index: 8;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 10px;
        padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border-light);
      }
      .field-header-ghost {
        visibility: hidden;
        pointer-events: none;
      }
      .field-back {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        flex: none;
      }
      .field-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.15;
      }
      .field-brand b {
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .field-brand span {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .field-icon-btn {
        position: relative;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--text);
        flex: none;
      }
      .field-icon-btn svg {
        width: 20px;
        height: 20px;
      }
      .field-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--danger);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      .field-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 20px;
      }
      .field-section {
        margin-bottom: 22px;
      }
      .field-h2 {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        font-weight: 700;
        margin: 0 0 10px;
      }
      .field-project-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      .field-eyebrow {
        font-size: 10px;
        letter-spacing: 0.1em;
        font-weight: 700;
        color: var(--text-tertiary);
      }
      .field-project-head h1 {
        font-size: 22px;
        margin: 2px 0 1px;
        letter-spacing: -0.01em;
      }
      .field-project-head small {
        color: var(--text-secondary);
        font-size: 13px;
      }
      .field-projects {
        display: grid;
        gap: 12px;
      }
      .field-project-card {
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        padding: 14px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
      }
      .field-project-card:active {
        transform: scale(0.99);
      }
      .field-project-visual {
        width: 64px;
        height: 64px;
        border-radius: var(--radius-md);
        overflow: hidden;
        flex: none;
        background: var(--surface-muted);
      }
      .field-project-visual svg {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .field-project-body {
        display: grid;
        gap: 2px;
      }
      .field-project-body b {
        font-size: 16px;
      }
      .field-project-body small {
        font-size: 12.5px;
        color: var(--text-secondary);
      }
      .field-today-count {
        color: var(--accent-ink, var(--accent)) !important;
        font-weight: 600;
      }
      .field-list {
        display: grid;
        gap: 10px;
      }
      .field-task {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px 14px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
      }
      .field-task .field-task-body {
        flex: 1;
        min-width: 0;
      }
      .field-task-body b {
        display: block;
        font-size: 14.5px;
      }
      .field-task-body small {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .field-task.control .btn {
        flex: none;
      }
      .field-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        background: var(--text-tertiary);
      }
      .field-dot.danger {
        background: var(--danger);
      }
      .field-dot.warning {
        background: var(--warning);
      }
      .field-dot.success {
        background: var(--success);
      }
      .field-dot.accent {
        background: var(--accent);
      }
      .field-none {
        color: var(--text-tertiary);
        font-size: 13px;
        margin: 0;
      }
      /* Planning mobile Mode Chantier (v2.4.2) — agenda + dépendances simples. */
      .field-range-toggle {
        margin: 2px 0 18px;
      }
      .field-plan-day {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        margin: 18px 0 8px;
      }
      .field-plan-day:first-child {
        margin-top: 0;
      }
      .field-plan-arrow {
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-tertiary);
      }
      .field-plan-focus-row {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .field-search {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        margin-bottom: 12px;
        background: var(--surface);
      }
      .field-search svg {
        width: 17px;
        height: 17px;
        color: var(--text-tertiary);
        flex: none;
      }
      .field-search input {
        border: 0;
        background: none;
        padding: 11px 0;
        flex: 1;
        font-size: 14px;
        color: var(--text);
        min-width: 0;
      }
      .field-search input:focus {
        outline: none;
      }
      .field-messages-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 2px 0 12px;
      }
      .field-messages-head h2 {
        margin: 0;
      }
      .field-modal-meta {
        margin: 10px 0 14px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-subtle);
      }
      .field-modal-meta b {
        display: block;
        margin-bottom: 2px;
      }
      .field-modal-meta p {
        margin: 0;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .field-bottom {
        position: sticky;
        bottom: 0;
        display: flex;
        border-top: 1px solid var(--border-light);
        background: var(--surface);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .field-bottom button {
        position: relative;
        flex: 1;
        border: 0;
        background: none;
        color: var(--text-secondary);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 10px 4px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .field-bottom button.active {
        color: var(--accent);
      }
      .field-bottom button svg {
        width: 22px;
        height: 22px;
      }
      .field-bottom .field-badge {
        top: 4px;
        right: calc(50% - 22px);
      }
      .field-empty {
        padding: 24px 0;
      }
      .chat {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .chat-header {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-light);
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .chat-header .resource-avatar {
        --size: 40px;
      }
      .chat-title {
        flex: 1;
        min-width: 0;
        line-height: 1.3;
      }
      .chat-title b {
        display: block;
        font-size: 15px;
      }
      .chat-title span {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .chat-online {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--success);
        font-size: 11px;
        font-weight: 600;
      }
      .chat-online i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .chat-mission {
        margin: 14px 16px 6px;
        padding: 15px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-subtle);
      }
      .chat-mission .eyebrow {
        color: var(--accent-ink);
      }
      .chat-mission h2 {
        font-size: 18px;
        margin: 5px 0 3px;
      }
      .chat-mission .mission-time {
        color: var(--text-secondary);
        font-size: 13px;
        margin: 0 0 12px;
      }
      .chat-mission .actions {
        margin-top: 12px;
      }
      .chat-status-live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--success);
        margin-bottom: 6px;
      }
      .chat-thread {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 16px 16px;
        overflow: auto;
      }
      .chat-day {
        text-align: center;
        margin: 8px 0;
        font-size: 11px;
        color: var(--text-tertiary);
        font-weight: 600;
      }
      .bubble {
        max-width: 78%;
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        position: relative;
      }
      .bubble.them {
        align-self: flex-start;
        background: var(--surface-muted);
        border-bottom-left-radius: 5px;
      }
      .bubble.me {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 5px;
      }
      .bubble .bubble-photo {
        display: block;
        width: 100%;
        height: 120px;
        border-radius: 9px;
        margin-bottom: 7px;
        overflow: hidden;
        padding: 0;
        border: 0;
        cursor: pointer;
        background: none;
      }
      .bubble .bubble-photo svg,
      .bubble .bubble-photo .photo-img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .bubble time {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        opacity: 0.7;
        text-align: right;
      }
      .bubble.me time {
        color: #dbe8ff;
      }
      .chat-compose {
        display: grid;
        grid-template-columns: 38px 1fr 38px;
        gap: 8px;
        align-items: center;
        padding: 11px 14px;
        border-top: 1px solid var(--border-light);
        background: var(--surface);
        position: sticky;
        bottom: 0;
      }
      .chat-compose input {
        border-radius: 20px;
        background: var(--surface-subtle);
        border-color: var(--border);
      }
      .chat-icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        display: grid;
        place-items: center;
      }
      .chat-icon-btn svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chat-icon-btn.send {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      /* legacy artisan fallbacks (kept for safety) */
      .artisan {
        display: flex;
        flex-direction: column;
        padding: 20px;
      }
      .mission {
        margin-top: 20px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .mobile-nav {
        display: flex;
        justify-content: space-around;
        margin-top: auto;
        padding: 14px 0;
        border-top: 1px solid var(--border-light);
      }
      .mobile-nav button {
        border: 0;
        background: none;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .mobile-nav button.active {
        color: var(--accent);
        font-weight: 600;
      }

      /* ---------------- Impact chain ---------------- */
      .impact-chain {
        display: grid;
        gap: 0;
      }
      .impact-step {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
      }
      .impact-step:hover {
        border-color: var(--border-strong);
      }
      .impact-step.source {
        border-color: var(--danger-border);
        background: var(--danger-soft);
      }
      .impact-step h4 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .impact-step small {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .impact-link {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 0 6px 22px;
        color: var(--text-tertiary);
        font-size: 11px;
        font-weight: 600;
      }
      .impact-link:before {
        content: "";

        color: var(--danger-ink);
      }

        margin: 6px 0 2px;

        margin: 0;
        color: var(--text-secondary);

      .uc-chain {
        display: grid;
        gap: 0;
      }
      .uc-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 12px;
        align-items: start;
        padding: 14px 16px;
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--border-strong);
        border-radius: var(--radius-md);

      .uc-card.source {
        border-color: var(--danger-border);

      }
      .uc-card.milestone {

        border-left-color: var(--accent);

      .uc-card .uc-role {

        font-weight: 700;
        letter-spacing: 0.1em;

      }
      .uc-card.milestone .uc-role {
        color: var(--accent-ink);
      }
      .uc-card h4 {

        font-size: 15px;
        color: var(--text);

        align-items: center;

        margin-top: 7px;

        align-items: center;

      .uc-badge {
        align-self: start;

        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.01em;

      .uc-badge.danger {
        background: color-mix(in srgb, var(--danger) 16%, transparent);

      }
      .uc-badge.accent {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent-ink);
      }
      .uc-badge.soft {
        background: var(--surface-muted);
        color: var(--text-tertiary);

      .uc-arrow {

        place-items: center;
        height: 22px;
        color: var(--text-tertiary);

      }

        font-size: 13px;

      /* ---------------- Réglages (V2.4.7) — page de préférences sobre ---------------- */
      .settings-page {

      /* Un réglage = titre 15-16px + sous-titre + contrôle */

      .settings-hint {

        color: var(--text-secondary);

      /* Contrôle segmenté sobre (pas de gros bouton bleu plein) */
      .seg {

      .seg-opt {

        align-items: center;

      /* Mode de démonstration — deux cartes rôle */

      }
      .settings-sublabel {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin: 0 0 10px;

      .role-grid {
        display: grid;

      .role-card {

        gap: 12px;
        align-items: flex-start;

      .role-card:hover {
        border-color: var(--accent);
      }
      .role-card.active {
        background: var(--accent-soft);
        border-color: var(--accent);

      .role-card .role-emoji {

        line-height: 1;
        flex: none;

      .role-card .role-body b {

        display: block;

      .role-card .role-body small {

        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;

      /* Données & démonstration — lignes de réglage cliquables */
      .settings-rows {
        display: flex;
        flex-direction: column;
      }
      .settings-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 10px;
        padding: 14px 12px;
        cursor: pointer;
        color: var(--text);
        transition: background 0.14s;
      }
      .settings-row:hover {

      }
      .settings-row + .settings-row {
        border-top: 1px solid var(--border-light);
        border-radius: 0;

      .settings-row-ico {
        flex: none;
        font-size: 17px;
        width: 22px;
        text-align: center;
        color: var(--text-tertiary);
      }
      .settings-row-body {
        flex: 1;
        min-width: 0;
      }
      .settings-row-body b {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      .settings-row-body small {
        font-size: 12px;
        color: var(--text-secondary);
        display: block;
        margin-top: 2px;
      }
      .settings-row-chevron {
        flex: none;
        color: var(--text-tertiary);
        font-size: 18px;
      }
      .settings-danger-sep {
        height: 1px;
        background: var(--border-light);
        margin: 8px 0;
      }
      .settings-row.danger .settings-row-ico,
      .settings-row.danger .settings-row-body b,
      .settings-row.danger .settings-row-chevron {
        color: var(--danger-ink);
      }
      .settings-row.danger:hover {
        background: var(--danger-soft);
      }
      @media (max-width: 620px) {
        .role-grid {
          grid-template-columns: 1fr;
        }
        .settings-section {
          padding: 20px 16px;
        }
      }

    <script id="kanvix-js">
      // CONSTANTS
      const SEED_TODAY = "2026-08-13", // date d'écriture des données de démo
        APP_VERSION = "8.3",
        STORE = "kanvix-product-8-3",
        DAY = 86400000,
        STATUS = {
          todo: "À faire",
          doing: "En cours",
          done: "Terminée",
          waiting: "En attente",
          late: "En retard",
        };
      // TEMPS RÉEL — la démo s'ancre sur la date de l'appareil (pensé PWA).
      // NOW_OVERRIDE permet de figer l'horloge (tests / démonstration pilotée).
      // Optionnel : ?now=YYYY-MM-DDTHH:MM fige la date de démo (aperçu / recette).
      let NOW_OVERRIDE = null;
      try {
        let q = new URLSearchParams(location.search).get("now");
        if (q) NOW_OVERRIDE = q;
      } catch {}
      function nowDate() {
        return NOW_OVERRIDE ? new Date(NOW_OVERRIDE) : new Date();
      }
      function todayKeyOf(d) {
        d = d || nowDate();
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }
      // Recalculée à chaque changement d'horloge (setDemoClock).
      let TODAY = todayKeyOf() + "T00:00";
      // Décalage d'une chaîne de date "YYYY-MM-DD..." de N jours (heure préservée).
      function shiftDateStr(s, days) {
        if (typeof s !== "string") return s;

          if (stored) {
            geocodeMemo[key] = stored;
            return Promise.resolve(stored);
          }
          if (geocodePending[key]) return geocodePending[key];
          let request = (async () => {
            try {
              let url =
                "https://data.geopf.fr/geocodage/search?q=" +
                encodeURIComponent(location) +
                "&limit=1";
              let res = await fetch(url);
              if (!res.ok) throw new Error("géocodage http " + res.status);
              let data = await res.json(),
                feat = data?.features?.[0];
              if (!feat) return null;
              let [lon, lat] = feat.geometry.coordinates,
                coords = { lat, lon };
              geocodeMemo[key] = coords;
              cache.geocode = cache.geocode || {};
              cache.geocode[key] = coords;
              saveWeatherCache(cache);
              return coords;
            } catch (err) {
              console.warn("Kanvix météo : géocodage indisponible pour", location, err);
              return null;
            } finally {
              delete geocodePending[key];
            }
          })();
          geocodePending[key] = request;
          return request;
        }
        // Géocodage inverse (coordonnées → commune) — pour le bloc météo du
        // conducteur uniquement ; jamais utilisé pour les chantiers, qui
        // gardent toujours project.location comme libellé affiché (§16).
        async function reverseGeocode(lat, lon) {
          let key = "rev:" + weatherCoordKey(lat, lon);
          if (geocodeMemo[key] !== undefined) return geocodeMemo[key];
          try {
            let url = `https://data.geopf.fr/geocodage/reverse?lon=${lon}&lat=${lat}&limit=1`;
            let res = await fetch(url);
            if (!res.ok) throw new Error("géocodage inverse http " + res.status);
            let data = await res.json(),
              name = placeNameFromFeature(data?.features?.[0]);
            geocodeMemo[key] = name;
            return name;
          } catch (err) {
            console.warn("Kanvix météo : localisation indisponible", err);
            return null;
          }
        }
        // Météo actuelle par coordonnées — Open-Meteo (WMO weather_code, pas
        // de clé requise). Cache 15-30 min, repli 6h max si le réseau échoue.
        function getWeatherForCoordinates(lat, lon) {
          let key = weatherCoordKey(lat, lon),
            entry = cache.weather?.[key];
          if (entry && Date.now() - entry.fetchedAt < WEATHER_TTL_MS)
            return Promise.resolve(entry);
          if (weatherPending[key]) return weatherPending[key];
          let request = (async () => {
            try {
              let url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m`;
              let res = await fetch(url);
              if (!res.ok) throw new Error("météo http " + res.status);
              let data = await res.json(),
                c = data.current;
              if (!c) return null;
              let fresh = {
                temperature: c.temperature_2m,
                weatherCode: c.weather_code,
                windSpeed: c.wind_speed_10m,
                fetchedAt: Date.now(),
              };
              cache.weather = cache.weather || {};
              cache.weather[key] = fresh;
              saveWeatherCache(cache);
              return fresh;
            } catch (err) {
              console.warn("Kanvix météo : indisponible pour", lat, lon, err);
              if (entry && Date.now() - entry.fetchedAt < WEATHER_OFFLINE_MAX_MS)
                return { ...entry, stale: true };
              return null; // pas de cache exploitable : le bloc météo reste masqué
            } finally {
              delete weatherPending[key];
            }
          })();
          weatherPending[key] = request;
          return request;
        }
        async function getWeatherForLocation(location) {
          let coords = await getCoordinatesForLocation(location);
          return coords ? getWeatherForCoordinates(coords.lat, coords.lon) : null;
        }
        // Météo du conducteur : géolocalisation (avec accord du navigateur
        // uniquement), jamais bloquante — l'appelant doit résoudre en tâche de
        // fond et mettre à jour l'UI seul (voir updateUserWeatherWidget).
        let userWeatherPromise = null;
        function getCurrentUserWeather() {
          if (userWeatherPromise) return userWeatherPromise;
          userWeatherPromise = new Promise((resolve) => {
            if (!navigator.geolocation) return resolve(null);
            navigator.geolocation.getCurrentPosition(
              async (pos) => {
                let { latitude: lat, longitude: lon } = pos.coords,
                  weather = await getWeatherForCoordinates(lat, lon),
                  place = await reverseGeocode(lat, lon);
                resolve(weather ? { ...weather, place } : null);
              },
              () => resolve(null), // refus/erreur : repli silencieux, voir §7.2
              { timeout: 8000, maximumAge: 10 * 60 * 1000 },
            );
          });
          return userWeatherPromise;
        }
        return {
          getCoordinatesForLocation,
          getWeatherForCoordinates,
          getWeatherForLocation,
          getCurrentUserWeather,
        };
      })();
      // Pictogramme sobre à partir du code WMO Open-Meteo — jamais déduit de
      // la température (voir doc Open-Meteo : weather_code, table WMO 4677).
      function weatherIcon(code) {
        if (code === 0) return "☀️";
        if (code >= 1 && code <= 3) return "🌤";
        if (code >= 45 && code <= 48) return "🌫";
        if (code >= 51 && code <= 67) return "🌧";
        if (code >= 71 && code <= 77) return "🌨";
        if (code >= 80 && code <= 82) return "🌦";
        if (code >= 85 && code <= 86) return "🌨";
        if (code >= 95) return "⛈";
        return "🌡";
      }
      // Météo du conducteur (hero Accueil) — état en mémoire uniquement,
      // JAMAIS persisté dans app/STORE (ce n'est pas une donnée métier).
      let currentUserWeather = null,
        userWeatherRequested = false;
      function initUserWeather() {
        if (userWeatherRequested) return;
        userWeatherRequested = true;
        weatherService.getCurrentUserWeather().then((w) => {
          currentUserWeather = w;
          updateUserWeatherWidget();
        });
      }
      // Réserve toujours sa largeur (même vide) : le titre de l'en-tête ne
      // doit jamais bouger quand la météo termine de charger (§21).
      function userWeatherWidgetHTML(w) {
        if (!w) return `<div class="hero-weather" id="userWeatherWidget"></div>`;
        return `<div class="hero-weather" id="userWeatherWidget" title="Météo · Open-Meteo${w.stale ? " · dernières données connues" : ""}"><span class="hw-ico">${weatherIcon(w.weatherCode)}</span><span class="hw-temp">${Math.round(w.temperature)}°</span>${w.place ? `<small>${esc(w.place)}</small>` : ""}</div>`;
      }
      function updateUserWeatherWidget() {
        let el = $("#userWeatherWidget");
        if (!el || app.ui.page !== "today") return;
        el.outerHTML = userWeatherWidgetHTML(currentUserWeather);
      }
      // Météo par chantier (Accueil "Chantiers actifs" ET header Mode Chantier)
      // — état en mémoire, indépendant de app/STORE. project.location reste
      // TOUJOURS le libellé affiché (§16) ; le géocodage ne sert qu'à trouver
      // des coordonnées. Dédoublonné par lieu normalisé (§13) : deux chantiers
      // à "Brest" ne déclenchent qu'un seul géocodage + un seul appel météo,
      // grâce au cache interne de weatherService.
      let projectWeatherState = {}, // pid -> résultat météo | false (échec connu)
        projectWeatherLastAttempt = {}, // pid -> timestamp du dernier appel RÉSEAU lancé
        projectWeatherInFlight = {}; // pid -> Promise déjà en vol (dédoublonnage, V2.4.5 §1.3)
      // Anti-rappel léger (60s) pour ne jamais interroger le réseau à CHAQUE
      // renderPage() (§12) — le cache TTL de weatherService (15-30 min) décide
      // ensuite seul si un nouvel appel réseau est réellement nécessaire.
      // V2.4.5 (F01) : donnée et affichage DOM sont désormais DÉCOUPLÉS — cette
      // fonction ne fait plus qu'orchestrer le réseau (dédoublonné par
      // projectWeatherInFlight) ; c'est projectWeatherHTML()/le rendu de
      // activeProjectsPanel()/fieldProjectView() qui réappliquent à CHAQUE
      // rendu la donnée déjà connue, sans attendre le .then() du tout premier
      // appel — un rendu produit pendant la fenêtre d'anti-rappel n'affiche
      // donc plus jamais un badge vide qui ne se peuplerait plus jamais.
      function ensureProjectWeather(pid, location) {
        if (!location || projectWeatherInFlight[pid]) return;
        let now = Date.now();
        if (projectWeatherLastAttempt[pid] && now - projectWeatherLastAttempt[pid] < 60000)
          return;
        projectWeatherLastAttempt[pid] = now;
        projectWeatherInFlight[pid] = weatherService
          .getWeatherForLocation(location)
          .then((w) => {
            projectWeatherState[pid] = w || false;
            updateProjectWeatherBadge(pid);
          })
          .finally(() => {
            delete projectWeatherInFlight[pid];
          });
      }
      // Rendu compact (icône + température) de l'état déjà connu — jamais de
      // valeur fictive tant que rien n'est confirmé (chaîne vide).
      function projectWeatherHTML(pid) {
        let w = projectWeatherState[pid];
        return w ? `${weatherIcon(w.weatherCode)} ${Math.round(w.temperature)}°` : "";
      }
      // Hydrate le(s) nœud(s) DOM ACTUEL(S) quand une requête réseau aboutit
      // (querySelectorAll interroge le DOM au moment de la résolution, jamais
      // une référence capturée au moment de l'appel).
      function updateProjectWeatherBadge(pid) {
        let html = projectWeatherHTML(pid);
        document.querySelectorAll(`.acp-weather[data-pid="${pid}"]`).forEach((el) => {
          el.innerHTML = html;
          el.title = html ? "Météo · Open-Meteo" : "";
        });
      }
      // Libellé long du jour courant — horloge réelle uniquement, jamais codé
      // en dur. Format française sans année (inutile sur l'Accueil) : "lundi
      // 31 août", "mardi 1er septembre".
      function todayLongLabel() {
        let d = date(TODAY),
          cap = (s) => s.charAt(0).toUpperCase() + s.slice(1),
          weekday = new Intl.DateTimeFormat("fr-FR", { weekday: "long" }).format(d),
          month = new Intl.DateTimeFormat("fr-FR", { month: "long" }).format(d),
          day = d.getDate();
        return `${cap(weekday)} ${day === 1 ? "1er" : day} ${month}`;
      }
      // PAGE RENDERERS
      // Bande « Cette semaine » — aperçu léger, niveau-conscient, sous le workflow.
      function weekPreview() {
        let level = app.settings.level,
          expert = level !== "essential",
          pilot = level !== "essential",
          days = getResourceWeekDays(),
          todayKey = dayKey(TODAY),
          cap = (s) => s.charAt(0).toUpperCase() + s.slice(1),
          cells = days
            .map((day) => {
              let dt = date(day + "T12:00"),
                wd = cap(
                  new Intl.DateTimeFormat("fr-FR", { weekday: "short" }).format(
                    dt,
                  ),
                ).replace(".", ""),
                label = `${wd} ${dt.getDate()}`,
                isToday = day === todayKey,
                dayTasks = app.tasks.filter(
                  (t) =>
                    t.status !== "done" &&
                    dayKey(t.start) <= day &&
                    dayKey(t.end) >= day,
                ),
                count = dayTasks.length,
                crit = app.issues.some(
                  (i) =>
                    i.status !== "resolved" &&
                    i.severity === "critical" &&
                    dayTasks.some((t) => t.id === i.taskId),
                ),
                warn =
                  app.issues.some(
                    (i) =>
                      i.status !== "resolved" &&
                      dayTasks.some((t) => t.id === i.taskId),
                  ) ||
                  dayTasks.some(
                    (t) => t.status === "late" || t.status === "waiting",
                  ),
                conflict =
                  expert &&
                  app.resources.some(
                    (r) => getResourceState(r.id, day) === "conflict",
                  ),
                signals = "";
              if (crit) signals += `<span class="wp-dot danger"></span>`;
              else if (warn) signals += `<span class="wp-dot warning"></span>`;
              if (pilot && (crit || warn))
                signals += `<span class="wp-risk">${crit ? "À décider" : "À surveiller"}</span>`;
              if (conflict) signals += `<span class="wp-tag">Conflit</span>`;
              if (!signals)
                signals = `<span class="wp-quiet">${count ? "Sous contrôle" : "—"}</span>`;
              return `<button class="wp-day ${isToday ? "today" : ""}" onclick="openDayTasks('${day}')" aria-label="${label}, ${count} intervention${count > 1 ? "s" : ""}"><span class="wp-label">${label}${isToday ? `<span class="wp-today-tag">Auj.</span>` : ""}</span><span class="wp-count"><b>${count}</b>${count > 1 ? "interventions" : "intervention"}</span><span class="wp-signals">${signals}</span></button>`;
            })
            .join("");
        // Une SEULE carte : le header et les 5 jours sont les cellules
        // contiguës d'un même bloc (voir .week-card), pas cinq cartes
        // flottantes séparées par des espaces (§22).
        return `<section class="week-preview"><div class="week-card"><div class="week-card-head"><h2>Cette semaine</h2><button class="link" onclick="openWeekPlanning()">Vue semaine ›</button></div><div class="wp-days">${cells}</div></div></section>`;
      }
      function focusPlanningDay(day) {
        app.ui.planningProject = "all";
        app.ui.planningResource = "all";
        app.settings.period =
          app.settings.level === "essential" ? "week" : "day";
        app.ui.periodAnchor = day + "T08:00";
        app.ui.planningNeedsCenter = true;
        app.ui.page = "planning";
        save();
        renderPage();
        scrollTo(0, 0);
      }
      // Pop-up « journée » : toutes les tâches du jour + accès direct au planning.
      function openDayTasks(day) {
        let dt = date(day + "T12:00"),
          cap = (s) => s.charAt(0).toUpperCase() + s.slice(1),
          title = cap(
            new Intl.DateTimeFormat("fr-FR", {
              weekday: "long",
              day: "numeric",
              month: "long",
            }).format(dt),
          ),
          tasks = app.tasks
            .filter((t) => dayKey(t.start) <= day && dayKey(t.end) >= day)
            .sort((a, b) => a.start.localeCompare(b.start)),
          rows = tasks.length
            ? tasks
                .map(
                  (t) =>
                    `<button class="day-task" onclick="closeOverlay('modal');openTask('${t.id}')">${dot(taskTone(t))}<div class="day-task-body"><b>${esc(t.name)}</b><small>${esc(project(t.projectId).name)} · ${esc(resourceLabel(t.resourceId))} · ${fmtTime(t.start)}–${fmtTime(t.end)}</small></div>${pill(taskTone(t), STATUS[t.status])}</button>`,
                )
                .join("")
            : `<p class="muted" style="padding:6px 2px">Aucune intervention ce jour.</p>`;
        $("#modalContent").innerHTML =
          `<h2 id="modalTitle">${title}</h2><p class="muted">${tasks.length} intervention${tasks.length > 1 ? "s" : ""}</p>` +
          `<div class="day-tasks">${rows}</div>` +
          `<div class="pop-actions"><button class="btn" onclick="closeOverlay('modal')">Fermer</button><button class="btn primary" onclick="closeOverlay('modal');focusPlanningDay('${day}')">Ouvrir le planning</button></div>`;
        $("#modal").classList.add("open");
      }
      // ---------------- Accueil minimaliste (v2.4.3) ----------------
      // Décision UX : l'Accueil (Bureau ET Mode Chantier) ne montre plus le
      // détail de chaque alerte, seulement une synthèse (combien / quelle
      // gravité) — le détail reste à un clic (popup), jamais supprimé.
      // Une seule ligne de synthèse, ordre de priorité métier réutilisé
      // (jamais dupliqué) : critique > décisions prioritaires.
      function decisionSummary(items) {
        if (!items.length) return "Tout est traité";
        let criticals = items.filter((i) => i.severity === "critical").length;
        if (criticals) return `${criticals} critique${criticals > 1 ? "s" : ""}`;
        return items.length > 1
          ? `${items.length} décisions prioritaires`
          : "1 décision prioritaire";
      }
      // Ordre de priorité métier réutilisé (jamais dupliqué) : problème
      // terrain > échéance proche (<48h) > confirmation terrain > standard.
      function warningSummary(items) {
        if (!items.length) return "Tout est sous contrôle";
        let isProblem = (i) => i.source === "field" && !isFieldConfirmation(i),
          fieldProblems = items.filter(isProblem).length,
          confirmations = items.filter((i) => isFieldConfirmation(i)).length,
          soon = items.filter((i) => {
            if (isProblem(i) || isFieldConfirmation(i)) return false;
            let t = i.taskId ? task(i.taskId) : null,
              delta = t ? date(t.start) - getDemoNow() : null;
            return delta !== null && delta >= 0 && delta <= 2 * DAY;
          }).length;
        if (fieldProblems)
          return `${fieldProblems} problème${fieldProblems > 1 ? "s" : ""} terrain`;
        if (soon) return `${soon} échéance${soon > 1 ? "s" : ""} < 48 h`;
        if (confirmations)
          return `${confirmations} confirmation${confirmations > 1 ? "s" : ""} terrain`;
        return items.length > 1
          ? `${items.length} points de surveillance`
          : "1 point de surveillance";
      }
      // Ton d'une ligne de popup de synthèse (bureau ET Mode Chantier) :
      // confirmation terrain = calme, problème terrain = marqué, standard = léger.
      function attentionRowTone(kind, i) {
        if (kind === "decide") return i.severity === "critical" ? "danger" : "warning";
        if (isFieldConfirmation(i)) return "success";
        return i.source === "field" ? "danger" : "warning";
      }
      // Lignes compactes communes aux popups de synthèse — titre, chantier,
      // raison courte ; jamais l'analyse complète ni plusieurs boutons.
      // onClick(i) fournit l'action de clic (diffère bureau/Mode Chantier).
      function attentionRows(items, kind, onClick) {
        return items.length
          ? items
              .map(
                (i) =>
                  `<button class="day-task" onclick="${onClick(i)}">${dot(attentionRowTone(kind, i))}<div class="day-task-body"><b>${esc(i.title)}</b><small>${esc(project(i.projectId)?.name || "")}${i.comment ? " · " + esc(i.comment) : ""}</small></div></button>`,

              .join("")

      }

      // POPUP). Tri : priorité métier existante réutilisée (jamais dupliquée) —
      // getTodayWarnings trie déjà terrain > confirmation > standard, récent
      // d'abord ; les décisions sont triées ici par priorityScore (existant).
      function openMoreIssues(kind) {

            kind === "decide"

                )

            all,

          `<h2 id="modalTitle">${title}</h2><p class="muted">${all.length} au total</p>` +
          `<div class="day-tasks">${rows}</div>` +
          `<div class="pop-actions"><button class="btn" onclick="closeOverlay('modal')">Fermer</button></div>`;
        $("#modal").classList.add("open");
      }
      // Carte de synthèse minimaliste (Bureau ET Mode Chantier, même langage
      // visuel) : icône + libellé + TOTAL réel + une ligne courte, toute la
      // carte cliquable → popup. Géométrie fixe (icône/compteur/chevron) :
      // passer de 1 à 8 alertes ne change ni la hauteur ni l'alignement.
      function attentionCard(kind, items, onclickExpr, label) {
        let decide = kind === "decide",

        let cls = `attention-card ${decide ? "decide" : "watch"}${total ? "" : " calm"}`,

          top = items[0],
          topLine = top
            ? `<span class="attention-top-item">${dot(attentionRowTone(kind, top))}${esc(top.title)} — ${esc(project(top.projectId)?.name || "")}</span>`
            : "",
          // Compteur = élément graphique fort, dans sa propre zone (pas collé
          // au libellé) — à 0, un ✓ calme plutôt qu'un gros zéro anxiogène.
          countDisplay = total ? total : "✓";
        return `<button class="${cls}" data-sev="${critical ? "critical" : ""}" onclick="${onclickExpr}"><span class="attention-ico">${icon(decide ? "alert" : "eye")}</span><span class="attention-body"><b class="attention-title">${esc(label)}</b><span class="attention-sub">${summary}</span>${topLine}</span><span class="attention-count">${countDisplay}</span><span class="attention-chevron">›</span></button>`;
      }
      // Badge compact d'un chantier pour le panneau "Chantiers actifs" —
      // réutilise getProjectSummary (donc getProjectHealth/getProjectIssues),
      // aucune nouvelle vérité métier.
      function projectAttentionBadge(pid) {
        let sum = getProjectSummary(pid),
          criticals = sum.issues.filter((i) => i.severity === "critical").length;
        if (criticals)
          return { tone: "danger", icon: "⚠", text: `${criticals} critique${criticals > 1 ? "s" : ""}` };
        if (sum.issues.length)
          return { tone: "warning", icon: "◉", text: `${sum.issues.length} à surveiller` };
        return { tone: "success", icon: "✓", text: "Tout est à jour" };
      }
      // Panneau "Chantiers actifs" — activeProjects() + fonctions existantes
      // uniquement (getProjectSummary), 4 chantiers maximum, le reste via
      // "Voir tous les chantiers" (page Chantiers existante).
      function activeProjectsPanel() {
        let all = activeProjects(),
          shown = all.slice(0, 4),
          rows = shown.length
            ? shown
                .map((p) => {
                  let badge = projectAttentionBadge(p.id);
                  // Réseau orchestré en tâche de fond (jamais bloquant) ; la
                  // donnée déjà connue, elle, est réappliquée immédiatement
                  // et directement dans CE rendu (V2.4.5, F01) — le badge ne

                  ensureProjectWeather(p.id, p.location);
                  let weatherHtml = projectWeatherHTML(p.id);
                  return `<button class="acp-row" onclick="selectProject('${p.id}')"><span class="acp-visual">${projectVisual(p.id)}</span><span class="acp-body"><b>${esc(p.name)}</b><small>${[p.phase, p.location].filter(Boolean).map(esc).join(" · ")} <span class="acp-weather" data-pid="${p.id}" title="${weatherHtml ? "Météo · Open-Meteo" : ""}">${weatherHtml}</span></small></span><span class="acp-badge ${badge.tone}">${badge.icon} ${esc(badge.text)}</span></button>`;
                })
                .join("")
            : `<p class="field-none">Aucun chantier actif.</p>`;
        return `<div class="today-panel projects-panel"><div class="panel-head"><h2>Chantiers actifs</h2><button class="link" onclick="go('sites')">Voir tous les chantiers ›</button></div><div class="acp-list">${rows}</div></div>`;
      }
      // Ligne "confirmation terrain" sous une intervention du jour — réutilise
      // les signaux field-start/field-done existants, aucun nouveau système.
      function fieldStartDoneNote(t) {

      // V2.4.5 (F04) — .tp-row reste un <article> (design conservé), mais

      function taskRowKeydown(e, id) {

        let confirm = fieldStartDoneNote(t),

      function todayActionsPanel(actions) {

      function todayInsight() {

      function pageToday() {

        initUserWeather();

          attention = `<div class="attention-grid">${attentionCard("decide", decisions, "openMoreIssues('decide')")}${attentionCard("watch", warnings, "openMoreIssues('watch')")}</div>`,

        if (validateInProgressDates(d)) return;
        snapshot();
        let pid = "project-" + Date.now(),
          now = localDateTime(getDemoNow());
        app.projects.push({
          id: pid,
          name: d.name.trim(),
          location: d.location || "",
          phase: d.phase || "",
          lifecycle: "active",
          creationMode: "in_progress",
          taskGranularity: d.taskGranularity || "day",
          createdAt: now,
          onboardedAt: now,
          startDate: d.startDate ? d.startDate + "T08:00" : null,
          baselineEnd: d.milestoneDate ? d.milestoneDate + "T17:00" : null,
          visualIndex: hashHue(d.name) % 4,
        });
        if (d.milestoneName && d.milestoneDate)
          app.milestones.push({
            id: "m-" + pid,
            projectId: pid,
            name: d.milestoneName,
            date: d.milestoneDate + "T17:00",
            // Coché dans le wizard : ce jalon marque la fin du chantier.
            isFinal: !!d.milestoneIsFinal,
            taskId: null,
          });
        if (d.currentName && d.currentName.trim()) {
          let s = localDateKey(getDemoNow()) + "T08:00",
            e = (d.currentEnd || localDateKey(getDemoNow())) + "T17:00";
          app.tasks.push({
            id: pid + "-current",
            projectId: pid,
            name: d.currentName.trim(),
            resourceId: d.currentResource || null,
            start: s,
            end: e,
            status: "doing",
            deps: [],
            colorKey: "auto",

        }

        if (d.nextName && d.nextName.trim()) {
          let fallback = d.currentEnd || localDateKey(getDemoNow()),
            ns = (d.nextStart || fallback) + "T08:00",
            ne = (d.nextEnd || d.nextStart || fallback) + "T17:00";
          app.tasks.push({
            id: pid + "-next",
            projectId: pid,
            name: d.nextName.trim(),
            resourceId: d.nextResource || null,

      function finishWizard(pid) {

          h = getProjectHealth(projectId),
          xs = getProjectIssues(projectId),
          nextTask = getUpcomingTasks(projectId)[0],
          m = app.milestones.find(x => x.projectId === projectId),
          delay = calculateProjectDelay(projectId),
          critical = xs.find(i => i.severity === "critical"),
          primaryIssue = critical || xs[0],
          impacts = primaryIssue ? getCriticalImpacts(primaryIssue.taskId).length : 0,
          tasks = getProjectTasks(projectId),
          team = [...new Set(tasks.map((t) => t.resourceId))].map(resource).filter(Boolean),
          label = h === "danger" ? "Risque" : h === "warning" ? "À surveiller" : "Dans les temps",
          // Titre de synthèse (danger, warning, success)
          sTitle = h === "danger"
            ? (primaryIssue ? primaryIssue.title : nextTask ? nextTask.name : "À planifier")
            : h === "warning"
              ? (primaryIssue ? primaryIssue.title : nextTask ? nextTask.name : "À surveiller")
              : (nextTask ? nextTask.name : "Aucune intervention prévue"),
          // Sous-titre/détail
          sDetail = h === "danger"
            ? (delay ? `Impact calculé : +${delay} j` : primaryIssue?.comment || "")

              ? (primaryIssue?.comment || (nextTask ? `Prochaine étape ${fmtDay(nextTask.start)}` : "Sous contrôle"))

        let lifecycle = projectLifecycle(p),
          setupNeeded = lifecycle === "active" && tasks.length === 0,
          displayLabel =
            lifecycle === "closed"
              ? "Clôturé"
              : lifecycle === "archived"
                ? "Archivé"
                : setupNeeded
                  ? "À configurer"
                  : label,
          // Tonalité visuelle : neutre pour closed/archived/setup, sinon health
          tone =
            lifecycle !== "active"

                ? "setup"

          lifecycle,
          setupNeeded,
          tone,
          label,
          displayLabel,

          primaryIssue,

          nextTask,
          milestone: m,
          impacts,
          team,
          sTitle,

          headline,

      // Un chantier est « prêt à clôturer » si son jalon FINAL est atteint,

      // aucun incident ouvert. Ne clôture jamais : ne fait que renseigner.
      function getProjectClosureStatus(projectId) {
        let tasks = getProjectTasks(projectId),
          finalMilestone = app.milestones.find(
            (m) => m.projectId === projectId && m.isFinal,
          ),
          finalTask = finalMilestone?.taskId ? task(finalMilestone.taskId) : null,
          openIssues = getProjectIssues(projectId),
          // Tâches non terminées, hors la tâche finale elle-même
          openTasks = tasks.filter(
            (t) => t.status !== "done" && t.id !== finalMilestone?.taskId,
          ),
          finalReached = false;
        if (finalMilestone) {
          if (finalTask) finalReached = finalTask.status === "done";

            // Jalon final sans tâche : atteint si date passée ET tout terminé.
            finalReached =

          !!finalMilestone &&
          finalReached &&
          openTasks.length === 0 &&
          openIssues.length === 0;
        return {

          finalTask,
          openTasks,
          openIssues,
          finalReached,
          ready,
        };

      // Déclenché quand la tâche liée au jalon final vient d'être terminée.

      function checkProjectReadyToClose(projectId) {
        let st = getProjectClosureStatus(projectId),

            `<p><b>${esc(p.name)}</b> semble prêt à être clôturé.</p>` +

          if (st.openIssues.length)
            bits.push(

            `<h2>${esc(eventName)} terminée</h2>` +
            `<p>Le chantier n’est pas encore prêt à être clôturé.</p>` +
            `<ul class="closure-remaining">${bits.map((b) => `<li>${b}</li>`).join("")}</ul>` +
            `<div class="pop-actions"><button class="btn primary" onclick="dismissClosurePrompt('${projectId}')">Continuer le chantier</button><button class="btn secondary" onclick="closeOverlay('modal');closeProjectPrompt('${projectId}')">Clôturer quand même</button></div>`;

      // « Plus tard » / « Continuer » : on n'insiste plus (état écarté mémorisé).
      function dismissClosurePrompt(pid) {

        if (p) p.closureDismissed = localDateTime(getDemoNow());

        closeOverlay("modal");
        renderPage();

      // Cockpit d'un chantier prêt à clôturer : état calme, jamais « Dans les
      // temps ». discreet = version discrète (après « Plus tard » ou réouverture).
      function closureReadyCockpit(p, closure, discreet) {
        let fm = closure.finalMilestone,
          dateBased = fm && !fm.taskId,
          lead = discreet
            ? "✓ Chantier prêt à clôturer"
            : dateBased
              ? "Le jalon final est atteint."
              : "✓ Fin de chantier atteinte",

            ? `<p class="muted small">Jalon final : ${esc(fm.name)}${fm.date ? " · " + fmtDay(fm.date) : ""}</p>`
            : "";

      }
      function projectTabs() {

      function renderProject() {

                </div>

        let lifecycleBar =

            ? `<div class="cockpit-lifecycle"><span class="muted">${p.closedAt ? "Clôturé le " + fmtDay(p.closedAt) : "Chantier clôturé"} · lecture seule${closedFinalLine}</span><div class="cl-actions"><button class="btn small" onclick="reopenProject('${p.id}')">Réouvrir</button><button class="btn small secondary" onclick="archiveProjectPrompt('${p.id}')">Archiver</button></div></div>`

      // Timeline horizontale de la journée (08h–18h) pour un chantier : les

      // Gantt (mêmes classes .gantt/.g-row/.g-bar), sans toucher à l'état
      // global du Planning (period/anchor), pour rester un simple aperçu.
      function projectToday(id) {
        let d = dayKey(TODAY),
          tasks = getProjectTasks(id)
            .filter((t) => dayKey(t.start) <= d && dayKey(t.end) >= d)
            .sort((a, b) => a.start.localeCompare(b.start));
        if (!tasks.length)
          return `<section class="section">${empty("Rien aujourd’hui", "Le prochain jalon est sous contrôle.")}</section>`;
        let dayStart = d + "T08:00",

            i % 2 === 0 ? `${8 + i / 2}h` : "·",

            0,

              cols - 1,

          ),
          rows = tasks
            .map((t) => {

                end = Math.min(+date(t.end), +date(dayEnd));
              if (end <= start) return "";
              let index = Math.floor(
                  (start - date(dayStart)) / (30 * 60000),

              return `<div class="g-row" id="row-${t.id}"><div class="g-label"><b>${esc(t.name)}</b><small>${esc(resourceLabel(t.resourceId))}</small></div>${labels
                .map(

                )

          .join("")}</div>${rows}</div></div></section>`;
      }
      // Timeline horizontale des 7 prochains jours pour un chantier : les
      // colonnes sont les jours de la semaine, les tâches dispatchées de
      // gauche à droite selon leur date — même logique visuelle que ci-dessus.
      function projectUpcomingTimeline(id) {

        if (!allUpcoming.length)
          return empty(

            .filter(

                +date(t.end) > windowStartMs && +date(t.start) < windowEndMs,
            )
            .sort((a, b) => a.start.localeCompare(b.start)),
          overflow = allUpcoming.length - tasks.length,
          cols = days.length,
          cap = (s) => s.charAt(0).toUpperCase() + s.slice(1),
          isWeekend = (dstr) => [0, 6].includes(date(dstr + "T12:00").getDay()),
          labels = days.map(
            (dstr) =>
              `${cap(new Intl.DateTimeFormat("fr-FR", { weekday: "short" }).format(date(dstr + "T12:00"))).replace(".", "")} ${date(dstr + "T12:00").getDate()}`,
          ),
          rows = tasks
            .map((t) => {
              let startMs = Math.max(+date(t.start), windowStartMs),
                endMs = Math.min(+date(t.end), windowEndMs),
                index = Math.min(
                  cols - 1,
                  Math.floor((startMs - windowStartMs) / DAY),
                ),
                span = Math.max(1, (endMs - startMs) / DAY);
              return `<div class="g-row" id="row-${t.id}"><div class="g-label"><b>${esc(t.name)}</b><small>${esc(resourceLabel(t.resourceId))}</small></div>${days

      function localDay(d) {

      function scale() {
        let anchor = date(app.ui.periodAnchor || TODAY);

          let d = localDateKey(anchor),
            labels = Array.from({ length: 20 }, (_, i) =>
              i % 2 === 0 ? `${8 + i / 2}h` : "·",

            dates = labels.map(

                String(8 + Math.floor(i / 2)).padStart(2, "0") +

            labels,
            dates,
            start: d + "T08:00",
            end: d + "T18:00",
            filter: (t) =>
              date(t.start) < date(d + "T18:00") &&
              date(t.end) > date(d + "T08:00"),
            // Repère « maintenant » = créneau réel de la journée (temps réel),

          let y = anchor.getFullYear(),
            m = anchor.getMonth(),
            start = new Date(y, m, 1, 0),
            end = new Date(y, m + 1, 1, 0),
            count = Math.ceil((end - start) / (7 * DAY)),
            dates = Array.from(
              { length: count },
              (_, i) =>
                localDateKey(new Date(start.getTime() + i * 7 * DAY)) +
                "T00:00",
            ),
            labels = dates.map((d, i) => `S${i + 1} · ${date(d).getDate()}`);
          return {
            labels,
            dates,
            start: localDateTime(start),
            end: localDateTime(end),
            filter: (t) => date(t.start) < end && date(t.end) > start,
            todayIndex: dates.findIndex(
              (d, i) =>
                date(TODAY) >= date(d) &&
                date(TODAY) < date(dates[i + 1] || end),
            ),
          };
        }
        if (app.settings.period === "year") {
          let y = anchor.getFullYear(), start = new Date(y, 0, 1), end = new Date(y + 1, 0, 1),
            dates = Array.from({ length: 12 }, (_, i) => localDateTime(new Date(y, i, 1))),
            labels = dates.map((d) => new Intl.DateTimeFormat("fr-FR", { month: "short" }).format(date(d)));

            labels, dates, start: localDateTime(start), end: localDateTime(end),

            todayIndex: date(TODAY).getFullYear() === y ? date(TODAY).getMonth() : -1,

          start: dates[0],
          end,
          filter: (t) =>

      function pos(t, s) {

      // Sélection commune des tâches du planning (Gantt desktop + agenda mobile) :

        return `${effectSummary()}${active ? impactBandHTML() : ""}${planningAgenda(pid)}<div class="gantt-wrap"><div class="gantt ${active ? "impact-mode" : ""}" id="gantt" style="--cols:${cols}"><div class="g-head"><div><b>Tâche</b></div>${s.labels.map((x, i) => `<div class="${i === s.todayIndex ? "today-cell" : ""} ${isWeekend(i) ? "weekend" : ""}">${i === s.todayIndex ? "<small>AUJOURD’HUI</small>" : ""}${x}</div>`).join("")}</div>${groups
          .map((g) => {

      // Chaîne d'impact (couche analytique — aucune donnée modifiée) :
      // tâches liées à un incident actif + leurs conséquences en aval (deps).
      function impactChainSources() {
        return new Set(

        );
      }
      function impactChainSet() {

            url = URL.createObjectURL(blob), a = document.createElement("a");

      function importKanvixFile(file) {
        let reader = new FileReader();
        reader.onload = () => {
          try {
            let data = JSON.parse(reader.result);
            if (data.format !== "kanvix-portable" || !Array.isArray(data.projects) || !Array.isArray(data.tasks))
              throw new Error("Format Kanvix non reconnu");
            snapshot();
            let stamp = Date.now(), projectMap = {}, taskMap = {};
            data.projects.forEach((p, i) => projectMap[p.id] = app.projects.some((x) => x.id === p.id) ? `import-${stamp}-p${i}` : p.id);
            data.tasks.forEach((t, i) => taskMap[t.id] = app.tasks.some((x) => x.id === t.id) ? `import-${stamp}-t${i}` : t.id);
            app.projects.push(...data.projects.map((p) => ({ ...p, id: projectMap[p.id], name: app.projects.some((x) => x.name === p.name) ? `${p.name} (importé)` : p.name })));
            app.tasks.push(...data.tasks.filter((t) => projectMap[t.projectId]).map((t) => ({ ...t, id: taskMap[t.id], projectId: projectMap[t.projectId], deps: (t.deps || []).map((id) => taskMap[id]).filter(Boolean) })));
            app.milestones.push(...(data.milestones || []).filter((m) => projectMap[m.projectId]).map((m, i) => ({ ...m, id: `import-${stamp}-m${i}`, projectId: projectMap[m.projectId], taskId: taskMap[m.taskId] || null })));
            (data.companyTemplates || []).forEach((t, i) => app.companyTemplates.push({ ...t, id: `import-${stamp}-tpl${i}`, companyOwned: true }));
            save(); render(); toast(`${data.projects.length} chantier(s) importé(s)`);
          } catch (error) {
            console.error("Kanvix: import impossible", error); toast("Import impossible : fichier invalide.");
          }
        };
        reader.readAsText(file);
      }

          taskColX =

                x1 = x.right - root.left,
                y1 = x.top + x.height / 2 - root.top,
                x2 = y.left - root.left - 4,

      // ============================================================

            `<details class="rework-plan"><summary>Planifier une reprise</summary><div class="rework-plan-body"><label>Date souhaitée<input name="planDate" type="date" value="${defaultDate}"></label><label>Durée estimée<select name="duration">${Object.entries(REWORK_DURATIONS).map(([k, v]) => `<option value="${k}" ${k === "half" ? "selected" : ""}>${v[0]}</option>`).join("")}</select></label></div></details>` +

      function createRework(originalId, { comment, dataUrl, planDate, duration }) {
        let orig = task(originalId);
        if (!orig || !guardEditable(orig.projectId)) return;
        snapshot(); // UN seul point d'annulation pour toute l'opération
        let durMs = (REWORK_DURATIONS[duration] || REWORK_DURATIONS.half)[1],
          start = nextWorkingTime(planDate ? planDate + "T08:00" : orig.end);
        // Une reprise ne peut pas démarrer avant la fin de la tâche d'origine.
        if (+date(start) < +date(orig.end)) start = nextWorkingTime(orig.end);
        let end = addWorkingDuration(start, durMs),
          reworkId = "rework-" + Date.now(),
          rework = {
            id: reworkId,
            name: "Reprise — " + orig.name,
            projectId: orig.projectId,
            resourceId: orig.resourceId || null,
            status: "todo",
            start,
            end,
            deps: [originalId],
            scheduleMode: "day",
            colorKey: "auto",
            reworkOfTaskId: originalId,
          };
        app.tasks.push(rework);
        // Insertion dans la chaîne : les successeurs DIRECTS de la tâche d'origine
        // dépendent désormais de la reprise (jamais de tâche d'un autre chantier).
        app.tasks.forEach((s) => {
          if (
            s.id !== reworkId &&
            s.projectId === orig.projectId &&
            (s.deps || []).includes(originalId)

            s.deps = s.deps.map((d) => (d === originalId ? reworkId : d));

            resourceId: orig.resourceId || null,

            dataUrl,

          text: `Reprise créée après « ${orig.name} ».`,
          author: "Eric",
          taskId: reworkId,
          comment,

          author: "Eric",
          taskId: originalId,
          comment,

          reworkId,
          originalId,
          projectId: orig.projectId,
          resourceId: orig.resourceId || null,
          comment,
          photoId,
          plan,
        };

        closeOverlay("drawer");
        render();
        showReworkImpact();

      // Redimensionne un fichier image (max ~1280px) et le compresse en JPEG
      // pour ne jamais stocker un original de plusieurs Mo dans localStorage.
      function resizeImageFile(file, maxDim = 1280, quality = 0.72) {
        return new Promise((resolve, reject) => {
          let reader = new FileReader();
          reader.onerror = () => reject(new Error("lecture impossible"));
          reader.onload = () => {
            let img = new Image();
            img.onerror = () => reject(new Error("image illisible"));
            img.onload = () => {
              let scale = Math.min(1, maxDim / Math.max(img.width, img.height)),
                w = Math.max(1, Math.round(img.width * scale)),
                h = Math.max(1, Math.round(img.height * scale)),
                canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              try {
                canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/jpeg", quality));
              } catch (e) {
                reject(e);
              }
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

        document.body.appendChild(input);
        input.onchange = () => {
          let file = input.files && input.files[0];
          input.remove();
          if (!file) return;
          resizeImageFile(file)
            .then((dataUrl) => onReady(dataUrl))
            .catch(() => toast("Image illisible — réessayez."));
        };
        input.click();
      }

      function fieldTaskRow(t, action) {
        return `<article class="field-task" onclick="openTask('${t.id}')"><span class="field-dot ${taskTone(t)}"></span><div class="field-task-body"><b>${esc(t.name)}</b><small>${esc(resourceLabel(t.resourceId))} · ${fmtTime(t.start)}–${fmtTime(t.end)}</small></div>${pill(taskTone(t), STATUS[t.status])}</article>`;
      }
      // À CONTRÔLER : tâches TERMINÉES du chantier → reprise/SAV direct.
      function fieldControlSection(pid) {
        return `<section class="field-section"><h2 class="field-h2">À contrôler</h2><div class="field-search">${icon("search")}<input type="search" placeholder="Rechercher une tâche…" value="${esc(app.ui.fieldQuery || "")}" oninput="setFieldQuery(this.value)" aria-label="Rechercher une tâche du chantier"></div><div id="fieldControlList">${fieldControlItems(pid)}</div></section>`;
      }
      function fieldControlItems(pid) {
        let q = norm(app.ui.fieldQuery || ""),
          tasks = getProjectTasks(pid).filter((t) => !t.reworkOfTaskId),
          done = tasks
            .filter((t) => t.status === "done")
            .sort((a, b) => b.end.localeCompare(a.end)),
          list = q
            ? tasks.filter((t) => norm(t.name).includes(q))
            : done.slice(0, 8);

          return `<p class="field-none">${q ? "Aucune tâche ne correspond." : "Aucune tâche terminée à contrôler."}</p>`;
        return `<div class="field-list">${list
          .map((t) => {
            let doneT = t.status === "done";
            return `<article class="field-task control"><span class="field-dot ${taskTone(t)}"></span><div class="field-task-body" onclick="openTask('${t.id}')"><b>${doneT ? "✓ " : ""}${esc(t.name)}</b><small>${esc(resourceLabel(t.resourceId))} · ${doneT ? "Terminée" : STATUS[t.status]}</small></div>${
              doneT
                ? `<button class="btn small primary" onclick="event.stopPropagation();openReworkForm('${t.id}')">Signaler une reprise</button>`
                : `<button class="btn small" onclick="event.stopPropagation();openTask('${t.id}')">Ouvrir</button>`
            }</article>`;

      // REPRISES EN COURS : tâches reworkOfTaskId non terminées du chantier.
      function fieldReworkSection(pid) {

          .filter((t) => t.reworkOfTaskId && t.status !== "done")
          .sort((a, b) => a.start.localeCompare(b.start));

        return `<section class="field-section"><h2 class="field-h2">Reprises en cours</h2><div class="field-list">${reworks
          .map(

              `<article class="field-task rework" onclick="openTask('${t.id}')"><span class="field-dot ${taskTone(t)}"></span><div class="field-task-body"><b>${esc(t.name)}</b><small>${esc(resourceLabel(t.resourceId))} · ${fmtDay(t.start)} · ${fmtTime(t.start)}</small></div>${pill(taskTone(t), STATUS[t.status])}</article>`,
          )

      }
      // ---------------- Mode Chantier — onglet MESSAGES (vraie page, pas un drawer) ----------------
      // Réutilise EXCLUSIVEMENT le moteur de messagerie existant (getConversations,
      // conversationRow, openConversation, conversationScreenHTML…) — seule la
      // présentation change (page plein écran au lieu d'une sidewindow).
      function fieldMessagesBody() {
        // Une conversation est ouverte : l'afficher plein écran (même moteur
        // que le bureau, voir conversationScreenHTML/openConversation).
        if (app.ui.conversation) {
          let c = app.ui.conversation;
          return conversationScreenHTML(
            c.resourceId,
            c.taskId,

          convs.length

      }
      // « + Nouveau » en Mode Chantier : réutilise newMessageCandidates/newMessageRow

      function fieldNewMessageBody() {

              `<p class="muted">NOUVEAU MESSAGE</p><h2>${esc(r.name)}</h2>` +
              `<p class="muted">Cet intervenant n’a pas encore d’accès Kanvix. Aucun message ne peut lui être distribué tant qu’il n’est pas invité.</p>` +

          `<div class="field-search">${icon("search")}<input type="search" placeholder="Rechercher un membre de l’équipe…" value="${esc(q)}" oninput="app.ui.fieldMsgQuery=this.value;refreshFieldNewMessageList()" aria-label="Rechercher un membre de l’équipe"></div>` +
          `<div class="conv-list" id="fieldNewMsgList">${

      // ---------------- Mode Chantier — tâche = POPUP, jamais une sidewindow ----------------
      // Le smartphone est utilisé debout sur le chantier : un popup quasi plein

      function openFieldTaskModal(id) {

        $("#modalContent").innerHTML =
          `<p class="muted">TÂCHE</p><h2>${esc(t.name)}</h2>${pill(taskTone(t), STATUS[t.status])}` +
          `<div class="field-modal-meta"><b>${esc(p.name)}</b><p>${esc(resourceLabel(t.resourceId))}<br>${fmtRange(t)}</p></div>` +

          `<div class="pop-actions"><button class="btn" onclick="openFieldPlanning('${id}')">Voir dans le planning</button><button class="btn" onclick="closeOverlay('modal')">Fermer</button></div>`;
        $("#modal").classList.add("open");

      // ---------------- Mode Chantier — Planning MOBILE (v2.4.2) ----------------
      // « Voir dans le planning » depuis le Mode Chantier ouvrait auparavant le
      // Planning Bureau (sortie complète du Mode Chantier) : sur smartphone,
      // l'utilisateur perdait son chemin naturel de retour au chantier. Ici, le
      // Planning devient une sous-vue de l'onglet Chantier (app.ui.fieldView),
      // AUCUNE nouvelle donnée ni moteur : réutilise app.tasks/getProjectTasks,

      // STATUS — seule une présentation mobile est ajoutée. driverMode reste

      function openFieldPlanning(taskId) {

        app.ui.fieldPlanningTaskId = taskId || null;

        scrollTo(0, 0);

      // Retour obligatoire (bouton visible ET barre basse, voir setFieldTab) :
