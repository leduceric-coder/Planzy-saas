<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link rel="icon" href="data:" />
    <title>Kanvix — Piloter simplement</title>
    <!-- PWA : installable en plein écran, s'ancre sur l'horloge de l'appareil.
         Le manifeste n'est référencé que servi en http/https (voir le script
         d'amorçage) : en ouverture locale file://, le charger déclencherait une
         erreur CORS inutile — le POC reste un fichier autonome. -->
    <meta name="application-name" content="Kanvix" />
    <meta name="apple-mobile-web-app-title" content="Kanvix" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0d14"
      media="(prefers-color-scheme: dark)"
    />
    <style id="kanvix-css">
      /* ============================================================
         KANVIX — Design System (POC nouvelle génération)
         Fond métier BLANC · sidebar teintée · cartes blanches
         bordures fines · ombres légères · bleu Kanvix parcimonieux
         ============================================================ */
      :root {
        /* Surfaces */
        --bg-app: #eceff5;
        --bg: var(--bg-app);
        --surface-1: #ffffff;
        --surface: var(--surface-1);
        --surface-subtle: #f7f9fc;
        --surface-muted: #f1f4f8;
        /* Sidebar */
        --bg-sidebar: #ffffff;
        --sidebar-border: #e3e8ef;
        --sidebar-text: #475467;
        --sidebar-muted: #8593a5;
        --sidebar-hover: #eaeef4;
        --sidebar-active-bg: #eaf1ff;
        --sidebar-active-text: #1456c7;
        --sidebar-brand: #101828;
        /* Text */
        --text: #111827;
        --text-secondary: #596579;
        --text-tertiary: #7b8798;
        /* Borders */
        --border-light: #e8ecf2;
        --border: #dce2ea;
        --border-strong: #c9d2dd;
        /* Accent */
        --accent: #1769ff;
        --accent-hover: #0d5bea;
        --accent-soft: #edf4ff;
        --accent-ink: #1456c7;
        /* Status */
        --success: #19a45b;
        --success-soft: #edf9f2;
        --warning: #d97b1f;
        --warning-soft: #fff5e9;
        --danger: #e5484d;
        --danger-soft: #fff0f1;
        /* Shadows */
        --shadow-xs: 0 1px 3px rgba(20, 32, 55, 0.07),
          0 5px 14px rgba(20, 32, 55, 0.09);
        --shadow: 0 10px 26px rgba(20, 32, 55, 0.14),
          0 2px 6px rgba(20, 32, 55, 0.1), 0 0 1px rgba(20, 32, 55, 0.04);
        --shadow-hover: 0 18px 40px rgba(20, 32, 55, 0.18),
          0 3px 8px rgba(20, 32, 55, 0.12);
        --shadow-strong: 0 24px 65px rgba(17, 31, 58, 0.18),
          0 4px 18px rgba(17, 31, 58, 0.08);
        /* Radius */
        --radius-xs: 6px;
        --radius-sm: 8px;
        --radius-md: 11px;
        --radius-lg: 14px;
        /* Legacy aliases (compat with carried-over rules / inline styles) */
        --canvas: var(--surface-muted);
        --line: var(--border-light);
        --surface-elevated: var(--surface);
        --shadow-sm: var(--shadow);
        --shadow-md: var(--shadow-strong);
        --success-border: #a7dcbf;
        --warning-border: #efc38a;
        --danger-border: #f4b9bb;
        --success-ink: #0f7a41;
        --warning-ink: #a45b12;
        --danger-ink: #c13b40;
      }
      body.dark {
        --bg-app: #0a0d14;
        --surface-1: #10202f;
        --surface: var(--surface-1);
        --surface-subtle: #14283a;
        --surface-muted: #172d40;
        --bg-sidebar: #0d1119;
        --sidebar-border: #1e3346;
        --sidebar-text: #a9bccf;
        --sidebar-muted: #6f8398;
        --sidebar-hover: #142a3d;
        --sidebar-active-bg: #14345a;
        --sidebar-active-text: #cfe1ff;
        --sidebar-brand: #f4f8fc;
        --text: #eef4f9;
        --text-secondary: #a3b3c4;
        --text-tertiary: #75899c;
        --border-light: #1d3244;
        --border: #26405a; /* Layout */
        --border-strong: #33526f;
        --accent: #5c9bff;
        --accent-hover: #78adff;
        --accent-soft: #17335a;
        --accent-ink: #cfe1ff;
        --success: #46c17d;
        --success-soft: #12321f;
        --warning: #e8a24d;
        --warning-soft: #35270f;
        --danger: #f2686d;
        --danger-soft: #391c1f;
        --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.3),
          0 6px 16px rgba(0, 0, 0, 0.34);
        --shadow: 0 0 1px rgba(255, 255, 255, 0.04),
          0 1px 0 rgba(255, 255, 255, 0.05), 0 16px 40px rgba(0, 0, 0, 0.36);
        --shadow-hover: 0 0 1px rgba(255, 255, 255, 0.05),
          0 22px 52px rgba(0, 0, 0, 0.46);
        --shadow-strong: 0 24px 65px rgba(0, 0, 0, 0.55),
          0 4px 18px rgba(0, 0, 0, 0.4);
        --success-border: #1e5236;
        --warning-border: #5a441f;
        --danger-border: #5c2f32;
      }

      /* ---------------- Base ---------------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      html {
        /* Réserve toujours la place de la scrollbar desktop : sans ça,
           l'apparition/disparition de la scrollbar (ex. contenu plus long
           sur une page) décale horizontalement tout le contenu de quelques
           pixels — l'un des effets de « saccade » les plus visibles. */
        scrollbar-gutter: stable;
      }
      @supports not (scrollbar-gutter: stable) {
        html {
          /* Repli pour les navigateurs sans scrollbar-gutter : la scrollbar
             reste toujours affichée (même largeur réservée en permanence). */
          overflow-y: scroll;
        }
      }
      /* Artisan et Mode Chantier sont des usages SMARTPHONE exclusifs : sur
         un vrai téléphone la scrollbar est un overlay qui ne réserve aucune
         place, cette réservation n'y sert donc à rien et ampute inutilement
         la largeur utile de l'écran (un cadre censé être plein écran). */
      html.mobile-frame {
        scrollbar-gutter: auto;
        overflow-y: auto;
      }
      body {
        background: var(--bg-app);
        color: var(--text);
        font: 400 14px/1.5 Inter, ui-sans-serif, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button:not(.native-control) {
        -webkit-appearance: none;
        appearance: none;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      input,
      select,
      textarea {
        color-scheme: light;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 9px 11px;
        outline: 0;
      }
      body.dark input,
      body.dark select,
      body.dark textarea {
        color-scheme: dark;
      }
      select option {
        background: var(--surface);
        color: var(--text);
      }
      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible,
      [role="button"]:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      h1,
      h2,
      h3 {
        color: var(--text);
      }

      /* ---------------- Shell / Sidebar ---------------- */
      .shell {
        display: grid;
        grid-template-columns: 178px minmax(0, 1fr);
        min-height: 100vh;
        background: var(--bg-app);
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--bg-sidebar);
        color: var(--sidebar-text);
        border-right: 1px solid var(--sidebar-border);
        padding: 22px 14px 16px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 2px 8px 22px;
        color: var(--sidebar-brand);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .brand svg {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        display: block;
      }
      /* Bouton replier / déplier le menu */
      .sidebar-toggle {
        margin-left: auto;
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--sidebar-muted);
        width: 26px;
        height: 26px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        padding: 0;
        cursor: pointer;
        transition: background 0.14s, color 0.14s;
      }
      .sidebar-toggle:hover {
        background: var(--sidebar-hover);
        color: var(--sidebar-text);
      }
      .sidebar-toggle svg {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.2s;
      }
      body.sidebar-collapsed .shell {
        grid-template-columns: 68px minmax(0, 1fr);
      }
      body.sidebar-collapsed .sidebar {
        padding: 22px 12px 16px;
      }
      body.sidebar-collapsed .brand {
        flex-direction: column;
        gap: 14px;
        padding: 2px 0 20px;
        justify-content: center;
      }
      body.sidebar-collapsed .brand > span,
      body.sidebar-collapsed .nav button > span,
      body.sidebar-collapsed .nav-messaging > span,
      body.sidebar-collapsed .profile-copy {
        display: none;
      }
      body.sidebar-collapsed .sidebar-toggle {
        margin-left: 0;
      }
      body.sidebar-collapsed .sidebar-toggle svg {
        transform: rotate(180deg);
      }
      body.sidebar-collapsed .nav button {
        justify-content: center;
        padding-inline: 0;
      }
      body.sidebar-collapsed .profile-trigger {
        justify-content: center;
      }
      body.sidebar-collapsed .nav-messaging {
        position: relative;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav button {
        width: 100%;
        border: 0;
        background: none;
        color: var(--sidebar-text);
        min-height: 38px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        font-size: 13.5px;
        font-weight: 500;
        transition: background 0.14s, color 0.14s;
      }
      .nav button:hover {
        background: var(--sidebar-hover);
        color: var(--sidebar-brand);
      }
      .nav button.active {
        background: var(--sidebar-active-bg);
        color: var(--sidebar-active-text);
        font-weight: 600;
      }
      .nav svg {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav button.active svg {
        stroke: var(--accent);
      }
      .nav-messaging {
        position: relative;
      }
      .nav-badge {
        margin-left: auto;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      /* Profile */
      .profile {
        margin-top: auto;
        border-top: 1px solid var(--sidebar-border);
        padding: 12px 2px 0;
        position: relative;
      }
      .profile-trigger {
        width: 100%;
        min-height: 50px;
        padding: 6px 6px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: transparent;
        color: var(--sidebar-brand);
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
      }
      .profile-trigger:hover,
      .profile-trigger[aria-expanded="true"] {
        background: var(--sidebar-hover);
      }
      .profile-copy {
        min-width: 0;
        line-height: 1.3;
      }
      .profile-copy b {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
      }
      .profile-copy small {
        display: block;
        color: var(--sidebar-muted);
        font-size: 11px;
      }
      .profile-level {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 3px;
        color: var(--accent-ink);
        font-size: 10.5px;
        font-weight: 600;
      }
      .profile-gear {
        display: inline-flex;
      }
      .profile-gear svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        opacity: 0.85;
      }
      .avatar {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 50%;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-weight: 700;
        font-size: 12px;
      }
      .avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* User popover */
      .user-popover {
        display: none;
        position: absolute;
        left: 0;
        bottom: 64px;
        /* Largeur lisible fixe : la sidebar (178px) est trop étroite pour les
           libellés d'apparence — le menu déborde légèrement sur le contenu
           (comportement normal d'un popover), plutôt que de tronquer. */
        width: 224px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 96px);
        overflow-y: auto;
        /* overflow-y:auto force overflow-x à « auto » : sans cette ligne, le
           moindre dépassement (ex. bouton « Système ») ajoute une barre de
           défilement horizontale disgracieuse dans le menu. */
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow-strong);
        z-index: 80;
      }
      .user-popover.open {
        display: block;
      }
      body.sidebar-collapsed .user-popover {
        left: 0;
        width: 260px;
        max-width: calc(100vw - 24px);
      }
      .user-popover-head {
        padding: 4px 6px 10px;
      }
      .user-popover-head b {
        display: block;
        font-size: 13px;
      }
      .user-popover-head small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
      }
      .user-popover-section {
        padding: 9px 0;
        border-top: 1px solid var(--border-light);
      }
      .user-popover-label {
        display: block;
        padding: 0 6px 6px;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .user-popover button {
        width: 100%;
        padding: 8px 8px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--text);
        text-align: left;
        font-size: 13px;
      }
      .user-popover button:hover {
        background: var(--surface-subtle);
      }
      .user-popover button.selected {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .user-popover button small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 400;
      }
      .appearance-options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }
      .appearance-options button {
        text-align: center;
        font-size: 11.5px;
        padding: 7px 3px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border: 1px solid var(--border);
      }
      .user-action {
        color: var(--text-secondary) !important;
      }
      .user-action.danger {
        color: var(--danger) !important;
      }

      /* ---------------- Main / header ---------------- */
      .main {
        background: var(--bg-app);
        padding: 34px 40px 60px;
        max-width: 1320px;
        width: 100%;
        margin: 0 auto;
        min-width: 0;
      }
      .page {
        /* Volontairement AUCUNE animation de transition (ni fade, ni
           translateY) : Kanvix doit paraître instantané et stable d'un écran
           à l'autre plutôt que de masquer un décalage par une animation. */
        display: none;
      }
      .page.active {
        display: block;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 24px;
      }
      .header h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .muted {
        color: var(--text-secondary);
      }
      .context {
        font-size: 12px;
        color: var(--text-secondary);
        text-align: right;
      }
      .context b {
        display: block;
        color: var(--text);
      }
      /* Dots */
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        margin-right: 8px;
        flex: 0 0 8px;
      }
      .dot.warning {
        background: var(--warning);
      }
      .dot.danger {
        background: var(--danger);
      }
      .dot.accent {
        background: var(--accent);
      }

      /* ---------------- Buttons ---------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        padding: 8px 13px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
        transition: background 0.14s, border-color 0.14s, transform 0.05s;
      }
      .btn svg {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn:hover {
        background: var(--surface-subtle);
        border-color: var(--text-tertiary);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        box-shadow: 0 1px 2px rgba(23, 105, 255, 0.35);
      }
      .btn.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .btn.danger {
        background: var(--danger-soft);
        border-color: var(--danger-border);
        color: var(--danger-ink);
      }
      .btn.danger:hover {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      .btn.small {
        padding: 6px 10px;
        font-size: 12px;
      }
      .btn.secondary {
        border-color: var(--border-light);
        background: var(--surface);
        color: var(--text-secondary);
      }
      .btn.secondary:hover {
        background: var(--surface-subtle);
        border-color: var(--border);
        color: var(--text);
      }
      .link {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 0;
        font-weight: 600;
        font-size: 13px;
      }
      .link:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }
      .divider {
        border-top: 1px solid var(--border-light);
      }

      /* ---------------- Rows ---------------- */
      .row {
        display: grid;
        grid-template-columns: 12px 1fr auto;
        gap: 12px;
        padding: 14px 2px;
        border-top: 1px solid var(--border-light);
        align-items: start;
        cursor: pointer;
      }
      .row:first-child {
        border-top: 0;
      }
      .row:hover {
        background: var(--surface-subtle);
      }
      .row h3 {
        font-size: 14px;
        margin: 0 0 3px;
      }
      .row p {
        margin: 2px 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .row .avatar {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
      }

      /* ---------------- Pills ---------------- */
      .pill {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 20px;
        background: var(--surface-muted);
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .pill.danger {
        background: var(--danger-soft);
        color: var(--danger-ink);
      }
      .pill.warning {
        background: var(--warning-soft);
        color: var(--warning-ink);
      }
      .pill.success {
        background: var(--success-soft);
        color: var(--success-ink);
      }
      .pill.accent {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      body.dark .pill.danger,
      body.dark .pill.warning,
      body.dark .pill.success,
      body.dark .pill.accent {
        color: #fff;
      }

      /* ---------------- Sections / generic ---------------- */
      .section {
        margin-top: 24px;
      }
      .section:first-child {
        margin-top: 0;
      }
      .section-title {
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        font-weight: 700;
        margin: 0 0 10px;
      }
      /* Cockpit chantier : chaque item d'onglet dans une vignette, alignement
         constant d'un onglet à l'autre (Aujourd'hui / À venir / Équipe / Historique) */
      #projectContent .row {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 15px 18px;
        margin-bottom: 10px;
        column-gap: 18px;
      }
      /* Aligner la pastille de statut avec le titre + espace avant la tâche */
      #projectContent .row > .dot {
        margin-top: 6px;
        margin-left: 4px;
      }
      #projectContent .row,
      #projectContent .row:first-child {
        border-top: 1px solid var(--border-light);
      }
      #projectContent .row:hover {
        background: var(--surface);
        border-color: var(--accent);
      }
      #projectContent .row:last-child {
        margin-bottom: 0;
      }
      .empty {
        padding: 16px 0;
        color: var(--text-secondary);
      }
      .empty b {
        display: block;
        color: var(--text);
        font-size: 15px;
        margin-bottom: 2px;
      }
      .attention-layout {
        display: grid;
        grid-template-columns: 1.25fr 0.75fr;
        gap: 40px;
        align-items: start;
      }
      .decision {
        padding: 20px;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-lg);
        background: var(--danger-soft);
      }
      .decision h2 {
        font-size: 19px;
        margin: 6px 0;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .eyebrow.danger {
        color: var(--danger-ink);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* ---------------- Today / workflow ---------------- */
      .today-hero {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: 0 0 24px;
      }
      .today-hero-main {
        min-width: 0;
      }
      .today-hero h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .today-hero p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
      }
      .today-date {
        font-weight: 600;
        color: var(--text) !important;
      }
      /* Bloc météo conducteur — largeur réservée dès le premier rendu (même
         vide, le temps que la géolocalisation/l'API répondent) : le titre ne
         doit jamais bouger quand la météo termine de charger (§21). */
      .hero-weather {
        flex: none;
        min-width: 70px;
        min-height: 40px;
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
      }
      .hero-weather .hw-ico {
        font-size: 22px;
        line-height: 1;
      }
      .hero-weather .hw-temp {
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
      }
      .hero-weather small {
        font-size: 11.5px;
        color: var(--text-tertiary);
      }
      @media (max-width: 720px) {
        .today-hero {
          flex-wrap: wrap;
        }
        .hero-weather {
          align-items: flex-start;
          text-align: left;
          margin-top: 4px;
        }
      }
      /* Raccourci Mode Chantier sur mobile : le menu profil (seul point
         d'entrée desktop) est masqué en dessous de 720px. */
      .field-mobile-entry {
        display: none;
      }
      @media (max-width: 720px) {
        .field-mobile-entry {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          width: 100%;
          margin: 14px 0 22px;
          padding: 12px 16px;
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          background: var(--surface);
          color: var(--text);
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
        }
      }
      /* ---------------- Cartes de synthèse minimalistes (v2.4.3) ---------------- */
      /* Remplace les anciennes colonnes détaillées À décider/À surveiller sur
         l'Accueil (Bureau ET Mode Chantier, même langage visuel) : synthèse
         seulement, détail au clic (popup). Géométrie fixe (icône/compteur/
         chevron) : 1 alerte ou 8 ne change ni la hauteur ni l'alignement. */
      .attention-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 16px;
        width: 100%;
        margin: 18px 0 26px;
      }
      .attention-card {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        /* Élément de grille (.attention-grid) : sans min-width:0, un enfant en
           nowrap (.attention-top-item) empêche la carte de rétrécir sous sa
           largeur de contenu minimale et fait déborder la page en mobile. */
        min-width: 0;
        /* Harmonisation §1.1 : même hauteur pour "À décider"/"À surveiller"
           quel que soit le texte (ellipsis sur les lignes trop longues). */
        min-height: 96px;
        padding: 14px 18px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow-xs);
        text-align: left;
        cursor: pointer;
        transition: background 0.14s, border-color 0.14s;
      }
      .attention-card:hover {
        border-color: var(--border);
        background: var(--surface-subtle);
      }
      .attention-ico {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        flex: none;
        border-radius: 50%;
        background: var(--surface-subtle);
      }
      .attention-ico svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .attention-card.decide .attention-ico svg {
        stroke: var(--danger);
      }
      .attention-card.watch .attention-ico svg {
        stroke: var(--warning);
      }
      .attention-card.calm .attention-ico {
        background: var(--success-soft);
      }
      .attention-card.calm .attention-ico svg {
        stroke: var(--success);
      }
      .attention-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
      }
      .attention-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
      }
      /* Compteur = élément graphique fort, dans sa propre zone fixe entre le
         texte et le chevron (§4) — jamais collé au libellé. Largeur fixe :
         passer de 1 à 8 (ou au ✓ calme) ne décale ni le chevron ni la carte. */
      .attention-count {
        flex: none;
        min-width: 46px;
        text-align: center;
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        color: var(--text-tertiary);
      }
      .attention-card.decide .attention-count {
        color: var(--danger-ink, var(--danger));
      }
      .attention-card.watch .attention-count {
        color: var(--warning-ink, var(--warning));
      }
      .attention-card.calm .attention-count {
        color: var(--success);
        font-size: 24px;
      }
      .attention-sub {
        font-size: 12.5px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .attention-card.calm .attention-sub {
        color: var(--success);
      }
      .attention-chevron {
        flex: none;
        width: 16px;
        text-align: center;
        color: var(--text-tertiary);
        font-size: 16px;
      }
      /* Teinte très légère (decide=rouge, watch=orange) — neutre dès que calme. */
      .attention-card.decide:not(.calm) {
        background: var(--danger-soft);
        border-color: transparent;
      }
      .attention-card.watch:not(.calm) {
        background: var(--warning-soft);
        border-color: transparent;
      }
      /* Élément le plus prioritaire — une seule ligne représentative. */
      .attention-top-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 1px;
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 720px) {
        .attention-count {
          font-size: 26px;
          min-width: 38px;
        }
        .attention-card.calm .attention-count {
          font-size: 21px;
        }
      }
      /* En-tête Accueil : ligne de synthèse ⚠/▣/◉ — calculée, jamais figée. */
      .today-summary {
        display: flex;
        gap: 18px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .ts-item {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .ts-decide {
        color: var(--danger-ink);
      }
      .ts-action {
        color: var(--accent-ink);
      }
      .ts-watch {
        color: var(--warning-ink);
      }
      /* ---------------- Bloc principal Aujourd'hui / Chantiers actifs ---------------- */
      .today-main-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 16px;
        width: 100%;
        /* Alignés en haut, mais les DEUX conteneurs peuvent occuper toute la
           hauteur disponible (§1.4) — le contenu, lui, ne s'étire jamais. */
        align-items: stretch;
        margin-bottom: 24px;
      }
      @media (max-width: 1080px) {
        .attention-grid,
        .today-main-grid {
          grid-template-columns: 1fr;
        }
      }
      .today-panel {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        padding: 16px 18px 18px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .panel-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
      }
      .panel-head .link {
        font-size: 12.5px;
        flex: none;
      }
      /* Aujourd'hui — lignes intervention */
      .today-actions-list {
        display: grid;
        gap: 10px;
      }
      .tp-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        /* V2.4.5 (F03) : élément d'une grille (.today-actions-list), même
           raison que .acp-row (F02) — nécessaire pour que le nom de tâche
           puisse réellement se tronquer au lieu de forcer la ligne (et donc
           toute la colonne) à s'élargir. */
        min-width: 0;
        text-align: left;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        padding: 11px 13px;
        /* Harmonisation §1.2 : hauteur identique avec ou sans confirmation
           terrain (intégrée dans .tp-meta, jamais une ligne en plus). */
        min-height: 76px;
        cursor: pointer;
        background: var(--surface);
        transition: border-color 0.14s, background 0.14s;
      }
      .tp-row:hover {
        border-color: var(--accent);
      }
      .tp-time {
        flex: none;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-tertiary);
        line-height: 1.5;
        padding-top: 1px;
      }
      .tp-dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .tp-dot.danger {
        background: var(--danger);
      }
      .tp-dot.warning {
        background: var(--warning);
      }
      .tp-dot.success {
        background: var(--success);
      }
      .tp-dot.accent {
        background: var(--accent);
      }
      .tp-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .tp-body b {
        font-size: 13.5px;
        /* V2.4.5 (F03) : décision UX — nom de tâche tronqué sur une seule
           ligne (jamais de retour à la ligne qui casserait l'homogénéité de
           hauteur des lignes Aujourd'hui) ; nom complet via title (natif). */
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .tp-body small {
        font-size: 12px;
        color: var(--text-secondary);
        /* V2.4.5 (F03, complément) : même raison que .tp-body b — un nom de
           chantier très long sur cette ligne cassait aussi l'homogénéité de
           hauteur des lignes Aujourd'hui. */
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .tp-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 2px;
        min-height: 21px;
      }
      .tp-res {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .tp-confirm {
        font-size: 11.5px;
        font-weight: 600;
        line-height: 1;
      }
      .tp-confirm.start {
        color: var(--accent-ink, var(--accent));
      }
      .tp-confirm.done {
        color: var(--success-ink, var(--success));
      }
      /* Chantiers actifs — lignes compactes */
      .acp-list {
        display: grid;
        gap: 10px;
      }
      .acp-row {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        /* V2.4.5 (F02) : élément d'une grille (.acp-list), sans min-width:0
           un enfant en nowrap (.acp-body b/small) empêche la ligne de
           rétrécir sous sa largeur de contenu minimale et fait déborder la
           page avec un nom de chantier/localisation très longs — même
           correction déjà appliquée à .attention-card. */
        min-width: 0;
        text-align: left;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        padding: 9px 12px;
        /* Harmonisation §1.3 : le badge météo ne doit agrandir aucune ligne
           par rapport aux autres — il s'ajoute au texte existant, sans étage
           en plus (voir .acp-body small). */
        min-height: 72px;
        cursor: pointer;
        background: var(--surface);
        transition: border-color 0.14s;
      }
      .acp-row:hover {
        border-color: var(--accent);
      }
      .acp-visual {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .acp-visual svg {
        width: 100%;
        height: 100%;
      }
      .acp-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .acp-body b {
        font-size: 13.5px;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .acp-body small {
        display: block;
        font-size: 11.5px;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Météo de chantier — vide tant que la réponse n'est pas arrivée (voir
         ensureProjectWeather/updateProjectWeatherBadge), jamais de valeur
         fictive affichée entre-temps. */
      .acp-weather {
        color: var(--text-secondary);
        font-weight: 600;
      }
      .acp-badge {
        flex: none;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .acp-badge.danger {
        color: var(--danger-ink);
      }
      .acp-badge.warning {
        color: var(--warning-ink);
      }
      .acp-badge.success {
        color: var(--success);
      }
      /* Bandeau contextuel "À savoir" — une phrase, discret. */
      .today-insight {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 22px;
        padding: 13px 16px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        font-size: 13px;
      }
      .today-insight b {
        flex: none;
        color: var(--text);
      }
      .today-insight p {
        margin: 0;
        color: var(--text-secondary);
      }
      /* Two prominent zones (À décider + Aujourd'hui), À surveiller light below */
      .today-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
        grid-template-areas: "decide today" "watch watch";
        gap: 24px 24px;
        align-items: start;
      }
      .zone-decide {
        grid-area: decide;
      }
      .zone-today {
        grid-area: today;
      }
      .zone-watch {
        grid-area: watch;
        margin-top: 2px;
      }
      /* Aujourd'hui : deux colonnes À décider / À surveiller (timeline au-dessus),
         vignettes d'action à l'intérieur, colonnes jusqu'en bas de page */
      .today-grid.two {
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "decide watch";
        margin-top: 28px;
        align-items: stretch;
        min-height: calc(100vh - 290px);
      }
      .today-grid.two .zone {
        display: flex;
        flex-direction: column;
      }
      .today-grid.two .zone-watch {
        margin-top: 0;
      }
      .today-grid.two .zone-body {
        flex: 1;
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: none;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .today-grid.two .decision-card,
      .today-grid.two .watch-card {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow);
        padding: 16px 18px;
        margin: 0;
      }
      .today-grid.two .decision-card {
        border-left: 3px solid var(--danger);
      }
      .today-grid.two .watch-card {
        border-left: 3px solid var(--warning);
      }
      /* Confirmation terrain = carte CALME (démarrage bleu / fin vert), jamais
         une alerte. Bordure gauche colorée positive plutôt qu'orange. */
      .today-grid.two .watch-card.confirm-start {
        border-left-color: var(--accent);
      }
      .today-grid.two .watch-card.confirm-done {
        border-left-color: var(--success);
      }
      .eyebrow.confirm {
        color: var(--accent-ink, var(--accent));
      }
      .watch-card.confirm-done .eyebrow.confirm {
        color: var(--success-ink, var(--success));
      }
      .btn.ghost {
        background: none;
        border-color: transparent;
        color: var(--text-secondary);
      }
      /* Icône d'en-tête de colonne (À décider / À surveiller) */
      .zone-head-ico {
        display: inline-flex;
        width: 20px;
        height: 20px;
        flex: none;
      }
      .zone-head-ico svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .zone-head.decide .zone-head-ico svg {
        stroke: var(--danger);
      }
      .zone-head.watch .zone-head-ico svg {
        stroke: var(--warning);
      }
      /* Raison courte « pourquoi » dans les vignettes d'action */
      .card-why {
        margin: 6px 0 0;
        color: var(--text-secondary);
        font-size: 13.5px;
        line-height: 1.4;
      }
      .card-project {
        margin: 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .eyebrow.warning {
        color: var(--warning-ink);
      }
      .watch-card h3 {
        font-size: 16px;
        margin: 6px 0 0;
      }
      .watch-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .watch-actions {
        display: flex;
      }
      /* Pop-up journée : liste des interventions */
      .day-tasks {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 14px 0 4px;
        max-height: 52vh;
        overflow-y: auto;
      }
      .day-task {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        /* Ligne assez haute pour rester tactile (~56-60px) — popups
           réutilisés tels quels par le Mode Chantier (openFieldAttentionPopup). */
        padding: 14px 14px;
        cursor: pointer;
        transition: border-color 0.14s, background 0.14s;
      }
      .day-task:hover {
        border-color: var(--accent);
        background: var(--surface);
      }
      .day-task .day-task-body {
        flex: 1;
        min-width: 0;
      }
      .day-task .day-task-body b {
        display: block;
        font-size: 14px;
        color: var(--text);
      }
      .day-task .day-task-body small {
        color: var(--text-secondary);
        font-size: 12.5px;
      }
      .zone-head {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 12px;
        padding: 0 0 10px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        border-bottom: 1px solid var(--border-light);
      }
      .zone-head .zdot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .zone-head.decide .zdot {
        background: var(--danger);
      }
      .zone-head.today .zdot {
        background: var(--accent);
      }
      .zone-head.watch .zdot {
        background: var(--warning);
      }
      .zone-head em {
        margin-left: 2px;
        font-style: normal;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-tertiary);
      }
      .zone-head.decide em {
        color: var(--danger-ink);
      }
      .zone-head.today em {
        color: var(--accent-ink);
      }
      .zone-head.watch em {
        color: var(--warning-ink);
      }
      /* décider + à surveiller = mêmes vignettes (cartes présentes) */
      .zone-decide .zone-body,
      .zone-today .zone-body,
      .zone-watch .zone-body {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 2px 18px;
      }
      /* décider = fine barre rouge à gauche ; surveiller = barre orange */
      .zone-decide .zone-body {
        border-left: 3px solid var(--danger);
      }
      .zone-watch .zone-body {
        border-left: 3px solid var(--warning);
      }
      .zone-empty {
        display: grid;
        gap: 2px;
        padding: 14px 2px;
        color: var(--success);
        font-size: 13px;
        font-weight: 600;
      }
      .zone-empty b {
        color: var(--text);
        font-size: 14px;
      }
      .zone-empty span {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 400;
      }
      .today-calm {
        max-width: 760px;
      }
      .calm-note {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: var(--success);
        font-size: 13px;
        font-weight: 600;
      }
      /* Halo d'accueil sur la première décision (premium, discret, 2 cycles) */
      .decision-card.halo,
      .attention-card.halo {
        border-radius: var(--radius-md);
        animation: cardHalo 0.9s ease-out 2;
      }
      @keyframes cardHalo {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 42%, transparent);
          background: color-mix(in srgb, var(--accent) 5%, transparent);
        }
        60% {
          box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
          background: transparent;
        }
      }
      .decision-card.halo.halo-critical,
      .attention-card.halo.halo-critical {
        animation-name: cardHaloCritical;
      }
      @keyframes cardHaloCritical {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 38%, transparent);
          background: color-mix(in srgb, var(--danger) 5%, transparent);
        }
        60% {
          box-shadow: 0 0 0 7px color-mix(in srgb, var(--danger) 0%, transparent);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .decision-card.halo,
        .attention-card.halo {
          animation: none;
          outline: 2px solid var(--accent);
          outline-offset: 3px;
        }
        .decision-card.halo.halo-critical,
        .attention-card.halo.halo-critical {
          outline-color: var(--danger);
        }
      }
      /* Aperçu « Cette semaine » — bande légère sous le workflow */
      .week-preview {
        margin-top: 8px;
      }
      /* UNE seule carte (§2/§22) : header + 5 jours contigus, pas cinq
         cartes flottantes. overflow:hidden épouse le border-radius sur les
         cellules de bord sans avoir à leur donner un rayon individuel. */
      .week-card {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        overflow: hidden;
      }
      .week-card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 14px 18px 12px;
      }
      .week-card-head h2 {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin: 0;
      }
      .week-card-head .link {
        font-size: 12px;
      }
      .wp-days {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        border-top: 1px solid var(--border-light);
      }
      .wp-day {
        display: grid;
        gap: 5px;
        align-content: start;
        /* Dimensions §2.3 : 20% de largeur (5 colonnes égales, déjà garanti
           par le grid) et hauteur stable quel que soit le nombre d'actions. */
        min-height: 100px;
        padding: 12px 12px 14px;
        text-align: left;
        border: 0;
        border-left: 1px solid var(--border-light);
        border-radius: 0;
        background: var(--surface);
        box-shadow: none;
        cursor: pointer;
        transition: background 0.14s;
      }
      .wp-day:first-child {
        border-left: 0;
      }
      .wp-day:hover {
        background: var(--surface-subtle);
      }
      .wp-day:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: -3px;
      }
      /* Seule la cellule du jour courant ressort — bleu très léger (§2.2). */
      .wp-day.today {
        background: var(--accent-soft);
      }
      .wp-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text);
        text-transform: capitalize;
      }
      .wp-day.today .wp-label {
        color: var(--accent-ink);
      }
      .wp-today-tag {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.07em;
        padding: 2px 5px;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
        text-transform: uppercase;
      }
      .wp-count {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .wp-count b {
        color: var(--text);
        font-size: 16px;
        margin-right: 4px;
      }
      .wp-signals {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 13px;
        flex-wrap: wrap;
      }
      .wp-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .wp-dot.danger {
        background: var(--danger);
      }
      .wp-dot.warning {
        background: var(--warning);
      }
      .wp-risk {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .wp-tag {
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--surface-muted);
        color: var(--text-tertiary);
      }
      .wp-quiet {
        font-size: 11px;
        color: var(--text-tertiary);
      }
      @media (max-width: 720px) {
        /* Sous 720px, la carte contiguë redevient invisible : on retrouve le
           carrousel de cartes individuelles déjà éprouvé en mobile (glisser
           horizontalement lit mieux qu'une bande contiguë tronquée). */
        .week-card {
          background: none;
          border: 0;
          box-shadow: none;
          border-radius: 0;
          overflow: visible;
        }
        .week-card-head {
          padding: 0 0 8px;
        }
        .wp-days {
          border-top: 0;
          grid-template-columns: none;
          grid-auto-flow: column;
          grid-auto-columns: 46%;
          gap: 8px;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          /* Bleed aligné sur le padding horizontal mobile de .main (16px),
             sinon la bande déborde de 2px et fait défiler la page. */
          margin: 0 -16px;
          padding: 2px 16px 6px;
        }
        .wp-day {
          min-height: auto;
          border: 1px solid var(--border-light);
          border-radius: var(--radius-md);
          background: var(--surface);
          box-shadow: var(--shadow-xs);
          scroll-snap-align: start;
        }
      }
      @media print {
        body.planning-print .sidebar,
        body.planning-print .planning-header button,
        body.planning-print .planning-nav button,
        body.planning-print .plan-toolbar,
        body.planning-print .analysis-bar,
        body.planning-print .ai-nudge,
        body.planning-print .scroll-hint,
        body.planning-print .add { display: none !important; }
        body.planning-print .shell { display: block; }
        body.planning-print .main { padding: 0; }
        body.planning-print .page { padding: 12px; }
        body.planning-print .gantt-wrap { overflow: visible; border: 1px solid #cbd5e1; }
        body.planning-print .gantt { min-width: 100% !important; }
      }
      /* Décision */
      .decision-card {
        padding: 14px 0 15px;
        border-bottom: 1px solid var(--border-light);
      }
      .decision-card:last-child {
        border-bottom: 0;
      }
      .decision-card h3 {
        font-size: 17px;
        margin: 6px 0 2px;
      }
      .decision-card > p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .decide-facts {
        margin: 12px 0 14px;
        padding: 11px 13px;
        background: var(--danger-soft);
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-sm);
      }
      .decide-facts b {
        display: block;
        font-size: 14px;
        color: var(--danger-ink);
      }
      .decide-facts span {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .decide-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .multi-note {
        margin: 12px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .impact-mini {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
      }
      .impact-mini small {
        display: block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
      }
      .mini-track {
        height: 7px;
        background: var(--surface-muted);
        border-radius: 8px;
        position: relative;
        margin: 5px 0 11px;
      }
      .mini-track i {
        position: absolute;
        height: 7px;
        border-radius: 8px;
      }
      .baseline-mini {
        background: var(--text-tertiary);
      }
      .actual-mini {
        background: var(--danger);
      }
      .technical-details {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--border-light);
        color: var(--text-secondary);
        font-size: 12px;
      }
      .technical-details summary {
        color: var(--accent);
        font-weight: 600;
        cursor: pointer;
      }
      /* Aujourd'hui = liste de lignes */
      .today-task {
        display: grid;
        grid-template-columns: 9px minmax(0, 1fr) auto;
        gap: 11px;
        align-items: center;
        padding: 13px 8px;
        margin: 0 -8px;
        border-radius: var(--radius-sm);
        border-bottom: 1px solid var(--border-light);
        cursor: pointer;
        min-height: 44px;
      }
      .today-task:last-child {
        border-bottom: 0;
      }
      .today-task:hover {
        background: var(--surface-subtle);
      }
      .today-task.doing {
        background: var(--accent-soft);
        border-bottom-color: transparent;
      }
      .today-task h3 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .today-task p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .today-task small {
        color: var(--text-tertiary);
        font-size: 12px;
      }
      /* À surveiller = lignes légères */
      .watch-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid var(--border-light);
        min-height: 44px;
      }
      .watch-row:last-child {
        border-bottom: 0;
      }
      .watch-row h3 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .watch-row p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12.5px;
      }
      .watch-row small {
        display: block;
        margin-top: 2px;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .watch-row .success {
        color: var(--success);
        font-size: 12px;
        font-weight: 600;
      }

      /* ---------------- Chantiers (sites) ---------------- */
      .portfolio-summary {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .portfolio-summary b {
        font-size: 13px;
      }
      .portfolio-summary span {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .portfolio-summary .danger {
        color: var(--danger-ink);
      }
      .portfolio-summary .warning {
        color: var(--warning-ink);
      }
      .portfolio-summary .success {
        color: var(--success-ink);
      }
      .portfolio-summary .setup {
        color: var(--accent-ink);
      }
      /* Portfolio grid — vertical cards */
      .sites-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(258px, 1fr));
        gap: 18px;
      }
      .site-card {
        display: flex;
        flex-direction: column;
        text-align: left;
        width: 100%;
        padding: 0;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        overflow: hidden;
        cursor: pointer;
        transition: box-shadow 0.16s ease, border-color 0.16s ease;
      }
      .site-card:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .site-card:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: 2px;
      }
      .site-card.danger {
        border-color: var(--danger-border);
      }
      .site-card.warning {
        border-color: var(--warning-border);
      }
      /* V4.8 — onglets Actifs / Clôturés / Archives */
      .sites-tabs {
        display: flex;
        gap: 6px;
        margin: 4px 0 18px;
      }
      .sites-tab {
        border: 0;
        background: none;
        padding: 7px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sites-tab:hover {
        background: var(--surface-subtle);
      }
      .sites-tab.active {
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .sites-tab em {
        font-style: normal;
        font-size: 11px;
        font-weight: 700;
        opacity: 0.7;
      }
      /* Tons cycle de vie sur la carte */
      .site-card.neutral,
      .site-card.setup {
        border-color: var(--border-light);
      }
      .site-badge.neutral,
      .status-badge.neutral {
        color: var(--text-secondary);
      }
      .site-badge.neutral i,
      .status-badge.neutral i {
        background: var(--text-tertiary);
      }
      .site-badge.setup,
      .status-badge.setup {
        color: var(--accent-ink);
      }
      .site-badge.setup i,
      .status-badge.setup i {
        background: var(--accent);
      }
      .site-subject.neutral b,
      .site-subject.setup b {
        color: var(--text);
      }
      .site-subject.neutral span,
      .site-subject.setup span {
        color: var(--text-tertiary);
      }
      /* Menu ••• d'une carte chantier (coin haut droit de l'illustration) */
      .site-menu {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 4;
      }
      .site-menu .more-trigger {
        width: 30px;
        height: 30px;
        padding: 0;
        background: rgba(255, 255, 255, 0.92);
        border-color: transparent;
        box-shadow: var(--shadow-xs);
      }
      body.dark .site-menu .more-trigger {
        background: rgba(16, 32, 47, 0.92);
      }
      /* Empty state soigné */
      .empty-state {
        text-align: center;
        padding: 44px 20px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-subtle);
      }
      .empty-state b {
        display: block;
        font-size: 15px;
        margin-bottom: 4px;
      }
      .empty-state span {
        color: var(--text-secondary);
        font-size: 13px;
      }
      .empty-action {
        margin-top: 16px;
      }
      /* Avatar « non affecté » */
      .resource-avatar.unassigned {
        background: var(--surface-muted);
        color: var(--text-tertiary);
        font-size: 13px;
        font-weight: 700;
      }
      /* Bandeau lecture seule + zone setup dans le cockpit */
      .cockpit-head-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .cockpit-lifecycle {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
      }
      .cockpit-lifecycle .cl-actions {
        display: flex;
        gap: 8px;
      }
      /* Bandeau lecture seule discret (sidewindow tâche / planning historique) */
      .lock-note {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 10px 12px;
        font-size: 13px;
        color: var(--text-secondary);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
      }
      .lock-note svg {
        width: 15px;
        height: 15px;
        flex: none;
        stroke: var(--text-secondary);
        fill: none;
      }
      .setup-zone .setup-lead {
        color: var(--text-secondary);
        font-size: 14px;
        margin: 0 0 12px;
      }
      .setup-steps {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .setup-origin {
        margin-top: 12px;
      }
      /* V4.8.3 — fin de chantier guidée */
      .closure-zone {
        border: 1px solid var(--success-border, var(--border-light));
        background: var(--success-surface, var(--surface-subtle));
        border-radius: var(--radius-md);
        padding: 18px 18px 16px;
      }
      .closure-zone.discreet {
        padding: 12px 14px;
      }
      .closure-lead {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 700;
        color: var(--success-ink, var(--text));
      }
      .closure-zone.discreet .closure-lead {
        font-size: 14px;
      }
      .closure-actions {
        margin-top: 14px;
      }
      .closure-zone.discreet .closure-actions {
        margin-top: 10px;
      }
      .closure-remaining {
        margin: 6px 0 4px;
        padding-left: 18px;
        color: var(--text-secondary);
        font-size: 14px;
      }
      .closure-remaining li {
        margin: 2px 0;
      }
      /* Case à cocher inline (jalon de fin, wizard) */
      .drawer-form label.check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-direction: row;
        font-size: 13px;
        color: var(--text);
        cursor: pointer;
      }
      .drawer-form label.check-row input {
        width: auto;
        margin: 0;
        flex: none;
      }
      /* Wizard création chantier */
      .wiz-next {
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        padding: 0 12px;
        margin: 4px 0 2px;
        background: var(--surface-subtle);
      }
      .wiz-next > summary {
        cursor: pointer;
        list-style: none;
        padding: 12px 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent-ink);
        user-select: none;
      }
      .wiz-next > summary::-webkit-details-marker {
        display: none;
      }
      .wiz-next[open] > summary {
        border-bottom: 1px solid var(--border-light);
        margin-bottom: 8px;
      }
      .wiz-next[open] > summary::after {
        content: " — replier";
        font-weight: 400;
        color: var(--text-secondary);
      }
      .wiz-next > label:last-child {
        margin-bottom: 12px;
      }
      .wiz-choices {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
      }
      .wiz-choice {
        text-align: left;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        padding: 16px;
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
        column-gap: 14px;
        transition: border-color 0.14s, box-shadow 0.14s;
      }
      .wiz-choice:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow-xs);
      }
      .wiz-choice .wiz-ico {
        grid-row: 1 / 3;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        align-self: center;
      }
      .wiz-choice b {
        font-size: 15px;
      }
      .wiz-choice small {
        color: var(--text-secondary);
        font-size: 12.5px;
      }
      .wiz-templates {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }
      .wiz-template {
        text-align: left;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .wiz-template:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow-xs);
      }
      .wiz-template b {
        font-size: 14.5px;
      }
      .wiz-template small {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .wiz-preview {
        padding: 14px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        margin-bottom: 16px;
      }
      .wiz-preview-meta {
        display: flex;
        gap: 14px;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 10px;
      }
      .wiz-chain {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .wiz-step {
        font-size: 12.5px;
        padding: 4px 9px;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .wiz-arrow {
        color: var(--text-tertiary);
      }
      .wiz-target {
        font-size: 13px;
        color: var(--text-secondary);
      }
      .wiz-summary {
        padding: 16px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        margin: 8px 0 16px;
      }
      .wiz-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--accent-ink);
        background: var(--accent-soft);
        padding: 4px 9px;
        border-radius: 20px;
        margin-bottom: 12px;
      }
      .wiz-summary dl {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .wiz-summary dl > div {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .wiz-summary dt {
        font-size: 11px;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .wiz-summary dd {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
      }
      /* Confirmation forte de suppression */
      .del-confirm {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 14px 0;
        font-size: 13px;
      }
      .del-confirm input {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 11px;
        font-size: 14px;
        background: var(--surface);
        color: var(--text);
      }
      .del-confirm input:focus {
        outline: none;
        border-color: var(--danger);
      }
      .danger-ink {
        color: var(--danger-ink);
      }
      .site-art {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: var(--surface-muted);
      }
      .site-art svg {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 0.18s ease;
      }
      .site-card:hover .site-art svg {
        transform: scale(1.015);
      }
      .site-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.18);
      }
      body.dark .site-badge {
        background: rgba(16, 32, 47, 0.9);
      }
      .site-badge i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .site-badge.warning {
        color: var(--warning-ink);
      }
      .site-badge.warning i {
        background: var(--warning);
      }
      .site-badge.danger {
        color: var(--danger-ink);
      }
      .site-badge.danger i {
        background: var(--danger);
      }
      .site-body {
        display: flex;
        flex-direction: column;
        padding: 14px 16px 15px;
        flex: 1;
      }
      .site-body h2 {
        font-size: 16px;
        margin: 0;
      }
      .site-loc {
        color: var(--text-secondary);
        font-size: 12px;
        margin: 2px 0 0;
      }
      .site-subject {
        margin: 12px 0 0;
        padding: 11px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
      }
      .site-subject b {
        display: block;
        font-size: 13px;
      }
      .site-subject span {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .site-subject.danger span {
        color: var(--danger-ink);
        font-weight: 600;
      }
      .site-subject.warning span {
        color: var(--warning-ink);
        font-weight: 600;
      }
      .site-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 14px;
      }
      .site-team {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .site-team > span {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .site-open {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      /* status pill (project cockpit) */
      .location {
        color: var(--text-secondary);
        margin: 2px 0 12px;
        font-size: 13px;
      }
      .site-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--success-ink);
      }
      .site-status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .site-status.warning {
        color: var(--warning-ink);
      }
      .site-status.warning i {
        background: var(--warning);
      }
      .site-status.danger {
        color: var(--danger-ink);
      }
      .site-status.danger i {
        background: var(--danger);
      }
      .team-filters small {
        display: block;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.09em;
        margin-bottom: 4px;
      }
      .avatar-stack {
        display: flex;
        align-items: center;
      }
      .avatar-stack .resource-avatar {
        margin-left: -6px;
        box-shadow: 0 0 0 2px var(--surface);
      }
      .avatar-stack .resource-avatar:first-child {
        margin-left: 0;
      }
      .avatar-stack em {
        font-size: 10px;
        font-style: normal;
        font-weight: 600;
        margin-left: 6px;
        color: var(--text-secondary);
      }

      /* Resource avatars (portraits + monograms) */
      .resource-avatar {
        --size: 36px;
        width: var(--size);
        height: var(--size);
        flex: 0 0 var(--size);
        border-radius: 50%;
        overflow: hidden;
        display: inline-grid;
        place-items: center;
        background: var(--surface-muted);
      }
      .resource-avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .resource-avatar.small {
        --size: 26px;
      }
      .resource-avatar.company {
        border-radius: 8px;
      }

      /* ---------------- Project cockpit V4.5 ---------------- */
      .cockpit {
        padding: 20px 0;
        border-bottom: 1px solid var(--border-light);
      }
      .cockpit-header {
        margin-bottom: 24px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--success-ink);
        margin-bottom: 8px;
      }
      .status-badge i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .status-badge.warning {
        color: var(--warning-ink);
      }
      .status-badge.warning i {
        background: var(--warning);
      }
      .status-badge.danger {
        color: var(--danger-ink);
      }
      .status-badge.danger i {
        background: var(--danger);
      }
      .cockpit-header h1 {
        font-size: 27px;
        margin: 0 0 4px;
        letter-spacing: -0.02em;
      }
      .cockpit-header .location {
        color: var(--text-secondary);
        font-size: 13px;
        margin: 2px 0 12px;
      }
      .cockpit-header .headline {
        color: var(--text-secondary);
        font-size: 14px;
        margin: 0;
      }
      .cockpit-body {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 32px;
        align-items: start;
      }
      .cockpit-content {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .cockpit-zone {
      }
      .cockpit-zone h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--text-secondary);
        margin: 0 0 12px;
      }
      .issue-card,
      .milestone-card {
        padding: 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-light);
        background: var(--surface);
      }
      .issue-card.issue-critical {
        border-color: var(--danger-border);
        background: linear-gradient(135deg, var(--surface) 0%, var(--danger-soft) 100%);
      }
      .issue-card.issue-warning {
        border-color: var(--warning-border);
        background: linear-gradient(135deg, var(--surface) 0%, var(--warning-soft) 100%);
      }
      .issue-card h3,
      .milestone-card b {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .issue-card p,
      .milestone-card p {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0 0 10px;
      }
      .impact-summary {
        display: block;
        padding: 8px 0;
        font-size: 12px;
        color: var(--text-secondary);
        border-top: 1px solid var(--border-light);
        margin: 8px 0;
      }
      .impact-summary strong {
        color: var(--text);
      }
      .issue-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .issue-actions .btn {
        font-size: 12px;
      }
      .success-state {
        padding: 12px;
        border-radius: var(--radius-md);
        background: var(--success-soft);
        color: var(--success-ink);
        font-size: 13px;
        margin: 0;
      }
      .cockpit-visual {
        height: 240px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-muted);
      }
      .cockpit-visual svg {
        width: 100%;
        height: 100%;
      }
      .visual {
        height: 210px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-muted);
      }
      .visual svg {
        width: 100%;
        height: 100%;
      }
      .tabs {
        display: flex;
        gap: 22px;
        border-bottom: 1px solid var(--border-light);
        overflow: auto;
        margin-top: 6px;
      }
      .tab {
        border: 0;
        background: none;
        padding: 13px 2px;
        color: var(--text-secondary);
        white-space: nowrap;
        font-size: 13.5px;
      }
      .tab.active {
        color: var(--accent);
        font-weight: 600;
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      /* ---------------- Équipe ---------------- */
      .team-actions {
        display: flex;
        gap: 12px;
