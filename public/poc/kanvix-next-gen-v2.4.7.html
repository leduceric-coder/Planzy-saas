      // perdre le chantier sélectionné.
      function exitFieldPlanning() {
        app.ui.fieldView = "site";
        save();
        renderPage();
        scrollTo(0, 0);
      }
      function setFieldPlanningRange(range) {
        app.ui.fieldPlanningRange = range === "week" ? "week" : "today";
        save();
        renderPage();
      }
      function fieldPlanningRangeValue() {
        return app.ui.fieldPlanningRange === "week" ? "week" : "today";
      }
      // Ligne compacte d'une tâche dans le Planning mobile : statut, nom,
      // ressource, date/heure — clic = popup (jamais un sidewindow), même
      // moteur que le reste du Mode Chantier (openTask → openFieldTaskModal).
      function fieldPlanningRow(t, opts = {}) {
        let meta = opts.showDay
          ? `${esc(resourceLabel(t.resourceId))} · ${fmtDay(t.start)} · ${fmtTime(t.start)}–${fmtTime(t.end)}`
          : `${esc(resourceLabel(t.resourceId))} · ${fmtTime(t.start)}–${fmtTime(t.end)}`;
        return `<article class="field-task${opts.focus ? " field-plan-focus-row" : ""}" onclick="openTask('${t.id}')"><span class="field-dot ${taskTone(t)}"></span><div class="field-task-body"><b>${esc(t.name)}</b><small>${meta}</small></div>${pill(taskTone(t), STATUS[t.status])}</article>`;
      }
      // Dépendances de la tâche focalisée : indication verticale simple —
      // regroupée par rôle (Dépend de / Puis), jamais enchaînée A→B→C, pas de
      // Gantt miniature ni de flèches — réutilise exclusivement
      // getTaskPredecessors()/getTaskSuccessors() existants (aucune dépendance
      // n'est modifiée, uniquement leur présentation).
      function fieldPlanningFocusBlock(taskId) {
        let t = task(taskId);
        if (!t) return "";
        let preds = getTaskPredecessors(t.id),
          succs = getTaskSuccessors(t.id),
          depGroup = (label, list) =>
            list.length
              ? `<div class="field-h2 field-plan-dep-label">${label}${list.length > 1 ? ` · ${list.length}` : ""}</div><div class="field-list">${list.map((x) => fieldPlanningRow(x, { showDay: true })).join("")}</div><div class="field-plan-arrow">↓</div>`
              : "";
        return (
          `<section class="field-section field-plan-focus"><h2 class="field-h2">Tâche sélectionnée</h2>` +
          depGroup("Dépend de", preds) +
          `<div class="field-list">${fieldPlanningRow(t, { showDay: true, focus: true })}</div>` +
          (succs.length
            ? `<div class="field-plan-arrow">↓</div><div class="field-h2 field-plan-dep-label">Puis${succs.length > 1 ? ` · ${succs.length}` : ""}</div><div class="field-list">${succs.map((x) => fieldPlanningRow(x, { showDay: true })).join("")}</div>`
            : "") +
          `</section>`
        );
      }
      // Semaine MÉTIER (lundi → vendredi contenant TODAY) — pas un simple
      // "aujourd'hui + 6 jours". Réutilise le helper de semaine déjà utilisé
      // par l'équipe (getResourceWeekDays), aucune nouvelle logique de dates.
      function fieldCurrentWeekRange() {
        let days = getResourceWeekDays(TODAY);
        return { startKey: days[0], endKey: days.at(-1) };
      }
      // Agenda chronologique du chantier pour la période choisie (Aujourd'hui /
      // Cette semaine), groupé par jour — pas de Gantt, pas de filtres bureau.
      // excludeIds évite de répéter la tâche déjà mise en avant ci-dessus.
      function fieldPlanningAgenda(pid, excludeIds) {
        let range = fieldPlanningRangeValue(),
          todayKey = dayKey(TODAY),
          week = fieldCurrentWeekRange(),
          startKey = range === "today" ? todayKey : week.startKey,
          endKey = range === "today" ? todayKey : week.endKey,
          tasks = getProjectTasks(pid)
            .filter((t) => !excludeIds.has(t.id))
            .filter((t) => dayKey(t.start) <= endKey && dayKey(t.end) >= startKey)
            .sort((a, b) => a.start.localeCompare(b.start));
        if (!tasks.length)
          return `<p class="field-none">${range === "today" ? "Aucune intervention aujourd’hui." : "Aucune intervention cette semaine."}</p>`;
        let groups = {},
          order = [];
        tasks.forEach((t) => {
          // Regroupement VISUEL uniquement : une tâche commencée avant le
          // début de la période affichée apparaît sous le premier jour visible
          // (jamais sous son jour de début réel) — task.start n'est JAMAIS modifié.
          let k = dayKey(t.start) < startKey ? startKey : dayKey(t.start);
          if (!groups[k]) {
            groups[k] = [];
            order.push(k);
          }
          groups[k].push(t);
        });
        let cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
        return order
          .map((k) => {
            let label = cap(
              new Intl.DateTimeFormat("fr-FR", {
                weekday: "long",
                day: "numeric",
                month: "long",
              }).format(date(k + "T12:00")),
            );
            return `<div class="field-plan-day">${label}</div><div class="field-list">${groups[k].map((t) => fieldPlanningRow(t)).join("")}</div>`;
          })
          .join("");
      }
      function fieldPlanningBody() {
        let focusId = app.ui.fieldPlanningTaskId,
          pid = app.ui.fieldProjectId || (focusId ? task(focusId)?.projectId : null),
          back = `<button class="link drawer-back" onclick="exitFieldPlanning()">← Chantier</button>`;
        if (!pid || !project(pid))
          return (
            back +
            `<p class="muted">PLANNING</p>` +
            `<div class="field-empty">${empty("Aucun chantier sélectionné", "Choisissez un chantier depuis l’onglet Chantier.")}</div>`
          );
        let p = project(pid),
          range = fieldPlanningRangeValue(),
          focusBlock = focusId ? fieldPlanningFocusBlock(focusId) : "",
          excludeIds = new Set();
        if (focusId) {
          let t = task(focusId);
          if (t) {
            excludeIds.add(t.id);
            getTaskPredecessors(t.id).forEach((x) => excludeIds.add(x.id));
            getTaskSuccessors(t.id).forEach((x) => excludeIds.add(x.id));
          }
        }
        return (
          back +
          `<p class="muted">PLANNING</p><h2>${esc(p.name)}</h2>` +
          `<div class="segment field-range-toggle"><button class="${range === "today" ? "active" : ""}" onclick="setFieldPlanningRange('today')">Aujourd’hui</button><button class="${range === "week" ? "active" : ""}" onclick="setFieldPlanningRange('week')">Cette semaine</button></div>` +
          focusBlock +
          `<section class="field-section"><h2 class="field-h2">${focusBlock ? "Autres interventions" : "Interventions"}</h2>${fieldPlanningAgenda(pid, excludeIds)}</section>`
        );
      }
      function renderPage() {
        try {
        // Distingue « conversation artisan » d'une page conducteur consultée
        // depuis celle-ci (ex. Documents) : seule la 1ère doit avoir la mise
        // en page mobile étroite — l'autre doit rester une page normale.
        document.body.classList.toggle(
          "artisan-page",
          app.settings.role === "artisan" && app.ui.page === "artisan",
        );
        // V2.4.5 (F06) : masque le "+" flottant uniquement sur l'Accueil
        // Bureau (Mode Chantier le masque déjà via .field-body .add).
        document.body.classList.toggle(
          "page-today",
          app.ui.page === "today" && !isFieldMode(),
        );

        // et Messages sont deux onglets internes (app.ui.fieldTab), et Planning
        // une sous-vue contextuelle de Chantier (app.ui.fieldView). « Voir dans
        // le planning » reste en driverMode="field" (openFieldPlanning).
        let f = isFieldMode()
          ? renderField

            today: pageToday,
            sites: renderSites,
            project: renderProject,
            team: renderTeam,
            planning: renderPlanning,
            resources: renderResources,

            photos: renderPhotos,
            impact: renderImpact,
            more: renderMore,
            artisan: renderArtisan,

        if (app.ui.page === "today") setupTodayHalo();

          console.error("Kanvix: rendu interrompu", error);
          document.body.classList.remove("artisan-body", "artisan-page", "field-body");
          document.documentElement.classList.remove("mobile-frame");
          let main = $("#main");
          if (main) main.innerHTML = `<section class="page active"><div class="empty"><h2>Kanvix a rencontré un problème</h2><p>Vos données restent enregistrées. Vous pouvez revenir à l’accueil, exporter vos données ou réinitialiser la démonstration.</p><div class="actions"><button class="btn primary" onclick="app.settings.role='driver';app.ui.page='today';save();render()">Revenir à l’accueil</button><button class="btn" onclick="exportKanvixData()">Exporter</button><button class="btn" onclick="resetApp()">Réinitialiser</button></div></div></section>`;
          try { nav(); } catch (_) {}
        }
      }
      function render() {
        applyAppearance();
        document.body.classList.toggle(
          "artisan-body",
          app.settings.role === "artisan",
        );

        document.body.classList.toggle("field-body", isFieldMode());
        // Cadre smartphone exclusif (Artisan / Mode Chantier) : voir la règle
        // html.mobile-frame plus haut (pas de gutter de scrollbar réservé).
        document.documentElement.classList.toggle(
          "mobile-frame",
          app.settings.role === "artisan" || isFieldMode(),
        );

          "sidebar-collapsed",
          !!app.ui.sidebarCollapsed,
        );

      function toggleSidebar() {

          "sidebar-collapsed",
          app.ui.sidebarCollapsed,
        );

          app.ui.docCategory = "all";

        renderPage();

      function applyAppearance() {

      $("#cmdInput").addEventListener("input", () => {

      });

          e.preventDefault();
          cmdIndex = Math.min(xs.length - 1, cmdIndex + 1);
          renderCommands();
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          cmdIndex = Math.max(0, cmdIndex - 1);
          renderCommands();
        }
        if (e.key === "Enter" && xs[cmdIndex]) {
          xs[cmdIndex].run();
          $("#cmd").classList.remove("open");
        }

      $("#cmd").addEventListener("click", (e) => {
        if (e.target === $("#cmd")) $("#cmd").classList.remove("open");
      });
      $$(".drawer,.modal").forEach((x) =>
        x.addEventListener("click", (e) => {
          if (e.target === x) closeOverlay(x.id);
        }),
      );
      $("#aiOverlay")?.addEventListener("click", (e) => {
        if (e.target === $("#aiOverlay")) closeAIPanel();
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#profileArea")) closeUserMenu();
        if (!e.target.closest(".more-menu")) closeDrawerMenu();
      });
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openCommand();
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "j") {
          e.preventDefault();
          toggleAIPanel();
        }

        "change",
        () => {

      // PWA — manifeste + service worker uniquement quand le POC est SERVI
      // (http/https). En ouverture locale (file://), on ne les charge pas :

      if (location.protocol === "http:" || location.protocol === "https:") {
        let mf = document.createElement("link");
        mf.rel = "manifest";
        mf.href = "kanvix.webmanifest";
        document.head.appendChild(mf);
        if (
          "serviceWorker" in navigator &&
          (location.protocol === "https:" ||

          window.addEventListener("load", () => {
            navigator.serviceWorker
              .register("kanvix-sw.js")
