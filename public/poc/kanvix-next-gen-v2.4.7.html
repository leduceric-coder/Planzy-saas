        align-items: center;
        justify-content: flex-end;
      }
      .team-summary {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .team-summary .ts-item {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .team-summary b {
        color: var(--text);
      }
      .ts-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .ts-dot.accent {
        background: var(--accent);
      }
      .ts-dot.success {
        background: var(--success);
      }
      .ts-dot.warning {
        background: var(--warning);
      }
      .team-filters {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 15px;
        gap: 20px;
        flex-wrap: wrap;
      }
      .team-filters > div {
        display: grid;
        gap: 6px;
      }
      .team-filters small {
        display: block;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.09em;
        margin-bottom: 4px;
      }
      .team-list {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-xs);
      }
      .team-card {
        display: grid;
        grid-template-columns: 40px 1.2fr 1.6fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px 18px;
        border-top: 1px solid var(--border-light);
        cursor: pointer;
      }
      .team-card:first-child {
        border-top: 0;
      }
      .team-card:hover {
        background: var(--surface-subtle);
      }
      .team-card:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: -3px;
      }
      .tc-id h3 {
        margin: 0;
        font-size: 14px;
      }
      .tc-id p {
        margin: 2px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .tc-mission b {
        font-size: 13.5px;
      }
      .tc-mission span,
      .tc-mission small {
        display: block;
        margin: 2px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .tc-mission .tc-expert {
        color: var(--text-tertiary);
      }
      /* Raison de surveillance (Équipe > À surveiller) */
      .tc-reason {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 7px;
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
        background: var(--warning-soft);
        color: var(--warning-ink);
      }
      .tc-reason .tc-reason-ico {
        font-size: 11px;
      }
      .tc-reason.late,
      .tc-reason.conflict,
      .tc-reason.issue {
        background: var(--danger-soft);
        color: var(--danger-ink);
      }
      .tc-status {
        font-style: normal;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-tertiary);
      }
      /* état ressource : point + texte, discret (jamais un gros pill) */
      .tc-state,
      .rstate {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--text-secondary);
      }
      .tc-state i,
      .rstate i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .tc-state.success,
      .rstate.success {
        color: var(--success-ink);
      }
      .tc-state.success i,
      .rstate.success i {
        background: var(--success);
      }
      .tc-state.accent,
      .rstate.accent {
        color: var(--accent-ink);
      }
      .tc-state.accent i,
      .rstate.accent i {
        background: var(--accent);
      }
      .tc-state.warning,
      .rstate.warning {
        color: var(--warning-ink);
      }
      .tc-state.warning i,
      .rstate.warning i {
        background: var(--warning);
      }
      .tc-state.danger,
      .rstate.danger {
        color: var(--danger-ink);
      }
      .tc-state.danger i,
      .rstate.danger i {
        background: var(--danger);
      }
      .rstate {
        margin: 6px 0 4px;
      }
      .rstate.muted {
        color: var(--text-tertiary);
      }
      .rstate.muted i {
        background: var(--text-tertiary);
      }

      /* ---------------- Fiche Ressource V4.6 ---------------- */
      .rfiche-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .rfiche-id {
        min-width: 0;
      }
      .rfiche-role {
        color: var(--text-secondary);
        font-size: 13px;
        margin: 2px 0 0;
      }
      .rc-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .rc-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .rc-row small {
        color: var(--text-tertiary);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .rc-row a,
      .rc-row b {
        font-size: 14px;
        color: var(--text);
        text-decoration: none;
      }
      .rc-row a:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      .rc-account {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .rc-sub {
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .rc-account-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .rc-pending {
        display: inline-flex;
        align-items: center;
        font-size: 13px;
        color: var(--warning-ink);
        padding: 8px 4px;
      }
      .invite-intro {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0;
      }
      .invite-list {
        list-style: none;
        padding: 0;
        margin: 0 0 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      /* Badge non-lu (Équipe) */
      .tc-unread {
        display: inline-flex;
        align-items: center;
        margin-left: 8px;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-ink);
        vertical-align: middle;
      }
      /* Archives */
      .arch-card {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface);
        margin-bottom: 10px;
      }
      .arch-id {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .arch-id small {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .arch-id .arch-date {
        color: var(--text-tertiary);
      }
      /* Messagerie sidewindow */
      .drawer-back {
        display: inline-block;
        margin-bottom: 8px;
      }
      .conv-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 4px 0 8px;
      }
      .conv-who {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .conv-who b {
        font-size: 15px;
      }
      .conv-who small {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .conv-online {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--success-ink);
        margin-top: 2px;
      }
      .conv-online i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .conv-ctx {
        font-size: 12px;
        color: var(--text-secondary);
        padding: 8px 12px;
        background: var(--surface-subtle);
        border-radius: var(--radius-sm);
        margin-bottom: 12px;
      }
      .conv-thread {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 4px 0 12px;
        overflow-y: auto;
        flex: 1;
        min-height: 120px;
      }
      .conv-day {
        text-align: center;
        font-size: 11px;
        color: var(--text-tertiary);
        margin: 4px 0;
      }
      .conv-day.muted {
        padding: 20px 0;
      }
      .conv-bubble {
        max-width: 78%;
        padding: 9px 12px 6px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        position: relative;
      }
      .conv-bubble time {
        display: block;
        font-size: 10px;
        opacity: 0.65;
        margin-top: 3px;
        text-align: right;
      }
      .conv-bubble.them {
        align-self: flex-start;
        background: var(--surface-muted);
        color: var(--text);
        border-bottom-left-radius: 4px;
      }
      .conv-bubble.me {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .conv-bubble .conv-bubble-photo {
        display: block;
        width: 100%;
        max-width: 220px;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 6px;
        padding: 0;
        border: 0;
        cursor: pointer;
        background: none;
      }
      .conv-bubble .conv-bubble-photo svg,
      .conv-bubble .conv-bubble-photo .photo-img {
        display: block;
        width: 100%;
        height: 150px;
        object-fit: cover;
      }
      .conv-bubble-text {
        display: block;
      }
      /* Brouillon photo au-dessus du composer */
      .conv-draft {
        display: none;
      }
      .conv-draft.has-photo {
        display: block;
        position: sticky;
        bottom: 60px;
        padding: 8px 0 0;
      }
      .conv-draft-inner {
        position: relative;
        display: inline-block;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border-light);
      }
      .conv-draft-inner .photo-img {
        display: block;
        max-height: 120px;
        max-width: 100%;
      }
      .conv-compose {
        display: flex;
        gap: 8px;
        align-items: center;
        position: sticky;
        bottom: 0;
        padding: 12px 0 4px;
        background: var(--surface);
        border-top: 1px solid var(--border-light);
      }
      .conv-compose input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 9px 14px;
        font-size: 14px;
        background: var(--surface);
        color: var(--text);
      }
      .conv-compose input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .conv-compose .send {
        flex: 0 0 auto;
      }
      /* Messagerie — hub / liste de conversations */
      .conv-hub-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 2px 0 12px;
      }
      .conv-hub-head h2 {
        margin: 0;
      }
      .conv-search {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 9px 12px;
        font-size: 13.5px;
        background: var(--surface);
        color: var(--text);
        margin-bottom: 8px;
      }
      .conv-search:focus {
        outline: none;
        border-color: var(--accent);
      }
      .conv-list {
        display: flex;
        flex-direction: column;
      }
      .conv-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 12px 6px;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        color: var(--text);
        transition: background 0.14s;
      }
      .conv-item:hover {
        background: var(--surface-subtle);
      }
      .conv-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .conv-line1 {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .conv-line1 b {
        font-size: 14px;
        font-weight: 600;
      }
      .conv-line1 time {
        font-size: 11px;
        color: var(--text-tertiary);
        flex: 0 0 auto;
      }
      .conv-sub,
      .conv-ctx-line {
        font-size: 12px;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-ctx-line {
        color: var(--text-secondary);
      }
      .conv-last {
        font-size: 13px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .conv-item.unread .conv-last {
        color: var(--text);
        font-weight: 500;
      }
      .conv-unread {
        flex: 0 0 auto;
        align-self: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .access-pill {
        flex: 0 0 auto;
        font-size: 10.5px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        background: var(--surface-subtle);
        white-space: nowrap;
      }
      .access-pill.success {
        color: var(--success-ink, var(--success));
        border-color: var(--success-border, var(--success));
        background: var(--success-soft);
      }
      .access-pill.warning {
        color: var(--warning-ink, var(--warning));
        border-color: var(--warning-border, var(--warning));
        background: var(--warning-soft);
      }
      .access-pill.muted {
        color: var(--text-tertiary);
      }
      .conv-empty {
        padding: 28px 6px;
        text-align: center;
      }
      /* Détails techniques cockpit (Expert) */
      .cockpit-tech {
        margin-top: 10px;
        font-size: 12px;
      }
      .cockpit-tech summary {
        cursor: pointer;
        color: var(--text-secondary);
        font-weight: 600;
      }
      .cockpit-tech p {
        margin: 6px 0 0;
        color: var(--text-secondary);
      }

      /* ---------------- Charge des ressources ---------------- */
      .back-link {
        display: inline-block;
        margin-bottom: 6px;
      }
      .resources {
        overflow: auto;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        background: var(--surface);
        scrollbar-width: thin;
      }
      .load-row {
        display: grid;
        grid-template-columns: 200px repeat(5, minmax(96px, 1fr));
        min-width: 720px;
        border-top: 1px solid var(--border-light);
        align-items: stretch;
      }
      .load-row:first-child {
        border-top: 0;
      }
      .load-head {
        background: var(--surface-subtle);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--text-tertiary);
        text-transform: uppercase;
      }
      .load-head > div {
        padding: 10px 13px;
      }
      .load-row:not(.load-head) {
        cursor: pointer;
      }
      .load-row:not(.load-head):hover {
        background: var(--surface-subtle);
      }
      .load-row:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: -3px;
      }
      .rc-name {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        min-width: 0;
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--surface);
      }
      .load-head > div:first-child {
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--surface-subtle);
      }
      .load-row:not(.load-head):hover .rc-name {
        background: var(--surface-subtle);
      }
      .rc-name b {
        font-size: 13px;
      }
      .rc-name small {
        display: block;
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .rc-cell-wrap {
        padding: 8px;
        border-left: 1px solid var(--border-light);
        display: flex;
      }
      .rc-cell {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 600;
        background: var(--surface-subtle);
        color: var(--text-tertiary);
      }
      .rc-cell i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--border-strong);
        flex: 0 0 7px;
      }
      .rc-cell.available {
        background: transparent;
        color: var(--text-tertiary);
        font-weight: 500;
      }
      .rc-cell.accent {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .rc-cell.accent i {
        background: var(--accent);
      }
      .rc-cell.warning {
        background: var(--warning-soft);
        color: var(--warning-ink);
      }
      .rc-cell.warning i {
        background: var(--warning);
      }
      .rc-cell.danger {
        background: var(--danger-soft);
        color: var(--danger-ink);
      }
      .rc-cell.danger i {
        background: var(--danger);
      }

      /* Drawer ressource */
      .drawer-mission {
        display: grid;
        grid-template-columns: 88px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--border-light);
      }
      .drawer-mission:first-child {
        border-top: 0;
      }
      .drawer-mission > b {
        font-size: 12.5px;
        color: var(--text-secondary);
      }
      .drawer-mission span {
        display: block;
        font-size: 13px;
      }
      .drawer-mission small {
        display: block;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .drawer-avail {
        margin: 12px 0 0;
        padding-top: 10px;
        border-top: 1px dashed var(--border);
        color: var(--text-secondary);
        font-size: 13px;
      }
      .drawer-cap {
        display: flex;
        gap: 26px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
      }
      .drawer-cap small {
        display: block;
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .drawer-cap b {
        font-size: 14px;
      }
      .week-dots {
        display: flex;
        gap: 16px;
      }
      .week-dots .wd {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--text-tertiary);
        font-weight: 600;
      }
      .week-dots .wd i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--border-strong);
      }
      .week-dots .wd.success i {
        background: var(--success);
      }
      .week-dots .wd.accent i {
        background: var(--accent);
      }
      .week-dots .wd.warning i {
        background: var(--warning);
      }
      .week-dots .wd.danger i {
        background: var(--danger);
      }
      /* Pièces liées (drawer tâche) — compact, cliquable si > 0 */
      .dp-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dp-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface-subtle);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
        transition: box-shadow 0.16s, border-color 0.16s;
      }
      .dp-chip svg {
        width: 15px;
        height: 15px;
        stroke: var(--text-secondary);
        fill: none;
        stroke-width: 1.7;
      }
      .dp-chip:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .dp-none {
        color: var(--text-tertiary);
        font-size: 13px;
      }
      .ai-nudge {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 10px 14px;
        margin: 0 0 14px;
        border: 1px solid var(--border-light);
        background: var(--surface);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
        font-size: 13px;
        color: var(--text-secondary);
      }
      .ai-nudge svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ai-nudge b {
        color: var(--text);
      }
      .ai-nudge .link {
        margin-left: auto;
      }
      /* Planning en mode Essentiel : invitation à passer en Pilotage */
      .mode-hint {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        margin: 0 0 14px;
        border: 1px solid var(--accent-soft);
        background: var(--accent-soft);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
      }
      .mode-hint svg {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mode-hint-copy {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .mode-hint-copy b {
        color: var(--text);
        font-size: 13.5px;
      }
      .mode-hint-copy span {
        color: var(--text-secondary);
        font-size: 12.5px;
      }
      .mode-hint .btn {
        margin-left: auto;
      }

      /* ---------------- Planning / Gantt ---------------- */
      .planning-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }
      .planning-header h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .planning-nav {
        display: flex;
        gap: 7px;
        align-items: center;
        margin-bottom: 12px;
      }
      .planning-nav .btn {
        padding: 7px 11px;
      }
      .planning-nav .period-label {
        margin-left: 8px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        flex-wrap: wrap;
      }
      .segment {
        display: inline-flex;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        padding: 3px;
        border-radius: var(--radius-sm);
      }
      .segment button {
        border: 0;
        background: none;
        color: var(--text-secondary);
        padding: 6px 13px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
      }
      .segment button.active {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 1px 2px rgba(23, 105, 255, 0.3);
      }
      .segment button:not(.active):hover {
        color: var(--text);
      }
      .gantt-wrap {
        position: relative;
        overflow: auto;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        background: var(--surface);
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }
      .gantt {
        position: relative;
        --task-col: 210px;
        --cols: 7;
        min-width: min(1060px, calc(100vw - 240px));
      }
      @media (min-width: 1200px) {
        .gantt {
          min-width: 100%;
        }
      }
      .g-head,
      .g-row {
        display: grid;
        grid-template-columns: var(--task-col) repeat(var(--cols), minmax(94px, 1fr));
      }
      .g-head {
        position: sticky;
        top: 0;
        z-index: 6;
        background: var(--surface);
      }
      .g-head > div,
      .g-slot {
        min-height: 50px;
        border-bottom: 1px solid var(--border-light);
        border-right: 1px solid var(--border-light);
        padding: 8px;
      }
      .g-head > div {
        position: relative;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 600;
      }
      .g-head > div:first-child,
      .g-label {
        position: sticky;
        left: 0;
        z-index: 4;
        background: var(--surface);
        box-shadow: 1px 0 0 var(--border-light);
      }
      .g-head > div:first-child {
        z-index: 7;
        color: var(--text);
      }
      .g-head small {
        display: block;
        font-size: 8px;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .g-label {
        padding: 8px 12px;
      }
      .g-label b {
        display: block;
        font-size: 13px;
      }
      .g-label small {
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .g-slot {
        position: relative;
      }
      .g-row {
        min-height: 50px;
      }
      .g-row:hover > div {
        background: var(--surface-subtle);
      }
      .g-project {
        position: sticky;
        left: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 14px;
        background: var(--surface-subtle);
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
        min-width: var(--task-col);
      }
      .g-project button {
        border: 0;
        background: none;
        color: var(--text);
        font-weight: 700;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .project-health {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .project-health i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .project-health.warning i {
        background: var(--warning);
      }
      .project-health.danger i {
        background: var(--danger);
      }
      .g-bar {
        height: 26px;
        top: 16px;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 9px;
        border-radius: 5px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
      }
      /* drag & drop only from Pilotage upward */
      body[data-level="pilot"] .g-bar,
      body[data-level="pilot"] .g-bar,
      body[data-level="expert"] .g-bar {
        cursor: grab;
      }
      body[data-level="pilot"] .g-bar:active,
      body[data-level="expert"] .g-bar:active {
        cursor: grabbing;
      }
      .g-bar.dragging {
        opacity: 0.5;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
      }
      .g-bar em {
        font-size: 8px;
        font-style: normal;
        letter-spacing: 0.06em;
        opacity: 0.85;
      }
      /* À faire = planifié (bleu creux) ; En cours = bleu plein */
      .g-bar.todo {
        background: var(--accent-soft);
        color: var(--accent-ink);
        box-shadow: inset 0 0 0 1px
          color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .g-bar.danger {
        background: var(--danger);
      }
      .g-bar.warning {
        background: var(--warning);
      }
      .g-bar.success {
        background: var(--success);
      }
      .g-bar.source {
        outline: 2px solid var(--danger);
        outline-offset: 1px;
      }
      .g-bar.ghost {
        position: absolute;
        top: 16px;
        z-index: 1;
        opacity: 0.22;
        filter: grayscale(1);
        box-shadow: none;
      }
      .g-bar.simulated {
        outline: 2px solid var(--surface);
        box-shadow: 0 2px 8px rgba(23, 105, 255, 0.35);
      }
      .g-bar .bar-avatar {
        margin-left: auto;
      }
      /* Baseline = rail fantôme « prévu initialement », au-dessus de la barre actuelle.
         L'espace est réservé en permanence (barre à top:16px) : aucun saut au toggle. */
      .baseline {
        position: absolute;
        height: 9px;
        top: 3px;
        border-radius: 3px;
        background: color-mix(in srgb, var(--text-tertiary) 22%, var(--surface));
        border: 1px dashed var(--text-tertiary);
        opacity: 0.85;
        z-index: 1;
      }
      .g-slot.over {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1.5px
          color-mix(in srgb, var(--accent) 45%, transparent);
      }
      .g-slot.weekend,
      .g-head > div.weekend {
        background: var(--surface-subtle);
      }
      .today-cell,
      .today-col {
        background: color-mix(in srgb, var(--accent) 6%, var(--surface)) !important;
      }
      .g-slot.today-cell {
        border-left: 2px solid var(--accent);
      }
      .g-head > div.today-cell {
        border-left: 2px solid var(--accent);
      }
      .g-row.selected .g-label {
        box-shadow: inset 3px 0 var(--accent);
        background: var(--accent-soft);
      }
      /* SVG des dépendances : couvre TOUT le Gantt (référentiel unique = .gantt).
         Les coordonnées sont calculées dans ce même repère, sans double décalage. */
      .deps {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
        z-index: 3;
      }
      .deps path {
        fill: none;
        stroke: var(--text-tertiary);
        stroke-width: 1.6;
        opacity: 0.75;
      }
      .deps path.faint {
        opacity: 0.18;
      }
      /* Lien appartenant à la chaîne d'impact : renforcé, accent Kanvix (pas rouge) */
      .deps path.hot {
        stroke: var(--accent);
        stroke-width: 2.2;
        opacity: 0.95;
      }
      /* Dépendance non respectée temporellement : signalée distinctement */
      .deps path.conflict {
        stroke: var(--danger);
        stroke-width: 2;
        opacity: 0.95;
        stroke-dasharray: 5 3;
      }
      .deps path.dep-arrow.conflict {
        stroke-dasharray: none;
      }
      .g-row.dim .g-bar,
      .g-row.dim .g-label {
        opacity: 0.28;
      }
      .g-row.dim {
        pointer-events: auto;
      }
      .focus-flash {
        animation: focusFlash 1.8s ease;
      }
      @keyframes focusFlash {
        0%,
        50% {
          background: var(--accent-soft);
        }
        100% {
          background: transparent;
        }
      }
      /* Focus sur une tâche : la barre du planning pulse doucement (accent Kanvix) */
      .g-bar.focus-bar {
        animation: focusBar 0.72s ease-out 2;
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        z-index: 6;
      }
      .g-bar.focus-bar.focus-danger {
        outline-color: var(--danger);
        animation-name: focusBarDanger;
      }
      @keyframes focusBar {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);
        }
        100% {
          box-shadow: 0 0 0 11px color-mix(in srgb, var(--accent) 0%, transparent);
        }
      }
      @keyframes focusBarDanger {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 50%, transparent);
        }
        100% {
          box-shadow: 0 0 0 11px color-mix(in srgb, var(--danger) 0%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .g-bar.focus-bar {
          animation: none;
          outline-width: 3px;
          outline-offset: 2px;
        }
        .focus-flash {
          animation: none;
        }
      }
      .scroll-hint {
        text-align: center;
        color: var(--text-tertiary);
        font-size: 10px;
        padding: 6px;
        display: none;
      }
      .scroll-hint.show {
        display: block;
      }
      .planning-summary {
        padding: 10px 0 14px;
        color: var(--text-secondary);
        font-size: 12px;
      }
      /* Toolbar Pilotage — segment + filtres compacts + toggle */
      .plan-toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 12px 0 16px;
      }
      .plan-filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .plan-toolbar select {
        min-width: auto;
        padding: 7px 28px 7px 11px;
        font-size: 13px;
      }
      /* Toggle switch */
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-secondary);
        cursor: pointer;
        user-select: none;
      }
      .toggle input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle .track {
        width: 34px;
        height: 20px;
        flex: 0 0 34px;
        border-radius: 20px;
        background: var(--border-strong);
        position: relative;
        transition: background 0.15s;
      }
      .toggle .track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s;
      }
      .toggle input:checked + .track {
        background: var(--accent);
      }
      .toggle input:checked + .track::after {
        transform: translateX(14px);
      }
      .toggle input:focus-visible + .track {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: 2px;
      }
      .toggle input:checked ~ * {
        color: var(--text);
      }
      /* Expert — barre Analyse */
      .analysis-bar {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        margin: 10px 0 14px;
        padding: 11px 15px;
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
      }
      .analysis-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .analysis-meta {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-secondary);
      }
      /* Légende Expert */
      .plan-legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin: 10px 2px 0;
        font-size: 11px;
        color: var(--text-secondary);
      }
      .plan-legend .lg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .plan-legend .lg::before {
        content: "";
        width: 14px;
        height: 8px;
        border-radius: 3px;
        background: var(--accent);
      }
      .plan-legend .lg-base::before {
        height: 9px;
        background: color-mix(in srgb, var(--text-tertiary) 22%, var(--surface));
        border: 1px dashed var(--text-tertiary);
        opacity: 0.85;
      }
      .plan-legend .lg-sim::before {
        background: var(--accent);
        box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3px var(--accent);
      }
      .plan-legend .lg-impact::before {
        background: var(--accent);
      }
      /* Bande explicative « Chaîne d'impact » (compacte, au-dessus du Gantt) */
      .impact-band {
        margin: 4px 0 12px;
        padding: 12px 14px;
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--accent);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
      }
      .impact-band .ic-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }
      .impact-band .ic-eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .impact-band .ic-delay {
        font-size: 12px;
        font-weight: 700;
        color: var(--danger-ink);
      }
      .impact-band .ic-steps {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .ic-step {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        padding: 5px 10px 5px 6px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: 500;
      }
      .ic-step:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow-xs);
      }
      .ic-step .ic-num {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .ic-step.cause {
        border-color: var(--danger-border);
      }
      .ic-step.cause .ic-num {
        background: var(--danger);
      }
      .ic-arrow {
        color: var(--text-tertiary);
        font-size: 13px;
      }
      /* Marqueur numéroté sur la barre en mode Chaîne d'impact */
      .g-bar .ic-marker {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        color: var(--accent-ink);
        font-size: 10px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: 1px;
      }
      .g-bar.todo .ic-marker {
        background: var(--accent);
        color: #fff;
      }
      .g-bar .ic-marker.cause {
        background: var(--danger);
        color: #fff;
      }
      /* Liens de la chaîne d'impact : renforcés (accent), le rouge reste à la cause */
      .gantt.impact-mode .g-row:not(.dim) {
        z-index: 2;
      }
      /* Couleurs de tâche personnalisées (todo/doing uniquement — états métier prioritaires) */
      .g-bar.tcolor-blue {
        --tc: #1769ff;
        --tc-soft: #edf4ff;
        --tc-ink: #1456c7;
      }
      .g-bar.tcolor-indigo {
        --tc: #4f46e5;
        --tc-soft: #ecebfd;
        --tc-ink: #3730a3;
      }
      .g-bar.tcolor-violet {
        --tc: #8b5cf6;
        --tc-soft: #f3ecfe;
        --tc-ink: #6d28d9;
      }
      .g-bar.tcolor-teal {
        --tc: #0d9488;
        --tc-soft: #e2f5f2;
        --tc-ink: #0f766e;
      }
      .g-bar.tcolor-green {
        --tc: #1f9d57;
        --tc-soft: #e7f7ee;
        --tc-ink: #0f7a41;
      }
      .g-bar.tcolor-slate {
        --tc: #64748b;
        --tc-soft: #eef1f5;
        --tc-ink: #475569;
      }
      body.dark .g-bar.tcolor-blue {
        --tc: #5c9bff;
        --tc-soft: #17335a;
        --tc-ink: #cfe1ff;
      }
      body.dark .g-bar.tcolor-indigo {
        --tc: #8b83f0;
        --tc-soft: #232159;
        --tc-ink: #d5d2fb;
      }
      body.dark .g-bar.tcolor-violet {
        --tc: #a985f7;
        --tc-soft: #2c1d52;
        --tc-ink: #e6d8fd;
      }
      body.dark .g-bar.tcolor-teal {
        --tc: #3bb5a6;
        --tc-soft: #103a35;
        --tc-ink: #b9eee5;
      }
      body.dark .g-bar.tcolor-green {
        --tc: #46c17d;
        --tc-soft: #123821;
        --tc-ink: #bdefd0;
      }
      body.dark .g-bar.tcolor-slate {
        --tc: #93a3b6;
        --tc-soft: #26333f;
        --tc-ink: #d5dde6;
      }
      /* doing = plein ; todo = creux (même langage que le bleu) */
      .g-bar.has-color {
        background: var(--tc);
        color: #fff;
        box-shadow: none;
      }
      .g-bar.has-color.todo {
        background: var(--tc-soft);
        color: var(--tc-ink);
        box-shadow: inset 0 0 0 1px
          color-mix(in srgb, var(--tc) 35%, transparent);
      }
      /* Empty state */
      .plan-empty {
        text-align: center;
        padding: 48px 20px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-subtle);
      }
      .plan-empty b {
        font-size: 15px;
      }
      .plan-empty p {
        margin: 6px 0 14px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .plan-empty .actions {
        justify-content: center;
      }
      /* ---------------- Kanban (représentation par statut) ---------------- */
      .plan-view-switch {
        margin: 4px 0 12px;
      }
      .view-segment {
        display: inline-flex;
      }
      .kanban {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        align-items: start;
      }
      .kanban-col {
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        min-height: 120px;
        display: flex;
        flex-direction: column;
      }
      .kanban-col.drop {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .kanban-col-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 14px;
        font-size: 13px;
        font-weight: 700;
        border-bottom: 1px solid var(--border-light);
      }
      .kanban-col-head em {
        font-style: normal;
        font-weight: 700;
        font-size: 12px;
        min-width: 22px;
        height: 20px;
        padding: 0 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--surface);
        color: var(--text-secondary);
        border: 1px solid var(--border-light);
      }
      .kanban-col-head.kb-todo {
        color: var(--text-secondary);
      }
      .kanban-col-head.kb-doing {
        color: var(--accent-ink, var(--accent));
      }
      .kanban-col-head.kb-done {
        color: var(--success-ink, var(--success));
      }
      .kanban-col-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        flex: 1;
      }
      .kanban-empty {
        color: var(--text-tertiary);
        font-size: 12px;
        text-align: center;
        padding: 10px 0;
        margin: 0;
      }
      .kanban-card {
        display: grid;
        gap: 3px;
        padding: 11px 12px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--border-strong);
        background: var(--surface);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
        transition: box-shadow 0.14s, border-color 0.14s, transform 0.1s;
      }
      .kanban:not(.readonly) .kanban-card {
        cursor: grab;
      }
      .kanban-card:hover {
        box-shadow: var(--shadow-hover);
      }
      .kanban-card.dragging {
        opacity: 0.5;
      }
      .kanban-card b {
        font-size: 13.5px;
        line-height: 1.3;
      }
      .kanban-card small {
        font-size: 11.5px;
        color: var(--text-secondary);
      }
      .kanban-card .kb-meta {
        color: var(--text-tertiary);
      }
      .kanban-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 4px;
      }
      .kanban-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 2px 7px;
        border-radius: 999px;
      }
      .kanban-badge.rework {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent-ink, var(--accent));
      }
      .kanban-badge.attention {
        background: color-mix(in srgb, var(--warning) 20%, transparent);
        color: var(--warning-ink, var(--warning));
      }
      /* Dépendances compactes dans la carte Kanban (lecture seule) */
      .kanban-deps {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px dashed var(--border-light);
        display: grid;
        gap: 2px;
      }
      .kb-dep-row {
        font-size: 11px;
        line-height: 1.4;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: baseline;
      }
      .kb-dep-label {
        color: var(--text-tertiary);
        font-weight: 600;
        flex: none;
      }
      .kb-dep-names {
        color: var(--text-secondary);
      }
      .kb-dep-link {
        border: 0;
        background: none;
        padding: 0;
        margin: 0;
        font: inherit;
        font-size: 11px;
        color: var(--accent);
        cursor: pointer;
      }
      .kb-dep-link:hover {
        text-decoration: underline;
      }
      .g-chevron {
        display: inline-block;
        width: 12px;
        color: var(--text-tertiary);
      }
      /* Simulation banner + effect */
      .sim-banner {
        position: sticky;
        top: 10px;
        z-index: 9;
        margin: 0 auto 18px;
        max-width: 780px;
        background: var(--surface);
        border: 1px solid var(--warning-border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow);
        padding: 12px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .sim-banner b {
        font-size: 14px;
      }
      .sim-banner small {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .effect-summary {
        margin: 14px 0;
        padding: 16px;
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
      }
      .effect {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
        margin: 10px 0 0;
      }
      .effect div {
        padding: 12px 14px;
        border-right: 1px solid var(--border-light);
      }
      .effect div:last-child {
        border-right: 0;
      }
      .effect small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
        margin-bottom: 3px;
      }
      .what-if {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .form-error {
        min-height: 18px;
        color: var(--danger);
        margin: 0;
        font-size: 12px;
      }
      /* Mobile agenda (planning fallback) */
      .mobile-agenda {
        display: none;
      }

      /* ---------------- Documents ---------------- */
      /* ---------------- Bibliothèque : contrôles (recherche + filtres) ------- */
      .lib-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .search-field {
        position: relative;
        flex: 1;
        min-width: 200px;
        display: flex;
        align-items: center;
      }
      .search-field svg {
        position: absolute;
        left: 12px;
        width: 16px;
        height: 16px;
        stroke: var(--text-tertiary);
        fill: none;
        stroke-width: 1.8;
        pointer-events: none;
      }
      .search-field input {
        width: 100%;
        padding-left: 36px;
        border-color: var(--border);
        background: var(--surface);
      }
      .scope-select {
        border-color: var(--border);
        min-width: 180px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }
      .chip {
        padding: 7px 13px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text-secondary);
        font-size: 12.5px;
        font-weight: 600;
        transition: background 0.14s, color 0.14s, border-color 0.14s;
      }
      .chip:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }
      .chip.active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      /* ---------------- Vignettes unifiées (Documents) ---------------- */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 16px;
      }
      .card {
        display: flex;
        flex-direction: column;
        text-align: left;
        width: 100%;
        padding: 0;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        overflow: hidden;
        cursor: pointer;
        transition: box-shadow 0.16s, border-color 0.16s;
      }
      .card:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .doc-thumb {
        height: 128px;
        background: var(--surface-muted);
        display: block;
      }
      .doc-thumb svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .card-body {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 13px 14px 14px;
      }
      .card-eyebrow {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.3;
      }
      .card-meta {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 7px;
      }
      .card-date {
        font-size: 11px;
        color: var(--text-tertiary);
      }
      .tag-flag {
        font-size: 10px;
        font-weight: 700;
        color: var(--danger-ink);
        white-space: nowrap;
      }

      /* ---------------- Photos ---------------- */
      .photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
        gap: 16px;
      }
      .photo {
        display: block;
        width: 100%;
        text-align: left;
        height: 190px;
        border-radius: var(--radius-lg);
        position: relative;
        overflow: hidden;
        cursor: pointer;
        background: var(--surface-muted);
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-xs);
        transition: box-shadow 0.16s, border-color 0.16s;
      }
      .photo:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .photo svg,
      .photo .photo-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photo-flag {
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 10px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        color: #fff;
        background: var(--danger);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .photo-info {
        position: absolute;
        z-index: 2;
        inset: auto 0 0;
        padding: 30px 13px 11px;
        color: #fff;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.76));
      }
      .photo-info b {
        display: block;
        font-size: 13px;
      }
      .photo-info small {
        display: block;
        margin-top: 2px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.82);
      }
      /* ---------------- Popups Document / Photo ---------------- */
      .doc-hero {
        height: 240px;
        border-radius: var(--radius-md);
        overflow: hidden;
        margin-bottom: 16px;
        background: var(--surface-muted);
      }
      .doc-hero svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .photo-hero {
        position: relative;
        height: 56vh;
        border-radius: var(--radius-md);
        overflow: hidden;
        margin-bottom: 16px;
        background: var(--surface-muted);
      }
      .photo-hero svg,
      .photo-hero .photo-hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* Capture photo (formulaire photo / reprise / message) */
      .photo-capture {
        display: grid;
        gap: 8px;
      }
      .photo-capture-btn {
        justify-content: center;
        gap: 8px;
      }
      .photo-capture-preview {
        display: none;
      }
      .photo-capture-preview.has-photo {
        display: block;
        position: relative;
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--border-light);
        background: var(--surface-muted);
      }
      .photo-capture-preview .photo-img {
        display: block;
        width: 100%;
        max-height: 240px;
        object-fit: cover;
      }
      .photo-draft-remove {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 0;
        background: rgba(15, 23, 42, 0.72);
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }
      .pop-eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .pop-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin: 6px 0 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .pop-meta span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .pop-meta svg {
        width: 15px;
        height: 15px;
        stroke: var(--text-tertiary);
        fill: none;
        stroke-width: 1.7;
      }
      .pop-linked {
        margin-top: 16px;
        padding: 13px 15px;
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--accent);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
      }
      .pop-linked small {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-tertiary);
      }
      .pop-linked b {
        display: block;
        margin-top: 3px;
        font-size: 14px;
      }
      .pop-flag {
        display: inline-flex;
        align-items: center;
        margin-top: 10px;
        padding: 6px 11px;
        border: 1px solid var(--danger-border);
        border-radius: 999px;
        background: var(--danger-soft);
        color: var(--danger-ink);
        font-size: 12px;
        font-weight: 600;
      }
      .pop-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 20px;
      }
      /* ---------------- Formulaire en sidewindow ---------------- */
      .drawer-form {
        display: grid;
        gap: 14px;
        margin-top: 6px;
      }
      .drawer-form label {
        display: grid;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .drawer-form input,
      .drawer-form select,
      .drawer-form textarea {
        font-weight: 400;
        color: var(--text);
      }
      .drawer-form textarea {
        resize: vertical;
      }
      .drawer-form-actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .drawer-form-actions .btn {
        flex: 1;
        justify-content: center;
      }
      /* Sélecteur de couleur de tâche (palette maîtrisée) */
      .color-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .color-field-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .swatches {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
        box-shadow: inset 0 0 0 1px var(--border);
        transition: transform 0.1s;
      }
      .swatch:hover {
        transform: scale(1.08);
      }
      .swatch.selected {
        border-color: var(--text);
        box-shadow: inset 0 0 0 1px var(--surface);
      }
      .swatch-auto {
        background: var(--surface-muted);
      }
      .swatch-blue {
        background: #1769ff;
      }
      .swatch-indigo {
        background: #4f46e5;
      }
      .swatch-violet {
        background: #8b5cf6;
      }
      .swatch-teal {
        background: #0d9488;
      }
      .swatch-green {
        background: #1f9d57;
      }
      .swatch-slate {
        background: #64748b;
      }

      /* ---------------- Drawer / Modal ---------------- */
      .drawer,
      .modal {
        position: fixed;
        inset: 0;
        z-index: 30;
        overflow: hidden;
        background: rgba(9, 17, 29, 0);
        pointer-events: none;
        transition: background 0.2s;
      }
      .drawer.open,
      .modal.open {
        background: rgba(9, 17, 29, 0.42);
        pointer-events: auto;
      }
      .drawer-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: min(432px, 92vw);
        height: 100%;
        overflow: auto;
        background: var(--surface);
        padding: 26px 28px;
        transform: translateX(100%);
        transition: transform 0.22s ease;
        box-shadow: -14px 0 40px rgba(9, 17, 29, 0.16);
      }
      .drawer.open .drawer-panel {
        transform: none;
      }
      .drawer-panel h2 {
        font-size: 20px;
        margin: 6px 0;
      }
      .drawer-section {
        padding: 18px 0;
        border-top: 1px solid var(--border-light);
      }
      .drawer-section h3 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      /* Section Dépendances de la fiche Tâche */
      .dep-rel {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .dep-line {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dep-line .dep-dir {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--surface-muted);
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .dep-line .dep-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .dep-line .dep-task {
        text-align: left;
        font-size: 14px;
        font-weight: 500;
        padding: 0;
      }
      .dep-line .dep-body small {
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .dep-line .dep-focus {
        flex: 0 0 auto;
        font-size: 12px;
        padding: 0;
      }
      .dep-mini {
        font-size: 12px;
        color: var(--text-tertiary);
        margin: 2px 0 8px;
      }
      .task-activity {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .ta-row {
        display: grid;
        grid-template-columns: 14px 1fr;
        gap: 10px;
        position: relative;
        padding: 4px 0;
      }
      .ta-row:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 16px;
        bottom: -4px;
        width: 2px;
        background: var(--border);
      }
      .ta-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        margin-top: 6px;
        margin-left: 3px;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .ta-body b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.35;
      }
      .ta-body small {
        display: block;
        margin-top: 1px;
        font-size: 11.5px;
        color: var(--text-tertiary);
      }
      .ta-changes {
        margin: 4px 0 2px;
        padding-left: 0;
        list-style: none;
        display: grid;
        gap: 2px;
      }
      .ta-changes li {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .ta-changes li span {
        font-weight: 600;
        color: var(--text);
      }
      .ta-comment {
        margin: 4px 0 2px;
        font-size: 12.5px;
        color: var(--text-secondary);
        font-style: italic;
      }
      .reflow-list {
        margin: 8px 0;
        padding-left: 18px;
        display: grid;
        gap: 3px;
      }
      .reflow-list li {
        font-size: 13px;
      }
      .reflow-shift {
        color: var(--text-secondary);
        font-size: 12.5px;
      }
      /* Reprise / SAV */
      .rework-context {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        margin-bottom: 4px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
      }
      .rework-context > div {
        display: grid;
        gap: 1px;
      }
      .rework-context span {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        font-weight: 700;
      }
      .rework-context b {
        font-size: 14px;
      }
      .rework-plan summary {
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
        padding: 4px 0;
      }
      .rework-plan-body {
        display: grid;
        gap: 12px;
        padding-top: 8px;
      }
      .rework-impact-warn {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        color: var(--danger-ink, var(--danger));
        margin: 0 0 8px;
      }
      .rework-impact-warn svg {
        width: 18px;
        height: 18px;
        flex: none;
        stroke: var(--danger);
        fill: none;
        stroke-width: 1.8;
      }
      .modal-box {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -47%) scale(0.97);
        opacity: 0;
        width: min(560px, 92vw);
        max-height: 88vh;
        overflow: auto;
        background: var(--surface);
        padding: 26px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-strong);
        transition: opacity 0.18s, transform 0.18s;
      }
      .modal.open .modal-box {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      .modal.full .modal-box {
        width: min(1040px, 96vw);
      }
      .modal-box h2 {
        font-size: 20px;
        margin: 4px 0 12px;
      }
      .close {
        float: right;
        border: 1px solid var(--border-light);
        background: var(--surface-subtle);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        color: var(--text-secondary);
        font-size: 17px;
        line-height: 1;
      }
      .close:hover {
        background: var(--surface-muted);
      }
      /* Menu contextuel « ••• » — petit popover flottant ancré sous le bouton,
         jamais un second tiroir : reste toujours contenu dans le sidewindow. */
      .more-menu {
        position: relative;
        display: inline-flex;
      }
      /* La barre d'actions Tâche pousse le ••• au bord droit : le popover
         (right:0) reste ainsi toujours contenu dans le sidewindow. */
      .task-actions .more-menu {
        margin-left: auto;
      }
      .more-trigger[aria-expanded="true"] {
        background: var(--surface-muted);
        border-color: var(--border-strong);
      }
      .more-pop {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        left: auto;
        width: min(220px, calc(100vw - 32px));
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-strong);
        display: none;
        z-index: 40;
      }
      .more-pop.open {
        display: block;
        animation: morePop 0.14s ease;
      }
      @keyframes morePop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      .more-pop button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 9px 11px;
        border-radius: 6px;
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .more-pop button:hover {
        background: var(--surface-subtle);
      }
      .more-sep {
        height: 1px;
        margin: 5px 6px;
        background: var(--border-light);
      }
      .more-pop button.danger {
        color: var(--danger);
      }
      .more-pop button.danger:hover {
        background: var(--danger-soft);
      }
      /* Messages (drawer conversation) */
      .message {
        max-width: 82%;
        margin: 9px auto 0 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
        font-size: 13px;
      }
      .message.artisan {
        margin-left: auto;
        margin-right: 0;
        background: var(--accent-soft);
        border-color: var(--accent-soft);
      }
      .message small {
        display: block;
        margin-top: 3px;
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .decision-steps section {
        padding: 13px 0;
        border-top: 1px solid var(--border-light);
      }
      .decision-steps h3 {
        margin: 0 0 4px;
      }

      /* ---------------- Toast ---------------- */
      .toast {
        position: fixed;
        left: 22px;
        bottom: 22px;
        background: #101828;
        color: #fff;
        padding: 11px 15px;
        border-radius: var(--radius-sm);
        z-index: 60;
        opacity: 0;
        transform: translateY(8px);
        transition: 0.18s;
        box-shadow: var(--shadow-strong);
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      .toast button {
        border: 0;
        background: none;
        color: #9ec5ff;
        font-weight: 700;
      }

      /* ---------------- Command palette ---------------- */
      .cmd {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(9, 17, 29, 0.5);
        display: none;
        justify-content: center;
        align-items: flex-start;
        padding-top: 12vh;
      }
      .cmd.open {
        display: flex;
      }
      .cmd-box {
        width: min(600px, 92vw);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-strong);
        overflow: hidden;
      }
      .cmd-box input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        padding: 18px 20px;
        font-size: 16px;
      }
      .cmd-results {
        padding: 8px;
        max-height: 420px;
        overflow: auto;
      }
      .cmd-label {
        padding: 9px 11px 5px;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .cmd-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 11px;
        border-radius: 7px;
        cursor: pointer;
      }
      .cmd-item:hover,
      .cmd-item.selected {
        background: var(--surface-subtle);
      }
      .cmd-item small {
        color: var(--text-secondary);
      }

      /* ---------------- Floating add ---------------- */
      .add {
        display: none; /* desktop: contextual actions in headers, no floating + */
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 10;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        box-shadow: 0 6px 18px rgba(23, 105, 255, 0.35);
        font-size: 22px;
        line-height: 1;
      }
      .add:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      /* ---------------- Assistant side panel (kept darker) ---------------- */
      .ai-overlay {
        position: fixed;
        inset: 0;
        z-index: 90;
        overflow: hidden;
        background: rgba(3, 12, 20, 0);
        pointer-events: none;
        transition: background 0.18s ease;
      }
      .ai-overlay.open {
        background: rgba(3, 12, 20, 0.32);
        pointer-events: auto;
      }
      .ai-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: min(460px, 100vw);
        height: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        background: var(--surface);
        color: var(--text);
        border-left: 1px solid var(--border);
        box-shadow: -18px 0 48px rgba(15, 23, 42, 0.18);
        transform: translateX(100%);
        transition: transform 0.24s ease;
      }
      body.dark .ai-panel {
        box-shadow: -18px 0 48px rgba(2, 9, 18, 0.5);
      }
      .ai-overlay.open .ai-panel {
        transform: none;
      }
      .ai-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 22px;
        border-bottom: 1px solid var(--border-light);
      }
      .ai-header small {
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .ai-header h2 {
        margin: 3px 0 0;
        font-size: 19px;
        color: var(--text);
      }
      .ai-header button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface-subtle);
        color: var(--text-secondary);
        font-size: 19px;
        line-height: 1;
      }
      .ai-header button:hover {
        background: var(--surface-muted);
        border-color: var(--border-strong);
        color: var(--text);
      }
      .ai-context {
        padding: 14px 22px;
        background: var(--surface-subtle);
        border-bottom: 1px solid var(--border-light);
        color: var(--text-secondary);
        font-size: 12px;
      }
      .ai-context small {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--text-tertiary);
      }
      .ai-context b {
        display: block;
        color: var(--text);
        font-size: 14px;
        margin: 4px 0 2px;
      }
      .ai-body {
        overflow: auto;
        padding: 20px 22px;
      }
      /* KANVIX · RÉSOUDRE — panneau de décision (pas de composeur) */
      .ai-panel.resolve-mode {
        grid-template-rows: auto auto 1fr;
      }
      .ai-panel.resolve-mode .ai-compose {
        display: none;
      }
      .rv-block {
        padding: 14px 0;
        border-bottom: 1px solid var(--border-light);
      }
      .rv-block:first-child {
        padding-top: 2px;
      }
      .rv-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin: 0 0 8px;
      }
      .rv-lead {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 3px;
      }
      .rv-text {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0;
      }
      .rv-impact {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .rv-impact b {
        color: var(--text);
      }
      .rv-impact .rv-dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        margin-top: 5px;
      }
      .rv-solutions {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-top: 16px;
      }
      .rv-scenario {
        padding: 15px;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface);
      }
      .rv-scenario.recommended {
        border-color: color-mix(in srgb, var(--accent) 45%, transparent);
        background: var(--accent-soft);
      }
      .rv-scenario-head {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }
      .rv-scenario-head h3 {
        font-size: 16px;
        margin: 0;
      }
      .rv-tag {
        align-self: flex-start;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 20px;
      }
      .rv-tag.reco {
        background: var(--accent);
        color: #fff;
      }
      .rv-tag.alt {
        background: var(--surface-muted);
        color: var(--text-secondary);
      }
      .rv-why {
        margin: 0 0 12px;
        padding: 10px 12px;
        background: color-mix(in srgb, var(--surface) 70%, transparent);
        border-radius: var(--radius-sm);
      }
      body:not(.dark) .rv-scenario.recommended .rv-why {
        background: rgba(255, 255, 255, 0.6);
      }
      .rv-why small {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
        margin-bottom: 5px;
      }
      .rv-why ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .rv-why li {
        font-size: 13px;
        color: var(--text);
        padding-left: 18px;
        position: relative;
      }
      .rv-why li::before {
        content: "✓";
        position: absolute;
        left: 0;
        color: var(--success);
        font-weight: 700;
      }
      .rv-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
        margin: 0 0 12px;
      }
      .rv-metrics > div {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .rv-metrics dt {
        font-size: 11px;
        color: var(--text-tertiary);
      }
      .rv-metrics dd {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
      }
      .rv-jalon.ok {
        color: var(--success-ink);
      }
      .rv-jalon.warn {
        color: var(--warning-ink);
      }
      .rv-details {
        margin: 0 0 12px;
        font-size: 12px;
      }
      .rv-details summary {
        cursor: pointer;
        color: var(--accent);
        font-weight: 600;
      }
      .rv-changes {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }
      .rv-change {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12.5px;
      }
      .rv-change b {
        font-weight: 500;
      }
      .rv-change span {
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .rv-scenario .ai-btn {
        width: 100%;
      }
      .rv-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
      }
      .ai-welcome {
        color: var(--text-secondary);
      }
      .ai-welcome h3 {
        color: var(--text);
        margin: 0 0 6px;
      }
      .ai-suggestions {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }
      .ai-suggestions button {
        padding: 11px 13px;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-subtle);
        color: var(--text);
        font-size: 13px;
      }
      .ai-suggestions button:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .ai-message {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 10px;
        margin: 0 0 16px;
        animation: aiIn 0.18s ease;
      }
      .ai-message.user {
        grid-template-columns: 1fr 26px;
      }
      .ai-message.user .ai-bubble {
        grid-column: 1;
      }
      .ai-message.user .ai-mark {
        grid-column: 2;
        grid-row: 1;
      }
      .ai-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      .ai-message.user .ai-mark {
        background: var(--surface-muted);
        color: var(--text-secondary);
      }
      .ai-bubble {
        padding: 11px 13px;
        border-radius: 12px;
        background: var(--surface-subtle);
        color: var(--text);
        font-size: 13px;
      }
      .ai-message.user .ai-bubble {
        background: var(--accent-soft);
        color: var(--text);
      }
      .ai-bubble p {
        margin: 0 0 8px;
      }
      .ai-bubble p:last-child {
        margin: 0;
      }
      .ai-actions {
