<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:" />
    <title>Kanvix — Piloter simplement</title>
    <style id="kanvix-css">
      /* ============================================================
         KANVIX — Design System (POC nouvelle génération)
         Fond métier BLANC · sidebar teintée · cartes blanches
         bordures fines · ombres légères · bleu Kanvix parcimonieux
         ============================================================ */
      :root {
        /* Surfaces */
        --app-bg: #ffffff;
        --surface: #ffffff;
        --surface-subtle: #f7f9fc;
        --surface-muted: #f1f4f8;
        /* Sidebar */
        --sidebar-bg: #f5f7fa;
        --sidebar-border: #e3e8ef;
        --sidebar-text: #475467;
        --sidebar-muted: #8593a5;
        --sidebar-hover: #eaeef4;
        --sidebar-active-bg: #eaf1ff;
        --sidebar-active-text: #1456c7;
        --sidebar-brand: #101828;
        /* Text */
        --text: #111827;
        --text-secondary: #596579;
        --text-tertiary: #7b8798;
        /* Borders */
        --border-light: #e8ecf2;
        --border: #dce2ea;
        --border-strong: #c9d2dd;
        /* Accent */
        --accent: #1769ff;
        --accent-hover: #0d5bea;
        --accent-soft: #edf4ff;
        --accent-ink: #1456c7;
        /* Status */
        --success: #19a45b;
        --success-soft: #edf9f2;
        --warning: #d97b1f;
        --warning-soft: #fff5e9;
        --danger: #e5484d;
        --danger-soft: #fff0f1;
        /* Shadows */
        --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04),
          0 2px 6px rgba(15, 23, 42, 0.04);
        --shadow-card: 0 4px 16px rgba(15, 23, 42, 0.06);
        --shadow-hover: 0 8px 24px rgba(15, 23, 42, 0.1);
        --shadow-pop: 0 12px 40px rgba(15, 23, 42, 0.14);
        /* Radius */
        --radius-xs: 6px;
        --radius-sm: 8px;
        --radius-md: 11px;
        --radius-lg: 14px;
        /* Legacy aliases (compat with carried-over rules / inline styles) */
        --canvas: var(--surface-muted);
        --line: var(--border-light);
        --surface-elevated: var(--surface);
        --shadow-sm: var(--shadow-card);
        --shadow-md: var(--shadow-pop);
        --success-border: #a7dcbf;
        --warning-border: #efc38a;
        --danger-border: #f4b9bb;
        --success-ink: #0f7a41;
        --warning-ink: #a45b12;
        --danger-ink: #c13b40;
      }
      body.dark {
        --app-bg: #0b1622;
        --surface: #10202f;
        --surface-subtle: #14283a;
        --surface-muted: #172d40;
        --sidebar-bg: #0c1a28;
        --sidebar-border: #1e3346;
        --sidebar-text: #a9bccf;
        --sidebar-muted: #6f8398;
        --sidebar-hover: #142a3d;
        --sidebar-active-bg: #14345a;
        --sidebar-active-text: #cfe1ff;
        --sidebar-brand: #f4f8fc;
        --text: #eef4f9;
        --text-secondary: #a3b3c4;
        --text-tertiary: #75899c;
        --border-light: #1d3244;
        --border: #26405a; /* Layout */
        --border-strong: #33526f;
        --accent: #5c9bff;
        --accent-hover: #78adff;
        --accent-soft: #17335a;
        --accent-ink: #cfe1ff;
        --success: #46c17d;
        --success-soft: #12321f;
        --warning: #e8a24d;
        --warning-soft: #35270f;
        --danger: #f2686d;
        --danger-soft: #391c1f;
        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-card: 0 6px 22px rgba(0, 0, 0, 0.4);
        --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.5);
        --shadow-pop: 0 18px 50px rgba(0, 0, 0, 0.55);
        --success-border: #1e5236;
        --warning-border: #5a441f;
        --danger-border: #5c2f32;
      }

      /* ---------------- Base ---------------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--app-bg);
        color: var(--text);
        font: 400 14px/1.5 Inter, ui-sans-serif, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button:not(.native-control) {
        -webkit-appearance: none;
        appearance: none;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      input,
      select,
      textarea {
        color-scheme: light;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 9px 11px;
        outline: 0;
      }
      body.dark input,
      body.dark select,
      body.dark textarea {
        color-scheme: dark;
      }
      select option {
        background: var(--surface);
        color: var(--text);
      }
      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      h1,
      h2,
      h3 {
        color: var(--text);
      }

      /* ---------------- Shell / Sidebar ---------------- */
      .shell {
        display: grid;
        grid-template-columns: 178px minmax(0, 1fr);
        min-height: 100vh;
        background: var(--app-bg);
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        border-right: 1px solid var(--sidebar-border);
        padding: 22px 14px 16px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 2px 8px 22px;
        color: var(--sidebar-brand);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .brand svg {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        display: block;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav button {
        width: 100%;
        border: 0;
        background: none;
        color: var(--sidebar-text);
        min-height: 38px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        font-size: 13.5px;
        font-weight: 500;
        transition: background 0.14s, color 0.14s;
      }
      .nav button:hover {
        background: var(--sidebar-hover);
        color: var(--sidebar-brand);
      }
      .nav button.active {
        background: var(--sidebar-active-bg);
        color: var(--sidebar-active-text);
        font-weight: 600;
      }
      .nav svg {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav button.active svg {
        stroke: var(--accent);
      }
      .nav .assistant-entry {
        position: relative;
        margin-top: 18px;
        color: var(--sidebar-text);
      }
      .nav .assistant-entry svg {
        stroke: var(--accent);
      }
      .nav .assistant-entry:before {
        content: "";
        position: absolute;
        top: -10px;
        left: 10px;
        right: 10px;
        height: 1px;
        background: var(--sidebar-border);
      }
      .nav .assistant-entry.ai-nav-active {
        background: var(--sidebar-active-bg) !important;
        color: var(--sidebar-active-text) !important;
      }
      .nav .assistant-entry.ai-nav-active:after {
        content: "";
        width: 6px;
        height: 6px;
        margin-left: auto;
        border-radius: 50%;
        background: var(--accent);
      }
      /* Profile */
      .profile {
        margin-top: auto;
        border-top: 1px solid var(--sidebar-border);
        padding: 12px 2px 0;
        position: relative;
      }
      .profile-trigger {
        width: 100%;
        min-height: 50px;
        padding: 6px 6px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: transparent;
        color: var(--sidebar-brand);
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
      }
      .profile-trigger:hover,
      .profile-trigger[aria-expanded="true"] {
        background: var(--sidebar-hover);
      }
      .profile-copy {
        min-width: 0;
        line-height: 1.3;
      }
      .profile-copy b {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
      }
      .profile-copy small {
        display: block;
        color: var(--sidebar-muted);
        font-size: 11px;
      }
      .profile-level {
        display: inline-block;
        margin-top: 3px;
        color: var(--accent-ink);
        font-size: 10.5px;
        font-weight: 600;
      }
      .avatar {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 50%;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-weight: 700;
        font-size: 12px;
      }
      .avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* User popover */
      .user-popover {
        display: none;
        position: absolute;
        left: 0;
        bottom: 64px;
        width: 244px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow-pop);
        z-index: 80;
      }
      .user-popover.open {
        display: block;
      }
      .user-popover-head {
        padding: 4px 6px 10px;
      }
      .user-popover-head b {
        display: block;
        font-size: 13px;
      }
      .user-popover-head small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
      }
      .user-popover-section {
        padding: 9px 0;
        border-top: 1px solid var(--border-light);
      }
      .user-popover-label {
        display: block;
        padding: 0 6px 6px;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .user-popover button {
        width: 100%;
        padding: 8px 8px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--text);
        text-align: left;
        font-size: 13px;
      }
      .user-popover button:hover {
        background: var(--surface-subtle);
      }
      .user-popover button.selected {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .user-popover button small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 400;
      }
      .appearance-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
      }
      .appearance-options button {
        text-align: center;
        font-size: 11.5px;
        border: 1px solid var(--border);
      }
      .user-action {
        color: var(--text-secondary) !important;
      }
      .user-action.danger {
        color: var(--danger) !important;
      }

      /* ---------------- Main / header ---------------- */
      .main {
        background: var(--app-bg);
        padding: 34px 40px 60px;
        max-width: 1320px;
        width: 100%;
        margin: 0 auto;
        min-width: 0;
      }
      .page {
        display: none;
        animation: fade 0.18s ease;
      }
      .page.active {
        display: block;
      }
      @keyframes fade {
        from {
          opacity: 0.4;
          transform: translateY(3px);
        }
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 24px;
      }
      .header h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .muted {
        color: var(--text-secondary);
      }
      .context {
        font-size: 12px;
        color: var(--text-secondary);
        text-align: right;
      }
      .context b {
        display: block;
        color: var(--text);
      }
      /* Dots */
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        margin-right: 8px;
        flex: 0 0 8px;
      }
      .dot.warning {
        background: var(--warning);
      }
      .dot.danger {
        background: var(--danger);
      }
      .dot.accent {
        background: var(--accent);
      }

      /* ---------------- Buttons ---------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        padding: 8px 13px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
        transition: background 0.14s, border-color 0.14s, transform 0.05s;
      }
      .btn svg {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn:hover {
        background: var(--surface-subtle);
        border-color: var(--text-tertiary);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        box-shadow: 0 1px 2px rgba(23, 105, 255, 0.35);
      }
      .btn.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .link {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 0;
        font-weight: 600;
        font-size: 13px;
      }
      .link:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }
      .divider {
        border-top: 1px solid var(--border-light);
      }

      /* ---------------- Rows ---------------- */
      .row {
        display: grid;
        grid-template-columns: 12px 1fr auto;
        gap: 12px;
        padding: 14px 2px;
        border-top: 1px solid var(--border-light);
        align-items: start;
        cursor: pointer;
      }
      .row:first-child {
        border-top: 0;
      }
      .row:hover {
        background: var(--surface-subtle);
      }
      .row h3 {
        font-size: 14px;
        margin: 0 0 3px;
      }
      .row p {
        margin: 2px 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .row .avatar {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
      }

      /* ---------------- Pills ---------------- */
      .pill {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 20px;
        background: var(--surface-muted);
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .pill.danger {
        background: var(--danger-soft);
        color: var(--danger-ink);
      }
      .pill.warning {
        background: var(--warning-soft);
        color: var(--warning-ink);
      }
      .pill.success {
        background: var(--success-soft);
        color: var(--success-ink);
      }
      .pill.accent {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      body.dark .pill.danger,
      body.dark .pill.warning,
      body.dark .pill.success,
      body.dark .pill.accent {
        color: #fff;
      }

      /* ---------------- Sections / generic ---------------- */
      .section {
        margin-top: 24px;
      }
      .section-title {
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        font-weight: 700;
        margin: 0 0 10px;
      }
      .empty {
        padding: 16px 0;
        color: var(--text-secondary);
      }
      .empty b {
        display: block;
        color: var(--text);
        font-size: 15px;
        margin-bottom: 2px;
      }
      .attention-layout {
        display: grid;
        grid-template-columns: 1.25fr 0.75fr;
        gap: 40px;
        align-items: start;
      }
      .decision {
        padding: 20px;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-lg);
        background: var(--danger-soft);
      }
      .decision h2 {
        font-size: 19px;
        margin: 6px 0;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .eyebrow.danger {
        color: var(--danger-ink);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* ---------------- Today / workflow ---------------- */
      .today-hero {
        padding: 0 0 24px;
      }
      .today-hero h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .today-hero p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
      }
      /* Two prominent zones (À décider + Aujourd'hui), À surveiller light below */
      .today-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
        grid-template-areas: "decide today" "watch watch";
        gap: 24px 24px;
        align-items: start;
      }
      .zone-decide {
        grid-area: decide;
      }
      .zone-today {
        grid-area: today;
      }
      .zone-watch {
        grid-area: watch;
        margin-top: 2px;
      }
      .zone-head {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 12px;
        padding: 0 0 10px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        border-bottom: 1px solid var(--border-light);
      }
      .zone-head .zdot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .zone-head.decide .zdot {
        background: var(--danger);
      }
      .zone-head.today .zdot {
        background: var(--accent);
      }
      .zone-head.watch .zdot {
        background: var(--warning);
      }
      .zone-head em {
        margin-left: auto;
        font-style: normal;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-tertiary);
      }
      .zone-head.decide em {
        color: var(--danger-ink);
      }
      .zone-head.today em {
        color: var(--accent-ink);
      }
      .zone-head.watch em {
        color: var(--warning-ink);
      }
      /* décider + aujourd'hui = surfaces présentes */
      .zone-decide .zone-body,
      .zone-today .zone-body {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        padding: 2px 18px;
      }
      /* décider = l'élément le plus fort : fine barre rouge à gauche */
      .zone-decide .zone-body {
        border-left: 3px solid var(--danger);
      }
      /* à surveiller = beaucoup plus léger, pas de carte */
      .zone-watch .zone-body {
        padding: 0;
      }
      .zone-empty {
        display: grid;
        gap: 2px;
        padding: 14px 2px;
        color: var(--success);
        font-size: 13px;
        font-weight: 600;
      }
      .zone-empty b {
        color: var(--text);
        font-size: 14px;
      }
      .zone-empty span {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 400;
      }
      .today-calm {
        max-width: 760px;
      }
      .calm-note {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: var(--success);
        font-size: 13px;
        font-weight: 600;
      }
      /* Halo d'accueil sur la première décision (premium, discret, 2 cycles) */
      .decision-card.halo {
        border-radius: var(--radius-md);
        animation: cardHalo 0.9s ease-out 2;
      }
      @keyframes cardHalo {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 42%, transparent);
          background: color-mix(in srgb, var(--accent) 5%, transparent);
        }
        60% {
          box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
          background: transparent;
        }
      }
      .decision-card.halo.halo-critical {
        animation-name: cardHaloCritical;
      }
      @keyframes cardHaloCritical {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 38%, transparent);
          background: color-mix(in srgb, var(--danger) 5%, transparent);
        }
        60% {
          box-shadow: 0 0 0 7px color-mix(in srgb, var(--danger) 0%, transparent);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .decision-card.halo {
          animation: none;
          outline: 2px solid var(--accent);
          outline-offset: 3px;
        }
        .decision-card.halo.halo-critical {
          outline-color: var(--danger);
        }
      }
      /* Aperçu « Cette semaine » — bande légère sous le workflow */
      .week-preview {
        margin-top: 28px;
      }
      .wp-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 11px;
      }
      .wp-head h2 {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin: 0;
      }
      .wp-head span {
        font-size: 12px;
        color: var(--text-tertiary);
      }
      .wp-days {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .wp-day {
        display: grid;
        gap: 7px;
        align-content: start;
        padding: 12px 12px 13px;
        text-align: left;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
        transition: box-shadow 0.16s, border-color 0.16s;
      }
      .wp-day:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .wp-day:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: 2px;
      }
      .wp-day.today {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .wp-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        text-transform: capitalize;
      }
      .wp-day.today .wp-label {
        color: var(--accent-ink);
      }
      .wp-today-tag {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.07em;
        padding: 2px 5px;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
        text-transform: uppercase;
      }
      .wp-count {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .wp-count b {
        color: var(--text);
        font-size: 15px;
        margin-right: 3px;
      }
      .wp-signals {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 15px;
        flex-wrap: wrap;
      }
      .wp-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .wp-dot.danger {
        background: var(--danger);
      }
      .wp-dot.warning {
        background: var(--warning);
      }
      .wp-risk {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .wp-tag {
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--surface-muted);
        color: var(--text-tertiary);
      }
      .wp-quiet {
        font-size: 11px;
        color: var(--text-tertiary);
      }
      @media (max-width: 720px) {
        .wp-days {
          grid-template-columns: none;
          grid-auto-flow: column;
          grid-auto-columns: 46%;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          margin: 0 -18px;
          padding: 2px 18px 6px;
        }
        .wp-day {
          scroll-snap-align: start;
        }
      }
      /* Décision */
      .decision-card {
        padding: 14px 0 15px;
        border-bottom: 1px solid var(--border-light);
      }
      .decision-card:last-child {
        border-bottom: 0;
      }
      .decision-card h3 {
        font-size: 17px;
        margin: 6px 0 2px;
      }
      .decision-card > p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .decide-facts {
        margin: 12px 0 14px;
        padding: 11px 13px;
        background: var(--danger-soft);
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-sm);
      }
      .decide-facts b {
        display: block;
        font-size: 14px;
        color: var(--danger-ink);
      }
      .decide-facts span {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .decide-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .multi-note {
        margin: 12px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .impact-mini {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
      }
      .impact-mini small {
        display: block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
      }
      .mini-track {
        height: 7px;
        background: var(--surface-muted);
        border-radius: 8px;
        position: relative;
        margin: 5px 0 11px;
      }
      .mini-track i {
        position: absolute;
        height: 7px;
        border-radius: 8px;
      }
      .baseline-mini {
        background: var(--text-tertiary);
      }
      .actual-mini {
        background: var(--danger);
      }
      .technical-details {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--border-light);
        color: var(--text-secondary);
        font-size: 12px;
      }
      .technical-details summary {
        color: var(--accent);
        font-weight: 600;
        cursor: pointer;
      }
      /* Aujourd'hui = liste de lignes */
      .today-task {
        display: grid;
        grid-template-columns: 9px minmax(0, 1fr) auto;
        gap: 11px;
        align-items: center;
        padding: 13px 8px;
        margin: 0 -8px;
        border-radius: var(--radius-sm);
        border-bottom: 1px solid var(--border-light);
        cursor: pointer;
        min-height: 44px;
      }
      .today-task:last-child {
        border-bottom: 0;
      }
      .today-task:hover {
        background: var(--surface-subtle);
      }
      .today-task.doing {
        background: var(--accent-soft);
        border-bottom-color: transparent;
      }
      .today-task h3 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .today-task p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .today-task small {
        color: var(--text-tertiary);
        font-size: 12px;
      }
      /* À surveiller = lignes légères */
      .watch-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid var(--border-light);
        min-height: 44px;
      }
      .watch-row:last-child {
        border-bottom: 0;
      }
      .watch-row h3 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .watch-row p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12.5px;
      }
      .watch-row small {
        display: block;
        margin-top: 2px;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .watch-row .success {
        color: var(--success);
        font-size: 12px;
        font-weight: 600;
      }

      /* ---------------- Chantiers (sites) ---------------- */
      .portfolio-summary {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .portfolio-summary b {
        font-size: 13px;
      }
      .portfolio-summary span {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .portfolio-summary .danger {
        color: var(--danger-ink);
      }
      .portfolio-summary .warning {
        color: var(--warning-ink);
      }
      .portfolio-summary .success {
        color: var(--success-ink);
      }
      /* Portfolio grid — vertical cards */
      .sites-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(258px, 1fr));
        gap: 18px;
      }
      .site-card {
        display: flex;
        flex-direction: column;
        text-align: left;
        width: 100%;
        padding: 0;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        overflow: hidden;
        cursor: pointer;
        transition: box-shadow 0.16s ease, border-color 0.16s ease;
      }
      .site-card:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .site-card:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: 2px;
      }
      .site-card.danger {
        border-color: var(--danger-border);
      }
      .site-card.warning {
        border-color: var(--warning-border);
      }
      .site-art {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: var(--surface-muted);
      }
      .site-art svg {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 0.18s ease;
      }
      .site-card:hover .site-art svg {
        transform: scale(1.015);
      }
      .site-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.18);
      }
      body.dark .site-badge {
        background: rgba(16, 32, 47, 0.9);
      }
      .site-badge i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .site-badge.warning {
        color: var(--warning-ink);
      }
      .site-badge.warning i {
        background: var(--warning);
      }
      .site-badge.danger {
        color: var(--danger-ink);
      }
      .site-badge.danger i {
        background: var(--danger);
      }
      .site-body {
        display: flex;
        flex-direction: column;
        padding: 14px 16px 15px;
        flex: 1;
      }
      .site-body h2 {
        font-size: 16px;
        margin: 0;
      }
      .site-loc {
        color: var(--text-secondary);
        font-size: 12px;
        margin: 2px 0 0;
      }
      .site-subject {
        margin: 12px 0 0;
        padding: 11px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
      }
      .site-subject b {
        display: block;
        font-size: 13px;
      }
      .site-subject span {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .site-subject.danger span {
        color: var(--danger-ink);
        font-weight: 600;
      }
      .site-subject.warning span {
        color: var(--warning-ink);
        font-weight: 600;
      }
      .site-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 14px;
      }
      .site-team {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .site-team > span {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .site-open {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      /* status pill (project cockpit) */
      .location {
        color: var(--text-secondary);
        margin: 2px 0 12px;
        font-size: 13px;
      }
      .site-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--success-ink);
      }
      .site-status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .site-status.warning {
        color: var(--warning-ink);
      }
      .site-status.warning i {
        background: var(--warning);
      }
      .site-status.danger {
        color: var(--danger-ink);
      }
      .site-status.danger i {
        background: var(--danger);
      }
      .team-filters small {
        display: block;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.09em;
        margin-bottom: 4px;
      }
      .avatar-stack {
        display: flex;
        align-items: center;
      }
      .avatar-stack .resource-avatar {
        margin-left: -6px;
        box-shadow: 0 0 0 2px var(--surface);
      }
      .avatar-stack .resource-avatar:first-child {
        margin-left: 0;
      }
      .avatar-stack em {
        font-size: 10px;
        font-style: normal;
        font-weight: 600;
        margin-left: 6px;
        color: var(--text-secondary);
      }

      /* Resource avatars (portraits + monograms) */
      .resource-avatar {
        --size: 36px;
        width: var(--size);
        height: var(--size);
        flex: 0 0 var(--size);
        border-radius: 50%;
        overflow: hidden;
        display: inline-grid;
        place-items: center;
        background: var(--surface-muted);
      }
      .resource-avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .resource-avatar.small {
        --size: 26px;
      }
      .resource-avatar.company {
        border-radius: 8px;
      }

      /* ---------------- Project cockpit ---------------- */
      .cockpit {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 34px;
        padding: 16px 0 26px;
        border-bottom: 1px solid var(--border-light);
        align-items: start;
      }
      .cockpit h1 {
        font-size: 27px;
        margin: 8px 0 2px;
        letter-spacing: -0.02em;
      }
      .visual {
        height: 210px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-muted);
      }
      .visual svg {
        width: 100%;
        height: 100%;
      }
      .milestone {
        margin: 20px 0;
        padding-left: 15px;
        border-left: 2px solid var(--accent);
      }
      .milestone small {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .milestone b {
        font-size: 15px;
      }
      .tabs {
        display: flex;
        gap: 22px;
        border-bottom: 1px solid var(--border-light);
        overflow: auto;
        margin-top: 6px;
      }
      .tab {
        border: 0;
        background: none;
        padding: 13px 2px;
        color: var(--text-secondary);
        white-space: nowrap;
        font-size: 13.5px;
      }
      .tab.active {
        color: var(--accent);
        font-weight: 600;
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      /* ---------------- Équipe ---------------- */
      .team-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: flex-end;
      }
      .team-summary {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .team-summary .ts-item {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .team-summary b {
        color: var(--text);
      }
      .ts-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .ts-dot.accent {
        background: var(--accent);
      }
      .ts-dot.success {
        background: var(--success);
      }
      .ts-dot.warning {
        background: var(--warning);
      }
      .team-filters {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 15px;
        gap: 20px;
        flex-wrap: wrap;
      }
      .team-filters > div {
        display: grid;
        gap: 6px;
      }
      .team-filters small {
        display: block;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.09em;
        margin-bottom: 4px;
      }
      .team-list {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-xs);
      }
      .team-card {
        display: grid;
        grid-template-columns: 40px 1.2fr 1.6fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px 18px;
        border-top: 1px solid var(--border-light);
        cursor: pointer;
      }
      .team-card:first-child {
        border-top: 0;
      }
      .team-card:hover {
        background: var(--surface-subtle);
      }
      .team-card:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: -3px;
      }
      .tc-id h3 {
        margin: 0;
        font-size: 14px;
      }
      .tc-id p {
        margin: 2px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .tc-mission b {
        font-size: 13.5px;
      }
      .tc-mission span,
      .tc-mission small {
        display: block;
        margin: 2px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .tc-mission .tc-expert {
        color: var(--text-tertiary);
      }
      .tc-status {
        font-style: normal;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-tertiary);
      }
      /* état ressource : point + texte, discret (jamais un gros pill) */
      .tc-state,
      .rstate {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--text-secondary);
      }
      .tc-state i,
      .rstate i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .tc-state.success,
      .rstate.success {
        color: var(--success-ink);
      }
      .tc-state.success i,
      .rstate.success i {
        background: var(--success);
      }
      .tc-state.accent,
      .rstate.accent {
        color: var(--accent-ink);
      }
      .tc-state.accent i,
      .rstate.accent i {
        background: var(--accent);
      }
      .tc-state.warning,
      .rstate.warning {
        color: var(--warning-ink);
      }
      .tc-state.warning i,
      .rstate.warning i {
        background: var(--warning);
      }
      .tc-state.danger,
      .rstate.danger {
        color: var(--danger-ink);
      }
      .tc-state.danger i,
      .rstate.danger i {
        background: var(--danger);
      }
      .rstate {
        margin: 6px 0 4px;
      }

      /* ---------------- Charge des ressources ---------------- */
      .back-link {
        display: inline-block;
        margin-bottom: 6px;
      }
      .resources {
        overflow: auto;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        background: var(--surface);
        scrollbar-width: thin;
      }
      .load-row {
        display: grid;
        grid-template-columns: 200px repeat(5, minmax(96px, 1fr));
        min-width: 720px;
        border-top: 1px solid var(--border-light);
        align-items: stretch;
      }
      .load-row:first-child {
        border-top: 0;
      }
      .load-head {
        background: var(--surface-subtle);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--text-tertiary);
        text-transform: uppercase;
      }
      .load-head > div {
        padding: 10px 13px;
      }
      .load-row:not(.load-head) {
        cursor: pointer;
      }
      .load-row:not(.load-head):hover {
        background: var(--surface-subtle);
      }
      .load-row:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: -3px;
      }
      .rc-name {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        min-width: 0;
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--surface);
      }
      .load-head > div:first-child {
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--surface-subtle);
      }
      .load-row:not(.load-head):hover .rc-name {
        background: var(--surface-subtle);
      }
      .rc-name b {
        font-size: 13px;
      }
      .rc-name small {
        display: block;
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .rc-cell-wrap {
        padding: 8px;
        border-left: 1px solid var(--border-light);
        display: flex;
      }
      .rc-cell {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 600;
        background: var(--surface-subtle);
        color: var(--text-tertiary);
      }
      .rc-cell i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--border-strong);
        flex: 0 0 7px;
      }
      .rc-cell.available {
        background: transparent;
        color: var(--text-tertiary);
        font-weight: 500;
      }
      .rc-cell.accent {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .rc-cell.accent i {
        background: var(--accent);
      }
      .rc-cell.warning {
        background: var(--warning-soft);
        color: var(--warning-ink);
      }
      .rc-cell.warning i {
        background: var(--warning);
      }
      .rc-cell.danger {
        background: var(--danger-soft);
        color: var(--danger-ink);
      }
      .rc-cell.danger i {
        background: var(--danger);
      }

      /* Drawer ressource */
      .drawer-mission {
        display: grid;
        grid-template-columns: 88px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--border-light);
      }
      .drawer-mission:first-child {
        border-top: 0;
      }
      .drawer-mission > b {
        font-size: 12.5px;
        color: var(--text-secondary);
      }
      .drawer-mission span {
        display: block;
        font-size: 13px;
      }
      .drawer-mission small {
        display: block;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .drawer-avail {
        margin: 12px 0 0;
        padding-top: 10px;
        border-top: 1px dashed var(--border);
        color: var(--text-secondary);
        font-size: 13px;
      }
      .drawer-cap {
        display: flex;
        gap: 26px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
      }
      .drawer-cap small {
        display: block;
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .drawer-cap b {
        font-size: 14px;
      }
      .week-dots {
        display: flex;
        gap: 16px;
      }
      .week-dots .wd {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--text-tertiary);
        font-weight: 600;
      }
      .week-dots .wd i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--border-strong);
      }
      .week-dots .wd.success i {
        background: var(--success);
      }
      .week-dots .wd.accent i {
        background: var(--accent);
      }
      .week-dots .wd.warning i {
        background: var(--warning);
      }
      .week-dots .wd.danger i {
        background: var(--danger);
      }
      /* Pièces liées (drawer tâche) — compact, cliquable si > 0 */
      .dp-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dp-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface-subtle);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
        transition: box-shadow 0.16s, border-color 0.16s;
      }
      .dp-chip svg {
        width: 15px;
        height: 15px;
        stroke: var(--text-secondary);
        fill: none;
        stroke-width: 1.7;
      }
      .dp-chip:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .dp-none {
        color: var(--text-tertiary);
        font-size: 13px;
      }
      .ai-nudge {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 10px 14px;
        margin: 0 0 14px;
        border: 1px solid var(--border-light);
        background: var(--surface);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
        font-size: 13px;
        color: var(--text-secondary);
      }
      .ai-nudge svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ai-nudge b {
        color: var(--text);
      }
      .ai-nudge .link {
        margin-left: auto;
      }

      /* ---------------- Planning / Gantt ---------------- */
      .planning-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }
      .planning-header h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .planning-nav {
        display: flex;
        gap: 7px;
        align-items: center;
        margin-bottom: 12px;
      }
      .planning-nav .btn {
        padding: 7px 11px;
      }
      .planning-nav .period-label {
        margin-left: 8px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        flex-wrap: wrap;
      }
      .segment {
        display: inline-flex;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        padding: 3px;
        border-radius: var(--radius-sm);
      }
      .segment button {
        border: 0;
        background: none;
        color: var(--text-secondary);
        padding: 6px 13px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
      }
      .segment button.active {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 1px 2px rgba(23, 105, 255, 0.3);
      }
      .segment button:not(.active):hover {
        color: var(--text);
      }
      .gantt-wrap {
        position: relative;
        overflow: auto;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        background: var(--surface);
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }
      .gantt {
        position: relative;
        --task-col: 210px;
        --cols: 7;
        min-width: min(1060px, calc(100vw - 240px));
      }
      @media (min-width: 1200px) {
        .gantt {
          min-width: 100%;
        }
      }
      .g-head,
      .g-row {
        display: grid;
        grid-template-columns: var(--task-col) repeat(var(--cols), minmax(94px, 1fr));
      }
      .g-head {
        position: sticky;
        top: 0;
        z-index: 6;
        background: var(--surface);
      }
      .g-head > div,
      .g-slot {
        min-height: 50px;
        border-bottom: 1px solid var(--border-light);
        border-right: 1px solid var(--border-light);
        padding: 8px;
      }
      .g-head > div {
        position: relative;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 600;
      }
      .g-head > div:first-child,
      .g-label {
        position: sticky;
        left: 0;
        z-index: 4;
        background: var(--surface);
        box-shadow: 1px 0 0 var(--border-light);
      }
      .g-head > div:first-child {
        z-index: 7;
        color: var(--text);
      }
      .g-head small {
        display: block;
        font-size: 8px;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .g-label {
        padding: 8px 12px;
      }
      .g-label b {
        display: block;
        font-size: 13px;
      }
      .g-label small {
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .g-slot {
        position: relative;
      }
      .g-row {
        min-height: 50px;
      }
      .g-row:hover > div {
        background: var(--surface-subtle);
      }
      .g-project {
        position: sticky;
        left: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 14px;
        background: var(--surface-subtle);
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
        min-width: var(--task-col);
      }
      .g-project button {
        border: 0;
        background: none;
        color: var(--text);
        font-weight: 700;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .project-health {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .project-health i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .project-health.warning i {
        background: var(--warning);
      }
      .project-health.danger i {
        background: var(--danger);
      }
      .g-bar {
        height: 27px;
        top: 11px;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 9px;
        border-radius: 5px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
      }
      /* drag & drop only from Pilotage upward */
      body[data-level="pilot"] .g-bar,
      body[data-level="expert"] .g-bar {
        cursor: grab;
      }
      body[data-level="pilot"] .g-bar:active,
      body[data-level="expert"] .g-bar:active {
        cursor: grabbing;
      }
      .g-bar.dragging {
        opacity: 0.5;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
      }
      .g-bar em {
        font-size: 8px;
        font-style: normal;
        letter-spacing: 0.06em;
        opacity: 0.85;
      }
      /* À faire = planifié (bleu creux) ; En cours = bleu plein */
      .g-bar.todo {
        background: var(--accent-soft);
        color: var(--accent-ink);
        box-shadow: inset 0 0 0 1px
          color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .g-bar.danger {
        background: var(--danger);
      }
      .g-bar.warning {
        background: var(--warning);
      }
      .g-bar.success {
        background: var(--success);
      }
      .g-bar.source {
        outline: 2px solid var(--danger);
        outline-offset: 1px;
      }
      .g-bar.ghost {
        position: absolute;
        top: 11px;
        z-index: 1;
        opacity: 0.22;
        filter: grayscale(1);
        box-shadow: none;
      }
      .g-bar.simulated {
        outline: 2px solid var(--surface);
        box-shadow: 0 2px 8px rgba(23, 105, 255, 0.35);
      }
      .g-bar .bar-avatar {
        margin-left: auto;
      }
      .baseline {
        position: absolute;
        height: 4px;
        top: 41px;
        border-radius: 4px;
        background: var(--text-tertiary);
        opacity: 0.5;
        z-index: 1;
      }
      .g-slot.over {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1.5px
          color-mix(in srgb, var(--accent) 45%, transparent);
      }
      .g-slot.weekend,
      .g-head > div.weekend {
        background: var(--surface-subtle);
      }
      .today-cell,
      .today-col {
        background: color-mix(in srgb, var(--accent) 6%, var(--surface)) !important;
      }
      .g-slot.today-cell {
        border-left: 2px solid var(--accent);
      }
      .g-head > div.today-cell {
        border-left: 2px solid var(--accent);
      }
      .g-row.selected .g-label {
        box-shadow: inset 3px 0 var(--accent);
        background: var(--accent-soft);
      }
      .deps {
        position: absolute;
        inset: 50px 0 0 var(--task-col);
        pointer-events: none;
        z-index: 3;
      }
      .deps path {
        fill: none;
        stroke: var(--text-tertiary);
        stroke-width: 1.3;
        opacity: 0.5;
      }
      .deps path.faint {
        opacity: 0.12;
      }
      .deps path.hot {
        stroke: var(--danger);
        stroke-width: 1.7;
        opacity: 0.9;
      }
      .g-row.dim .g-bar,
      .g-row.dim .g-label {
        opacity: 0.4;
      }
      .g-row.dim {
        pointer-events: auto;
      }
      .focus-flash {
        animation: focusFlash 1.8s ease;
      }
      @keyframes focusFlash {
        0%,
        50% {
          background: var(--accent-soft);
        }
        100% {
          background: transparent;
        }
      }
      /* Focus sur une tâche : la barre du planning pulse doucement (accent Kanvix) */
      .g-bar.focus-bar {
        animation: focusBar 0.72s ease-out 2;
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        z-index: 6;
      }
      .g-bar.focus-bar.focus-danger {
        outline-color: var(--danger);
        animation-name: focusBarDanger;
      }
      @keyframes focusBar {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);
        }
        100% {
          box-shadow: 0 0 0 11px color-mix(in srgb, var(--accent) 0%, transparent);
        }
      }
      @keyframes focusBarDanger {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 50%, transparent);
        }
        100% {
          box-shadow: 0 0 0 11px color-mix(in srgb, var(--danger) 0%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .g-bar.focus-bar {
          animation: none;
          outline-width: 3px;
          outline-offset: 2px;
        }
        .focus-flash {
          animation: none;
        }
      }
      .scroll-hint {
        text-align: center;
        color: var(--text-tertiary);
        font-size: 10px;
        padding: 6px;
        display: none;
      }
      .scroll-hint.show {
        display: block;
      }
      .planning-summary {
        padding: 10px 0 14px;
        color: var(--text-secondary);
        font-size: 12px;
      }
      /* Toolbar Pilotage — segment + filtres compacts + toggle */
      .plan-toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 12px 0 16px;
      }
      .plan-filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .plan-toolbar select {
        min-width: auto;
        padding: 7px 28px 7px 11px;
        font-size: 13px;
      }
      /* Toggle switch */
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-secondary);
        cursor: pointer;
        user-select: none;
      }
      .toggle input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle .track {
        width: 34px;
        height: 20px;
        flex: 0 0 34px;
        border-radius: 20px;
        background: var(--border-strong);
        position: relative;
        transition: background 0.15s;
      }
      .toggle .track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s;
      }
      .toggle input:checked + .track {
        background: var(--accent);
      }
      .toggle input:checked + .track::after {
        transform: translateX(14px);
      }
      .toggle input:focus-visible + .track {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: 2px;
      }
      .toggle input:checked ~ * {
        color: var(--text);
      }
      /* Expert — barre Analyse */
      .analysis-bar {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        margin: 10px 0 14px;
        padding: 11px 15px;
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
      }
      .analysis-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .analysis-meta {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-secondary);
      }
      /* Légende Expert */
      .plan-legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin: 10px 2px 0;
        font-size: 11px;
        color: var(--text-secondary);
      }
      .plan-legend .lg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .plan-legend .lg::before {
        content: "";
        width: 14px;
        height: 8px;
        border-radius: 3px;
        background: var(--accent);
      }
      .plan-legend .lg-base::before {
        height: 4px;
        background: var(--text-tertiary);
        opacity: 0.6;
      }
      .plan-legend .lg-sim::before {
        background: var(--accent);
        box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3px var(--accent);
      }
      .plan-legend .lg-impact::before {
        background: var(--danger);
      }
      /* Empty state */
      .plan-empty {
        text-align: center;
        padding: 48px 20px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-subtle);
      }
      .plan-empty b {
        font-size: 15px;
      }
      .plan-empty p {
        margin: 6px 0 14px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .plan-empty .actions {
        justify-content: center;
      }
      .g-chevron {
        display: inline-block;
        width: 12px;
        color: var(--text-tertiary);
      }
      /* Simulation banner + effect */
      .sim-banner {
        position: sticky;
        top: 10px;
        z-index: 9;
        margin: 0 auto 18px;
        max-width: 780px;
        background: var(--surface);
        border: 1px solid var(--warning-border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
        padding: 12px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .sim-banner b {
        font-size: 14px;
      }
      .sim-banner small {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .effect-summary {
        margin: 14px 0;
        padding: 16px;
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
      }
      .effect {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
        margin: 10px 0 0;
      }
      .effect div {
        padding: 12px 14px;
        border-right: 1px solid var(--border-light);
      }
      .effect div:last-child {
        border-right: 0;
      }
      .effect small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
        margin-bottom: 3px;
      }
      .what-if {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .form-error {
        min-height: 18px;
        color: var(--danger);
        margin: 0;
        font-size: 12px;
      }
      /* Mobile agenda (planning fallback) */
      .mobile-agenda {
        display: none;
      }

      /* ---------------- Documents ---------------- */
      /* ---------------- Bibliothèque : contrôles (recherche + filtres) ------- */
      .lib-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .search-field {
        position: relative;
        flex: 1;
        min-width: 200px;
        display: flex;
        align-items: center;
      }
      .search-field svg {
        position: absolute;
        left: 12px;
        width: 16px;
        height: 16px;
        stroke: var(--text-tertiary);
        fill: none;
        stroke-width: 1.8;
        pointer-events: none;
      }
      .search-field input {
        width: 100%;
        padding-left: 36px;
        border-color: var(--border);
        background: var(--surface);
      }
      .scope-select {
        border-color: var(--border);
        min-width: 180px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }
      .chip {
        padding: 7px 13px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text-secondary);
        font-size: 12.5px;
        font-weight: 600;
        transition: background 0.14s, color 0.14s, border-color 0.14s;
      }
      .chip:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }
      .chip.active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      /* ---------------- Vignettes unifiées (Documents) ---------------- */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 16px;
      }
      .card {
        display: flex;
        flex-direction: column;
        text-align: left;
        width: 100%;
        padding: 0;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        overflow: hidden;
        cursor: pointer;
        transition: box-shadow 0.16s, border-color 0.16s;
      }
      .card:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .doc-thumb {
        height: 128px;
        background: var(--surface-muted);
        display: block;
      }
      .doc-thumb svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .card-body {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 13px 14px 14px;
      }
      .card-eyebrow {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.3;
      }
      .card-meta {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 7px;
      }
      .card-date {
        font-size: 11px;
        color: var(--text-tertiary);
      }
      .tag-flag {
        font-size: 10px;
        font-weight: 700;
        color: var(--danger-ink);
        white-space: nowrap;
      }

      /* ---------------- Photos ---------------- */
      .photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
        gap: 16px;
      }
      .photo {
        display: block;
        width: 100%;
        text-align: left;
        height: 190px;
        border-radius: var(--radius-lg);
        position: relative;
        overflow: hidden;
        cursor: pointer;
        background: var(--surface-muted);
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-xs);
        transition: box-shadow 0.16s, border-color 0.16s;
      }
      .photo:hover {
        box-shadow: var(--shadow-hover);
        border-color: var(--border-strong);
      }
      .photo svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .photo-flag {
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 10px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        color: #fff;
        background: var(--danger);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .photo-info {
        position: absolute;
        z-index: 2;
        inset: auto 0 0;
        padding: 30px 13px 11px;
        color: #fff;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.76));
      }
      .photo-info b {
        display: block;
        font-size: 13px;
      }
      .photo-info small {
        display: block;
        margin-top: 2px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.82);
      }
      /* ---------------- Popups Document / Photo ---------------- */
      .doc-hero {
        height: 240px;
        border-radius: var(--radius-md);
        overflow: hidden;
        margin-bottom: 16px;
        background: var(--surface-muted);
      }
      .doc-hero svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .photo-hero {
        position: relative;
        height: 56vh;
        border-radius: var(--radius-md);
        overflow: hidden;
        margin-bottom: 16px;
        background: var(--surface-muted);
      }
      .photo-hero svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .pop-eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .pop-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin: 6px 0 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .pop-meta span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .pop-meta svg {
        width: 15px;
        height: 15px;
        stroke: var(--text-tertiary);
        fill: none;
        stroke-width: 1.7;
      }
      .pop-linked {
        margin-top: 16px;
        padding: 13px 15px;
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--accent);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
      }
      .pop-linked small {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-tertiary);
      }
      .pop-linked b {
        display: block;
        margin-top: 3px;
        font-size: 14px;
      }
      .pop-flag {
        display: inline-flex;
        align-items: center;
        margin-top: 10px;
        padding: 6px 11px;
        border: 1px solid var(--danger-border);
        border-radius: 999px;
        background: var(--danger-soft);
        color: var(--danger-ink);
        font-size: 12px;
        font-weight: 600;
      }
      .pop-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 20px;
      }
      /* ---------------- Formulaire en sidewindow ---------------- */
      .drawer-form {
        display: grid;
        gap: 14px;
        margin-top: 6px;
      }
      .drawer-form label {
        display: grid;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .drawer-form input,
      .drawer-form select,
      .drawer-form textarea {
        font-weight: 400;
        color: var(--text);
      }
      .drawer-form textarea {
        resize: vertical;
      }
      .drawer-form-actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .drawer-form-actions .btn {
        flex: 1;
        justify-content: center;
      }

      /* ---------------- Drawer / Modal ---------------- */
      .drawer,
      .modal {
        position: fixed;
        inset: 0;
        z-index: 30;
        overflow: hidden;
        background: rgba(9, 17, 29, 0);
        pointer-events: none;
        transition: background 0.2s;
      }
      .drawer.open,
      .modal.open {
        background: rgba(9, 17, 29, 0.42);
        pointer-events: auto;
      }
      .drawer-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: min(432px, 92vw);
        height: 100%;
        overflow: auto;
        background: var(--surface);
        padding: 26px 28px;
        transform: translateX(100%);
        transition: transform 0.22s ease;
        box-shadow: -14px 0 40px rgba(9, 17, 29, 0.16);
      }
      .drawer.open .drawer-panel {
        transform: none;
      }
      .drawer-panel h2 {
        font-size: 20px;
        margin: 6px 0;
      }
      .drawer-section {
        padding: 18px 0;
        border-top: 1px solid var(--border-light);
      }
      .drawer-section h3 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .modal-box {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -47%) scale(0.97);
        opacity: 0;
        width: min(560px, 92vw);
        max-height: 88vh;
        overflow: auto;
        background: var(--surface);
        padding: 26px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-pop);
        transition: opacity 0.18s, transform 0.18s;
      }
      .modal.open .modal-box {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      .modal.full .modal-box {
        width: min(1040px, 96vw);
      }
      .modal-box h2 {
        font-size: 20px;
        margin: 4px 0 12px;
      }
      .close {
        float: right;
        border: 1px solid var(--border-light);
        background: var(--surface-subtle);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        color: var(--text-secondary);
        font-size: 17px;
        line-height: 1;
      }
      .close:hover {
        background: var(--surface-muted);
      }
      /* Menu contextuel « ••• » — contexte de positionnement = la barre d'actions,
         jamais le petit bouton : le menu reste toujours contenu dans le sidewindow. */
      .task-actions {
        position: relative;
      }
      .more-menu {
        position: static;
        display: inline-flex;
      }
      .more-trigger[aria-expanded="true"] {
        background: var(--surface-muted);
        border-color: var(--border-strong);
      }
      .more-pop {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        left: auto;
        width: 224px;
        max-width: calc(100% - 4px);
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-pop);
        display: none;
        z-index: 40;
      }
      .more-pop.open {
        display: block;
        animation: morePop 0.14s ease;
      }
      @keyframes morePop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      .more-pop button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 9px 11px;
        border-radius: 6px;
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .more-pop button:hover {
        background: var(--surface-subtle);
      }
      .more-sep {
        height: 1px;
        margin: 5px 6px;
        background: var(--border-light);
      }
      .more-pop button.danger {
        color: var(--danger);
      }
      .more-pop button.danger:hover {
        background: var(--danger-soft);
      }
      @media (max-width: 720px) {
        .more-pop {
          left: 0;
          right: 0;
          width: auto;
          max-width: none;
        }
      }
      /* Messages (drawer conversation) */
      .message {
        max-width: 82%;
        margin: 9px auto 0 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
        font-size: 13px;
      }
      .message.artisan {
        margin-left: auto;
        margin-right: 0;
        background: var(--accent-soft);
        border-color: var(--accent-soft);
      }
      .message small {
        display: block;
        margin-top: 3px;
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .decision-steps section {
        padding: 13px 0;
        border-top: 1px solid var(--border-light);
      }
      .decision-steps h3 {
        margin: 0 0 4px;
      }

      /* ---------------- Toast ---------------- */
      .toast {
        position: fixed;
        left: 22px;
        bottom: 22px;
        background: #101828;
        color: #fff;
        padding: 11px 15px;
        border-radius: var(--radius-sm);
        z-index: 60;
        opacity: 0;
        transform: translateY(8px);
        transition: 0.18s;
        box-shadow: var(--shadow-pop);
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      .toast button {
        border: 0;
        background: none;
        color: #9ec5ff;
        font-weight: 700;
      }

      /* ---------------- Command palette ---------------- */
      .cmd {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(9, 17, 29, 0.5);
        display: none;
        justify-content: center;
        align-items: flex-start;
        padding-top: 12vh;
      }
      .cmd.open {
        display: flex;
      }
      .cmd-box {
        width: min(600px, 92vw);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-pop);
        overflow: hidden;
      }
      .cmd-box input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        padding: 18px 20px;
        font-size: 16px;
      }
      .cmd-results {
        padding: 8px;
        max-height: 420px;
        overflow: auto;
      }
      .cmd-label {
        padding: 9px 11px 5px;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .cmd-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 11px;
        border-radius: 7px;
        cursor: pointer;
      }
      .cmd-item:hover,
      .cmd-item.selected {
        background: var(--surface-subtle);
      }
      .cmd-item small {
        color: var(--text-secondary);
      }

      /* ---------------- Floating add ---------------- */
      .add {
        display: none; /* desktop: contextual actions in headers, no floating + */
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 10;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        box-shadow: 0 6px 18px rgba(23, 105, 255, 0.35);
        font-size: 22px;
        line-height: 1;
      }
      .add:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      /* ---------------- Assistant side panel (kept darker) ---------------- */
