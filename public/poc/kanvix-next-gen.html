      .ai-overlay {
        position: fixed;
        inset: 0;
        z-index: 90;
        overflow: hidden;
        background: rgba(3, 12, 20, 0);
        pointer-events: none;
        transition: background 0.18s ease;
      }
      .ai-overlay.open {
        background: rgba(3, 12, 20, 0.32);
        pointer-events: auto;
      }
      .ai-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: min(460px, 100vw);
        height: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        background: var(--surface);
        color: var(--text);
        border-left: 1px solid var(--border);
        box-shadow: -18px 0 48px rgba(15, 23, 42, 0.18);
        transform: translateX(100%);
        transition: transform 0.24s ease;
      }
      body.dark .ai-panel {
        box-shadow: -18px 0 48px rgba(2, 9, 18, 0.5);
      }
      .ai-overlay.open .ai-panel {
        transform: none;
      }
      .ai-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 22px;
        border-bottom: 1px solid var(--border-light);
      }
      .ai-header small {
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .ai-header h2 {
        margin: 3px 0 0;
        font-size: 19px;
        color: var(--text);
      }
      .ai-header button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface-subtle);
        color: var(--text-secondary);
        font-size: 19px;
        line-height: 1;
      }
      .ai-header button:hover {
        background: var(--surface-muted);
        border-color: var(--border-strong);
        color: var(--text);
      }
      .ai-context {
        padding: 14px 22px;
        background: var(--surface-subtle);
        border-bottom: 1px solid var(--border-light);
        color: var(--text-secondary);
        font-size: 12px;
      }
      .ai-context small {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--text-tertiary);
      }
      .ai-context b {
        display: block;
        color: var(--text);
        font-size: 14px;
        margin: 4px 0 2px;
      }
      .ai-body {
        overflow: auto;
        padding: 20px 22px;
      }
      .ai-welcome {
        color: var(--text-secondary);
      }
      .ai-welcome h3 {
        color: var(--text);
        margin: 0 0 6px;
      }
      .ai-suggestions {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }
      .ai-suggestions button {
        padding: 11px 13px;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-subtle);
        color: var(--text);
        font-size: 13px;
      }
      .ai-suggestions button:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .ai-message {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 10px;
        margin: 0 0 16px;
        animation: aiIn 0.18s ease;
      }
      .ai-message.user {
        grid-template-columns: 1fr 26px;
      }
      .ai-message.user .ai-bubble {
        grid-column: 1;
      }
      .ai-message.user .ai-mark {
        grid-column: 2;
        grid-row: 1;
      }
      .ai-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      .ai-message.user .ai-mark {
        background: var(--surface-muted);
        color: var(--text-secondary);
      }
      .ai-bubble {
        padding: 11px 13px;
        border-radius: 12px;
        background: var(--surface-subtle);
        color: var(--text);
        font-size: 13px;
      }
      .ai-message.user .ai-bubble {
        background: var(--accent-soft);
        color: var(--text);
      }
      .ai-bubble p {
        margin: 0 0 8px;
      }
      .ai-bubble p:last-child {
        margin: 0;
      }
      .ai-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 11px;
      }
      .ai-btn,
      .ai-actions button {
        border: 1px solid var(--border);
        background: var(--surface-subtle);
        color: var(--text);
        border-radius: 8px;
        min-height: 34px;
        padding: 7px 11px;
        font-weight: 600;
        font-size: 12.5px;
      }
      .ai-btn:hover,
      .ai-actions button:hover {
        background: var(--surface-muted);
        border-color: var(--border-strong);
      }
      .ai-btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .ai-btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .ai-btn-danger {
        background: var(--danger-soft);
        border-color: var(--danger-border);
        color: var(--danger-ink);
      }
      .ai-btn:active {
        transform: translateY(1px);
      }
      .ai-btn:disabled,
      .ai-actions button:disabled,
      .ai-suggestions button:disabled,
      .ai-header button:disabled,
      .ai-history-item:disabled {
        background: var(--surface-muted);
        color: var(--text-tertiary);
        border-color: var(--border-light);
        cursor: not-allowed;
      }
      .ai-history-item {
        display: grid;
        gap: 3px;
        width: 100%;
        margin: 0 0 8px;
        padding: 11px 12px;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface-subtle);
        color: var(--text);
      }
      .ai-history-item small {
        color: var(--text-secondary);
      }
      .ai-history-item:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .ai-history-link {
        display: inline-flex;
        align-items: center;
        border: 1px solid transparent;
        background: transparent;
        color: var(--accent);
        padding: 8px 4px;
        border-radius: 7px;
        font-weight: 500;
        text-align: left;
      }
      .ai-history-link:hover {
        background: var(--accent-soft);
        border-color: var(--border);
        color: var(--accent-ink);
      }
      .ai-compose {
        display: grid;
        grid-template-columns: 1fr 40px;
        gap: 9px;
        padding: 14px 18px 18px;
        border-top: 1px solid var(--border-light);
        background: var(--surface);
      }
      .ai-compose textarea {
        resize: none;
        max-height: 110px;
        border: 1px solid var(--border);
        background: var(--surface-subtle);
        color: var(--text);
        border-radius: 10px;
        padding: 11px 12px;
      }
      .ai-compose textarea::placeholder {
        color: var(--text-tertiary);
      }
      .ai-compose button {
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 16px;
      }
      .ai-compose button:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .ai-scenario {
        padding: 13px 0;
        border-top: 1px solid var(--border-light);
      }
      .ai-scenario h3 {
        font-size: 14px;
        color: var(--text);
      }
      .ai-scenario h3 small {
        display: inline-block;
        margin-left: 8px;
        padding: 3px 6px;
        border-radius: 5px;
        background: var(--accent);
        color: #fff;
        font-size: 9px;
        letter-spacing: 0.08em;
      }
      .ai-scenario.recommended {
        margin-inline: -10px;
        padding-inline: 10px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--accent-soft);
      }
      .ai-scenario dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 5px;
        margin: 8px 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .ai-scenario dd {
        margin: 0;
        color: var(--text);
      }
      @keyframes aiIn {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }

      /* ---------------- Artisan (mobile messaging) ---------------- */
      .artisan-body .sidebar,
      .artisan-body .add {
        display: none;
      }
      .artisan-body .shell {
        display: block;
        background: var(--surface-subtle);
      }
      .artisan-body .main {
        max-width: 460px;
        padding: 0;
        min-height: 100vh;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--border-light);
      }
      .chat {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .chat-header {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-light);
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .chat-header .resource-avatar {
        --size: 40px;
      }
      .chat-title {
        flex: 1;
        min-width: 0;
        line-height: 1.3;
      }
      .chat-title b {
        display: block;
        font-size: 15px;
      }
      .chat-title span {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .chat-online {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--success);
        font-size: 11px;
        font-weight: 600;
      }
      .chat-online i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .chat-mission {
        margin: 14px 16px 6px;
        padding: 15px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-subtle);
      }
      .chat-mission .eyebrow {
        color: var(--accent-ink);
      }
      .chat-mission h2 {
        font-size: 18px;
        margin: 5px 0 3px;
      }
      .chat-mission .mission-time {
        color: var(--text-secondary);
        font-size: 13px;
        margin: 0 0 12px;
      }
      .chat-mission .actions {
        margin-top: 12px;
      }
      .chat-status-live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--success);
        margin-bottom: 6px;
      }
      .chat-thread {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 16px 16px;
        overflow: auto;
      }
      .chat-day {
        text-align: center;
        margin: 8px 0;
        font-size: 11px;
        color: var(--text-tertiary);
        font-weight: 600;
      }
      .bubble {
        max-width: 78%;
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        position: relative;
      }
      .bubble.them {
        align-self: flex-start;
        background: var(--surface-muted);
        border-bottom-left-radius: 5px;
      }
      .bubble.me {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 5px;
      }
      .bubble .bubble-photo {
        display: block;
        width: 100%;
        height: 120px;
        border-radius: 9px;
        margin-bottom: 7px;
        overflow: hidden;
      }
      .bubble .bubble-photo svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .bubble time {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        opacity: 0.7;
        text-align: right;
      }
      .bubble.me time {
        color: #dbe8ff;
      }
      .chat-compose {
        display: grid;
        grid-template-columns: 38px 1fr 38px;
        gap: 8px;
        align-items: center;
        padding: 11px 14px;
        border-top: 1px solid var(--border-light);
        background: var(--surface);
        position: sticky;
        bottom: 0;
      }
      .chat-compose input {
        border-radius: 20px;
        background: var(--surface-subtle);
        border-color: var(--border);
      }
      .chat-icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        display: grid;
        place-items: center;
      }
      .chat-icon-btn svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chat-icon-btn.send {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      /* legacy artisan fallbacks (kept for safety) */
      .artisan {
        display: flex;
        flex-direction: column;
        padding: 20px;
      }
      .mission {
        margin-top: 20px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .mobile-nav {
        display: flex;
        justify-content: space-around;
        margin-top: auto;
        padding: 14px 0;
        border-top: 1px solid var(--border-light);
      }
      .mobile-nav button {
        border: 0;
        background: none;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .mobile-nav button.active {
        color: var(--accent);
        font-weight: 600;
      }

      /* ---------------- Impact chain ---------------- */
      .impact-chain {
        display: grid;
        gap: 0;
      }
      .impact-step {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
      }
      .impact-step:hover {
        border-color: var(--border-strong);
      }
      .impact-step.source {
        border-color: var(--danger-border);
        background: var(--danger-soft);
      }
      .impact-step h4 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .impact-step small {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .impact-link {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 0 6px 22px;
        color: var(--text-tertiary);
        font-size: 11px;
        font-weight: 600;
      }
      .impact-link:before {
        content: "";
        width: 1px;
        height: 14px;
        background: var(--border-strong);
      }
      .impact-aside {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        padding: 20px;
      }
      .impact-aside h3 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      .impact-aside .fact {
        display: flex;
        justify-content: space-between;
        padding: 9px 0;
        border-top: 1px solid var(--border-light);
        font-size: 13px;
        color: var(--text-secondary);
      }
      .impact-aside .fact:first-of-type {
        border-top: 0;
      }
      .impact-aside .fact b {
        color: var(--text);
      }
      .impact-aside .btn {
        width: 100%;
        margin-top: 14px;
        justify-content: center;
      }

      /* ---------------- « Comprendre » popup (chaîne d'impact) ---------------- */
      .understand-head {
        margin: 0 0 18px;
      }
      .understand-head .eyebrow {
        color: var(--danger-ink);
      }
      .understand-head h2 {
        margin: 6px 0 2px;
        font-size: 21px;
      }
      .understand-head p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .uc-chain {
        display: grid;
        gap: 0;
      }
      .uc-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 12px;
        align-items: start;
        padding: 14px 16px;
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-xs);
      }
      .uc-card.source {
        border-color: var(--danger-border);
        border-left-color: var(--danger);
        background: var(--danger-soft);
      }
      .uc-card.milestone {
        border-color: var(--accent);
        border-left-color: var(--accent);
        background: var(--accent-soft);
      }
      .uc-card .uc-role {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .uc-card.source .uc-role {
        color: var(--danger-ink);
      }
      .uc-card.milestone .uc-role {
        color: var(--accent-ink);
      }
      .uc-card h4 {
        margin: 3px 0 0;
        font-size: 15px;
        color: var(--text);
      }
      .uc-card .uc-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-top: 7px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .uc-card .uc-meta .uc-who {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .uc-card .uc-comment {
        grid-column: 1 / -1;
        margin: 8px 0 0;
        font-size: 12.5px;
        color: var(--text-secondary);
        font-style: italic;
      }
      .uc-badge {
        align-self: start;
        white-space: nowrap;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .uc-badge.danger {
        background: color-mix(in srgb, var(--danger) 16%, transparent);
        color: var(--danger-ink);
      }
      .uc-badge.accent {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent-ink);
      }
      .uc-badge.soft {
        background: var(--surface-muted);
        color: var(--text-tertiary);
      }
      .uc-arrow {
        display: grid;
        place-items: center;
        height: 22px;
        color: var(--text-tertiary);
        font-size: 15px;
        line-height: 1;
      }
      .uc-foot {
        display: flex;
        justify-content: flex-end;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--border-light);
      }
      .uc-foot .link {
        font-weight: 600;
        font-size: 13px;
      }

      /* ---------------- Responsive ---------------- */
      @media (max-width: 1199px) {
        .gantt {
          --task-col: 185px;
          min-width: 950px;
        }
        .g-head,
        .g-row {
          grid-template-columns: var(--task-col) repeat(var(--cols), minmax(92px, 1fr));
        }
      }
      @media (max-width: 1080px) {
        .main {
          padding: 28px 26px 60px;
        }
        .attention-layout,
        .cockpit {
          grid-template-columns: 1fr;
        }
        .cockpit .visual {
          order: -1;
        }
      }

        .shell {
          display: block;
        }

        }

          background: none !important;
          color: var(--accent) !important;
        }
        .main {
          padding: 22px 16px 84px;
        }
        .header {
          flex-direction: column;
          gap: 8px;
        }
        .context {
          text-align: left;
        }
        .today-grid {
          grid-template-columns: 1fr;
          grid-template-areas: "decide" "watch" "today";
          gap: 20px;
        }
        .lib-controls {
          gap: 10px;
        }
        .search-field {
          min-width: 100%;
        }
        .scope-select {
          flex: 1;
          min-width: 0;
        }
        .card-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .doc-thumb {
          height: 104px;
        }
        .photos {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .photo {
          height: 150px;
        }
        .chips {
          margin: 0 -18px 16px;
          padding: 0 18px;
          flex-wrap: nowrap;
          overflow-x: auto;
        }
        .chip {
          flex: none;
        }
        .site-art {
          aspect-ratio: 2 / 1;
        }
        .team-card {
          grid-template-columns: 38px 1fr auto;
          grid-template-areas: "av id st" "av mi mi";
          gap: 4px 12px;
          padding: 13px;
        }
        .team-card > .resource-avatar {
          grid-area: av;
          align-self: start;
        }
        .team-card .tc-id {
          grid-area: id;
        }
        .team-card .tc-state {
          grid-area: st;
          align-self: start;
        }
        .team-card .tc-mission {
          grid-area: mi;
          margin-top: 4px;
        }
        .load-row {
          grid-template-columns: 150px repeat(5, minmax(88px, 1fr));
        }
        .add {
          display: flex;
          align-items: center;
          justify-content: center;
          top: auto;
          bottom: 78px;
          right: 18px;
        }
        .gantt-wrap {
          display: none;
        }
        .mobile-agenda {
          display: grid;
          background: var(--surface);
          border: 1px solid var(--border-light);
          border-radius: var(--radius-lg);
          overflow: hidden;
          box-shadow: var(--shadow-xs);
        }
        .agenda-row {
          display: grid;
          grid-template-columns: 12px 1fr auto;
          gap: 10px;
          padding: 13px;
          border-top: 1px solid var(--border-light);
          align-items: center;
          cursor: pointer;
        }
        .agenda-row:first-child {
          border-top: 0;
        }
        .agenda-row small {
          display: block;
          color: var(--text-tertiary);
        }
        .agenda-row > span {
          text-align: right;
          font-size: 11px;
          color: var(--text-secondary);
        }
        .plan-toolbar {
          gap: 10px;
        }
        .plan-toolbar .segment,
        .plan-toolbar > .toggle,
        .analysis-bar,
        .plan-legend,
        .ai-nudge {
          display: none;
        }
        .plan-filters {
          width: 100%;
        }
        .plan-filters select {
          flex: 1;
          min-width: 0;
        }
        .ai-panel {
          width: 100vw;
        }
        .ai-header {
          position: sticky;
          top: 0;
          z-index: 2;
        }
        .ai-compose {
          position: sticky;
          bottom: 0;
        }
        /* Sidewindow (drawer) plein écran sur mobile */
        .drawer-panel {
          width: 100vw;
        }
        /* Popup quasi plein écran sur mobile (marges 14px) */
        .modal-box {
          width: calc(100vw - 28px);
          max-width: none;
          max-height: calc(100vh - 28px);
        }
        .modal.full .modal-box {
          width: calc(100vw - 28px);
        }
        .artisan-body .main {
          max-width: none;
        }
        .artisan-body .page {
          display: none !important;
        }
        .artisan-body #artisan {
          display: block !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation: none !important;
          transition: none !important;
        }
      }

      function explainIssue(id) {

            r

              : "";
        // Chaîne de dépendance réelle depuis la tâche source
        let successors = t ? getCriticalImpacts(t.id).slice(0, 3) : [];
        // Décalages propagés (si calculables) pour chaque successeur
        let shifts = {};
        if (t)
          propagateDependencies(t.id).forEach((c) => (shifts[c.taskId] = c));

        // CAUSE — la tâche source
        let srcDelay =
          t && t.baselineEnd && date(t.end) > date(t.baselineEnd)
            ? workdayDelay(t.baselineEnd, t.end)
            : null;
        let srcBadge = srcDelay
          ? `<span class="uc-badge danger">● Retard : +${srcDelay} j${srcDelay > 1 ? "" : ""}</span>`
          : `<span class="uc-badge danger">● ${i.severity === "critical" ? "Critique" : "À surveiller"}</span>`;

          ? `<div class="uc-card source"><div><div class="uc-role">Source du retard</div><h4>${esc(t.name)}</h4><div class="uc-meta">${who(resource(t.resourceId))}<span>${fmtRange(t)}</span></div></div>${srcBadge}${i.comment ? `<p class="uc-comment">« ${esc(i.comment)} »</p>` : ""}</div>`

        // CONSÉQUENCES — les tâches dépendantes

          .map((s) => {

      function autoFixSimulation() {
        if (!app.simulation) return;
        let changes = app.simulation.changes.map((x) => ({ ...x })),
          queue = [changes[0].taskId];
        while (queue.length) {
          let id = queue.shift(),
            all = app.tasks.map((t) => ({
              ...t,
              ...changes.find((c) => c.taskId === t.id),
            })),
            source = all.find((t) => t.id === id);
          all
            .filter((t) => (t.deps || []).includes(id))
            .forEach((t) => {
              if (date(t.start) < date(source.end)) {
                let dur = duration(t),
                  start = nextWorkingTime(source.end),
                  change = {
                    taskId: t.id,
                    start,
                    end: addWorkingDuration(start, dur),
                  },
                  old = changes.find((c) => c.taskId === t.id);
                old ? Object.assign(old, change) : changes.push(change);
                queue.push(t.id);
              }
            });
        }
        app.simulation.changes = changes;
        save();
        renderPage();

          messages = app.messages.filter((m) => !t || m.taskId === t.id);
        $("#modalContent").innerHTML =
          `<h2>${t ? project(t.projectId).name : "Messages"}</h2><p class="muted">${r.name}${t ? " · " + t.name : ""}</p>${messages.map((m) => `<div class="message ${m.from}">${m.text}<small>${m.time}${m.from === "artisan" ? " · Lu" : ""}</small></div>`).join("")}<div class="toolbar"><input id="messageInput" style="flex:1" placeholder="Écrire un message…"><button class="btn primary" onclick="sendMessage('${t?.id || ""}')">Envoyer</button></div>`;
        $("#modal").classList.add("open");
      }
      function sendMessage(taskId = "") {
        let v = $("#messageInput").value,
          t = task(taskId);
        if (!v) return;
        app.messages.push({
          id: Date.now(),
          projectId: t?.projectId || null,
          taskId: t?.id || null,
          resourceId: t?.resourceId || app.settings.artisanResourceId,
          from: app.settings.role === "artisan" ? "artisan" : "driver",
          text: v,
          time: fmtTime(getDemoNow()),
          read: true,
        });
        save();
        renderConversation(taskId);
      }
      function artisanDetails(taskId) {
        let t = task(taskId),
          p = project(t.projectId);
        $("#modalContent").innerHTML =
          `<h2>Détails</h2><p><b>Chantier</b><br>${p.name} · ${p.location}</p><p><b>Conducteur</b><br>Eric Leduc</p><button class="btn" onclick="go('documents')">Documents</button> <button class="btn" onclick="renderConversation('${t.id}')">Conversation</button>`;
        $("#modal").classList.add("open");
      }
      // CONSULTER un document = POPUP (lecture / aperçu)
      function viewDocument(id) {
        let d = app.documents.find((x) => x.id === id),
          t = d.taskId ? task(d.taskId) : null,
          li = linkedOpenIssue(d.taskId);
        $("#modalContent").innerHTML =
          `<div class="doc-hero">${documentPreview(d)}</div>` +
          `<span class="pop-eyebrow">${docCategoryLabel(d)}</span>` +
          `<h2>${esc(d.name)}</h2>` +
          `<div class="pop-meta"><span>${icon("sites")}${esc(project(d.projectId).name)}</span><span>${esc(d.type)} · ${fmtDay(d.date)}</span></div>` +
          (t
            ? `<div class="pop-linked"><small>LIÉ À</small><b>${esc(t.name)}</b>${li ? `<button class="pop-flag" onclick="closeOverlay('modal');explainIssue('${li.id}')">● Point à traiter — comprendre</button>` : ""}</div>`
            : "") +
          `<div class="pop-actions"><button class="btn" onclick="closeOverlay('modal');openProjectTab('${d.projectId}','Documents')">Voir le chantier</button><button class="btn" onclick="openDocumentEdit('${d.id}')">Classer / modifier</button></div>`;
        $("#modal").classList.add("open");
      }
      function viewPhoto(id) {
        let p = app.photos.find((x) => x.id === id),
          t = p.taskId ? task(p.taskId) : null,
          li = linkedOpenIssue(p.taskId);
        $("#modal").classList.add("full", "open");
        $("#modalContent").innerHTML =
          `<div class="photo-hero">${fieldPhotoSVG(hashHue(p.id))}</div>` +
          `<h2>${esc(p.comment)}</h2>` +
          `<div class="pop-meta"><span>${icon("sites")}${esc(project(p.projectId).name)}${t ? " · " + esc(t.name) : ""}</span><span>${fmtDay(p.date)} · ${fmtTime(p.date)}</span></div>` +
          `<p class="muted">Photo ajoutée par ${esc(p.author)}</p>` +
          (li
            ? `<button class="pop-flag" onclick="closeOverlay('modal');explainIssue('${li.id}')">● Liée à un point à traiter — comprendre</button>`
            : "") +
          `<div class="pop-actions">${t ? `<button class="btn" onclick="closeOverlay('modal');openTask('${p.taskId}')">Voir la tâche</button>` : ""}<button class="btn" onclick="closeOverlay('modal');openProjectTab('${p.projectId}','Photos')">Voir le chantier</button></div>`;
      }
      function openAdd() {
        if (app.ui.page === "team") openResourceForm();
        else if (app.ui.page === "project") {
          modalForm(
            "Ajouter à ce chantier",
            `<button type="button" class="btn" onclick="closeOverlay('modal');openTaskForm()">Nouvelle tâche</button><button type="button" class="btn" onclick="closeOverlay('modal');openDocumentForm()">Document</button><button type="button" class="btn" onclick="closeOverlay('modal');openPhotoForm(app.ui.projectId)">Photo</button>`,
            () => {},
          );
        } else
          modalForm(
            "Que voulez-vous ajouter ?",
            `<button type="button" class="btn" onclick="closeOverlay('modal');openTaskForm()">Nouvelle tâche</button><button type="button" class="btn" onclick="closeOverlay('modal');openIssueForm()">Signaler un problème</button>`,
            () => {},
          );
      }
      function closeOverlay(id) {
        closeDrawerMenu();
        $("#" + id).classList.remove("open", "full");
      }
      // Menu contextuel « ••• » dans un sidewindow
      function toggleDrawerMenu(btn) {
        let pop = btn.nextElementSibling,
          willOpen = !pop.classList.contains("open");
        closeDrawerMenu();
        if (willOpen) {
          pop.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
        }
      }
      function closeDrawerMenu() {
        $$(".more-pop.open").forEach((pop) => {
          pop.classList.remove("open");
          pop.previousElementSibling?.setAttribute("aria-expanded", "false");
        });
      }
      function anyDrawerMenuOpen() {
        return !!$(".more-pop.open");
      }
      // COMMAND PALETTE
      const norm = (s) =>
        s
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      let cmdIndex = 0;
      function commands(q = "") {
        let xs = [
          ...app.projects.map((p) => ({
            cat: "RECHERCHER",
            label: p.name,
            meta: "Chantier",
            run: () => selectProject(p.id),
          })),
          ...app.tasks.map((t) => ({
            cat: "RECHERCHER",
            label: t.name,
            meta: project(t.projectId).name,
            run: () => openTask(t.id),
          })),
          ...app.resources.map((r) => ({
            cat: "RECHERCHER",
            label: r.name,
            meta: r.scope,
            run: () => openResource(r.id),
          })),
          {
            cat: "NAVIGUER",
            label: "Planning",
            meta: "Page",
            run: () => go("planning"),
          },
          {
            cat: "NAVIGUER",
            label: "Ouvrir Assistant Kanvix",
            meta: "Assistant",
            run: () => toggleAIPanel(),
          },
          {
            cat: "NAVIGUER",
            label: "Documents",
            meta: "Outil",
            run: () => go("documents"),
          },
          {
            cat: "NAVIGUER",
            label: "Photos",
            meta: "Outil",
            run: () => go("photos"),
          },
          {
            cat: "NAVIGUER",
            label: "Ressources et charge",
            meta: "Outil",
            run: () => go("resources"),
          },
          {
            cat: "NAVIGUER",
            label: "Réglages",
            meta: "Profil",
            run: () => go("more"),
          },
          {
            cat: "AGIR",
            label: "Créer une tâche",
            meta: "Action",
            run: openTaskForm,
          },
          {
            cat: "AGIR",
            label: "Passer en mode Expert",
            meta: "Réglage",
            run: () => {
              setDepth("expert");
            },
          },
        ];
        return xs
          .filter((x) => norm(x.label + " " + x.meta).includes(norm(q)))
          .slice(0, 10);
      }
      function openCommand() {
        cmdIndex = 0;
        $("#cmd").classList.add("open");
        $("#cmdInput").value = "";
        renderCommands();
        setTimeout(() => $("#cmdInput").focus(), 0);
      }
      function renderCommands() {
        let xs = commands($("#cmdInput").value),
          last = "";
        $("#cmdResults").innerHTML = xs
          .map(
            (x, i) =>
              `${x.cat !== last ? ((last = x.cat), `<div class="cmd-label">${x.cat}</div>`) : ""}<div class="cmd-item ${i === cmdIndex ? "selected" : ""}" data-i="${i}"><span>${x.label}</span><small>${x.meta}</small></div>`,
          )
          .join("");
        $$(".cmd-item").forEach(
          (x) =>
            (x.onclick = () => {
              xs[+x.dataset.i].run();
              $("#cmd").classList.remove("open");
            }),
        );
      }
      // NAVIGATION / INITIALIZATION
      function nav() {
        const primaryNavigation = [
          ["today", "Aujourd'hui"],
          ["sites", "Chantiers"],
          ["planning", "Planning"],
          ["team", "Équipe"],
        ];
        // Kanvix est désormais un assistant CONTEXTUEL : plus d'entrée globale
        // dans la sidebar (accès via Résoudre / Rééquilibrer / Examiner / ⌘J).
        $("#nav").innerHTML = primaryNavigation
          .map(
            (x) =>
              `<button class="${app.ui.page === x[0] ? "active" : ""}" onclick="go('${x[0]}')">${icon(x[0])}<span>${x[1]}</span></button>`,
          )
          .join("");
        let pa = $(".profile-trigger .avatar");
        if (pa) pa.innerHTML = personPortrait("eric");
        renderUserMenu();
      }
      function renderUserMenu() {
        let host = $("#userPopover"),
          label =
            app.settings.level === "essential"
              ? "Essentiel"
              : app.settings.level === "pilot"
                ? "Pilotage"
                : "Expert";
        if (!host) return;
        $("#profileLevel").textContent = `${label} ⌄`;
        host.innerHTML = `<div class="user-popover-head"><b>Eric Leduc</b><small>Conducteur de travaux</small></div><div class="user-popover-section"><span class="user-popover-label">VUE</span>${[
          ["essential", "Essentiel", "Comprendre et agir"],
          ["pilot", "Pilotage", "Organiser et arbitrer"],
          ["expert", "Expert", "Analyser en profondeur"],
        ]
          .map(
            (x) =>
              `<button class="${app.settings.level === x[0] ? "selected" : ""}" onclick="setDepth('${x[0]}')"><b>${app.settings.level === x[0] ? "✓ " : " "}${x[1]}</b><small>${x[2]}</small></button>`,
          )
          .join(
            "",
          )}</div><div class="user-popover-section"><span class="user-popover-label">APPARENCE</span><div class="appearance-options">${[
          ["light", "Clair"],
          ["dark", "Sombre"],
          ["system", "Système"],
        ]
          .map(
            (x) =>
              `<button class="${app.settings.appearance === x[0] ? "selected" : ""}" onclick="setAppearance('${x[0]}')">${x[1]}</button>`,
          )
          .join(
            "",
          )}</div></div><div class="user-popover-section"><button class="user-action" onclick="setRole('artisan');closeUserMenu()">Voir comme artisan</button><button class="user-action" onclick="go('more');closeUserMenu()">Réglages</button><button class="user-action danger" onclick="resetApp();closeUserMenu()">Réinitialiser la démo</button></div>`;
      }
      function toggleUserMenu() {
        let menu = $("#userPopover"),
          open = !menu.classList.contains("open");
        menu.classList.toggle("open", open);
        $("#profileTrigger").setAttribute("aria-expanded", open);
      }
      function closeUserMenu() {
        $("#userPopover")?.classList.remove("open");
        $("#profileTrigger")?.setAttribute("aria-expanded", "false");
      }
      function setAppearance(value) {
        app.settings.appearance = value;
        save();
        applyAppearance();
        renderUserMenu();
      }
      function setDepth(level) {
        app.settings.level = level;
        if (level === "essential") {
          app.settings.period = "week";
          app.settings.dependencies = false;
        }
        save();
        closeUserMenu();
        render();
        toastDepthChanged(level);
      }
      function toastDepthChanged(level) {
        let messages = {
            essential: "Vue simplifiée activée",
            pilot: "Outils de planification et d’arbitrage activés",
            expert: "Analyse avancée activée",
          },
          t = $("#toast");
        t.textContent = messages[level];
        t.classList.add("show");
        clearTimeout(window.depthToastTimer);
        window.depthToastTimer = setTimeout(
          () => t.classList.remove("show"),
          2200,
        );
      }
      function renderPage() {
        let f =
          {
            today: pageToday,
            sites: renderSites,
            project: renderProject,
            team: renderTeam,
            planning: renderPlanning,
            resources: renderResources,
            documents: renderDocuments,
            photos: renderPhotos,
            impact: renderImpact,
            more: renderMore,
            artisan: renderArtisan,
          }[app.ui.page] || pageToday;
        $("#main").innerHTML =
          simulationBanner() +
          `<section class="page active" id="${app.ui.page}">${f()}</section>`;
        nav();
        requestAnimationFrame(drawDeps);
        if (app.ui.page === "planning") setupPlanningScroll();
        if (app.ui.page === "today") setupTodayHalo();
      }
      function render() {
        applyAppearance();
        document.body.classList.toggle(
          "artisan-body",
          app.settings.role === "artisan",
        );
        document.body.dataset.level = app.settings.level;
        renderPage();
      }
      function go(p) {
        if (p === "planning" && app.ui.page !== "planning")
          app.ui.planningNeedsCenter = true;
        if (p === "today" && app.ui.page !== "today") todayHaloPending = true;
        if (p === "documents" || p === "photos") {
          app.ui.docQuery = "";
          app.ui.docCategory = "all";
        }
        app.ui.page = p;
        save();
        renderPage();
        scrollTo(0, 0);
      }
      function setRole(r) {
        app.settings.role = r;
        app.ui.page = r === "artisan" ? "artisan" : "today";
        save();
        render();
      }
      function applyAppearance() {
        let d =
          app.settings.appearance === "dark" ||
          (app.settings.appearance === "system" &&
            matchMedia("(prefers-color-scheme:dark)").matches);
        document.body.classList.toggle("dark", d);
      }
      $("#cmdInput").addEventListener("input", () => {
        cmdIndex = 0;
        renderCommands();
      });
      $("#cmdInput").addEventListener("keydown", (e) => {
        let xs = commands(e.currentTarget.value);
        if (e.key === "ArrowDown") {
          e.preventDefault();
          cmdIndex = Math.min(xs.length - 1, cmdIndex + 1);
          renderCommands();
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          cmdIndex = Math.max(0, cmdIndex - 1);
          renderCommands();
        }
        if (e.key === "Enter" && xs[cmdIndex]) {
          xs[cmdIndex].run();
          $("#cmd").classList.remove("open");
        }
      });
      $("#cmd").addEventListener("click", (e) => {
        if (e.target === $("#cmd")) $("#cmd").classList.remove("open");
      });
      $$(".drawer,.modal").forEach((x) =>
        x.addEventListener("click", (e) => {
          if (e.target === x) closeOverlay(x.id);
        }),
      );
      $("#aiOverlay")?.addEventListener("click", (e) => {
        if (e.target === $("#aiOverlay")) closeAIPanel();
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#profileArea")) closeUserMenu();
        if (!e.target.closest(".more-menu")) closeDrawerMenu();
      });
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openCommand();
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "j") {
          e.preventDefault();
          toggleAIPanel();
        }
        if (e.key === "Escape") {
          // 1er Échap : ferme un menu contextuel ouvert avant le sidewindow lui-même
          if (anyDrawerMenuOpen()) {
            closeDrawerMenu();
            return;
          }
          closeUserMenu();
          $("#cmd").classList.remove("open");
          closeOverlay("drawer");
          closeOverlay("modal");
          closeAIPanel();
        }
      });
      window.addEventListener("resize", () => requestAnimationFrame(drawDeps));
      matchMedia("(prefers-color-scheme: dark)").addEventListener(
        "change",
        () => {
          if (app.settings.appearance === "system") applyAppearance();
        },
      );
      render();
    </script>
  </body>
</html>
