              severity: f.get("severity"),
              source: field ? "field" : "planning",
              comment: f.get("comment") || "À examiner",
            });
            if (f.get("severity") === "critical")
              app.decisions.push({
                id: "decision-" + Date.now(),
                issueId: app.issues.at(-1).id,
                status: "required",
              });
            save();
          },
        );
      }
      function openDocumentForm() {
        modalForm(
          "Ajouter un document",
          `<input name="name" required placeholder="Nom du document"><select name="projectId">${app.projects.map((p) => `<option value="${p.id}">${p.name}</option>`)}</select><input name="file" type="file">`,
          (f) => {
            app.documents.push({
              id: "doc-" + Date.now(),
              name: f.get("name"),
              projectId: f.get("projectId"),
              taskId: null,
              type: "PDF",
              date: localDateTime(new Date()),
            });
            save();
          },
        );
      }
      function addPhoto({
        projectId,
        taskId = null,
        resourceId = null,
        author = "Eric",
        comment = "Photo chantier",
      }) {
        let photo = {
          id: "photo-" + Date.now(),
          projectId,
          taskId,
          resourceId,
          author,
          date: localDateTime(getDemoNow()),
          comment,
        };
        app.photos.push(photo);
        if (taskId)
          app.messages.push({
            id: Date.now(),
            projectId,
            taskId,
            resourceId,
            from: app.settings.role === "artisan" ? "artisan" : "driver",
            text: "Photo terrain ajoutée.",
            time: fmtTime(getDemoNow()),
            read: true,
          });
        app.history.unshift({
          date: fmtTime(getDemoNow()),
          text: `Photo ajoutée — ${taskId ? task(taskId).name : project(projectId).name}`,
          author,
        });
        save();
        return photo;
      }
      function addFieldPhoto(taskId = null, projectId = app.ui.projectId) {
        let t = taskId ? task(taskId) : null,
          r = t
            ? resource(t.resourceId)
            : resource(app.settings.artisanResourceId);
        addPhoto({
          projectId: t?.projectId || projectId,
          taskId: t?.id || null,
          resourceId: t?.resourceId || null,
          author: r?.name || "Eric",
          comment: t
            ? "Photo ajoutée depuis le terrain."
            : "Photo ajoutée au chantier.",
        });
        render();
        actionToast("Photo ajoutée");
      }
      function openPhotoForm(projectId = app.ui.projectId) {
        let tasks = getProjectTasks(projectId);
        $("#modalContent").innerHTML =
          `<h2>Ajouter une photo</h2><form id="photoForm" style="display:grid;gap:12px"><label>Photo liée à<select name="taskId"><option value="">Chantier uniquement</option>${tasks.map((t) => `<option value="${t.id}">${t.name}</option>`).join("")}</select></label><input name="comment" value="Photo chantier" placeholder="Commentaire"><button class="btn primary">Ajouter la photo</button></form>`;
        $("#modal").classList.add("open");
        $("#photoForm").onsubmit = (e) => {
          e.preventDefault();
          let f = new FormData(e.currentTarget),
            tid = f.get("taskId"),
            t = task(tid);
          addPhoto({
            projectId,
            taskId: tid || null,
            resourceId: t?.resourceId || null,
            author: "Eric",
            comment: f.get("comment") || "Photo chantier",
          });
          closeOverlay("modal");
          renderPage();
          actionToast("Photo ajoutée au bon chantier");
        };
      }
      function renderConversation(taskId = "") {
        let t =
            task(taskId) ||
            getArtisanTodayTasks(app.settings.artisanResourceId)[0],
          r = t
            ? resource(t.resourceId)
            : resource(app.settings.artisanResourceId),
          messages = app.messages.filter((m) => !t || m.taskId === t.id);
        $("#modalContent").innerHTML =
          `<h2>${t ? project(t.projectId).name : "Messages"}</h2><p class="muted">${r.name}${t ? " · " + t.name : ""}</p>${messages.map((m) => `<div class="message ${m.from}">${m.text}<small>${m.time}${m.from === "artisan" ? " · Lu" : ""}</small></div>`).join("")}<div class="toolbar"><input id="messageInput" style="flex:1" placeholder="Écrire un message…"><button class="btn primary" onclick="sendMessage('${t?.id || ""}')">Envoyer</button></div>`;
        $("#modal").classList.add("open");
      }
      function sendMessage(taskId = "") {
        let v = $("#messageInput").value,
          t = task(taskId);
        if (!v) return;
        app.messages.push({
          id: Date.now(),
          projectId: t?.projectId || null,
          taskId: t?.id || null,
          resourceId: t?.resourceId || app.settings.artisanResourceId,
          from: app.settings.role === "artisan" ? "artisan" : "driver",
          text: v,
          time: fmtTime(getDemoNow()),
          read: true,
        });
        save();
        renderConversation(taskId);
      }
      function artisanDetails(taskId) {
        let t = task(taskId),
          p = project(t.projectId);
        $("#modalContent").innerHTML =
          `<h2>Détails</h2><p><b>Chantier</b><br>${p.name} · ${p.location}</p><p><b>Conducteur</b><br>Eric Leduc</p><button class="btn" onclick="go('documents')">Documents</button> <button class="btn" onclick="renderConversation('${t.id}')">Conversation</button>`;
        $("#modal").classList.add("open");
      }
      function viewDocument(id) {
        let d = app.documents.find((x) => x.id === id);
        $("#modalContent").innerHTML =
          `<div class="doc-preview" style="height:300px;margin-bottom:16px">${documentPreview(d)}</div><h2>${esc(d.name)}</h2><p class="muted">${project(d.projectId).name} · ${d.type} · ${fmtDay(d.date)}</p>`;
        $("#modal").classList.add("open");
      }
      function viewPhoto(id) {
        let p = app.photos.find((x) => x.id === id);
        $("#modal").classList.add("full", "open");
        $("#modalContent").innerHTML =
          `<div class="photo" style="height:56vh;margin-bottom:14px">${fieldPhotoSVG(hashHue(p.id))}</div><h2>${esc(p.comment)}</h2><p class="muted">${project(p.projectId).name} · ${task(p.taskId)?.name || "Chantier"} · ${p.author} · ${fmtDay(p.date)}</p>${p.taskId ? `<button class="btn" onclick="openTask('${p.taskId}')" style="margin-top:12px">Voir la tâche</button>` : ""}`;
      }
      function openAdd() {
        if (app.ui.page === "team") openResourceForm();
        else if (app.ui.page === "project") {
          modalForm(
            "Ajouter à ce chantier",
            `<button type="button" class="btn" onclick="closeOverlay('modal');openTaskForm()">Nouvelle tâche</button><button type="button" class="btn" onclick="closeOverlay('modal');openDocumentForm()">Document</button><button type="button" class="btn" onclick="closeOverlay('modal');openPhotoForm(app.ui.projectId)">Photo</button>`,
            () => {},
          );
        } else
          modalForm(
            "Que voulez-vous ajouter ?",
            `<button type="button" class="btn" onclick="closeOverlay('modal');openTaskForm()">Nouvelle tâche</button><button type="button" class="btn" onclick="closeOverlay('modal');openIssueForm()">Signaler un problème</button>`,
            () => {},
          );
      }
      function closeOverlay(id) {
        $("#" + id).classList.remove("open", "full");
      }
      // COMMAND PALETTE
      const norm = (s) =>
        s
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      let cmdIndex = 0;
      function commands(q = "") {
        let xs = [
          ...app.projects.map((p) => ({
            cat: "RECHERCHER",
            label: p.name,
            meta: "Chantier",
            run: () => selectProject(p.id),
          })),
          ...app.tasks.map((t) => ({
            cat: "RECHERCHER",
            label: t.name,
            meta: project(t.projectId).name,
            run: () => openTask(t.id),
          })),
          ...app.resources.map((r) => ({
            cat: "RECHERCHER",
            label: r.name,
            meta: r.scope,
            run: () => openResource(r.id),
          })),
          {
            cat: "NAVIGUER",
            label: "Planning",
            meta: "Page",
            run: () => go("planning"),
          },
          {
            cat: "NAVIGUER",
            label: "Ouvrir Assistant Kanvix",
            meta: "Assistant",
            run: () => toggleAIPanel(),
          },
          {
            cat: "NAVIGUER",
            label: "Documents",
            meta: "Outil",
            run: () => go("documents"),
          },
          {
            cat: "NAVIGUER",
            label: "Photos",
            meta: "Outil",
            run: () => go("photos"),
          },
          {
            cat: "NAVIGUER",
            label: "Ressources et charge",
            meta: "Outil",
            run: () => go("resources"),
          },
          {
            cat: "NAVIGUER",
            label: "Réglages",
            meta: "Profil",
            run: () => go("more"),
          },
          {
            cat: "AGIR",
            label: "Créer une tâche",
            meta: "Action",
            run: openTaskForm,
          },
          {
            cat: "AGIR",
            label: "Passer en mode Expert",
            meta: "Réglage",
            run: () => {
              setDepth("expert");
            },
          },
        ];
        return xs
          .filter((x) => norm(x.label + " " + x.meta).includes(norm(q)))
          .slice(0, 10);
      }
      function openCommand() {
        cmdIndex = 0;
        $("#cmd").classList.add("open");
        $("#cmdInput").value = "";
        renderCommands();
        setTimeout(() => $("#cmdInput").focus(), 0);
      }
      function renderCommands() {
        let xs = commands($("#cmdInput").value),
          last = "";
        $("#cmdResults").innerHTML = xs
          .map(
            (x, i) =>
              `${x.cat !== last ? ((last = x.cat), `<div class="cmd-label">${x.cat}</div>`) : ""}<div class="cmd-item ${i === cmdIndex ? "selected" : ""}" data-i="${i}"><span>${x.label}</span><small>${x.meta}</small></div>`,
          )
          .join("");
        $$(".cmd-item").forEach(
          (x) =>
            (x.onclick = () => {
              xs[+x.dataset.i].run();
              $("#cmd").classList.remove("open");
            }),
        );
      }
      // NAVIGATION / INITIALIZATION
      function nav() {
        const primaryNavigation = [
          ["today", "Aujourd'hui"],
          ["sites", "Chantiers"],
          ["planning", "Planning"],
          ["team", "Équipe"],
        ];
        $("#nav").innerHTML =
          primaryNavigation
            .map(
              (x) =>
                `<button class="${app.ui.page === x[0] ? "active" : ""}" onclick="go('${x[0]}')">${icon(x[0])}<span>${x[1]}</span></button>`,
            )
            .join("") +
          `<button class="assistant-entry ${app.ui.ai.open ? "ai-nav-active" : ""}" onclick="toggleAIPanel()">${icon("assistant")}<span>Assistant</span></button>`;
        let pa = $(".profile-trigger .avatar");
        if (pa) pa.innerHTML = personPortrait("eric");
        renderUserMenu();
      }
      function renderUserMenu() {
        let host = $("#userPopover"),
          label =
            app.settings.level === "essential"
              ? "Essentiel"
              : app.settings.level === "pilot"
                ? "Pilotage"
                : "Expert";
        if (!host) return;
        $("#profileLevel").textContent = `${label} ⌄`;
        host.innerHTML = `<div class="user-popover-head"><b>Eric Leduc</b><small>Conducteur de travaux</small></div><div class="user-popover-section"><span class="user-popover-label">VUE</span>${[
          ["essential", "Essentiel", "Comprendre et agir"],
          ["pilot", "Pilotage", "Organiser et arbitrer"],
          ["expert", "Expert", "Analyser en profondeur"],
        ]
          .map(
            (x) =>
              `<button class="${app.settings.level === x[0] ? "selected" : ""}" onclick="setDepth('${x[0]}')"><b>${app.settings.level === x[0] ? "✓ " : " "}${x[1]}</b><small>${x[2]}</small></button>`,
          )
          .join(
            "",
          )}</div><div class="user-popover-section"><span class="user-popover-label">APPARENCE</span><div class="appearance-options">${[
          ["light", "Clair"],
          ["dark", "Sombre"],
          ["system", "Système"],
        ]
          .map(
            (x) =>
              `<button class="${app.settings.appearance === x[0] ? "selected" : ""}" onclick="setAppearance('${x[0]}')">${x[1]}</button>`,
          )
          .join(
            "",
          )}</div></div><div class="user-popover-section"><button class="user-action" onclick="setRole('artisan');closeUserMenu()">Voir comme artisan</button><button class="user-action" onclick="go('more');closeUserMenu()">Réglages</button><button class="user-action danger" onclick="resetApp();closeUserMenu()">Réinitialiser la démo</button></div>`;
      }
      function toggleUserMenu() {
        let menu = $("#userPopover"),
          open = !menu.classList.contains("open");
        menu.classList.toggle("open", open);
        $("#profileTrigger").setAttribute("aria-expanded", open);
      }
      function closeUserMenu() {
        $("#userPopover")?.classList.remove("open");
        $("#profileTrigger")?.setAttribute("aria-expanded", "false");
      }
      function setAppearance(value) {
        app.settings.appearance = value;
        save();
        applyAppearance();
        renderUserMenu();
      }
      function setDepth(level) {
        app.settings.level = level;
        if (level === "essential") {
          app.settings.period = "week";
          app.settings.dependencies = false;
        }
        save();
        closeUserMenu();
        render();
        toastDepthChanged(level);
      }
      function toastDepthChanged(level) {
        let messages = {
            essential: "Vue simplifiée activée",
            pilot: "Outils de planification et d’arbitrage activés",
            expert: "Analyse avancée activée",
          },
          t = $("#toast");
        t.textContent = messages[level];
        t.classList.add("show");
        clearTimeout(window.depthToastTimer);
        window.depthToastTimer = setTimeout(
          () => t.classList.remove("show"),
          2200,
        );
      }
      function renderPage() {
        let f =
          {
            today: pageToday,
            sites: renderSites,
            project: renderProject,
            team: renderTeam,
            planning: renderPlanning,
            resources: renderResources,
            documents: renderDocuments,
            photos: renderPhotos,
            impact: renderImpact,
            more: renderMore,
            artisan: renderArtisan,
          }[app.ui.page] || pageToday;
        $("#main").innerHTML =
          simulationBanner() +
          `<section class="page active" id="${app.ui.page}">${f()}</section>`;
        nav();
        requestAnimationFrame(drawDeps);
        if (app.ui.page === "planning") setupPlanningScroll();
      }
      function render() {
        applyAppearance();
        document.body.classList.toggle(
          "artisan-body",
          app.settings.role === "artisan",
        );
        document.body.dataset.level = app.settings.level;
        renderPage();
      }
      function go(p) {
        if (p === "planning" && app.ui.page !== "planning")
          app.ui.planningNeedsCenter = true;
        app.ui.page = p;
        save();
        renderPage();
        scrollTo(0, 0);
      }
      function setRole(r) {
        app.settings.role = r;
        app.ui.page = r === "artisan" ? "artisan" : "today";
        save();
        render();
      }
      function applyAppearance() {
        let d =
          app.settings.appearance === "dark" ||
          (app.settings.appearance === "system" &&
            matchMedia("(prefers-color-scheme:dark)").matches);
        document.body.classList.toggle("dark", d);
      }
      $("#cmdInput").addEventListener("input", () => {
        cmdIndex = 0;
        renderCommands();
      });
      $("#cmdInput").addEventListener("keydown", (e) => {
        let xs = commands(e.currentTarget.value);
        if (e.key === "ArrowDown") {
          e.preventDefault();
          cmdIndex = Math.min(xs.length - 1, cmdIndex + 1);
          renderCommands();
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          cmdIndex = Math.max(0, cmdIndex - 1);
          renderCommands();
        }
        if (e.key === "Enter" && xs[cmdIndex]) {
          xs[cmdIndex].run();
          $("#cmd").classList.remove("open");
        }
      });
      $("#cmd").addEventListener("click", (e) => {
        if (e.target === $("#cmd")) $("#cmd").classList.remove("open");
      });
      $$(".drawer,.modal").forEach((x) =>
        x.addEventListener("click", (e) => {
          if (e.target === x) closeOverlay(x.id);
        }),
      );
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#profileArea")) closeUserMenu();
      });
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openCommand();
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "j") {
          e.preventDefault();
          toggleAIPanel();
        }
        if (e.key === "Escape") {
          closeUserMenu();
          $("#cmd").classList.remove("open");
          closeOverlay("drawer");
          closeOverlay("modal");
          closeAIPanel();
        }
      });
      window.addEventListener("resize", () => requestAnimationFrame(drawDeps));
      matchMedia("(prefers-color-scheme: dark)").addEventListener(
        "change",
        () => {
          if (app.settings.appearance === "system") applyAppearance();
        },
      );
      render();
    </script>
  </body>
</html>
