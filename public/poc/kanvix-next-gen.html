<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:" />
    <title>Kanvix — Piloter simplement</title>
    <style id="kanvix-css">
      /* ============================================================
         KANVIX — Design System (POC nouvelle génération)
         Fond métier BLANC · sidebar teintée · cartes blanches
         bordures fines · ombres légères · bleu Kanvix parcimonieux
         ============================================================ */
      :root {
        /* Surfaces */
        --app-bg: #ffffff;
        --surface: #ffffff;
        --surface-subtle: #f7f9fc;
        --surface-muted: #f1f4f8;
        /* Sidebar */
        --sidebar-bg: #f5f7fa;
        --sidebar-border: #e3e8ef;
        --sidebar-text: #475467;
        --sidebar-muted: #8593a5;
        --sidebar-hover: #eaeef4;
        --sidebar-active-bg: #eaf1ff;
        --sidebar-active-text: #1456c7;
        --sidebar-brand: #101828;
        /* Text */
        --text: #111827;
        --text-secondary: #596579;
        --text-tertiary: #7b8798;
        /* Borders */
        --border-light: #e8ecf2;
        --border: #dce2ea;
        --border-strong: #c9d2dd;
        /* Accent */
        --accent: #1769ff;
        --accent-hover: #0d5bea;
        --accent-soft: #edf4ff;
        --accent-ink: #1456c7;
        /* Status */
        --success: #19a45b;
        --success-soft: #edf9f2;
        --warning: #d97b1f;
        --warning-soft: #fff5e9;
        --danger: #e5484d;
        --danger-soft: #fff0f1;
        /* Shadows */
        --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04),
          0 2px 6px rgba(15, 23, 42, 0.04);
        --shadow-card: 0 4px 16px rgba(15, 23, 42, 0.06);
        --shadow-pop: 0 12px 40px rgba(15, 23, 42, 0.14);
        /* Radius */
        --radius-xs: 6px;
        --radius-sm: 8px;
        --radius-md: 11px;
        --radius-lg: 14px;
        /* Legacy aliases (compat with carried-over rules / inline styles) */
        --canvas: var(--surface-muted);
        --line: var(--border-light);
        --surface-elevated: var(--surface);
        --shadow-sm: var(--shadow-card);
        --shadow-md: var(--shadow-pop);
        --success-border: #a7dcbf;
        --warning-border: #efc38a;
        --danger-border: #f4b9bb;
        --success-ink: #0f7a41;
        --warning-ink: #a45b12;
        --danger-ink: #c13b40;
      }
      body.dark {
        --app-bg: #0b1622;
        --surface: #10202f;
        --surface-subtle: #14283a;
        --surface-muted: #172d40;
        --sidebar-bg: #0c1a28;
        --sidebar-border: #1e3346;
        --sidebar-text: #a9bccf;
        --sidebar-muted: #6f8398;
        --sidebar-hover: #142a3d;
        --sidebar-active-bg: #14345a;
        --sidebar-active-text: #cfe1ff;
        --sidebar-brand: #f4f8fc;
        --text: #eef4f9;
        --text-secondary: #a3b3c4;
        --text-tertiary: #75899c;
        --border-light: #1d3244;
        --border: #26405a; /* Layout */
        --border-strong: #33526f;
        --accent: #5c9bff;
        --accent-hover: #78adff;
        --accent-soft: #17335a;
        --accent-ink: #cfe1ff;
        --success: #46c17d;
        --success-soft: #12321f;
        --warning: #e8a24d;
        --warning-soft: #35270f;
        --danger: #f2686d;
        --danger-soft: #391c1f;
        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-card: 0 6px 22px rgba(0, 0, 0, 0.4);
        --shadow-pop: 0 18px 50px rgba(0, 0, 0, 0.55);
        --success-border: #1e5236;
        --warning-border: #5a441f;
        --danger-border: #5c2f32;
      }

      /* ---------------- Base ---------------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--app-bg);
        color: var(--text);
        font: 400 14px/1.5 Inter, ui-sans-serif, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button:not(.native-control) {
        -webkit-appearance: none;
        appearance: none;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      input,
      select,
      textarea {
        color-scheme: light;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 9px 11px;
        outline: 0;
      }
      body.dark input,
      body.dark select,
      body.dark textarea {
        color-scheme: dark;
      }
      select option {
        background: var(--surface);
        color: var(--text);
      }
      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      h1,
      h2,
      h3 {
        color: var(--text);
      }

      /* ---------------- Shell / Sidebar ---------------- */
      .shell {
        display: grid;
        grid-template-columns: 178px minmax(0, 1fr);
        min-height: 100vh;
        background: var(--app-bg);
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        border-right: 1px solid var(--sidebar-border);
        padding: 22px 14px 16px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 2px 8px 22px;
        color: var(--sidebar-brand);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .brand svg {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        display: block;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav button {
        width: 100%;
        border: 0;
        background: none;
        color: var(--sidebar-text);
        min-height: 38px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        font-size: 13.5px;
        font-weight: 500;
        transition: background 0.14s, color 0.14s;
      }
      .nav button:hover {
        background: var(--sidebar-hover);
        color: var(--sidebar-brand);
      }
      .nav button.active {
        background: var(--sidebar-active-bg);
        color: var(--sidebar-active-text);
        font-weight: 600;
      }
      .nav svg {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav button.active svg {
        stroke: var(--accent);
      }
      .nav .assistant-entry {
        position: relative;
        margin-top: 18px;
        color: var(--sidebar-text);
      }
      .nav .assistant-entry svg {
        stroke: var(--accent);
      }
      .nav .assistant-entry:before {
        content: "";
        position: absolute;
        top: -10px;
        left: 10px;
        right: 10px;
        height: 1px;
        background: var(--sidebar-border);
      }
      .nav .assistant-entry.ai-nav-active {
        background: var(--sidebar-active-bg) !important;
        color: var(--sidebar-active-text) !important;
      }
      .nav .assistant-entry.ai-nav-active:after {
        content: "";
        width: 6px;
        height: 6px;
        margin-left: auto;
        border-radius: 50%;
        background: var(--accent);
      }
      /* Profile */
      .profile {
        margin-top: auto;
        border-top: 1px solid var(--sidebar-border);
        padding: 12px 2px 0;
        position: relative;
      }
      .profile-trigger {
        width: 100%;
        min-height: 50px;
        padding: 6px 6px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: transparent;
        color: var(--sidebar-brand);
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
      }
      .profile-trigger:hover,
      .profile-trigger[aria-expanded="true"] {
        background: var(--sidebar-hover);
      }
      .profile-copy {
        min-width: 0;
        line-height: 1.3;
      }
      .profile-copy b {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
      }
      .profile-copy small {
        display: block;
        color: var(--sidebar-muted);
        font-size: 11px;
      }
      .profile-level {
        display: inline-block;
        margin-top: 3px;
        color: var(--accent-ink);
        font-size: 10.5px;
        font-weight: 600;
      }
      .avatar {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 50%;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-weight: 700;
        font-size: 12px;
      }
      .avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* User popover */
      .user-popover {
        display: none;
        position: absolute;
        left: 0;
        bottom: 64px;
        width: 244px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow-pop);
        z-index: 80;
      }
      .user-popover.open {
        display: block;
      }
      .user-popover-head {
        padding: 4px 6px 10px;
      }
      .user-popover-head b {
        display: block;
        font-size: 13px;
      }
      .user-popover-head small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
      }
      .user-popover-section {
        padding: 9px 0;
        border-top: 1px solid var(--border-light);
      }
      .user-popover-label {
        display: block;
        padding: 0 6px 6px;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .user-popover button {
        width: 100%;
        padding: 8px 8px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--text);
        text-align: left;
        font-size: 13px;
      }
      .user-popover button:hover {
        background: var(--surface-subtle);
      }
      .user-popover button.selected {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .user-popover button small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 400;
      }
      .appearance-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
      }
      .appearance-options button {
        text-align: center;
        font-size: 11.5px;
        border: 1px solid var(--border);
      }
      .user-action {
        color: var(--text-secondary) !important;
      }
      .user-action.danger {
        color: var(--danger) !important;
      }

      /* ---------------- Main / header ---------------- */
      .main {
        background: var(--app-bg);
        padding: 34px 40px 60px;
        max-width: 1320px;
        width: 100%;
        margin: 0 auto;
        min-width: 0;
      }
      .page {
        display: none;
        animation: fade 0.18s ease;
      }
      .page.active {
        display: block;
      }
      @keyframes fade {
        from {
          opacity: 0.4;
          transform: translateY(3px);
        }
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 26px;
      }
      .header h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 3px;
      }
      .muted {
        color: var(--text-secondary);
      }
      .context {
        font-size: 12px;
        color: var(--text-secondary);
        text-align: right;
      }
      .context b {
        display: block;
        color: var(--text);
      }
      /* Dots */
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        margin-right: 8px;
        flex: 0 0 8px;
      }
      .dot.warning {
        background: var(--warning);
      }
      .dot.danger {
        background: var(--danger);
      }
      .dot.accent {
        background: var(--accent);
      }

      /* ---------------- Buttons ---------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        padding: 8px 13px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
        transition: background 0.14s, border-color 0.14s, transform 0.05s;
      }
      .btn svg {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn:hover {
        background: var(--surface-subtle);
        border-color: var(--text-tertiary);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        box-shadow: 0 1px 2px rgba(23, 105, 255, 0.35);
      }
      .btn.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .link {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 0;
        font-weight: 600;
        font-size: 13px;
      }
      .link:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }
      .divider {
        border-top: 1px solid var(--border-light);
      }

      /* ---------------- Rows ---------------- */
      .row {
        display: grid;
        grid-template-columns: 12px 1fr auto;
        gap: 12px;
        padding: 14px 2px;
        border-top: 1px solid var(--border-light);
        align-items: start;
        cursor: pointer;
      }
      .row:first-child {
        border-top: 0;
      }
      .row:hover {
        background: var(--surface-subtle);
      }
      .row h3 {
        font-size: 14px;
        margin: 0 0 3px;
      }
      .row p {
        margin: 2px 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .row .avatar {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
      }

      /* ---------------- Pills ---------------- */
      .pill {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 20px;
        background: var(--surface-muted);
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .pill.danger {
        background: var(--danger-soft);
        color: var(--danger-ink);
      }
      .pill.warning {
        background: var(--warning-soft);
        color: var(--warning-ink);
      }
      .pill.success {
        background: var(--success-soft);
        color: var(--success-ink);
      }
      .pill.accent {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      body.dark .pill.danger,
      body.dark .pill.warning,
      body.dark .pill.success,
      body.dark .pill.accent {
        color: #fff;
      }

      /* ---------------- Sections / generic ---------------- */
      .section {
        margin-top: 24px;
      }
      .section-title {
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        font-weight: 700;
        margin: 0 0 10px;
      }
      .empty {
        padding: 16px 0;
        color: var(--text-secondary);
      }
      .empty b {
        display: block;
        color: var(--text);
        font-size: 15px;
        margin-bottom: 2px;
      }
      .attention-layout {
        display: grid;
        grid-template-columns: 1.25fr 0.75fr;
        gap: 40px;
        align-items: start;
      }
      .decision {
        padding: 20px;
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-lg);
        background: var(--danger-soft);
      }
      .decision h2 {
        font-size: 19px;
        margin: 6px 0;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-tertiary);
      }
      .eyebrow.danger {
        color: var(--danger-ink);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* ---------------- Today / workflow ---------------- */
      .today-hero {
        padding: 2px 0 22px;
      }
      .today-hero h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .today-hero p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
      }
      .today-workflow {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 16px;
        align-items: start;
      }
      .workflow-lane {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-xs);
      }
      .workflow-lane > h2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 11px 16px;
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.01em;
        border-bottom: 1px solid var(--border-light);
      }
      .workflow-lane > h2:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 2px;
      }
      .workflow-lane > h2 span {
        display: grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        margin-left: auto;
      }
      .decision-lane > h2 {
        background: var(--danger-soft);
        color: var(--danger-ink);
      }
      .decision-lane > h2:before {
        background: var(--danger);
      }
      .decision-lane > h2 span {
        background: var(--danger);
        color: #fff;
      }
      .today-lane > h2 {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .today-lane > h2:before {
        background: var(--accent);
      }
      .today-lane > h2 span {
        background: var(--accent);
        color: #fff;
      }
      .watch-lane > h2 {
        background: var(--warning-soft);
        color: var(--warning-ink);
      }
      .watch-lane > h2:before {
        background: var(--warning);
      }
      .watch-lane > h2 span {
        background: var(--warning);
        color: #fff;
      }
      .lane-content {
        padding: 4px 16px 8px;
      }
      .calm-workflow {
        grid-template-columns: minmax(420px, 640px);
        justify-content: center;
      }
      .decision-card {
        display: block;
        padding: 14px 0 12px;
        border-bottom: 1px solid var(--border-light);
      }
      .decision-card:last-child {
        border-bottom: 0;
      }
      .decision-card h3 {
        font-size: 16px;
        margin: 6px 0 2px;
      }
      .decision-card p,
      .watch-card p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .impact-facts {
        display: grid;
        gap: 3px;
        margin: 12px 0 14px;
      }
      .impact-facts b {
        font-size: 13px;
      }
      .impact-facts span {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .impact-mini {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
      }
      .impact-mini small {
        display: block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
      }
      .mini-track {
        height: 7px;
        background: var(--surface-muted);
        border-radius: 8px;
        position: relative;
        margin: 5px 0 11px;
      }
      .mini-track i {
        position: absolute;
        height: 7px;
        border-radius: 8px;
      }
      .baseline-mini {
        background: var(--text-tertiary);
      }
      .actual-mini {
        background: var(--danger);
      }
      .workflow-task {
        display: grid;
        grid-template-columns: 9px minmax(0, 1fr) auto;
        gap: 11px;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid var(--border-light);
        cursor: pointer;
      }
      .workflow-task:last-child,
      .watch-card:last-child {
        border-bottom: 0;
      }
      .workflow-task h3 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .workflow-task p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .workflow-task small {
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .watch-card {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 11px;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid var(--border-light);
      }
      .watch-card h3 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .lane-empty {
        display: grid;
        gap: 3px;
        justify-items: start;
        padding: 16px 2px;
        color: var(--success);
        font-size: 13px;
      }
      .lane-empty b {
        color: var(--text);
        font-size: 14px;
      }
      .lane-empty small {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .technical-details {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--border-light);
        color: var(--text-secondary);
        font-size: 12px;
      }
      .technical-details summary {
        color: var(--accent);
        font-weight: 600;
        cursor: pointer;
      }

      /* ---------------- Chantiers (sites) ---------------- */
      .portfolio-summary {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .portfolio-summary b {
        font-size: 13px;
      }
      .portfolio-summary span {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .portfolio-summary .danger {
        color: var(--danger-ink);
      }
      .portfolio-summary .warning {
        color: var(--warning-ink);
      }
      .portfolio-summary .success {
        color: var(--success-ink);
      }
      .portfolio-list {
        display: grid;
        gap: 14px;
      }
      .site-card {
        display: grid;
        grid-template-columns: 220px 1fr 240px;
        gap: 26px;
        align-items: center;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
        transition: box-shadow 0.16s, border-color 0.16s, transform 0.12s;
      }
      .site-card:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-card);
        border-color: var(--border-strong);
      }
      .site-art {
        height: 120px;
        border-radius: var(--radius-md);
        overflow: hidden;
        background: var(--surface-muted);
      }
      .site-art svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .site-main h2 {
        font-size: 18px;
        margin: 6px 0 0;
      }
      .location {
        color: var(--text-secondary);
        margin: 2px 0 12px;
        font-size: 13px;
      }
      .site-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--success-ink);
      }
      .site-status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .site-status.warning {
        color: var(--warning-ink);
      }
      .site-status.warning i {
        background: var(--warning);
      }
      .site-status.danger {
        color: var(--danger-ink);
      }
      .site-status.danger i {
        background: var(--danger);
      }
      .site-meta {
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
      }
      .site-meta small,
      .site-next > small,
      .team-filters small {
        display: block;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.09em;
        margin-bottom: 4px;
      }
      .site-meta b {
        font-size: 13px;
      }
      .avatar-stack {
        display: flex;
        align-items: center;
      }
      .avatar-stack .resource-avatar {
        margin-left: -6px;
        box-shadow: 0 0 0 2px var(--surface);
      }
      .avatar-stack .resource-avatar:first-child {
        margin-left: 0;
      }
      .avatar-stack em {
        font-size: 10px;
        font-style: normal;
        font-weight: 600;
        margin-left: 6px;
        color: var(--text-secondary);
      }
      .site-next {
        display: grid;
        gap: 4px;
        border-left: 1px solid var(--border-light);
        padding-left: 22px;
      }
      .site-next b {
        font-size: 14px;
      }
      .site-next span {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .site-next .btn {
        margin-top: 10px;
        justify-self: start;
      }
      .expert-links {
        display: flex;
        gap: 12px;
        margin-top: 12px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
        flex-wrap: wrap;
      }

      /* Resource avatars (portraits + monograms) */
      .resource-avatar {
        --size: 36px;
        width: var(--size);
        height: var(--size);
        flex: 0 0 var(--size);
        border-radius: 50%;
        overflow: hidden;
        display: inline-grid;
        place-items: center;
        background: var(--surface-muted);
      }
      .resource-avatar svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .resource-avatar.small {
        --size: 26px;
      }
      .resource-avatar.company {
        border-radius: 8px;
      }

      /* ---------------- Project cockpit ---------------- */
      .cockpit {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 34px;
        padding: 16px 0 26px;
        border-bottom: 1px solid var(--border-light);
        align-items: start;
      }
      .cockpit h1 {
        font-size: 27px;
        margin: 8px 0 2px;
        letter-spacing: -0.02em;
      }
      .visual {
        height: 210px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--surface-muted);
      }
      .visual svg {
        width: 100%;
        height: 100%;
      }
      .milestone {
        margin: 20px 0;
        padding-left: 15px;
        border-left: 2px solid var(--accent);
      }
      .milestone small {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .milestone b {
        font-size: 15px;
      }
      .tabs {
        display: flex;
        gap: 22px;
        border-bottom: 1px solid var(--border-light);
        overflow: auto;
        margin-top: 6px;
      }
      .tab {
        border: 0;
        background: none;
        padding: 13px 2px;
        color: var(--text-secondary);
        white-space: nowrap;
        font-size: 13.5px;
      }
      .tab.active {
        color: var(--accent);
        font-weight: 600;
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      /* ---------------- Team ---------------- */
      .team-summary {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .team-stat {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 15px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
      }
      .team-stat i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .team-stat.people i {
        background: var(--accent);
      }
      .team-stat.absent i {
        background: var(--danger);
      }
      .team-stat.field i {
        background: var(--success);
      }
      .team-stat.confirm i {
        background: var(--warning);
      }
      .team-stat b {
        font-size: 16px;
        line-height: 1;
      }
      .team-stat span {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .team-filters {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 15px;
        gap: 20px;
        flex-wrap: wrap;
      }
      .team-filters > div {
        display: grid;
        gap: 6px;
      }
      .team-list {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-xs);
      }
      .team-card {
        display: grid;
        grid-template-columns: 40px 1fr 1.4fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px 18px;
        border-top: 1px solid var(--border-light);
        cursor: pointer;
      }
      .team-card:first-child {
        border-top: 0;
      }
      .team-card:hover {
        background: var(--surface-subtle);
      }
      .team-card.is-late {
        box-shadow: inset 3px 0 var(--danger);
      }
      .team-card h3 {
        margin: 0;
        font-size: 14px;
      }
      .team-card p,
      .mission-copy span,
      .mission-copy small {
        display: block;
        margin: 2px 0;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .mission-copy b {
        font-size: 13.5px;
      }
      .mini-load {
        width: 150px;
        height: 5px;
        margin-top: 7px;
        overflow: hidden;
        border-radius: 8px;
        background: var(--surface-muted);
      }
      .mini-load i {
        display: block;
        height: 100%;
        background: var(--accent);
      }

      /* ---------------- Resources load ---------------- */
      .resources {
        overflow: auto;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
      }
      .load-row {
        display: grid;
        grid-template-columns: 190px repeat(5, 1fr);
        min-width: 730px;
        border-top: 1px solid var(--border-light);
      }
      .load-row:first-child {
        border-top: 0;
        background: var(--surface-subtle);
      }
      .load-row > div {
        padding: 13px;
      }
      .load-track {
        height: 8px;
        display: flex;
        gap: 3px;
        align-items: center;
      }
      .load-block {
        height: 7px;
        width: 28px;
        border-radius: 4px;
        background: var(--accent);
        opacity: 0.55;
      }
      .load-block.free {
        width: 10px;
        background: var(--border-strong);
        opacity: 1;
      }
      .load-block.over {
        background: var(--danger);
        opacity: 0.8;
      }
      .ai-nudge {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 14px 16px;
        margin-top: 16px;
        border: 1px solid var(--accent-soft);
        background: var(--accent-soft);
        border-radius: var(--radius-md);
      }
      .ai-nudge b {
        color: var(--accent-ink);
      }

      /* ---------------- Planning / Gantt ---------------- */
      .planning-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }
      .planning-header h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 3px;
      }
      .planning-nav {
        display: flex;
        gap: 7px;
        align-items: center;
        margin-bottom: 12px;
      }
      .planning-nav .btn {
        padding: 7px 11px;
      }
      .planning-nav .period-label {
        margin-left: 8px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .planning-tools {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 12px 0 16px;
      }
      .planning-tools select {
        min-width: 168px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        flex-wrap: wrap;
      }
      .segment {
        display: inline-flex;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        padding: 3px;
        border-radius: var(--radius-sm);
      }
      .segment button {
        border: 0;
        background: none;
        color: var(--text-secondary);
        padding: 6px 13px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
      }
      .segment button.active {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 1px 2px rgba(23, 105, 255, 0.3);
      }
      .segment button:not(.active):hover {
        color: var(--text);
      }
      .gantt-wrap {
        position: relative;
        overflow: auto;
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        background: var(--surface);
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }
      .gantt {
        position: relative;
        --task-col: 210px;
        --cols: 7;
        min-width: min(1060px, calc(100vw - 240px));
      }
      @media (min-width: 1200px) {
        .gantt {
          min-width: 100%;
        }
      }
      .g-head,
      .g-row {
        display: grid;
        grid-template-columns: var(--task-col) repeat(var(--cols), minmax(94px, 1fr));
      }
      .g-head {
        position: sticky;
        top: 0;
        z-index: 6;
        background: var(--surface);
      }
      .g-head > div,
      .g-slot {
        min-height: 50px;
        border-bottom: 1px solid var(--border-light);
        border-right: 1px solid var(--border-light);
        padding: 8px;
      }
      .g-head > div {
        position: relative;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 600;
      }
      .g-head > div:first-child,
      .g-label {
        position: sticky;
        left: 0;
        z-index: 4;
        background: var(--surface);
        box-shadow: 1px 0 0 var(--border-light);
      }
      .g-head > div:first-child {
        z-index: 7;
        color: var(--text);
      }
      .g-head small {
        display: block;
        font-size: 8px;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .g-label {
        padding: 8px 12px;
      }
      .g-label b {
        display: block;
        font-size: 13px;
      }
      .g-label small {
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .g-slot {
        position: relative;
      }
      .g-row {
        min-height: 50px;
      }
      .g-row:hover > div {
        background: var(--surface-subtle);
      }
      .g-project {
        position: sticky;
        left: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 14px;
        background: var(--surface-subtle);
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
        min-width: var(--task-col);
      }
      .g-project button {
        border: 0;
        background: none;
        color: var(--text);
        font-weight: 700;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .project-health {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .project-health i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .project-health.danger i {
        background: var(--danger);
      }
      .g-bar {
        height: 27px;
        top: 11px;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 9px;
        border-radius: 5px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        cursor: grab;
        box-shadow: 0 2px 5px rgba(15, 23, 42, 0.14);
      }
      .g-bar em {
        font-size: 8px;
        font-style: normal;
        letter-spacing: 0.06em;
        opacity: 0.85;
      }
      .g-bar.danger {
        background: var(--danger);
      }
      .g-bar.warning {
        background: var(--warning);
      }
      .g-bar.success {
        background: var(--success);
      }
      .g-bar.ghost {
        position: absolute;
        top: 11px;
        z-index: 1;
        opacity: 0.24;
        filter: grayscale(1);
        box-shadow: none;
      }
      .g-bar.simulated {
        outline: 2px solid var(--surface);
      }
      .g-bar .bar-avatar {
        margin-left: auto;
      }
      .baseline {
        position: absolute;
        height: 4px;
        top: 41px;
        border-radius: 4px;
        background: var(--text-tertiary);
        opacity: 0.5;
        z-index: 1;
      }
      .g-slot.over {
        outline: 2px dashed var(--accent);
        outline-offset: -3px;
      }
      .today-cell,
      .today-col {
        background: var(--accent-soft) !important;
      }
      .g-slot.today-cell {
        border-left: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      }
      .today-marker {
        position: absolute;
        top: 50px;
        bottom: 0;
        width: 1px;
        background: var(--accent);
        z-index: 2;
        pointer-events: none;
      }
      .today-marker span {
        position: absolute;
        top: -18px;
        left: -24px;
        color: var(--accent);
        font-size: 9px;
        font-weight: 700;
      }
      .g-row.selected .g-label {
        box-shadow: inset 3px 0 var(--accent);
        background: var(--accent-soft);
      }
      .deps {
        position: absolute;
        inset: 50px 0 0 var(--task-col);
        pointer-events: none;
        z-index: 3;
      }
      .deps path {
        fill: none;
        stroke: var(--text-tertiary);
        stroke-width: 1.3;
      }
      .focus-flash {
        animation: focusFlash 1.8s ease;
      }
      @keyframes focusFlash {
        0%,
        50% {
          background: var(--accent-soft);
        }
        100% {
          background: transparent;
        }
      }
      .scroll-hint {
        text-align: center;
        color: var(--text-tertiary);
        font-size: 10px;
        padding: 6px;
        display: none;
      }
      .scroll-hint.show {
        display: block;
      }
      .planning-summary {
        padding: 10px 0 14px;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .expert-options {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin: 10px 0 14px;
        padding: 11px 14px;
        border: 1px solid var(--accent-soft);
        border-radius: var(--radius-md);
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-size: 12px;
      }
      .expert-options b {
        font-size: 10px;
        letter-spacing: 0.09em;
      }
      .expert-options label {
        font-weight: 600;
      }
      .expert-options span {
        margin-left: auto;
        color: var(--text-secondary);
      }
      /* Simulation banner + effect */
      .sim-banner {
        position: sticky;
        top: 10px;
        z-index: 9;
        margin: 0 auto 18px;
        max-width: 780px;
        background: var(--surface);
        border: 1px solid var(--warning-border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
        padding: 12px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .sim-banner b {
        font-size: 14px;
      }
      .sim-banner small {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .effect-summary {
        margin: 14px 0;
        padding: 16px;
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
      }
      .effect {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
        margin: 10px 0 0;
      }
      .effect div {
        padding: 12px 14px;
        border-right: 1px solid var(--border-light);
      }
      .effect div:last-child {
        border-right: 0;
      }
      .effect small {
        display: block;
        color: var(--text-secondary);
        font-size: 11px;
        margin-bottom: 3px;
      }
      .what-if {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .form-error {
        min-height: 18px;
        color: var(--danger);
        margin: 0;
        font-size: 12px;
      }
      /* Mobile agenda (planning fallback) */
      .mobile-agenda {
        display: none;
      }

      /* ---------------- Documents ---------------- */
      .docs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 14px;
      }
      .doc {
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
        transition: box-shadow 0.14s, border-color 0.14s, transform 0.12s;
      }
      .doc:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-card);
        border-color: var(--border-strong);
      }
      .doc-preview {
        height: 108px;
        border-radius: var(--radius-sm);
        overflow: hidden;
        margin-bottom: 11px;
        background: var(--surface-muted);
        display: grid;
        place-items: center;
      }
      .doc-preview svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .doc b {
        font-size: 13px;
        display: block;
      }
      .doc .muted {
        font-size: 12px;
        margin: 3px 0 0;
      }
      .doc-type {
        display: inline-block;
        margin-top: 6px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
      }

      /* ---------------- Photos ---------------- */
      .photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 14px;
      }
      .photo {
        height: 168px;
        border-radius: var(--radius-md);
        position: relative;
        overflow: hidden;
        cursor: pointer;
        background: var(--surface-muted);
      }
      .photo svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .photo-info {
        position: absolute;
        z-index: 2;
        inset: auto 0 0;
        padding: 26px 12px 10px;
        color: #fff;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
        font-size: 12px;
      }
      .photo-info b {
        font-size: 13px;
      }

      /* ---------------- Drawer / Modal ---------------- */
      .drawer,
      .modal {
        position: fixed;
        inset: 0;
        z-index: 30;
        overflow: hidden;
        background: rgba(9, 17, 29, 0);
        pointer-events: none;
        transition: background 0.2s;
      }
      .drawer.open,
      .modal.open {
        background: rgba(9, 17, 29, 0.42);
        pointer-events: auto;
      }
      .drawer-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: min(432px, 92vw);
        height: 100%;
        overflow: auto;
        background: var(--surface);
        padding: 26px 28px;
        transform: translateX(100%);
        transition: transform 0.22s ease;
        box-shadow: -14px 0 40px rgba(9, 17, 29, 0.16);
      }
      .drawer.open .drawer-panel {
        transform: none;
      }
      .drawer-panel h2 {
        font-size: 20px;
        margin: 6px 0;
      }
      .drawer-section {
        padding: 18px 0;
        border-top: 1px solid var(--border-light);
      }
      .drawer-section h3 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .modal-box {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -47%) scale(0.97);
        opacity: 0;
        width: min(560px, 92vw);
        max-height: 88vh;
        overflow: auto;
        background: var(--surface);
        padding: 26px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-pop);
        transition: opacity 0.18s, transform 0.18s;
      }
      .modal.open .modal-box {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      .modal.full .modal-box {
        width: min(1040px, 96vw);
      }
      .modal-box h2 {
        font-size: 20px;
        margin: 4px 0 12px;
      }
      .close {
        float: right;
        border: 1px solid var(--border-light);
        background: var(--surface-subtle);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        color: var(--text-secondary);
        font-size: 17px;
        line-height: 1;
      }
      .close:hover {
        background: var(--surface-muted);
      }
      .more-menu {
        position: relative;
      }
      .more-pop {
        position: absolute;
        top: 40px;
        right: 0;
        width: 196px;
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-pop);
        display: none;
        z-index: 5;
      }
      .more-pop.open {
        display: block;
      }
      .more-pop button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 9px;
        border-radius: 6px;
        font-size: 13px;
      }
      .more-pop button:hover {
        background: var(--surface-subtle);
      }
      .more-pop button.danger {
        color: var(--danger);
      }
      /* Messages (drawer conversation) */
      .message {
        max-width: 82%;
        margin: 9px auto 0 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--surface-subtle);
        border: 1px solid var(--border-light);
        font-size: 13px;
      }
      .message.artisan {
        margin-left: auto;
        margin-right: 0;
        background: var(--accent-soft);
        border-color: var(--accent-soft);
      }
      .message small {
        display: block;
        margin-top: 3px;
        color: var(--text-tertiary);
        font-size: 11px;
      }
      .decision-steps section {
        padding: 13px 0;
        border-top: 1px solid var(--border-light);
      }
      .decision-steps h3 {
        margin: 0 0 4px;
      }

      /* ---------------- Toast ---------------- */
      .toast {
        position: fixed;
        left: 22px;
        bottom: 22px;
        background: #101828;
        color: #fff;
        padding: 11px 15px;
        border-radius: var(--radius-sm);
        z-index: 60;
        opacity: 0;
        transform: translateY(8px);
        transition: 0.18s;
        box-shadow: var(--shadow-pop);
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      .toast button {
        border: 0;
        background: none;
        color: #9ec5ff;
        font-weight: 700;
      }

      /* ---------------- Command palette ---------------- */
      .cmd {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(9, 17, 29, 0.5);
        display: none;
        justify-content: center;
        align-items: flex-start;
        padding-top: 12vh;
      }
      .cmd.open {
        display: flex;
      }
      .cmd-box {
        width: min(600px, 92vw);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-pop);
        overflow: hidden;
      }
      .cmd-box input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        padding: 18px 20px;
        font-size: 16px;
      }
      .cmd-results {
        padding: 8px;
        max-height: 420px;
        overflow: auto;
      }
      .cmd-label {
        padding: 9px 11px 5px;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .cmd-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 11px;
        border-radius: 7px;
        cursor: pointer;
      }
      .cmd-item:hover,
      .cmd-item.selected {
        background: var(--surface-subtle);
      }
      .cmd-item small {
        color: var(--text-secondary);
      }

      /* ---------------- Floating add ---------------- */
      .add {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 10;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        box-shadow: 0 6px 18px rgba(23, 105, 255, 0.35);
        font-size: 22px;
        line-height: 1;
      }
      .add:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      /* ---------------- Assistant side panel (kept darker) ---------------- */
      .ai-overlay {
        position: fixed;
        inset: 0;
        z-index: 90;
        overflow: hidden;
        background: rgba(3, 12, 20, 0);
        pointer-events: none;
        transition: background 0.18s ease;
      }
      .ai-overlay.open {
        background: rgba(3, 12, 20, 0.32);
        pointer-events: auto;
      }
      .ai-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: min(460px, 100vw);
        height: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        background: #0f1a24;
        color: #eef4f8;
        border-left: 1px solid #26404f;
        box-shadow: -18px 0 48px rgba(2, 9, 18, 0.4);
        transform: translateX(100%);
        transition: transform 0.24s ease;
      }
      .ai-overlay.open .ai-panel {
        transform: none;
      }
      .ai-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 22px;
        border-bottom: 1px solid #223644;
      }
      .ai-header small {
        color: #8fa5b5;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .ai-header h2 {
        margin: 3px 0 0;
        font-size: 19px;
        color: #fff;
      }
      .ai-header button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid #33505f;
        background: #17262f;
        color: #fff;
        font-size: 19px;
        line-height: 1;
      }
      .ai-header button:hover {
        background: #223743;
        border-color: #5f86a1;
      }
      .ai-context {
        padding: 14px 22px;
        background: #12212c;
        border-bottom: 1px solid #223644;
        color: #b6c6d2;
        font-size: 12px;
      }
      .ai-context small {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #7f97a8;
      }
      .ai-context b {
        display: block;
        color: #fff;
        font-size: 14px;
        margin: 4px 0 2px;
      }
      .ai-body {
        overflow: auto;
        padding: 20px 22px;
      }
      .ai-welcome {
        color: #b6c6d2;
      }
      .ai-welcome h3 {
        color: #fff;
        margin: 0 0 6px;
      }
      .ai-suggestions {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }
      .ai-suggestions button {
        padding: 11px 13px;
        text-align: left;
        border: 1px solid #33505f;
        border-radius: 10px;
        background: #16242f;
        color: #eef4f8;
        font-size: 13px;
      }
      .ai-suggestions button:hover {
        border-color: #5f86a1;
        background: #1c2f3b;
      }
      .ai-message {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 10px;
        margin: 0 0 16px;
        animation: aiIn 0.18s ease;
      }
      .ai-message.user {
        grid-template-columns: 1fr 26px;
      }
      .ai-message.user .ai-bubble {
        grid-column: 1;
      }
      .ai-message.user .ai-mark {
        grid-column: 2;
        grid-row: 1;
      }
      .ai-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      .ai-message.user .ai-mark {
        background: #33505f;
      }
      .ai-bubble {
        padding: 11px 13px;
        border-radius: 12px;
        background: #16242f;
        color: #eef4f8;
        font-size: 13px;
      }
      .ai-message.user .ai-bubble {
        background: #1b3450;
      }
      .ai-bubble p {
        margin: 0 0 8px;
      }
      .ai-bubble p:last-child {
        margin: 0;
      }
      .ai-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 11px;
      }
      .ai-btn,
      .ai-actions button {
        border: 1px solid #33505f;
        background: #182731;
        color: #e7eff5;
        border-radius: 8px;
        min-height: 34px;
        padding: 7px 11px;
        font-weight: 600;
        font-size: 12.5px;
      }
      .ai-btn:hover,
      .ai-actions button:hover {
        background: #223743;
        border-color: #5f86a1;
      }
      .ai-btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .ai-btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .ai-btn-danger {
        background: #8f241f;
        border-color: #bd534c;
        color: #fff;
      }
      .ai-btn:active {
        transform: translateY(1px);
      }
      .ai-btn:disabled,
      .ai-actions button:disabled,
      .ai-suggestions button:disabled,
      .ai-header button:disabled,
      .ai-history-item:disabled {
        background: #24333d;
        color: #8fa5b5;
        border-color: #3d5768;
        cursor: not-allowed;
      }
      .ai-history-item {
        display: grid;
        gap: 3px;
        width: 100%;
        margin: 0 0 8px;
        padding: 11px 12px;
        text-align: left;
        border: 1px solid #33505f;
        border-radius: 9px;
        background: #16242f;
        color: #eef4f8;
      }
      .ai-history-item small {
        color: #b6c6d2;
      }
      .ai-history-item:hover {
        background: #1c2f3b;
        border-color: #5f86a1;
      }
      .ai-history-link {
        display: inline-flex;
        align-items: center;
        border: 1px solid transparent;
        background: transparent;
        color: #9fc1e4;
        padding: 8px 4px;
        border-radius: 7px;
        font-weight: 500;
        text-align: left;
      }
      .ai-history-link:hover {
        background: #182731;
        border-color: #33505f;
        color: #fff;
      }
      .ai-compose {
        display: grid;
        grid-template-columns: 1fr 40px;
        gap: 9px;
        padding: 14px 18px 18px;
        border-top: 1px solid #223644;
        background: #0f1a24;
      }
      .ai-compose textarea {
        color-scheme: dark;
        resize: none;
        max-height: 110px;
        border: 1px solid #33505f;
        background: #15232e;
        color: #fff;
        border-radius: 10px;
        padding: 11px 12px;
      }
      .ai-compose textarea::placeholder {
        color: #90a4b3;
      }
      .ai-compose button {
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 16px;
      }
      .ai-compose button:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .ai-scenario {
        padding: 13px 0;
        border-top: 1px solid #223644;
      }
      .ai-scenario h3 {
        font-size: 14px;
        color: #fff;
      }
      .ai-scenario h3 small {
        display: inline-block;
        margin-left: 8px;
        padding: 3px 6px;
        border-radius: 5px;
        background: var(--accent);
        color: #fff;
        font-size: 9px;
        letter-spacing: 0.08em;
      }
      .ai-scenario.recommended {
        margin-inline: -10px;
        padding-inline: 10px;
        border: 1px solid #4d7fd6;
        border-radius: 10px;
        background: #172b3b;
      }
      .ai-scenario dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 5px;
        margin: 8px 0;
        color: #b8c6d2;
        font-size: 13px;
      }
      .ai-scenario dd {
        margin: 0;
        color: #fff;
      }
      @keyframes aiIn {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }

      /* ---------------- Artisan (mobile messaging) ---------------- */
      .artisan-body .sidebar,
      .artisan-body .add {
        display: none;
      }
      .artisan-body .shell {
        display: block;
        background: var(--surface-subtle);
      }
      .artisan-body .main {
        max-width: 460px;
        padding: 0;
        min-height: 100vh;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--border-light);
      }
      .chat {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .chat-header {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-light);
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .chat-header .resource-avatar {
        --size: 40px;
      }
      .chat-title {
        flex: 1;
        min-width: 0;
        line-height: 1.3;
      }
      .chat-title b {
        display: block;
        font-size: 15px;
      }
      .chat-title span {
        display: block;
        color: var(--text-secondary);
        font-size: 12px;
      }
      .chat-online {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--success);
        font-size: 11px;
        font-weight: 600;
      }
      .chat-online i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
      }
      .chat-mission {
        margin: 14px 16px 6px;
        padding: 15px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-subtle);
      }
      .chat-mission .eyebrow {
        color: var(--accent-ink);
      }
      .chat-mission h2 {
        font-size: 18px;
        margin: 5px 0 3px;
      }
      .chat-mission .mission-time {
        color: var(--text-secondary);
        font-size: 13px;
        margin: 0 0 12px;
      }
      .chat-mission .actions {
        margin-top: 12px;
      }
      .chat-status-live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--success);
        margin-bottom: 6px;
      }
      .chat-thread {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 16px 16px;
        overflow: auto;
      }
      .chat-day {
        text-align: center;
        margin: 8px 0;
        font-size: 11px;
        color: var(--text-tertiary);
        font-weight: 600;
      }
      .bubble {
        max-width: 78%;
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        position: relative;
      }
      .bubble.them {
        align-self: flex-start;
        background: var(--surface-muted);
        border-bottom-left-radius: 5px;
      }
      .bubble.me {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 5px;
      }
      .bubble .bubble-photo {
        display: block;
        width: 100%;
        height: 120px;
        border-radius: 9px;
        margin-bottom: 7px;
        overflow: hidden;
      }
      .bubble .bubble-photo svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .bubble time {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        opacity: 0.7;
        text-align: right;
      }
      .bubble.me time {
        color: #dbe8ff;
      }
      .chat-compose {
        display: grid;
        grid-template-columns: 38px 1fr 38px;
        gap: 8px;
        align-items: center;
        padding: 11px 14px;
        border-top: 1px solid var(--border-light);
        background: var(--surface);
        position: sticky;
        bottom: 0;
      }
      .chat-compose input {
        border-radius: 20px;
        background: var(--surface-subtle);
        border-color: var(--border);
      }
      .chat-icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        display: grid;
        place-items: center;
      }
      .chat-icon-btn svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chat-icon-btn.send {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      /* legacy artisan fallbacks (kept for safety) */
      .artisan {
        display: flex;
        flex-direction: column;
        padding: 20px;
      }
      .mission {
        margin-top: 20px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }
      .mobile-nav {
        display: flex;
        justify-content: space-around;
        margin-top: auto;
        padding: 14px 0;
        border-top: 1px solid var(--border-light);
      }
      .mobile-nav button {
        border: 0;
        background: none;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .mobile-nav button.active {
        color: var(--accent);
        font-weight: 600;
      }

      /* ---------------- Impact chain ---------------- */
      .impact-chain {
        display: grid;
        gap: 0;
      }
      .impact-step {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-xs);
        cursor: pointer;
      }
      .impact-step:hover {
        border-color: var(--border-strong);
      }
      .impact-step.source {
        border-color: var(--danger-border);
        background: var(--danger-soft);
      }
      .impact-step h4 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      .impact-step small {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .impact-link {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 0 6px 22px;
        color: var(--text-tertiary);
        font-size: 11px;
        font-weight: 600;
      }
      .impact-link:before {
        content: "";
        width: 1px;
        height: 14px;
        background: var(--border-strong);
      }
      .impact-aside {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        padding: 20px;
      }
      .impact-aside h3 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      .impact-aside .fact {
        display: flex;
        justify-content: space-between;
        padding: 9px 0;
        border-top: 1px solid var(--border-light);
        font-size: 13px;
        color: var(--text-secondary);
      }
      .impact-aside .fact:first-of-type {
        border-top: 0;
      }
      .impact-aside .fact b {
        color: var(--text);
      }
      .impact-aside .btn {
        width: 100%;
        margin-top: 14px;
        justify-content: center;
      }

      /* ---------------- Documents (folder rail + library) ---------------- */
      .doc-layout {
        display: grid;
        grid-template-columns: 210px 1fr;
        gap: 24px;
        align-items: start;
      }
      .doc-folders {
        display: grid;
        gap: 2px;
        padding: 8px;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
      }
      .doc-folder {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: none;
        color: var(--text-secondary);
        padding: 9px 11px;

      function autoFixSimulation() {
        if (!app.simulation) return;
        let changes = app.simulation.changes.map((x) => ({ ...x })),
          queue = [changes[0].taskId];
        while (queue.length) {
          let id = queue.shift(),
            all = app.tasks.map((t) => ({
              ...t,
              ...changes.find((c) => c.taskId === t.id),
            })),
            source = all.find((t) => t.id === id);
          all
            .filter((t) => (t.deps || []).includes(id))
            .forEach((t) => {
              if (date(t.start) < date(source.end)) {
                let dur = duration(t),
                  start = nextWorkingTime(source.end),
                  change = {
                    taskId: t.id,
                    start,
                    end: addWorkingDuration(start, dur),
                  },
                  old = changes.find((c) => c.taskId === t.id);
                old ? Object.assign(old, change) : changes.push(change);
                queue.push(t.id);
              }
            });
        }
        app.simulation.changes = changes;
        save();
        renderPage();
