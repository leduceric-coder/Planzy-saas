    .msg-file .mf-ico{flex:0 0 auto}
    .msg-file .mf-sz{opacity:.7;font-weight:600}
    .msg-file:hover{filter:brightness(1.06)}

    .audit-table{table-layout:fixed;width:100%}
    .audit-table td,.audit-table th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .audit-table td.audit-detail{white-space:normal}
    .report-print-kpis{display:flex;gap:22px;margin:14px 0}
    .report-print-kpis b{font-size:22px;display:block;letter-spacing:-.02em}
    .report-print-kpis span{font-size:11px;color:#555}
    .report-print-h2{margin:16px 0 8px;font-size:15px;font-weight:850}
    .print-audit{width:100%;border-collapse:collapse;font-size:11px}
    .print-audit th{text-align:left;background:#f2f4f8;border:1px solid #d5dbe6;padding:6px 8px;font-weight:800}
    .print-audit td{border:1px solid #e2e7ef;padding:5px 8px;vertical-align:top}
    @media print{.print-audit{page-break-inside:auto}.print-audit tr{page-break-inside:avoid}}

    .side-footer{position:relative;gap:0;padding:12px 14px}
    .user-menu-trigger{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border-radius:11px;padding:8px;margin:-4px;text-align:left;background:transparent}
    .user-menu-trigger:hover{background:var(--surface-hover)}
    .user-menu-trigger .user-caret{margin-left:auto;color:var(--text-tertiary);flex:0 0 auto;transition:transform .18s}

    @keyframes umPop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .um-head{display:flex;align-items:center;gap:11px;padding:10px 10px 12px}
    .um-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#2d6bff,#1753f4);color:#fff;display:grid;place-items:center;font-weight:850;font-size:13px;flex:0 0 auto}

    .um-sep{height:1px;background:var(--border);margin:6px 4px}
    .um-title{font-size:10px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);padding:6px 10px 4px}

    .um-item{display:flex;align-items:center;gap:11px;width:100%;height:42px;padding:0 10px;border-radius:10px;color:var(--text-secondary);font-weight:750;font-size:13px;text-align:left}
    .um-item:hover{background:var(--surface-hover);color:var(--text-primary)}
    .um-item .um-ico{width:20px;height:20px;display:grid;place-items:center;color:var(--text-tertiary);flex:0 0 auto}
    .um-item:hover .um-ico{color:var(--accent)}
    .um-item.danger{color:var(--danger)}
    .um-item.danger:hover{background:rgba(255,59,48,.1);color:var(--danger)}
    .um-item.danger .um-ico{color:var(--danger)}

<script>
/* ===================== CONFIG ===================== */
const STORAGE_KEY='dentalflow-next-mockup-state-v4';
const LEGACY_STORAGE_KEY='dentalflow-next-mockup-state-v3';
const STAGE_PALETTE=['#2d6bff','#7c4dff','#f5a623','#e5477d','#00b8d4','#20b970','#ff6b35','#8e44ad','#16a085','#3949ab'];
/* Labels par défaut du flux (seed uniquement). La source de vérité runtime est state.stageDefinitions. */
const DEFAULT_STAGE_LABELS=['Réception','Design CAD','Usinage','Céramique','Contrôle qualité','Prêtes'];
function defaultStageDefinitions(){return DEFAULT_STAGE_LABELS.map((label,i)=>({id:'STG-'+String(i+1).padStart(3,'0'),label,active:true,order:i+1}))}

/* ===================== CLOCK ===================== */
/* Horloge unique de l'application. Mode DEMO = date de référence figée ; REAL = new Date(). */
const Clock={
  mode:'demo',
  demoDate:new Date('2026-08-21T10:42:00'),
  now(){return this.mode==='real'?new Date():new Date(this.demoDate)},
  iso(){return this.now().toISOString()}
};

/* ===================== STAGES (source unique) ===================== */
/* Toutes les vues lisent state.stageDefinitions via ces helpers. */
function ensureStageDefinitions(){if(!Array.isArray(state.stageDefinitions)||!state.stageDefinitions.length){state.stageDefinitions=defaultStageDefinitions()}return state.stageDefinitions}
function stageDefs(){return ensureStageDefinitions().filter(s=>s.active!==false).slice().sort((a,b)=>(a.order||0)-(b.order||0))}
function allStageDefs(){return ensureStageDefinitions().slice().sort((a,b)=>(a.order||0)-(b.order||0))}
function stages(){return stageDefs().map(s=>s.label)}
function stageDefById(id){return ensureStageDefinitions().find(s=>s.id===id)||null}
function stageDefByLabel(label){return ensureStageDefinitions().find(s=>s.label===label)||null}
function stageIdByLabel(label){const d=stageDefByLabel(label);return d?d.id:null}
function labelForStageId(id){const d=stageDefById(id);return d?d.label:null}

function scanCurrentLabel(scan){if(!scan)return null;const cur=scan.stageId?labelForStageId(scan.stageId):null;return cur||scan.stageLabelAtScan||scan.station||null}
function scanTechName(scan){return scan?(scan.technicianNameAtScan||scan.tech||null):null}
/* API canonique de localisation confirmée. */
function getConfirmedStage(orderId){const s=getLastScan(orderId);if(!s)return{confirmed:false,stageId:null,label:null,labelAtScan:null};return{confirmed:true,stageId:s.stageId||null,label:scanCurrentLabel(s),labelAtScan:s.stageLabelAtScan||s.station||null}}
function getConfirmedTechnician(orderId){const s=getLastScan(orderId);return s?{confirmed:true,technicianId:s.technicianId||null,technicianName:scanTechName(s)}:{confirmed:false,technicianId:null,technicianName:null}}
function getConfirmedScanTime(orderId){const s=getLastScan(orderId);return s?{confirmed:true,timestamp:s.at}:{confirmed:false,timestamp:null}}
/* Alias de compatibilité. */
function getCurrentStation(orderId){const c=getConfirmedStage(orderId);return{confirmed:c.confirmed,station:c.label}}
function getCurrentTechnician(orderId){return getConfirmedTechnician(orderId)}
function getLastScanTime(orderId){return getConfirmedScanTime(orderId)}
/* Localisation confirmée (label courant du poste scanné), sinon null. Jamais de repli planifié. */
function effectiveStation(o){return getConfirmedStage(o.id).label}
/* Étape planifiée / prévue — intention, ne remplace jamais la localisation confirmée. */
function plannedNextStage(o){const labels=stages();if(!labels.length)return null;const c=getConfirmedStage(o.id);if(!c.confirmed)return labels[0];const idx=stageDefs().findIndex(s=>s.id===c.stageId);if(idx<0||idx>=labels.length-1)return null;return labels[idx+1]}
/* ===================== STAGES — configuration du flux (jamais l'historique) ===================== */
function renameStage(oldLabel,newLabel){newLabel=String(newLabel||'').trim();const def=stageDefByLabel(oldLabel);if(!def){renderProduction();return}if(!newLabel){renderProduction();return}if(newLabel===oldLabel)return;if(ensureStageDefinitions().some(s=>s.id!==def.id&&s.active!==false&&s.label===newLabel)){showToast('Ce poste existe déjà');renderProduction();return}def.label=newLabel;save();renderProduction();showToast('Poste renommé — l’historique des scans reste inchangé')}
function addStage(){const defs=ensureStageDefinitions();let n=defs.length+1,label='Poste '+n;while(defs.some(s=>s.label===label)){n++;label='Poste '+n}const nextOrder=Math.max(0,...defs.map(s=>s.order||0))+1;let idx=1;while(defs.some(s=>s.id==='STG-'+String(idx).padStart(3,'0')))idx++;defs.push({id:'STG-'+String(idx).padStart(3,'0'),label,active:true,order:nextOrder});save();renderProduction();showToast('Poste ajouté — cliquez le titre pour le renommer')}
/* Suppression = désactivation (active:false). Jamais de suppression physique si utilisé en historique. */
function deleteStage(label){const active=stageDefs();if(active.length<=2){showToast('Au moins 2 postes actifs requis');return}const def=stageDefByLabel(label);if(!def)return;def.active=false;save();renderProduction();showToast('Poste désactivé — l’historique reste lisible')}
function reorderStages(fromLabel,toLabel){const defs=stageDefs();const from=stageDefByLabel(fromLabel),to=stageDefByLabel(toLabel);if(!from||!to||from.id===to.id)return;const ids=defs.map(s=>s.id);ids.splice(ids.indexOf(from.id),1);ids.splice(ids.indexOf(to.id),0,from.id);ids.forEach((id,i)=>{const d=stageDefById(id);if(d)d.order=i+1});save();renderProduction();showToast('Flux de production mis à jour')}
/* Enregistre un scan immuable (snapshot du label de poste + du technicien). */
function recordScan(o,stageLabel,tech){const stageId=stageIdByLabel(stageLabel);state.scanEvents.push({orderId:o.id,stageId,stageLabelAtScan:stageLabel,technicianId:(tech&&tech.id)||null,technicianNameAtScan:(tech&&tech.name)||'',at:Clock.iso(),event:'Scan',station:stageLabel,tech:(tech&&tech.name)||''});if(o.flags)o.flags.scanExpected=false;delete o.boardStation;o.awaitingScan=false;o.noInitialScan=false}
function lastScan(o){return getLastScan(o.id)}
function locationText(o){const c=getConfirmedStage(o.id);return c.confirmed?h(c.label):'Localisation non confirmée'}
function technicianText(o){const t=getConfirmedTechnician(o.id);return t.confirmed?h(t.technicianName):'Technicien non confirmé'}
function scanTimeText(o){const t=getConfirmedScanTime(o.id);return t.confirmed?fmtTime(t.timestamp):'Aucun scan'}
function fmtTime(iso){const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function statusInfo(s){return {late:['En retard','red'],blocked:['Bloquée','orange'],ready:['Prête','green'],progress:['En cours','blue'],qc:['QC en cours','blue'],scan:['À scanner','blue']}[s]||['En cours','blue']}
function isDueToday(o){return /Aujourd/i.test(o.due||'')}
function kpiCounts(){const d=orderDistribution();return {prod:d.active,today:state.orders.filter(isDueToday).length,late:state.orders.filter(isOrderLate).length,blocked:d.blocked,total:state.orders.length,ready:d.ready,completed:d.completed}}
function orderMatchesFilter(o,f){switch(f){case 'all':return true;case 'attention':return needsAttention(o);case 'late':return isOrderLate(o);case 'blocked':return isOrderBlocked(o);case 'ready':return isOrderReady(o);case 'completed':return isOrderCompleted(o);case 'active':return getOrderProductionState(o)==='active';default:return o.status===f}}
function filteredOrders(){const q=state.search.toLowerCase().trim();let rows=state.orders.filter(o=>!q||[o.id,o.patientRef,o.type,o.cabinet].join(' ').toLowerCase().includes(q));rows=rows.filter(o=>orderMatchesFilter(o,state.filter||'all'));return sortOrders(rows)}
function dueRank(o){const s=String(o.due||'');let base=300;if(/Aujourd/i.test(s))base=100;else if(/Demain/i.test(s))base=200;const t=s.match(/(\d{1,2}):(\d{2})/);const mins=t?(+t[1]*60+ +t[2]):0;return base*10000+mins}
function sortOrders(rows){if(!state.sortKey)return rows;const key=state.sortKey,dir=state.sortDir==='desc'?-1:1;const val=o=>{switch(key){case 'station':return stageIndex(effectiveStation(o));case 'scan':{const sc=lastScan(o);return sc?new Date(sc.at).getTime():0}case 'status':return statusInfo(o.status)[0];case 'due':return dueRank(o);default:return String(o[key]||'').toLowerCase()}};return rows.slice().sort((a,b)=>{const va=val(a),vb=val(b);if(va<vb)return -dir;if(va>vb)return dir;return 0})}

/* ===================== MODÈLE COMMANDE — état + flags ===================== */
/* productionState ∈ {active, ready, completed} ; flags cumulables {late, blocked, scanExpected}. */
function orderFlags(o){return o.flags||{late:false,blocked:false,scanExpected:false}}
function getOrderProductionState(o){return o.productionState||'active'}
function isOrderLate(o){return !!orderFlags(o).late}
function isOrderBlocked(o){return !!orderFlags(o).blocked}
function isScanExpected(o){return !!orderFlags(o).scanExpected}
function isOrderCompleted(o){return getOrderProductionState(o)==='completed'}
function isOrderReady(o){return getOrderProductionState(o)==='ready'}
function needsAttention(o){return isOrderLate(o)||isOrderBlocked(o)||isScanExpected(o)}
/* Signaux d'une commande (retard/blocage/scan attendu), motif principal en tête. */
function orderSignals(o){const s=[];if(isOrderLate(o))s.push({key:'late',label:'Retard',color:'red'});if(isOrderBlocked(o))s.push({key:'blocked',label:'Bloquée',color:'orange'});if(isScanExpected(o))s.push({key:'scanExpected',label:'Scan attendu',color:'blue'});return s}
function getAttentionOrders({limit=null}={}){function score(o){return isOrderLate(o)?0:isOrderBlocked(o)?1:2}const all=state.orders.filter(needsAttention).sort((a,b)=>score(a)-score(b));return limit!=null?all.slice(0,limit):all}
/* Buckets exclusifs pour le donut : En production / Prêtes / Bloquées / Terminées. */
function getDistributionBucket(o){if(isOrderCompleted(o))return 'completed';if(isOrderReady(o))return 'ready';if(isOrderBlocked(o))return 'blocked';return 'active'}
function orderDistribution(){const d={active:0,ready:0,blocked:0,completed:0};state.orders.forEach(o=>d[getDistributionBucket(o)]++);return d}
function buildDonutGradient(d){const total=d.active+d.ready+d.blocked+d.completed;if(!total)return '#d7dce6';let a=0;const segs=[];function seg(c,n){if(!n)return;const deg=Math.round(n/total*360);segs.push(`${c} ${a}deg ${a+deg}deg`);a+=deg}seg('var(--blue)',d.active);seg('var(--green)',d.ready);seg('var(--orange)',d.blocked);seg('var(--red)',d.completed);if(a<360)segs.push(`#d7dce6 ${a}deg 360deg`);return `conic-gradient(${segs.join(',')})`}

function chartBars(vals,labels){const maxV=Math.max(...vals,1);const step=maxV>400?200:maxV>150?50:maxV>60?20:10;const axMax=Math.max(Math.ceil(maxV/step)*step,step);const marks=[axMax,Math.round(axMax*2/3),Math.round(axMax/3),0];const n=vals.length;return `<div class="chart2"><div class="chart2-body"><div class="chart2-axis">${marks.map(m=>`<span>${m}</span>`).join('')}</div><div class="chart2-plot" style="--n:${n}">${vals.map(v=>`<div class="chart2-col"><div class="chart2-bar" style="height:${(v/axMax*100).toFixed(1)}%"><span class="bar-tip">${v}</span></div></div>`).join('')}</div></div><div class="chart2-days"><span></span><div class="days-inner" style="--n:${n}">${labels.map(l=>`<span class="day2">${h(l)}</span>`).join('')}</div></div></div>`}
function renderDonutLegend(d,total){const cats=[['active','En production',d.active,'blue'],['ready','Prêtes',d.ready,'green'],['blocked','Bloquées',d.blocked,'orange'],['completed','Terminées',d.completed,'red']];return `<div class="legend">${cats.map(r=>{const p=total?Math.round(r[2]/total*100):0;return `<div class="legend-row" data-donut-cat="${r[0]}" data-count="${r[2]}" data-label="${h(r[1])}" data-pct="${p}" onmouseover="donutHover(this)" onmouseout="donutReset()"><span class="dot-flow" style="background:var(--${r[3]})"></span><span>${r[1]}</span><b>${r[2]}</b></div>`}).join('')}</div>`}
function renderDonut(){const d=orderDistribution();const total=d.active+d.ready+d.blocked+d.completed;const segs=[['active','En production','blue',d.active],['ready','Prêtes','green',d.ready],['blocked','Bloquées','orange',d.blocked],['completed','Terminées','red',d.completed]];let acc=0;const arcs=segs.filter(s=>s[3]>0).map(s=>{const pct=total?s[3]/total*100:0;const off=25-acc;acc+=pct;const p=total?Math.round(s[3]/total*100):0;return `<circle class="donut-seg" data-donut-cat="${s[0]}" data-count="${s[3]}" data-label="${h(s[1])}" data-pct="${p}" r="15.915" cx="21" cy="21" fill="none" stroke="var(--${s[2]})" stroke-width="5" stroke-dasharray="${pct.toFixed(2)} ${(100-pct).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" onmouseover="donutHover(this)" onmouseout="donutReset()"/>`}).join('');const ring=total?arcs:'<circle r="15.915" cx="21" cy="21" fill="none" stroke="#d7dce6" stroke-width="5"/>';return `<div class="donut-layout"><div class="donut-svg-wrap"><svg viewBox="0 0 42 42" class="donut-svg">${ring}</svg><div class="donut-center" id="donut-center" data-total="${total}">${total}<span>Total</span></div></div>${renderDonutLegend(d,total)}</div>`}
function donutHover(el){const c=document.getElementById('donut-center');if(!c)return;const cat=el.dataset.donutCat;c.innerHTML=`${el.dataset.count}<span>${el.dataset.label} · ${el.dataset.pct}%</span>`;document.querySelectorAll('[data-donut-cat]').forEach(x=>{x.classList.toggle('dim',x.dataset.donutCat!==cat);x.classList.toggle('sel',x.dataset.donutCat===cat)})}
function donutReset(){const c=document.getElementById('donut-center');if(!c)return;c.innerHTML=`${c.dataset.total}<span>Total</span>`;document.querySelectorAll('[data-donut-cat]').forEach(x=>x.classList.remove('dim','sel'))}

/* DnD limité à la réorganisation du FLUX (colonnes). Les commandes ne se déplacent jamais à la main. */
function setupProductionDnD(){const board=document.getElementById('prod-board');if(!board)return;let dragId=null;
board.addEventListener('dragstart',e=>{const nm=e.target.closest('[data-stage-name]');if(nm){e.preventDefault();return}const col=e.target.closest('.prod-col');if(col){dragId=col.dataset.stage;col.classList.add('col-drag')}try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId||'')}catch(_){}});
board.addEventListener('dragend',()=>{dragId=null;board.querySelectorAll('.col-drag,.drop-hint').forEach(x=>x.classList.remove('col-drag','drop-hint'))});
board.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const col=e.target.closest('.prod-col');board.querySelectorAll('.drop-hint').forEach(x=>x.classList.remove('drop-hint'));if(col&&col.dataset.stage!==dragId)col.classList.add('drop-hint')});
board.addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();const col=e.target.closest('.prod-col');const id=dragId;dragId=null;board.querySelectorAll('.drop-hint').forEach(x=>x.classList.remove('drop-hint'));if(!col)return;const target=col.dataset.stage;if(id!==target)reorderStages(id,target)});
board.addEventListener('blur',e=>{const nm=e.target.closest('[data-stage-name]');if(nm)renameStage(nm.dataset.stageName,nm.textContent)},true);
board.addEventListener('keydown',e=>{const nm=e.target.closest('[data-stage-name]');if(nm&&e.key==='Enter'){e.preventDefault();nm.blur()}});
board.addEventListener('click',e=>{if(e.target.closest('#prod-add-stage')){addStage();return}const del=e.target.closest('[data-stage-del]');if(del){e.stopPropagation();deleteStage(del.dataset.stageDel)}})}

function stockStatus(it){if(it.qty<=it.min)return['Critique','red'];if(it.qty<=it.min*2)return['Moyen','orange'];return['Bon','green']}
function stockPct(it){return it.capacity?Math.round(it.qty/it.capacity*100):0}
function stockSummary(){const s={units:0,refs:state.stock.length,critical:0,transit:0};state.stock.forEach(it=>{s.units+=it.qty;if(stockStatus(it)[1]==='red')s.critical++;if(it.incoming>0)s.transit++});return s}
function renderStock(){setPageMeta('Stocks','Gestion des matières premières et consommables');const sum=stockSummary();const cards=state.stock.map(it=>{const[label,color]=stockStatus(it);const pct=stockPct(it);return `<article class="card stock-item"><div class="stock-item-head"><div><div class="stock-name">${h(it.name)}</div><div class="stock-ref">${h(it.id)}</div></div><span class="stock-badge ${color}">${pct}%</span></div><div class="stock-bar"><span style="width:${pct}%;background:var(--${color})"></span></div><div class="stock-foot"><span><b>${it.qty}</b> / ${it.capacity} ${h(it.unit)}${it.incoming>0?` · <span class="stock-transit">+${it.incoming} en transit</span>`:''}</span><span class="stock-state ${color}">${label}</span></div><div class="stock-adjust"><button class="stock-step" data-stock-adj data-id="${h(it.id)}" data-delta="-1" aria-label="Retirer une unité">−</button><button class="stock-step" data-stock-adj data-id="${h(it.id)}" data-delta="1" aria-label="Ajouter une unité">+</button><button class="stock-edit-btn" data-stock-edit data-id="${h(it.id)}">Ajuster</button></div></article>`}).join('');$('#view-root').innerHTML=`<section class="grid stock-kpis"><article class="card stock-kpi"><div class="stock-kpi-ico green">${icon('cube')}</div><div><div class="stock-kpi-num">${sum.units}</div><div class="stock-kpi-label">Unités en stock · ${sum.refs} références</div></div></article><article class="card stock-kpi"><div class="stock-kpi-ico orange">${icon('warn')}</div><div><div class="stock-kpi-num">${sum.critical}</div><div class="stock-kpi-label">Stock critique</div></div></article><article class="card stock-kpi"><div class="stock-kpi-ico blue">${icon('truck')}</div><div><div class="stock-kpi-num">${sum.transit}</div><div class="stock-kpi-label">En transit</div></div></article></section><div class="stock-head"><h2 class="stock-head-title">Articles</h2><button class="primary stock-new" id="new-stock-btn"><span>＋</span><span>Nouvel article</span></button></div><section class="grid stock-grid">${cards}</section>`}
function logAudit(refId,type,detail){state.historyEvents.push({orderId:refId,type,at:Clock.iso(),detail})}
function adjustStock(id,delta){const it=state.stock.find(x=>x.id===id);if(!it)return;const before=it.qty;it.qty=Math.max(0,Math.min(it.capacity,it.qty+delta));if(it.qty===before)return;logAudit(it.id,'Stock',`Ajustement stock : ${delta>0?'+':''}${it.qty-before} ${it.unit} (→ ${it.qty}/${it.capacity})`);save();render()}
function renderStockFormPanel(){const editing=state.sidePanelOrderId;const it=editing?state.stock.find(x=>x.id===editing):null;$('#side-panel-head').innerHTML=`<div class="side-panel-title"><div><h2>${it?'Ajuster l’article':'Nouvel article'}</h2><div class="side-panel-sub">${it?h(it.id):'Création · stock local POC'}</div></div><button class="close" id="side-close">×</button></div>`;$('#side-panel-body').innerHTML=`<form class="side-form" id="stock-form">${it?`<input type="hidden" name="ref" value="${h(it.id)}">`:''}<div class="field"><label>Nom de l’article</label><input name="name" required value="${it?h(it.name):''}" placeholder="Zircone HT" ${it?'readonly':''}/></div>${it?'':'<div class="field"><label>Référence</label><input name="ref" required placeholder="ZIR-HT-010" /></div>'}<div class="field"><label>Unité</label><input name="unit" required value="${it?h(it.unit):''}" placeholder="disques, flacons…" /></div><div class="form-grid"><div class="field"><label>Quantité en stock</label><input name="qty" type="number" min="0" required value="${it?it.qty:0}" /></div><div class="field"><label>Capacité max</label><input name="capacity" type="number" min="1" required value="${it?it.capacity:50}" /></div><div class="field"><label>Seuil critique</label><input name="min" type="number" min="0" required value="${it?it.min:10}" /></div><div class="field"><label>En transit</label><input name="incoming" type="number" min="0" value="${it?it.incoming:0}" /></div></div><div class="form-actions"><button type="button" class="secondary" id="cancel-order">Annuler</button><button class="big-primary" type="submit">${it?'Enregistrer':'Créer l’article'}</button></div></form>`;$('#side-layer').classList.add('open');setTimeout(()=>$('#stock-form input:not([readonly])')?.focus(),0)}
function submitStockForm(data){const qty=Math.max(0,parseInt(data.qty,10)||0);const capacity=Math.max(1,parseInt(data.capacity,10)||1);const min=Math.max(0,parseInt(data.min,10)||0);const incoming=Math.max(0,parseInt(data.incoming,10)||0);const id=String(data.ref||'').trim().toUpperCase();const existing=state.stock.find(x=>x.id===id);if(existing){existing.name=data.name||existing.name;existing.unit=data.unit||existing.unit;existing.qty=Math.min(qty,capacity);existing.capacity=capacity;existing.min=min;existing.incoming=incoming;logAudit(existing.id,'Stock',`Article mis à jour : ${existing.qty}/${existing.capacity} ${existing.unit}`);showToast(`${existing.id} mis à jour`)}else{if(!id){showToast('Référence requise');return}state.stock.push({id,name:data.name||id,unit:data.unit||'unités',qty:Math.min(qty,capacity),capacity,min,incoming});logAudit(id,'Stock',`Nouvel article créé : ${Math.min(qty,capacity)}/${capacity} ${data.unit||'unités'}`);showToast(`${id} ajouté au stock`)}save();closeSidePanel();state.view='stock';render()}
function auditEvents(){const live=[];state.scanEvents.filter(e=>e.event==='Scan').forEach(e=>live.push({at:new Date(e.at).getTime(),type:'Scan',orderId:e.orderId,actor:e.tech||'Système',detail:`Scan enregistré — ${e.station}`}));(state.historyEvents||[]).forEach(e=>live.push({at:new Date(e.at).getTime(),type:e.type||'Statut',orderId:e.orderId,actor:'Système',detail:e.detail||e.type||''}));seedAuditLog.forEach(e=>live.push({at:baseNow.getTime()-e.daysAgo*86400000,type:e.type,orderId:e.orderId,actor:e.actor,detail:e.detail}));return live.sort((a,b)=>b.at-a.at)}
function auditInPeriod(days){const cutoff=baseNow.getTime()-days*86400000;return auditEvents().filter(e=>e.at>=cutoff)}
function auditTypeColor(t){return {Scan:'blue',Statut:'orange',Blocage:'orange',Création:'green',Livraison:'green',Stock:'blue',Connexion:'gray',Utilisateur:'gray'}[t]||'gray'}
function fmtAuditDate(ts){const d=new Date(ts);const days=Math.round((baseNow.getTime()-ts)/86400000);const time=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;if(days<=0)return `Aujourd’hui ${time}`;if(days===1)return `Hier ${time}`;return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${time}`}
function renderAuditTable(events){if(!events.length)return '<div class="empty">Aucun événement sur cette période.</div>';const ar=k=>state.auditSortKey===k?`<span class="sort-ar">${state.auditSortDir==='asc'?'▲':'▼'}</span>`:'';return `<div class="table-wrap"><table class="orders-table audit-table"><colgroup><col style="width:16%"><col style="width:13%"><col style="width:18%"><col style="width:15%"><col style="width:38%"></colgroup><thead><tr><th data-audit-sort="at">Date${ar('at')}</th><th data-audit-sort="type">Type${ar('type')}</th><th data-audit-sort="orderId">Commande / Réf.${ar('orderId')}</th><th data-audit-sort="actor">Acteur${ar('actor')}</th><th>Détail</th></tr></thead><tbody>${events.map(e=>`<tr><td class="muted">${fmtAuditDate(e.at)}</td><td><span class="pill ${auditTypeColor(e.type)}">${h(e.type)}</span></td><td><b>${h(e.orderId)}</b></td><td>${h(e.actor)}</td><td class="muted audit-detail" title="${h(e.detail)}">${h(e.detail)}</td></tr>`).join('')}</tbody></table></div>`}
function auditRows(){const period=reportPeriods[state.reportPeriod]||reportPeriods['30d'];let ev=auditInPeriod(period.days).filter(auditMatch);if(state.auditType&&state.auditType!=='all')ev=ev.filter(e=>e.type===state.auditType);const k=state.auditSortKey||'at';const dir=state.auditSortDir==='asc'?1:-1;return ev.slice().sort((a,b)=>{if(k==='at')return (a.at-b.at)*dir;const va=String(a[k]||'').toLowerCase(),vb=String(b[k]||'').toLowerCase();return va<vb?-dir:va>vb?dir:0})}
function renderAuditWrap(){const ev=auditRows();const per=10;const pages=Math.max(1,Math.ceil(ev.length/per));if((state.auditPage||0)>=pages)state.auditPage=pages-1;if((state.auditPage||0)<0)state.auditPage=0;const page=state.auditPage||0;const slice=ev.slice(page*per,page*per+per);const period=reportPeriods[state.reportPeriod]||reportPeriods['30d'];const types=[...new Set(auditInPeriod(period.days).map(e=>e.type))];const chips=`<button class="audit-chip ${(!state.auditType||state.auditType==='all')?'active':''}" data-audit-type="all">Tous</button>`+types.map(t=>`<button class="audit-chip ${state.auditType===t?'active':''}" data-audit-type="${h(t)}">${h(t)}</button>`).join('');const pager=`<div class="audit-pager"><button class="pg-btn" data-audit-page="prev" ${page<=0?'disabled':''}>‹ Précédent</button><span class="pg-info">Page ${page+1} / ${pages} · ${ev.length} entrée${ev.length>1?'s':''}</span><button class="pg-btn" data-audit-page="next" ${page>=pages-1?'disabled':''}>Suivant ›</button></div>`;return `<div class="audit-tools">${chips}</div>${renderAuditTable(slice)}${ev.length>per?pager:''}`}
function renderReports(){setPageMeta('Rapports','Indicateurs et journal d’audit du laboratoire');const period=reportPeriods[state.reportPeriod]||reportPeriods['30d'];const events=auditInPeriod(period.days);const scans=events.filter(e=>e.type==='Scan').length;const blocks=events.filter(e=>e.type==='Blocage'||/bloqu/i.test(e.detail)).length;const delivered=events.filter(e=>e.type==='Livraison').length;const onTime=events.filter(e=>e.type==='Livraison'&&/à temps/i.test(e.detail)).length;const rate=delivered?Math.round(onTime/delivered*100):0;const seg=Object.entries(reportPeriods).map(([k,v])=>`<button class="seg ${state.reportPeriod===k?'active':''}" data-report-period="${k}">${v.label}</button>`).join('');const proof=`<div class="kpi-proof">${period.label}</div>`;$('#view-root').innerHTML=`
  <div class="report-toolbar"><div class="report-toolbar-label">Période analysée</div><div class="segmented">${seg}</div><button class="ghost" id="print-report" style="margin-left:auto;height:38px;padding:0 16px">🖨️ Imprimer / PDF</button></div>
  <section class="grid kpis"><article class="card kpi"><div><div class="kpi-num" style="color:var(--blue)">${events.length}</div><div class="kpi-label">Événements journalisés</div><div class="kpi-vs">Sur ${period.label}</div></div>${proof}</article><article class="card kpi"><div><div class="kpi-num" style="color:var(--green)">${delivered}</div><div class="kpi-label">Commandes livrées</div><div class="kpi-vs" style="color:var(--green)">${delivered?rate+'% à temps':'aucune'}</div></div>${proof}</article><article class="card kpi"><div><div class="kpi-num" style="color:var(--orange)">${blocks}</div><div class="kpi-label">Blocages</div><div class="kpi-vs">${blocks?'sur la période':'aucun'}</div></div>${proof}</article><article class="card kpi"><div><div class="kpi-num" style="color:var(--blue)">${scans}</div><div class="kpi-label">Scans enregistrés</div><div class="kpi-vs">traçabilité</div></div>${proof}</article></section>
  <section class="card chart-card" style="margin-bottom:14px"><div class="section-head"><div><h2>Production · ${period.label}</h2><div class="mini-sub">Tendance de démonstration · agrégée par ${(reportProductionData[state.reportPeriod]||reportProductionData['7d']).unit.replace('/ ','')}</div></div><div class="tabs"><button class="${state.productionChartMode==='entries'?'active':''}" data-chart-tab="entries">Entrées</button><button class="${state.productionChartMode==='completed'?'active':''}" data-chart-tab="completed">Terminées</button></div></div>${renderReportBars()}</section>
  <section class="card section"><div class="section-head"><h2>Journal d’audit</h2><span class="muted" id="audit-count">${events.filter(auditMatch).length} entrée${events.filter(auditMatch).length>1?'s':''} · ${period.label}</span></div><div class="audit-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m21 21-4.3-4.3M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="audit-search-input" placeholder="Rechercher : acteur, commande, type, détail, date…" value="${h(state.auditSearch||'')}" oninput="filterAudit(this.value)" /></div><div id="audit-wrap">${renderAuditWrap()}</div></section>`}
function auditMatch(e){const q=(state.auditSearch||'').toLowerCase().trim();if(!q)return true;return [e.type,e.orderId,e.actor,e.detail,fmtAuditDate(e.at)].join(' ').toLowerCase().includes(q)}
function filterAudit(v){state.auditSearch=v;state.auditPage=0;const wrap=document.getElementById('audit-wrap');if(!wrap)return;wrap.innerHTML=renderAuditWrap();const c=document.getElementById('audit-count');if(c){const period=reportPeriods[state.reportPeriod]||reportPeriods['30d'];const n=auditRows().length;c.textContent=`${n} entrée${n>1?'s':''} · ${period.label}`}}
function refreshAuditWrap(){const wrap=document.getElementById('audit-wrap');if(wrap)wrap.innerHTML=renderAuditWrap()}

function weekStripHTML(o){const start=weekStartOf(baseNow);const due=orderDueDate(o);const names=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];const today=new Date(baseNow);today.setHours(0,0,0,0);let cells='';for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const isToday=d.getTime()===today.getTime();const isDue=due&&d.getTime()===due.getTime();cells+=`<div class="week-day${isToday?' today':''}${isDue?' due':''}"><div class="wd-n">${names[i]}</div><div class="wd-d">${d.getDate()}</div>${isDue?'<div class="wd-tag">Échéance</div>':isToday?'<div class="wd-tag" style="color:var(--blue)">Auj.</div>':''}</div>`}return `<section class="trace-summary"><h3>Cette semaine</h3><div class="week-strip">${cells}</div><div class="mini-sub" style="margin-top:8px">${due?'Échéance de la commande : '+h(o.due):'Échéance non datée'}</div></section>`}

 L’historique détaillé s’ouvre dans la side-window Traçabilité.</div></section><div class="quick-actions"><button class="big-primary" data-panel="messages" data-focus-thread="${h(o.id)}">Messages (${msgCount})</button><button class="secondary" data-panel="trace" data-trace-order="${h(o.id)}">Traçabilité</button><button class="secondary" id="more-options">••• Plus</button></div>`;$('#quick-layer').classList.add('open');setTimeout(()=>$('#quick-close')?.focus(),0)}

const MAX_ATTACH=2*1024*1024;
function fmtSize(b){b=+b||0;if(b<1024)return b+' o';if(b<1048576)return (b/1024).toFixed(0)+' Ko';return (b/1048576).toFixed(1)+' Mo'}
function fileIco(type){return (type||'').startsWith('image/')?'🖼️':/pdf/.test(type||'')?'📄':/word|document|sheet|excel/.test(type||'')?'📑':'📎'}
function readAttachments(fileList,cb){const files=[...(fileList||[])];if(!files.length){cb([]);return}const out=[];let done=0;files.forEach((f,idx)=>{const finish=obj=>{out[idx]=obj;if(++done===files.length)cb(out.filter(Boolean))};if(f.size>MAX_ATTACH){finish({name:f.name,size:f.size,url:null,type:f.type});return}const r=new FileReader();r.onload=()=>finish({name:f.name,size:f.size,url:r.result,type:f.type});r.onerror=()=>finish({name:f.name,size:f.size,url:null,type:f.type});r.readAsDataURL(f)})}
function attachmentHTML(files){return (files||[]).map(f=>`<a class="msg-file"${f.url?` href="${f.url}" download="${h(f.name)}" target="_blank"`:''} title="${f.url?'Ouvrir / télécharger':'Fichier trop volumineux pour l’aperçu (nom transmis)'}"><span class="mf-ico">${fileIco(f.type)}</span><span>${h(f.name)}</span><span class="mf-sz">${fmtSize(f.size)}</span></a>`).join('')}
function renderComposerFiles(inp){if(!inp)return;const box=inp.parentElement.querySelector('.composer-files');if(!box)return;box.innerHTML=[...inp.files].map(f=>`<span class="file-chip">${fileIco(f.type)} ${h(f.name)} <span class="fc-x" data-clear-files="${h(inp.id)}">✕</span></span>`).join('')}
function printReport(){const period=reportPeriods[state.reportPeriod]||reportPeriods['30d'];const events=auditInPeriod(period.days);const scans=events.filter(e=>e.type==='Scan').length;const blocks=events.filter(e=>e.type==='Blocage'||/bloqu/i.test(e.detail)).length;const delivered=events.filter(e=>e.type==='Livraison').length;const onTime=events.filter(e=>e.type==='Livraison'&&/à temps/i.test(e.detail)).length;const rate=delivered?Math.round(onTime/delivered*100):0;const rows=auditRows();let area=document.getElementById('print-area');if(!area){area=document.createElement('div');area.id='print-area';document.body.appendChild(area)}area.innerHTML=`<div class="fiche"><div class="fiche-head"><div><div class="fiche-brand">DentalFlow</div><h1>Rapport d’activité</h1></div><div class="fiche-code">${h(period.label)}</div></div><div class="report-print-kpis"><div><b>${events.length}</b><span>Événements</span></div><div><b>${delivered}</b><span>Livrées${delivered?` · ${rate}% à temps`:''}</span></div><div><b>${blocks}</b><span>Blocages</span></div><div><b>${scans}</b><span>Scans</span></div></div><h2 class="report-print-h2">Journal d’audit — ${rows.length} entrée${rows.length>1?'s':''}${state.auditType&&state.auditType!=='all'?` · ${h(state.auditType)}`:''}${state.auditSearch?` · « ${h(state.auditSearch)} »`:''}</h2><table class="print-audit"><thead><tr><th>Date</th><th>Type</th><th>Commande</th><th>Acteur</th><th>Détail</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${fmtAuditDate(e.at)}</td><td>${h(e.type)}</td><td>${h(e.orderId)}</td><td>${h(e.actor)}</td><td>${h(e.detail)}</td></tr>`).join('')}</tbody></table><div class="fiche-foot">Émis le ${new Date().toLocaleDateString('fr-FR')} · DentalFlow Next — POC</div></div>`;window.print()}
function addMessage(id,text,files){if(!text&&!(files&&files.length))return;if(!state.messages[id])state.messages[id]=[];state.messages[id].push({from:'lab',text,at:Clock.now().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),readAt:Clock.iso(),unread:false,files:files||[]});save();if(state.sidePanel==='messages')renderMessagesPanel();else render()}
function createOrder(data){const id=generateOrderId();const o={id,patientRef:generatePatientRef(),type:data.type,cabinet:data.cabinet,status:'progress',due:data.due,tech:'',priority:data.priority||'Normale',timeAtPost:0,avgTime:45,noInitialScan:true};deriveOrderModel(o); state.orders.unshift(o); state.historyEvents.push({orderId:o.id,type:'Création',at:Clock.iso(),detail:'Commande créée'}); state.messages[o.id]=[]; save(); state.view='orders'; closeSidePanel(); showToast(`${o.id} créée`); render(); openQuickView(o.id)}
/* ===== Espace cabinet (dentiste) ===== */
function isDentistMode(){return new URLSearchParams(location.search).get('mode')==='dentist'}
function fabricationLeadDays(type){return fabricationDays[type]||fabricationDays.default}
function activeLoadCount(){return state.orders.filter(o=>{const b=getDistributionBucket(o);return b==='active'||b==='blocked'}).length}
function labLoadBufferDays(){return Math.floor(activeLoadCount()/4)}
function addBusinessDays(date,days){const d=new Date(date);let a=0;while(a<days){d.setDate(d.getDate()+1);const wd=d.getDay();if(wd!==0&&wd!==6)a++}return d}
function fmtDateShort(d){return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'})}
function proposedDeliveries(type){const lead=fabricationLeadDays(type);const buffer=labLoadBufferDays();const base=addBusinessDays(baseNow,lead+buffer);return [{date:new Date(base),tag:'Au plus tôt'},{date:addBusinessDays(base,2),tag:'Confort +2 j'},{date:addBusinessDays(base,5),tag:'Flexible +5 j'}]}
function dentistOrdersHTML(orders){if(!orders.length)return '<section class="card section"><div class="empty">Aucune commande pour ce cabinet. Créez-en une via « Nouvelle commande ».</div></section>';return `<section class="card section"><div class="section-head"><h2>Mes commandes</h2><span class="muted">Cliquez une commande pour le détail</span></div><div class="watch-list">${orders.map(o=>{const [label,color]=statusInfo(o.status);const scan=lastScan(o);return `<div class="watch-item" data-ddetail="${h(o.id)}" style="cursor:pointer;grid-template-columns:48px 1fr auto"><div class="alert-ico ${color}">${icon('tooth')}</div><div class="watch-main"><b>${h(o.id)}</b><span class="pill ${color}">${label}</span><div class="watch-sub">${h(o.type)} · ${h(patientDisplay(o))}</div><div class="watch-meta">${scan?`En production · ${h(scan.station)}`:'Réceptionnée par le laboratoire'} · Livraison ${h(o.due)}</div></div><div class="chev">›</div></div>`}).join('')}</div></section>`}
function dentistDetailHTML(o){const [label,color]=statusInfo(o.status);const scans=state.scanEvents.filter(e=>e.orderId===o.id&&e.event==='Scan').reverse();const loc=getCurrentStation(o.id);return `<div class="pdetail-layer" id="pdetail"><div class="pdetail-card"><div class="quick-head"><div><h2>${h(o.id)} <span class="pill ${color}">${label}</span></h2><div class="quick-sub">${h(o.type)} · ${h(patientDisplay(o))}</div></div><button class="quick-close" data-ddetail-close aria-label="Fermer">×</button></div><section class="quick-grid"><div class="mini-card"><div class="mini-label">Patient</div><div class="mini-value">${h(patientDisplay(o))}</div><div class="mini-sub">Réf. ${h(o.patientRef)}</div></div><div class="mini-card"><div class="mini-label">Livraison prévue</div><div class="mini-value">${h(o.due)}</div></div><div class="mini-card"><div class="mini-label">Statut</div><div class="mini-value">${label}</div></div><div class="mini-card"><div class="mini-label">Localisation</div><div class="mini-value">${o.status==='ready'?'Prête à expédier':(loc.confirmed?h(loc.station):'En préparation')}</div></div></section><div class="trace-summary"><h3>Suivi de fabrication</h3>${scans.length?`<div class="timeline">${scans.map(e=>`<div class="timeline-item"><b>${h(e.station)}</b><div class="muted">${h(fmtTime(e.at))} · ${h(e.tech)}</div></div>`).join('')}</div>`:'<div class="empty">En attente de prise en charge par le laboratoire</div>'}</div><div class="order-qr"><div class="order-qr-code">${qrSvg(o.id)}</div><div class="order-qr-info"><div class="mini-label">QR commande ${h(o.id)}</div><div class="mini-sub">À joindre au dossier physique envoyé au laboratoire.</div><button class="ghost" data-print-fiche="${h(o.id)}" style="margin-top:8px">Imprimer la fiche</button></div></div><div class="quick-actions" style="grid-template-columns:1fr;margin-top:14px"><button class="big-primary" data-dthread="${h(o.id)}">Écrire au laboratoire</button></div></div></div>`}
function dentistNewHTML(){const types=Object.keys(fabricationDays).filter(t=>t!=='default');const type=(state.dentistNewType&&types.includes(state.dentistNewType))?state.dentistNewType:types[0];const deliveries=proposedDeliveries(type);const sel=Math.min(state.dentistDeliv||0,deliveries.length-1);return `<section class="card section"><div class="section-head"><h2>Nouvelle commande</h2></div><form id="dentist-order-form" class="dnew-form"><div class="dnew-main"><div class="field"><label>Type de prothèse</label><select name="type" id="dentist-type">${types.map(t=>`<option${t===type?' selected':''}>${h(t)}</option>`).join('')}</select></div><div class="field"><label>Teinte / indications</label><input name="notes" placeholder="Teinte A3, contact mésial…" /></div><div class="field" style="margin-top:-2px"><span class="mini-sub">Une référence patient opaque est générée automatiquement. Aucune donnée nominative n’est transmise au laboratoire via ce POC.</span></div><div class="field"><label>Fichiers joints (empreintes, radios, photos…)</label><input type="file" name="orderfiles" id="dentist-order-files" class="composer-file" multiple hidden><label class="attach-line" for="dentist-order-files"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3l7.8-7.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Joindre des fichiers</span></label><div class="composer-files"></div></div></div><aside class="dnew-side"><div class="deliv-title" style="margin-top:0">Dates de livraison proposées</div><div class="deliv-hint">Calculées selon le délai de fabrication (<b>${fabricationLeadDays(type)} j ouvrés</b>) et la charge actuelle du laboratoire (<b>+${labLoadBufferDays()} j</b>).</div><div class="deliv-opts dnew-deliv">${deliveries.map((d,i)=>`<label class="deliv-opt ${i===sel?'active':''}"><input type="radio" name="deliv" value="${i}" ${i===sel?'checked':''} hidden><div class="deliv-tag">${h(d.tag)}</div><div class="deliv-date">${h(fmtDateShort(d.date))}</div></label>`).join('')}</div><button class="big-primary" type="submit" style="width:100%;margin-top:6px">Envoyer la commande au laboratoire</button></aside></form></section>`}
function dentistThreadHTML(o){return `<div class="section-head"><h2>${h(o.id)} · ${h(o.type)}</h2></div><div id="thread-messages">${(state.messages[o.id]||[]).map(m=>`<div class="bubble ${m.from==='cabinet'?'lab':'cabinet'}"><b>${m.from==='cabinet'?'Vous':'Laboratoire'}</b><br>${m.text?h(m.text):''}${attachmentHTML(m.files)}<div style="opacity:.7;font-size:11px;margin-top:4px">${h(m.at)}</div></div>`).join('')}</div><form class="composer" id="dentist-compose" data-order="${h(o.id)}"><input class="composer-text" placeholder="Écrire au laboratoire…" /><input type="file" id="dent-file-${h(o.id)}" class="composer-file" multiple hidden /><label class="composer-attach" for="dent-file-${h(o.id)}" title="Joindre un fichier"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3l7.8-7.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></label><button>Envoyer</button><div class="composer-files"></div></form>`}
function dentistMessagesHTML(orders){const threads=orders.filter(o=>state.messages[o.id]&&state.messages[o.id].length);const active=state.dentistThread&&orders.find(o=>o.id===state.dentistThread);return `<section class="side-message-layout"><article class="card thread-list">${threads.length?threads.map(o=>{const last=(state.messages[o.id]||[]).slice(-1)[0]?.text||'';return `<button class="thread-item ${o.id===state.dentistThread?'active':''}" data-dthread="${h(o.id)}"><div class="thread-top"><strong>${h(o.id)}</strong></div><div class="thread-order">${h(o.type)}</div><div class="thread-preview">${h(last)}</div></button>`}).join(''):'<div class="empty">Aucune conversation.</div>'}</article><article class="card section thread-panel">${active?dentistThreadHTML(active):'<div class="empty">Sélectionnez une commande.</div>'}</article></section>`}
function renderDentistMode(){const cabinets=[...new Set(state.orders.map(o=>o.cabinet))].filter(Boolean).sort();if(!cabinets.length)cabinets.push('Cabinet démo');if(!state.dentistCabinet||!cabinets.includes(state.dentistCabinet))state.dentistCabinet=cabinets[0];const cab=state.dentistCabinet;const tab=state.dentistView||'orders';const myOrders=state.orders.filter(o=>o.cabinet===cab);const content=tab==='orders'?dentistOrdersHTML(myOrders):tab==='new'?dentistNewHTML():dentistMessagesHTML(myOrders);document.body.innerHTML=`<div class="portal" id="portal"><header class="portal-header"><div class="portal-brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M7.8 3.4c1 0 1.9.5 2.7.9.6.3 1 .5 1.5.5s.9-.2 1.5-.5c.8-.4 1.7-.9 2.7-.9 2.3 0 3.9 1.9 3.9 4.6 0 1.5-.6 3.2-1.4 4.8-.6 1.3-1 2.7-1.3 4.1-.4 1.9-.9 3.4-2.2 3.4-.9 0-1.3-.9-1.8-2.6-.4-1.4-.8-2.3-1.5-2.3s-1.1.9-1.5 2.3c-.5 1.7-.9 2.6-1.8 2.6-1.3 0-1.8-1.5-2.2-3.4-.3-1.4-.7-2.8-1.3-4.1C4.5 11.2 4 9.5 4 8c0-2.7 1.5-4.6 3.8-4.6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>DentalFlow · Espace cabinet</span></div><div class="portal-cabsel"><label>Cabinet</label><select id="portal-cab">${cabinets.map(c=>`<option${c===cab?' selected':''}>${h(c)}</option>`).join('')}</select></div><button class="ghost" id="portal-back">Retour laboratoire</button></header><div class="portal-body"><div class="portal-tabs"><button class="ptab ${tab==='orders'?'active':''}" data-dtab="orders">Mes commandes</button><button class="ptab ${tab==='new'?'active':''}" data-dtab="new">Nouvelle commande</button></div>${content}</div>${state.dentistDetail&&myOrders.find(o=>o.id===state.dentistDetail)?dentistDetailHTML(myOrders.find(o=>o.id===state.dentistDetail)):''}<div class="toast" id="toast"></div></div>`;attachDentistHandlers()}
function attachDentistHandlers(){const root=document.getElementById('portal');if(!root)return;root.addEventListener('click',e=>{const cf=e.target.closest('[data-clear-files]');if(cf){const inp=document.getElementById(cf.dataset.clearFiles);if(inp){inp.value='';renderComposerFiles(inp)}return}const tab=e.target.closest('[data-dtab]');if(tab){state.dentistView=tab.dataset.dtab;state.dentistDetail=null;renderDentistMode();return}const thr=e.target.closest('[data-dthread]');if(thr){state.dentistThread=thr.dataset.dthread;state.dentistView='messages';state.dentistDetail=null;renderDentistMode();return}if(e.target.closest('[data-ddetail-close]')||e.target.id==='pdetail'){state.dentistDetail=null;renderDentistMode();return}const pf=e.target.closest('[data-print-fiche]');if(pf){printFiche(pf.dataset.printFiche);return}const det=e.target.closest('[data-ddetail]');if(det){state.dentistDetail=det.dataset.ddetail;renderDentistMode();return}if(e.target.closest('#portal-back')){location.href=location.pathname;return}const opt=e.target.closest('.deliv-opt');if(opt){const inp=opt.querySelector('input');if(inp){state.dentistDeliv=+inp.value;renderDentistMode()}return}});root.addEventListener('change',e=>{if(e.target.id==='portal-cab'){state.dentistCabinet=e.target.value;state.dentistThread=null;renderDentistMode()}if(e.target.id==='dentist-type'){state.dentistNewType=e.target.value;state.dentistDeliv=0;renderDentistMode()}});root.addEventListener('submit',e=>{if(e.target.id==='dentist-order-form'){e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form).entries());const fileInp=form.querySelector('.composer-file');readAttachments(fileInp&&fileInp.files,files=>createDentistOrder(data,files));return}if(e.target.id==='dentist-compose'){e.preventDefault();const form=e.target;const inp=form.querySelector('.composer-text');const fileInp=form.querySelector('.composer-file');const text=inp?inp.value.trim():'';readAttachments(fileInp&&fileInp.files,files=>addCabinetMessage(form.dataset.order,text,files))}});root.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('composer-file'))renderComposerFiles(e.target)})}
function createDentistOrder(data,files){const cab=state.dentistCabinet;const type=data.type||Object.keys(fabricationDays)[0];const id=generateOrderId();const deliveries=proposedDeliveries(type);const chosen=deliveries[Math.min(+data.deliv||0,deliveries.length-1)];const due=fmtDateShort(chosen.date);const o={id,patientRef:generatePatientRef(),type,cabinet:cab,status:'progress',due,tech:'',priority:'Normale',timeAtPost:0,avgTime:45,noInitialScan:true,createdByCabinet:true};deriveOrderModel(o);state.orders.unshift(o);const now=Clock.now().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});state.messages[id]=[{from:'cabinet',text:`Nouvelle commande ${type} — livraison souhaitée ${due}.${data.notes?' Indications : '+data.notes:''}`,at:now,readAt:null,unread:true,files:files||[]}];logAudit(id,'Création',`Commande créée via l'espace cabinet (${cab})`);save();state.dentistView='orders';state.dentistThread=id;renderDentistMode();showToast(`${id} envoyée au laboratoire`)}

function weekStartOf(date){const d=new Date(date);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);d.setHours(0,0,0,0);return d}
function planningWeeks(count){const start=weekStartOf(baseNow);const arr=[];for(let i=0;i<count;i++){const s=new Date(start);s.setDate(s.getDate()+i*7);const e=new Date(s);e.setDate(e.getDate()+4);arr.push({i,start:s,end:e})}return arr}
function grossWeeklyCapacity(){return state.users.reduce((a,u)=>a+(+u.capacity||0),0)}
function capacityLostInWeek(week,extra){let lost=0;state.absences.concat(extra||[]).forEach(ab=>{const u=state.users.find(x=>x.id===ab.userId);if(!u)return;let d=new Date(Math.max(new Date(ab.from).getTime(),week.start.getTime()));const end=new Date(Math.min(new Date(ab.to).getTime(),week.end.getTime()));while(d.getTime()<=end.getTime()){const wd=d.getDay();if(wd!==0&&wd!==6)lost+=(+u.capacity||0)/5;d.setDate(d.getDate()+1)}});return lost}
function netWeekCapacity(week,extra){return Math.max(0,Math.round(grossWeeklyCapacity()-capacityLostInWeek(week,extra)))}
function whatIfLeaves(){const sims=(state.whatIfSims||[]).slice();(state.whatIfInclude||[]).forEach(id=>{const r=(state.leaveRequests||[]).find(x=>x.id===id&&x.status==='pending');if(r)sims.push({userId:r.userId,from:r.from,to:r.to})});return sims}
function whatIfSectionHTML(){const weeks=planningWeeks(8);const sims=whatIfLeaves();const pend=(state.leaveRequests||[]).filter(r=>r.status==='pending');const rows=weeks.map(w=>{const capNow=netWeekCapacity(w);const capSim=netWeekCapacity(w,sims);const load=weekForecast(w.i);const soldeSim=capSim-load;const cls=soldeSim>=0?'green':soldeSim>=-6?'orange':'red';const delta=capSim-capNow;return `<tr><td><b>S${w.i+1}</b><div class="muted" style="font-size:12px">${h(fmtDateShort(w.start))}</div></td><td>${capNow}</td><td><b>${capSim}</b>${delta?` <span class="danger" style="font-weight:800">${delta}</span>`:''}</td><td>${load}</td><td><span class="pill ${cls}">${soldeSim>=0?'+':''}${soldeSim}</span></td></tr>`}).join('');const negWeeks=weeks.filter(w=>(netWeekCapacity(w,sims)-weekForecast(w.i))<0).length;const negBase=weeks.filter(w=>(netWeekCapacity(w)-weekForecast(w.i))<0).length;const totalImpact=weeks.reduce((s,w)=>s+(netWeekCapacity(w)-netWeekCapacity(w,sims)),0);const hasSim=sims.length>0;return `<section class="card section" style="margin-top:14px"><div class="section-head"><div><h2>Simulateur What‑If — congés</h2><div class="mini-sub">Évaluez l'impact de congés (demandes en attente ou hypothétiques) sur le plan de charge avant de décider.</div></div><button class="ghost" id="whatif-reset">Réinitialiser</button></div><div class="whatif-grid"><div class="whatif-controls"><div class="mini-label" style="margin-bottom:8px">Inclure des demandes en attente</div>${pend.length?pend.map(r=>{const u=state.users.find(x=>x.id===r.userId);const on=(state.whatIfInclude||[]).includes(r.id);return `<label class="whatif-req${on?' on':''}"><input type="checkbox" ${on?'checked':''} data-whatif-req="${h(r.id)}"><span><b>${h(u?u.name:'—')}</b> · ${h(fmtDateShort(new Date(r.from)))}→${h(fmtDateShort(new Date(r.to)))} · ${bizDays(r.from,r.to)} j</span></label>`}).join(''):'<div class="empty" style="padding:12px">Aucune demande en attente.</div>'}<div class="mini-label" style="margin:16px const MONTH_KEYS=['janv','fevr','mars','avr','mai','juin','juil','aout','sept','oct','nov','dec'];
function orderDueDate(o){const raw=(o&&o.due)||'';const base=new Date(baseNow);base.setHours(0,0,0,0);const low=String(raw).toLowerCase();if(/aujourd/.test(low))return base;if(/demain/.test(low)){const d=new Date(base);d.setDate(d.getDate()+1);return d}const s=low.normalize('NFD').replace(/[̀-ͯ]/g,'');const m=s.match(/(\d{1,2})\s+([a-z]+)/);if(m){const day=parseInt(m[1],10);const mon=m[2];const mi=MONTH_KEYS.findIndex(k=>mon.startsWith(k));if(mi>=0&&day>=1&&day<=31){let d=new Date(base.getFullYear(),mi,day);if(d.getTime()<base.getTime()-1000*60*60*24*200)d=new Date(base.getFullYear()+1,mi,day);d.setHours(0,0,0,0);return d}}return null}
let ORDER_BOOK=[];
function buildOrderBook(){ORDER_BOOK=[];const start=weekStartOf(baseNow);const wip=state.orders.filter(o=>!isOrderCompleted(o)).map(o=>orderDueDate(o)).filter(Boolean);wip.forEach(d=>ORDER_BOOK.push(d));let seed=1934571>>>0;const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return seed/4294967296};const gross=grossWeeklyCapacity()||1;for(let w=0;w<8;w++){const wStart=new Date(start);wStart.setDate(wStart.getDate()+w*7);const wEnd=new Date(wStart);wEnd.setDate(wEnd.getDate()+6);const real=wip.filter(d=>d.getTime()>=wStart.getTime()&&d.getTime()<=wEnd.getTime()).length;const target=Math.round(gross*(0.82+rnd()*0.3));for(let k=real;k<target;k++){const d=new Date(wStart);d.setDate(d.getDate()+Math.floor(rnd()*5));d.setHours(0,0,0,0);ORDER_BOOK.push(d)}}}
function weekForecast(i){const start=weekStartOf(baseNow);const s=new Date(start);s.setDate(s.getDate()+i*7);const e=new Date(s);e.setDate(e.getDate()+6);const s0=s.getTime(),e0=e.getTime();return ORDER_BOOK.filter(d=>d.getTime()>=s0&&d.getTime()<=e0).length}
function renderPlanning(){setPageMeta('Plan de charge','Capacité de l’équipe et projection à long terme');buildOrderBook();const weeks=planningWeeks(8);const gross=grossWeeklyCapacity();const upcoming=state.absences.filter(a=>new Date(a.to)>=baseNow).sort((x,y)=>new Date(x.from)-new Date(y.from));const nextAbs=upcoming[0];const nextU=nextAbs&&state.users.find(u=>u.id===nextAbs.userId);const absSub=nextAbs?`Prochaine : ${fmtDateShort(new Date(nextAbs.from))}${nextU?' · '+nextU.name.split(' ')[0]:''}`:'Aucune dans les 30 prochains jours';const pend=(state.leaveRequests||[]).filter(r=>r.status==='pending');

function openPlanWeek(i){const w=planningWeeks(8)[i];if(!w)return;buildOrderBook();const gross=grossWeeklyCapacity();const lost=Math.round(capacityLostInWeek(w));const cap=Math.max(0,gross-lost);const load=weekForecast(i);const bal=cap-load;const occ=cap?Math.round(load/cap*100):0;const sig=occ<90?['À l’aise','green']:occ<=100?['Tendu','orange']:['Surcharge','red'];const abs=state.absences.filter(a=>{const f=new Date(a.from),t=new Date(a.to);return t>=w.start&&f<=w.end}).map(a=>{const u=state.users.find(x=>x.id===a.userId);return {name:u?u.name:'—',from:a.from,to:a.to,reason:a.reason}});$('#quick-body').innerHTML=`<div class="quick-head"><div><h2 id="quick-title">Semaine ${i+1} <span class="pill ${sig[1]}">${sig[0]}</span></h2><div class="quick-sub">${h(fmtDateShort(w.start))} → ${h(fmtDateShort(w.end))}</div></div><button class="quick-close" id="quick-close" aria-label="Fermer">×</button></div><div class="planpop-solde ${bal>=0?'green':'red'}"><div class="planpop-solde-num">${bal>=0?'+':''}${bal}</div><div class="mini-sub">solde (capacité nette − charge)</div></div><section class="quick-grid"><div class="mini-card"><div class="mini-label">Capacité brute</div><div class="mini-value">${gross}</div><div class="mini-sub">${state.users.length} collaborateurs</div></div><div class="mini-card"><div class="mini-label">Impact absences</div><div class="mini-value" style="color:${lost?'var(--orange)':'inherit'}">−${lost}</div><div class="mini-sub">${abs.length} absent${abs.length>1?'s':''}</div></div><div class="mini-card"><div class="mini-label">Capacité nette</div><div class="mini-value">${cap}</div><div class="mini-sub">commandes / semaine</div></div><div class="mini-card"><div class="mini-label">Charge à livrer</div><div class="mini-value">${load}</div><div class="mini-sub">échéances de la semaine</div></div><div class="mini-card"><div class="mini-label">Occupation</div><div class="mini-value" style="color:var(--${sig[1]})">${occ}%</div><div class="mini-sub">charge / capa function openEffectifPopup(){const today=new Date(baseNow);today.setHours(0,0,0,0);const isOff=u=>state.absences.some(a=>{const f=new Date(a.from);f.setHours(0,0,0,0);const t=new Date(a.to);t.setHours(23,59,59,999);return a.userId===u.id&&today>=f&&today<=t});const present=state.users.filter(u=>!isOff(u));const absent=state.users.filter(isOff);const row=u=>`<div class="lab-user-row"><div class="lab-user-avatar" style="background:${userColor(u)}">${h(userInitials(u.name))}</div><div><div class="lab-user-name">${h(u.name)}</div><div class="lab-user-role">${h(u.role)}${u.scope?' · '+h(u.scope):''}</div></div><div class="lab-user-actions"><span class="pill green">Présent</span></div></div>`;const arow=u=>{const a=state.absences.find(x=>x.userId===u.id&&(()=>{const f=new Date(x.from);f.setHours(0,0,0,0);const t=new Date(x.to);t.setHours(23,59,59,999);return today>=f&&today<=t})());return `<div class="lab-user-row"><div class="lab-user-avatar" style="background:${userColor(u)};opacity:.55">${h(userInitials(u.name))}</div><div><div class="lab-user-name">${h(u.name)}</div><div class="lab-user-role">${h(u.role)} · ${h(a?a.reason:'Absent')}</div></div><div class="lab-user-actions"><span class="pill orange">Absent</span></div></div>`};$('#quick-body').innerHTML=`<div class="quick-head"><div><h2 id="quick-title">Effectif présent</h2><div class="quick-sub">${present.length} présent${present.length>1?'s':''} sur ${state.users.length} · ${h(fmtDateShort(today))}</div></div><button class="quick-close" id="quick-close" aria-label="Fermer">×</button></div><div class="users-list">${present.map(row).join('')}</div>${absent.length?`<h3 style="font-size:14px;font-weight:850;margin:16px 0 4px">Absents aujourd’hui (${absent.length})</h3><div class="users-list">${absent.map(arow).join('')}</div>`:''}`;$('#quick-layer').classList.add('open')}

function bizDays(fromStr,toStr){let d=new Date(fromStr);const end=new Date(toStr);if(isNaN(d)||isNaN(end)||end<d)return 0;let n=0;while(d<=end){const w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1)}return n}
function leaveTaken(uid){return state.absences.filter(a=>a.userId===uid&&(a.reason||'').toLowerCase().indexOf('formation')<0).reduce((s,a)=>s+bizDays(a.from,a.to),0)}
function leavePending(uid){return (state.leaveRequests||[]).filter(r=>r.userId===uid&&r.status==='pending').reduce((s,r)=>s+bizDays(r.from,r.to),0)}
function submitLeaveRequest(uid,from,to,reason){if(!uid||!from||!to)return showToast('Champs requis');if(new Date(to)<new Date(from))return showToast('Dates invalides');const id='L'+Date.now().toString(36);state.leaveRequests.push({id,userId:uid,from,to,reason:reason||'Congés',status:'pending'});const u=state.users.find(x=>x.id===uid);logAudit(uid,'Utilisateur',`Demande de congés : ${u?u.name:''} (${from} → ${to})`);save()}
function approveLeave(id){const r=(state.leaveRequests||[]).find(x=>x.id===id);if(!r||r.status==='approved')return;r.status='approved';if(!state.absences.some(a=>a.id==='AB-'+id))state.absences.push({id:'AB-'+id,userId:r.userId,from:r.from,to:r.to,reason:r.reason||'Congés'});const u=state.users.find(x=>x.id===r.userId);logAudit(r.userId,'Utilisateur',`Congés approuvés : ${u?u.name:''} (${r.from} → ${r.to})`);save();render();showToast('Congés approuvés')}

function staffCalendarHTML(me){const base=new Date(baseNow);base.setDate(1);base.setMonth(base.getMonth()+(state.staffMonth||0));const year=base.getFullYear(),month=base.getMonth();const title=base.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});const firstW=(new Date(year,month,1).getDay()+6)%7;const dcount=new Date(year,month+1,0).getDate();const approved=state.absences;const pad=n=>String(n).padStart(2,'0');const cells=[];for(let i=0;i<firstW;i++)cells.push('<div class="cal-cell empty"></div>');for(let d=1;d<=dcount;d++){const iso=`${year}-${pad(month+1)}-${pad(d)}`;const wd=new Date(year,month,d).getDay();const wknd=wd===0||wd===6;const offs=approved.filter(a=>iso>=a.from&&iso<=a.to);const mine=offs.some(a=>a.userId===me.id);const names=offs.map(a=>{const u=state.users.find(x=>x.id===a.userId);return u?u.name.split(' ')[0]:''}).filter(Boolean).join(', ');cells.push(`<div class="cal-cell${wknd?' wknd':''}${mine?' mine':''}" title="${h(names)}"><span class="cal-d">${d}</span>${offs.length?`<span class="cal-dot${mine?' mineDot':''}">${offs.length}</span>`:''}</div>`)}return `<div class="cal-title">${h(title)}</div><div class="cal-grid"><div class="cal-h">L</div><div class="cal-h">M</div><div class="cal-h">M</div><div class="cal-h">J</div><div class="cal-h">V</div><div class="cal-h">S</div><div class="cal-h">D</div>${cells.join('')}</div><div class="cal-legend"><span><i class="cal-lg mine"></i>Mes congés</span><span><i class="cal-lg team"></i>Équipe absente</span></div>`}

  if(document.getElementById('portal')||!document.getElementById('view-root'))return;
  if(e.target.closest('#user-menu-trigger')){toggleUserMenu();return}
  const _um=document.getElementById('user-menu');
  if(_um&&_um.classList.contains('open')&&!e.target.closest('#user-menu'))closeUserMenu();
  const action=e.target.closest('[data-action]');
  if(action){e.stopPropagation();if(action.dataset.action==='scan')showToast('Le scan se fait dans DentalFlow Scan');if(action.dataset.action==='add-doc')showToast('Documents hors scope V3');return}
  const searchOrder=e.target.closest('[data-search-order]');
  if(searchOrder){state.searchOpen=false;state.search='';$('#search').value='';closeSearchPopup();openQuickView(searchOrder.dataset.searchOrder);return}
  const theme=e.target.closest('button[data-theme]');
  if(theme){state.theme=theme.dataset.theme;applyTheme();save();render();showToast(`Thème ${state.theme==='dark'?'sombre':state.theme==='light'?'clair':'système'} activé`);const um=$('#user-menu');if(um&&um.classList.contains('open'))um.innerHTML=userMenuInnerHTML();return}
  const chartTab=e.target.closest('[data-chart-tab]');
  if(chartTab){state.productionChartMode=chartTab.dataset.chartTab;render();return}
  const sortTh=e.target.closest('th[data-sort]');
  if(sortTh){const k=sortTh.dataset.sort;if(state.sortKey===k)state.sortDir=state.sortDir==='asc'?'desc':'asc';else{state.sortKey=k;state.sortDir='asc'}state.ordersPage=0;render();return}
  const reportPeriod=e.target.closest('[data-report-period]');
  if(reportPeriod){state.reportPeriod=reportPeriod.dataset.reportPeriod;state.auditPage=0;render();return}
  const aType=e.target.closest('[data-audit-type]');
  if(aType){state.auditType=aType.dataset.auditType;state.auditPage=0;refreshAuditWrap();return}
  const aSort=e.target.closest('[data-audit-sort]');
  if(aSort){const k=aSort.dataset.auditSort;if(state.auditSortKey===k)state.auditSortDir=state.auditSortDir==='asc'?'desc':'asc';else{state.auditSortKey=k;state.auditSortDir=(k==='at')?'desc':'asc'}state.auditPage=0;refreshAuditWrap();return}
  const aPage=e.target.closest('[data-audit-page]');
  if(aPage){state.auditPage=(state.auditPage||0)+(aPage.dataset.auditPage==='next'?1:-1);refreshAuditWrap();return}
  const tab=e.target.closest('[data-tab]');
  if(tab){state.drawerTab=tab.dataset.tab;openDrawer(state.drawer);return}
  const order=e.target.closest('[data-order]');
  if(order){openQuickView(order.dataset.order);return}
  const panel=e.target.closest('[data-panel]');
  if(panel){
    const panelName=panel.dataset.panel;
    if(panel.dataset.focusThread){state.selectedThreadId=panel.dataset.focusThread;state.messagesListOnly=false;markThreadRead(panel.dataset.focusThread)}
    else if(panelName==='messages'){state.messagesListOnly=true;state.selectedThreadId=null}
    const sidePanelOrderId=panel.dataset.traceOrder||null;
    openSidePanel(panelName,sidePanelOrderId);
    return;
  }
  const kpiTile=e.target.closest('[data-kpi]');
  if(kpiTile){state.kpiBucket=kpiTile.dataset.kpi;openSidePanel('kpi');return}
  const view=e.target.closest('[data-view]');
  if(view){state.view=view.dataset.view;state.quickOrderId=null;state.sidePanel=null;state.sidePanelOrderId=null;$('#side-layer').classList.remove('open');$('#quick-layer').classList.remove('open');if(view.dataset.filter)state.filter=view.dataset.filter;render();return}
  const filter=e.target.closest('[data-filter]');
  if(filter){state.filter=filter.dataset.filter;state.ordersPage=0;render();return}
  const oPage=e.target.closest('[data-orders-page]');
  if(oPage){state.ordersPage=(state.ordersPage||0)+(oPage.dataset.ordersPage==='next'?1:-1);render();return}
  const thread=e.target.closest('[data-thread]');
  if(thread){state.selectedThreadId=thread.dataset.thread;state.messagesListOnly=false;markThreadRead(thread.dataset.thread);if(state.sidePanel!=='messages'){state.sidePanel='messages';$('#side-layer').classList.add('open')}renderMessagesPanel();updateNotif();updateNav();return}
  if(e.target.closest('#drawer-close')||e.target.id==='drawer-layer'){state.drawer=null;$('#drawer-layer').classList.remove('open');return}
  if(e.target.closest('#quick-close')||e.target.id==='quick-layer'){closeQuickView();return}
  if(e.target.closest('#side-close')||e.target.id==='side-layer'){closeSidePanel();return}
  if(e.target.closest('#new-order-btn,#new-order-inline')){openSidePanel('newOrder');return}
  if(e.target.closest('#cancel-order')){closeSidePanel();return}
  if(e.target.closest('#sidebar-toggle')){state.sidebarCollapsed=!state.sidebarCollapsed;applySidebar();save();return}
  const stockAdj=e.target.closest('[data-stock-adj]');
  if(stockAdj){adjustStock(stockAdj.dataset.id,parseInt(stockAdj.dataset.delta,10));return}
  const stockEdit=e.target.closest('[data-stock-edit]');
  if(stockEdit){openSidePanel('stockForm',stockEdit.dataset.id);return}
  if(e.target.closest('#new-stock-btn')){openSidePanel('stockForm',null);return}
  const userEdit=e.target.closest('[data-user-edit]');
  if(userEdit){state.sidePanelUserId=userEdit.dataset.userEdit;openSidePanel('userForm');return}
  if(e.target.closest('#new-user-btn')){state.sidePanelUserId=null;openSidePanel('userForm');return}
  if(e.target.closest('#prod-add-stage')){addStage();return}
  if(e.target.closest('#print-report')){printReport();return}
  const clearFiles=e.target.closest('[data-clear-files]');if(clearFiles){const inp=document.getElementById(clearFiles.dataset.clearFiles);if(inp){inp.value='';renderComposerFiles(inp)}return}
  const colorSw=e.target.closest('[data-color]');
  if(colorSw){const inp=document.getElementById('ucolor-input');if(inp)inp.value=colorSw.dataset.color;const wrap=colorSw.parentElement;if(wrap)wrap.querySelectorAll('.color-sw').forEach(x=>x.classList.toggle('active',x===colorSw));return}
  const printFicheBtn=e.target.closest('[data-print-fiche]');
  if(printFicheBtn){printFiche(printFicheBtn.dataset.printFiche);return}
  if(e.target.closest('#new-absence-btn')){openSidePanel('absenceForm');return}
  const absDel=e.target.closest('[data-absence-del]');
  if(absDel){deleteAbsence(absDel.dataset.absenceDel);return}
  if(e.target.closest('#open-dentist')){location.href=location.pathname+'?mode=dentist';return}
  if(e.target.closest('#open-staff')){location.href=location.pathname+'?mode=staff';return}
  const leaveApp=e.target.closest('[data-leave-approve]');if(leaveApp){approveLeave(leaveApp.dataset.leaveApprove);return}
  const leaveRef=e.target.closest('[data-leave-refuse]');if(leaveRef){refuseLeave(leaveRef.dataset.leaveRefuse);return}
  const weekRow=e.target.closest('[data-week]');if(weekRow){openPlanWeek(+weekRow.dataset.week);return}
  if(e.target.closest('#open-charge-cal')){state.calMode='charge';state.chargeMonth=0;openMonthCalendar();return}
  if(e.target.closest('#whatif-cal')){state.calMode='whatif';state.chargeMonth=0;openMonthCalendar();return}
  const chgMonth=e.target.closest('[data-charge-month]');if(chgMonth){state.chargeMonth=(state.chargeMonth||0)+parseInt(chgMonth.dataset.chargeMonth,10);openMonthCalendar();return}
  if(e.target.closest('[data-effectif]')){openEffectifPopup();return}
  if(e.target.closest('[data-scroll-abs]')){const el=document.getElementById('abs-planifiees');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const wReq=e.target.closest('[data-whatif-req]');if(wReq){const id=wReq.dataset.whatifReq;const set=state.whatIfInclude||[];state.whatIfInclude=set.includes(id)?set.filter(x=>x!==id):set.concat(id);render();return}
  const wRem=e.target.closest('[data-whatif-remove]');if(wRem){state.whatIfSims.splice(+wRem.dataset.whatifRemove,1);render();return}
  if(e.target.closest('#whatif-reset')){state.whatIfSims=[];state.whatIfInclude=[];render();return}
  if(e.target.closest('#whatif-approve')){(state.whatIfInclude||[]).slice().forEach(id=>approveLeave(id));state.whatIfInclude=[];render();showToast('Congés approuvés');return}
  if(e.target.closest('#notif-btn')){openSidePanel('alerts');return}
  if(e.target.closest('#more-options')){showToast('Options démo: priorité, échéance, note interne');return}
  if(e.target.closest('#invite-user')){showToast('Invitation démo préparée');return}
  if(e.target.closest('#reset-demo')){closeUserMenu();seed();state.view='home';state.quickOrderId=null;state.sidePanel=null;state.sidePanelOrderId=null;$('#side-layer').classList.remove('open');$('#quick-layer').classList.remove('open');applyTheme();showToast('Données démo réinitialisées');render();return}
}
document.addEventListener('click',handleAppClick);
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('composer-file'))renderComposerFiles(e.target)});
document.addEventListener('submit',e=>{if(e.target.matches('[data-compose]')){e.preventDefault();const form=e.target;const input=form.querySelector('.composer-text');const fileInp=form.querySelector('.composer-file');const text=input?input.value.trim():'';readAttachments(fileInp&&fileInp.files,files=>addMessage(form.dataset.compose,text,files))} if(e.target.id==='order-form'){e.preventDefault();const fd=new FormData(e.target);createOrder(Object.fromEntries(fd.entries()));e.target.reset()} if(e.target.id==='stock-form'){e.preventDefault();const fd=new FormData(e.target);submitStockForm(Object.fromEntries(fd.entries()))} if(e.target.id==='user-form'){e.preventDefault();const fd=new FormData(e.target);submitUserForm(Object.fromEntries(fd.entries()))} if(e.target.id==='absence-form'){e.preventDefault();const fd=new FormData(e.target);submitAbsenceForm(Object.fromEntries(fd.entries()))} if(e.target.id==='whatif-form'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());if(d.userId&&d.from&&d.to&&new Date(d.to)>=new Date(d.from)){state.whatIfSims.push({userId:d.userId,from:d.from,to:d.to});render()}else showToast('Dates invalides')}});
$('#search').addEventListener('input',e=>{state.search=e.target.value;state.searchOpen=!!state.search.trim();state.ordersPage=0;render()});$('#search').addEventListener('focus',()=>{state.searchOpen=!!state.search.trim();renderSearchPopup()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();state.searchOpen=!!state.search.trim();renderSearchPopup()}if(e.key==='Escape'){const um=document.getElementById('user-menu');if(um&&um.classList.contains('open')){closeUserMenu();return}if(state.searchOpen){closeSearchPopup();return}if(state.quickOrderId){closeQuickView();return}if(state.sidePanel){closeSidePanel();return}}});
load();applyTheme();applySidebar();if(isScanMode())renderScanMode();else if(isDentistMode())renderDentistMode();else if(isStaffMode())renderStaffMode();else{renderNav();setupNavDnD();render()}
</script>
</body>
</html>
