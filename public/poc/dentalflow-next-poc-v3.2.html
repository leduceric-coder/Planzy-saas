function $(sel,root=document){return root.querySelector(sel)} function $all(sel,root=document){return [...root.querySelectorAll(sel)]}

function getLastScan(orderId){return [...state.scanEvents].reverse().find(e=>e.orderId===orderId&&e.event==='Scan')||null}
function getCurrentStation(orderId){const scan=getLastScan(orderId);return scan?{confirmed:true,station:scan.station}:{confirmed:false,station:null}}
function getCurrentTechnician(orderId){const scan=getLastScan(orderId);return scan?{confirmed:true,technicianName:scan.tech}:{confirmed:false,technicianName:null}}
function getLastScanTime(orderId){const scan=getLastScan(orderId);return scan?{confirmed:true,timestamp:scan.at}:{confirmed:false,timestamp:null}}
function lastScan(o){return getLastScan(o.id)}
function locationText(o){const loc=getCurrentStation(o.id);return loc.confirmed?h(loc.station):'Localisation non confirmée'}
function technicianText(o){const t=getCurrentTechnician(o.id);return t.confirmed?h(t.technicianName):'Technicien non confirmé'}
function scanTimeText(o){const t=getLastScanTime(o.id);return t.confirmed?fmtTime(t.timestamp):'Aucun scan'}
function fmtTime(iso){const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function statusInfo(s){return {late:['En retard','red'],blocked:['Bloquée','orange'],ready:['Prête','green'],progress:['En cours','blue'],qc:['QC en cours','blue'],scan:['À scanner','blue']}[s]||['En cours','blue']}

function kpiCounts(){const d=orderDistribution();return {prod:d.active,today:state.orders.filter(isDueToday).length,late:state.orders.filter(isOrderLate).length,blocked:d.blocked,total:state.orders.length,ready:d.ready,completed:d.completed}}
function filteredOrders(){const q=state.search.toLowerCase().trim();let rows=state.orders.filter(o=>!q||[o.id,o.patientRef,o.type,o.cabinet].join(' ').toLowerCase().includes(q)); if(state.filter==='attention'){const ids=new Set(getAttentionOrders().map(o=>o.id));rows=rows.filter(o=>ids.has(o.id))} else if(state.filter!=='all') rows=rows.filter(o=>o.status===state.filter); return rows}
function spark(color,points){return `<svg viewBox="0 0 78 42"><polyline fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${points}"/></svg>`}
function icon(kind){const paths={warn:'M12 4 21 20H3L12 4Zm0 5v5m0 3h.01',info:'M12 8h.01M11 12h1v5h1',bell:'M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z',scan:'M7 3H4a1 1 0 0 0-1 1v3m14-4h3a1 1 0 0 1 1 1v3M7 21H4a1 1 0 0 1-1-1v-3m18 0v3a1 1 0 0 1-1 1h-3M7 12h10'};return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="${paths[kind]||paths.info}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function isOrderLate(order){return order.status==='late'}
function isOrderBlocked(order){return order.status==='blocked'}
function isScanExpected(order){return order.status==='scan'}
function needsAttention(order){return isOrderLate(order)||isOrderBlocked(order)||isScanExpected(order)}
function getAttentionOrders({limit=null}={}){function score(o){return isOrderLate(o)?0:isOrderBlocked(o)?1:2}const all=state.orders.filter(needsAttention).sort((a,b)=>score(a)-score(b));return limit!=null?all.slice(0,limit):all}
function isOrderCompleted(o){return o.status==='completed'}
function isOrderReady(o){return o.status==='ready'}
function getDistributionBucket(o){if(isOrderCompleted(o))return 'completed';if(isOrderReady(o))return 'ready';if(isOrderBlocked(o))return 'blocked';return 'active'}
function orderDistribution(){const d={active:0,ready:0,blocked:0,completed:0};state.orders.forEach(o=>d[getDistributionBucket(o)]++);return d}
function buildDonutGradient(d){const total=d.active+d.ready+d.blocked+d.completed;if(!total)return '#d7dce6';let a=0;const segs=[];function seg(c,n){if(!n)return;const deg=Math.round(n/total*360);segs.push(`${c} ${a}deg ${a+deg}deg`);a+=deg}seg('var(--blue)',d.active);seg('var(--green)',d.ready);seg('var(--orange)',d.blocked);seg('var(--red)',d.completed);if(a<360)segs.push(`#d7dce6 ${a}deg 360deg`);return `conic-gradient(${segs.join(',')})`}

function renderHome(){setPageMeta('Accueil','Vue d’ensemble de votre laboratoire'); const orders=filteredOrders(); const k=kpiCounts(); const kpiProof='<div style="font-size:12px;line-height:1.35;color:var(--muted);font-weight:750;text-align:right">Données<br>actuelles</div>'; $('#view-root').innerHTML=`

function renderWatch(){return getAttentionOrders({limit:3}).map(o=>{const [label,color]=statusInfo(o.status);const aColor=isOrderLate(o)?'red':isOrderBlocked(o)?'orange':'blue';const ico=isOrderLate(o)||isOrderBlocked(o)?'warn':'info';const loc=locationText(o);const tech=technicianText(o);const time=scanTimeText(o);const right=isScanExpected(o)?`<strong class="blue">Scan attendu</strong><span>À effectuer dans DentalFlow Scan</span>`:isOrderLate(o)?`<strong class="red">Retard</strong><span>Échéance ${h(o.due)}</span>`:`<strong class="orange">Bloquée</strong><span>Validation requise</span>`;return `<div class="watch-item" data-order="${h(o.id)}"><div class="alert-ico ${aColor}">${icon(ico)}</div><div class="watch-main"><b>${h(o.id)}</b><span class="pill ${color}">${label}</span><div class="watch-sub">${h(o.type)} · ${h(o.cabinet)}</div><div class="watch-meta">${loc}${lastScan(o)?` · ${tech} · scan ${time}`:''}</div></div><div class="watch-status">${right}</div><div class="chev">›</div></div>`}).join('')}

function addMessage(id,text){if(!state.messages[id])state.messages[id]=[];state.messages[id].push({from:'lab',text,at:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),readAt:new Date().toISOString(),unread:false});save();if(state.sidePanel==='messages')renderMessagesPanel();else render()}
function createOrder(data){const n=150+state.orders.length; const o={id:`CMD-${n}`,patientRef:data.patientRef,type:data.type,cabinet:data.cabinet,status:'progress',due:data.due,tech:'',priority:data.priority||'Normale',timeAtPost:0,avgTime:45,noInitialScan:true}; state.orders.unshift(o); state.historyEvents.push({orderId:o.id,type:'Création',at:new Date().toISOString(),detail:'Commande créée'}); state.messages[o.id]=[]; save(); state.view='orders'; closeSidePanel(); showToast(`${o.id} créée`); render(); openQuickView(o.id)}
function renderScanMode(){const st=state.scanStation||'Réception';const tc=state.scanTechnician||'Marc';const recent=[...state.scanEvents].filter(e=>e.event==='Scan').reverse().slice(0,3);document.body.innerHTML=`<div class="scan-app"><header class="scan-header"><div class="scan-brand"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,88a87.87,87.87,0,0,0-8.4-37.37C196.07,27.69,173.27,16,148,16a87.47,87.47,0,0,0-20,2.32A87.47,87.47,0,0,0,108,16C82.73,16,59.93,27.69,48.4,50.63A87.87,87.87,0,0,0,40,88c0,66.33,54.28,144.9,56.59,148.07a16,16,0,0,0,26.09.42L128,229.69l5.32,6.8a16,16,0,0,0,26.09-.42C161.72,232.9,216,154.33,216,88Z"/></svg>DentalFlow Scan</div><div class="scan-session-bar"><span class="scan-session-name">${h(tc)} · ${h(st)}</span><button class="link" id="change-session-btn">Changer de poste</button></div></header><div class="scan-body"><div class="scan-session-config" id="session-config"><div class="field"><label>Poste</label><select id="session-station-sel">${STAGES.map(s=>`<option${state.scanStation===s?' selected':''}>${h(s)}</option>`).join('')}</select></div><div class="field"><label>Technicien</label><input id="session-tech-inp" value="${h(tc)}" placeholder="Prénom" /></div><div class="scan-session-actions"><button class="scan-session-cancel-btn" id="cancel-session-btn">Annuler</button><button class="scan-session-apply" id="apply-session-btn">Enregistrer</button></div></div><div class="scan-zone"><div class="scan-zone-title">Scannez une commande</div><div class="scan-zone-hint">Scannez une commande pour enregistrer sa localisation.</div><form id="scan-form"><div class="scan-input-row"><input class="scan-cmd-input" id="scan-cmd-input" name="orderId" placeholder="CMD-0190" autocomplete="off" spellcheck="false" /><button class="scan-submit-btn" type="submit">Scanner</button></div><div id="scan-feedback"></div></form></div><div class="scan-recent" id="scan-recent">${recent.length?'<div class="scan-recent-title">Derniers scans</div>'+recent.map(e=>'<div class="scan-recent-item"><div><div class="scan-recent-cmd">'+h(e.orderId)+'</div><div class="scan-recent-detail">'+h(e.station)+' · '+h(e.tech)+'</div></div><div class="scan-recent-time">'+fmtTime(e.at)+'</div></div>').join(''):''}</div></div></div>`;document.getElementById('scan-form').addEventListener('submit',handleScanSubmit);document.getElementById('change-session-btn').addEventListener('click',()=>{document.getElementById('session-config').classList.toggle('open')});document.getElementById('cancel-session-btn').addEventListener('click',()=>{document.getElementById('session-config').classList.remove('open')});document.getElementById('apply-session-btn').addEventListener('click',()=>{const ns=document.getElementById('session-station-sel').value;const nt=(document.getElementById('session-tech-inp').value||'').trim()||'Marc';state.scanStation=ns;state.scanTechnician=nt;save();renderScanMode()});const inp=document.getElementById('scan-cmd-input');if(inp)inp.focus()}
function handleScanSubmit(e){e.preventDefault();const fd=new FormData(e.target);const orderId=String(fd.get('orderId')||'').trim().toUpperCase();const station=state.scanStation||'Réception';const tech=state.scanTechnician||'Marc';const o=state.orders.find(x=>x.id.toUpperCase()===orderId);const fb=document.getElementById('scan-feedback');if(!o){fb.className='scan-feedback err';fb.textContent='Commande '+(orderId||'—')+' introuvable';return}state.scanEvents.push({orderId:o.id,station,tech,at:new Date().toISOString(),event:'Scan'});save();fb.className='scan-feedback ok';fb.textContent=o.id+' enregistrée — '+station+' · '+tech;e.target.orderId.value='';const re=document.getElementById('scan-recent');if(re){const rec=[...state.scanEvents].filter(ev=>ev.event==='Scan').reverse().slice(0,3);re.innerHTML=rec.length?'<div class="scan-recent-title">Derniers scans</div>'+rec.map(ev=>'<div class="scan-recent-item"><div><div class="scan-recent-cmd">'+h(ev.orderId)+'</div><div class="scan-recent-detail">'+h(ev.station)+' · '+h(ev.tech)+'</div></div><div class="scan-recent-time">'+fmtTime(ev.at)+'</div></div>').join(''):''}setTimeout(()=>{const fb2=document.getElementById('scan-feedback');if(fb2){fb2.className='scan-feedback';fb2.textContent=''}const inp=document.getElementById('scan-cmd-input');if(inp)inp.focus()},1500)}
function handleAppClick(e){
  const action=e.target.closest('[data-action]');
  if(action){e.stopPropagation();if(action.dataset.action==='scan')showToast('Le scan se fait dans DentalFlow Scan');if(action.dataset.action==='add-doc')showToast('Documents hors scope V3');return}
  const searchOrder=e.target.closest('[data-search-order]');
  if(searchOrder){state.searchOpen=false;state.search='';$('#search').value='';closeSearchPopup();openQuickView(searchOrder.dataset.searchOrder);return}
  const theme=e.target.closest('button[data-theme]');
  if(theme){state.theme=theme.dataset.theme;applyTheme();save();render();showToast(`Thème ${state.theme==='dark'?'sombre':state.theme==='light'?'clair':'système'} activé`);return}
  const chartTab=e.target.closest('[data-chart-tab]');
  if(chartTab){state.productionChartMode=chartTab.dataset.chartTab;render();return}
  const reportPeriod=e.target.closest('[data-report-period]');
  if(reportPeriod){state.reportPeriod=reportPeriod.dataset.reportPeriod;render();return}
  const tab=e.target.closest('[data-tab]');
  if(tab){state.drawerTab=tab.dataset.tab;openDrawer(state.drawer);return}
  const order=e.target.closest('[data-order]');
  if(order){openQuickView(order.dataset.order);return}
  const panel=e.target.closest('[data-panel]');
  if(panel){
    const panelName=panel.dataset.panel;
    if(panel.dataset.focusThread){state.selectedThreadId=panel.dataset.focusThread;state.messagesListOnly=false;markThreadRead(panel.dataset.focusThread)}
    else if(panelName==='messages'){state.messagesListOnly=true;state.selectedThreadId=null}
    const sidePanelOrderId=panel.dataset.traceOrder||null;
    openSidePanel(panelName,sidePanelOrderId);
    return;
  }
  const view=e.target.closest('[data-view]');
  if(view){state.view=view.dataset.view;state.quickOrderId=null;state.sidePanel=null;state.sidePanelOrderId=null;$('#side-layer').classList.remove('open');$('#quick-layer').classList.remove('open');if(view.dataset.filter)state.filter=view.dataset.filter;render();return}
  const filter=e.target.closest('[data-filter]');
  if(filter){state.filter=filter.dataset.filter;render();return}
  const thread=e.target.closest('[data-thread]');
  if(thread){state.selectedThreadId=thread.dataset.thread;state.messagesListOnly=false;markThreadRead(thread.dataset.thread);if(state.sidePanel!=='messages'){state.sidePanel='messages';$('#side-layer').classList.add('open')}renderMessagesPanel();updateNotif();updateNav();return}
  if(e.target.closest('#drawer-close')||e.target.id==='drawer-layer'){state.drawer=null;$('#drawer-layer').classList.remove('open');return}
  if(e.target.closest('#quick-close')||e.target.id==='quick-layer'){closeQuickView();return}
  if(e.target.closest('#side-close')||e.target.id==='side-layer'){closeSidePanel();return}
  if(e.target.closest('#new-order-btn,#new-order-inline')){openSidePanel('newOrder');return}
  if(e.target.closest('#cancel-order')){closeSidePanel();return}
  if(e.target.closest('#notif-btn')){openSidePanel('alerts');return}
  if(e.target.closest('#more-options')){showToast('Options démo: priorité, échéance, note interne');return}
  if(e.target.closest('#invite-user')){showToast('Invitation démo préparée');return}
  if(e.target.closest('#reset-demo')){seed();state.view='home';state.quickOrderId=null;state.sidePanel=null;state.sidePanelOrderId=null;$('#side-layer').classList.remove('open');$('#quick-layer').classList.remove('open');showToast('Données démo réinitialisées');render();return}
}
document.addEventListener('click',handleAppClick);
document.addEventListener('submit',e=>{if(e.target.matches('[data-compose]')){e.preventDefault();const input=e.target.querySelector('input');addMessage(e.target.dataset.compose,input.value.trim());input.value=''} if(e.target.id==='order-form'){e.preventDefault();const fd=new FormData(e.target);createOrder(Object.fromEntries(fd.entries()));e.target.reset()}});
$('#search').addEventListener('input',e=>{state.search=e.target.value;state.searchOpen=!!state.search.trim();render()});$('#search').addEventListener('focus',()=>{state.searchOpen=!!state.search.trim();renderSearchPopup()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();state.searchOpen=!!state.search.trim();renderSearchPopup()}if(e.key==='Escape'){if(state.searchOpen){closeSearchPopup();return}if(state.quickOrderId){closeQuickView();return}if(state.sidePanel){closeSidePanel();return}}});
load();applyTheme();if(isScanMode())renderScanMode();else render();
</script>
</body>
</html>
