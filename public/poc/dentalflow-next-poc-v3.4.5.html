    .side-footer{position:relative;gap:0;padding:12px 14px}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

      mode = mode || 'Byte';

      var newData = null;

      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

   configuration (assignedStageId, leaveAllowance, leaveUsedYTD, …) sans
   perdre les données déjà personnalisées (nom, email, rôle, couleur…).
   Règle : une clé absente du profil sauvegardé est complétée depuis
   demoUsers ; une clé présente — même à null — est un choix volontaire et
   n'est jamais écrasée (d'où l'usage du spread, pas de `||`). */
function migrateUsers(savedUsers){
  const saved=Array.isArray(savedUsers)?savedUsers:[];
  const savedIds=new Set(saved.map(u=>u.id));
  const migrated=saved.map(u=>{
    const defaults=demoUsers.find(d=>d.id===u.id);
    if(!defaults)return u; // profil créé localement (pas dans demoUsers) : conservé tel quel
    return {...defaults,...u};
  });

  // si un ancien localStorage existe déjà.
  demoUsers.forEach(d=>{if(!savedIds.has(d.id))migrated.push(clone(d))});
  return migrated;
}

function renderHome(){const greet=Clock.now().getHours()<18?'Bonjour':'Bonsoir';setPageMeta(`${greet} Eric 👋`,'Voici la vue d’ensemble de votre laboratoire'); const k=kpiCounts();const kpi=(c,ic,num,label,sub,bucket)=>`<article class="hkpi" style="--c:var(--${c});cursor:pointer" data-kpi="${bucket}" title="Voir les commandes concernées"><div class="hkpi-ico ${c}">${icon(ic)}</div><div class="hkpi-num">${num}</div><div class="hkpi-label">${label}</div><div class="hkpi-sub">${sub}</div></article>`; $('#view-root').innerHTML=`

function renderCompareBars(){const cur=weeklyCompare.current,prev=weeklyCompare.previous,labels=weeklyCompare.labels;const maxV=Math.max(...cur,...prev,1);const step=maxV>60?20:10;const axMax=Math.max(Math.ceil(maxV/step)*step,step);const marks=[axMax,Math.round(axMax*2/3),Math.round(axMax/3),0];const n=labels.length;return `<div class="chart2"><div class="chart2-body"><div class="chart2-axis">${marks.map(m=>`<span>${m}</span>`).join('')}</div><div class="chart2-plot" style="--n:${n}">${labels.map((l,i)=>`<div class="chart2-col cmp"><div class="cmp-pair"><div class="chart2-bar cur" style="height:${(cur[i]/axMax*100).toFixed(1)}%"><span class="bar-tip">${cur[i]}</span></div><div class="chart2-bar prev" style="height:${(prev[i]/axMax*100).toFixed(1)}%"><span class="bar-tip">${prev[i]}</span></div></div></div>`).join('')}</div></div><div class="chart2-days"><span></span><div class="days-inner" style="--n:${n}">${labels.map(l=>`<span class="day2">${h(l)}</span>`).join('')}</div></div></div>`}
function renderWatch(){return getAttentionOrders({limit:3}).map(o=>{const sigs=orderSignals(o);const primary=sigs[0]||{key:'info',label:'À surveiller',color:'blue'};const aColor=primary.color;const ico=(primary.key==='late'||primary.key==='blocked')?'warn':'info';const [label,color]=orderStatusInfo(o);const loc=locationText(o);const tech=technicianText(o);const time=scanTimeText(o);const n=sigs.length-1;const sub=n>0?(n>1?`+${n} autres signaux`:`+1 autre signal`):(primary.key==='late'?`Échéance ${h(o.due)}`:primary.key==='blocked'?'Validation requise':'À effectuer dans DentalFlow Scan');const right=`<strong class="${primary.color}">${primary.label}</strong><span>${sub}</span>`;return `<div class="watch-item watch-${aColor}" data-order="${h(o.id)}"><div class="alert-ico ${aColor}">${icon(ico)}</div><div class="watch-main"><b>${h(o.id)}</b><span class="pill ${color}">${label}</span><div class="watch-sub">${h(o.type)} · ${h(o.cabinet)}</div><div class="watch-meta">${loc}${lastScan(o)?` · ${tech} · scan ${time}`:''}</div></div><div class="watch-status">${right}</div><div class="chev">›</div></div>`}).join('')}
function renderFlow(st){const count=state.orders.filter(o=>effectiveStation(o)===st).length;const color=st==='Usinage'?COLORS.orange:st==='Céramique'?COLORS.green:st==='Prêtes'?COLORS.gray:COLORS.blue;return `<div class="flow-row" data-view="production" data-station="${h(st)}"><span class="dot-flow" style="background:${color}"></span><b>${h(st)}</b><span><span class="flow-num" style="color:${st==='Usinage'?COLORS.orange:'inherit'}">${count}</span></span></div>`}

function chartBars(vals,labels){const maxV=Math.max(...vals,1);const step=maxV>400?200:maxV>150?50:maxV>60?20:10;const axMax=Math.max(Math.ceil(maxV/step)*step,step);const marks=[axMax,Math.round(axMax*2/3),Math.round(axMax/3),0];const n=vals.length;return `<div class="chart2"><div class="chart2-body"><div class="chart2-axis">${marks.map(m=>`<span>${m}</span>`).join('')}</div><div class="chart2-plot" style="--n:${n}">${vals.map(v=>`<div class="chart2-col"><div class="chart2-bar" style="height:${(v/axMax*100).toFixed(1)}%"><span class="bar-tip">${v}</span></div></div>`).join('')}</div></div><div class="chart2-days"><span></span><div class="days-inner" style="--n:${n}">${labels.map(l=>`<span class="day2">${h(l)}</span>`).join('')}</div></div></div>`}
function renderDonutLegend(d,total){const cats=[['active','En production',d.active,'blue'],['ready','Prêtes',d.ready,'green'],['blocked','Bloquées',d.blocked,'orange'],['completed','Terminées',d.completed,'red']];return `<div class="legend">${cats.map(r=>{const p=total?Math.round(r[2]/total*100):0;return `<div class="legend-row" data-donut-cat="${r[0]}" data-count="${r[2]}" data-label="${h(r[1])}" data-pct="${p}" onmouseover="donutHover(this)" onmouseout="donutReset()"><span class="dot-flow" style="background:var(--${r[3]})"></span><span>${r[1]}</span><b>${r[2]}</b></div>`}).join('')}</div>`}
function renderDonut(){const d=orderDistribution();const total=d.active+d.ready+d.blocked+d.completed;const segs=[['active','En production','blue',d.active],['ready','Prêtes','green',d.ready],['blocked','Bloquées','orange',d.blocked],['completed','Terminées','red',d.completed]];let acc=0;const arcs=segs.filter(s=>s[3]>0).map(s=>{const pct=total?s[3]/total*100:0;const off=25-acc;acc+=pct;const p=total?Math.round(s[3]/total*100):0;return `<circle class="donut-seg" data-donut-cat="${s[0]}" data-count="${s[3]}" data-label="${h(s[1])}" data-pct="${p}" r="15.915" cx="21" cy="21" fill="none" stroke="var(--${s[2]})" stroke-width="5" stroke-dasharray="${pct.toFixed(2)} ${(100-pct).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" onmouseover="donutHover(this)" onmouseout="donutReset()"/>`}).join('');const ring=total?arcs:'<circle r="15.915" cx="21" cy="21" fill="none" stroke="#d7dce6" stroke-width="5"/>';return `<div class="donut-layout"><div class="donut-svg-wrap"><svg viewBox="0 0 42 42" class="donut-svg">${ring}</svg><div class="donut-center" id="donut-center" data-total="${total}">${total}<span>Total</span></div></div>${renderDonutLegend(d,total)}</div>`}
function donutHover(el){const c=document.getElementById('donut-center');if(!c)return;const cat=el.dataset.donutCat;c.innerHTML=`${el.dataset.count}<span>${el.dataset.label} · ${el.dataset.pct}%</span>`;document.querySelectorAll('[data-donut-cat]').forEach(x=>{x.classList.toggle('dim',x.dataset.donutCat!==cat);x.classList.toggle('sel',x.dataset.donutCat===cat)})}
function donutReset(){const c=document.getElementById('donut-center');if(!c)return;c.innerHTML=`${c.dataset.total}<span>Total</span>`;document.querySelectorAll('[data-donut-cat]').forEach(x=>x.classList.remove('dim','sel'))}
function renderTable(rows){const th=(key,label)=>{const active=state.sortKey===key;const ar=active?(state.sortDir==='desc'?'▼':'▲'):'▲';return `<th data-sort="${key}" class="${active?'sort-active':''}">${label}<span class="sort-ar">${ar}</span></th>`};return `<div class="table-wrap"><table class="orders-table"><thead><tr>${th('id','Commande')}${th('patientRef','Référence patient')}${th('type','Type')}${th('cabinet','Cabinet')}${th('status','État')}${th('station','Localisation')}${th('scan','Dernier scan')}${th('due','Échéance')}<th></th></tr></thead><tbody>${rows.map(o=>{const [l,c]=statusInfo(o.status);const scan=lastScan(o);return `<tr data-order="${h(o.id)}"><td><b>${h(o.id)}</b></td><td>${h(o.patientRef)}</td><td>${h(o.type)}</td><td>${h(o.cabinet)}</td><td><span class="pill ${c}">${l}</span></td><td><b>${locationText(o)}</b></td><td>${scan?`${technicianText(o)} · ${scanTimeText(o)}`:'Aucun scan enregistré'}</td><td>${h(o.due)}${isOrderLate(o)?'<br><span class="danger">En retard</span>':''}</td><td class="chev">›</td></tr>`}).join('')}</tbody></table></div>`}
function renderOrders(){setPageMeta('Commandes','Rechercher, filtrer et ouvrir une commande'); const all=filteredOrders();const per=10;const pages=Math.max(1,Math.ceil(all.length/per));if((state.ordersPage||0)>=pages)state.ordersPage=pages-1;if((state.ordersPage||0)<0)state.ordersPage=0;const page=state.ordersPage||0;const rows=all.slice(page*per,page*per+per);const pager=all.length>per?`<div class="audit-pager"><button class="pg-btn" data-orders-page="prev" ${page<=0?'disabled':''}>‹ Précédent</button><span class="pg-info">Page ${page+1} / ${pages} · ${all.length} commande${all.length>1?'s':''}</span><button class="pg-btn" data-orders-page="next" ${page>=pages-1?'disabled':''}>Suivant ›</button></div>`:''; $('#view-root').innerHTML=`<section class="card section"><div class="section-head"><h2>Commandes</h2><button class="primary" id="new-order-inline" style="height:40px;padding:0 16px"><span>＋</span><span>Nouvelle commande</span></button></div><div class="filters">${[['all','Toutes'],['attention','À surveiller'],['late','En retard'],['blocked','Bloquées'],['active','En production'],['ready','Prêtes'],['completed','Terminées']].map(f=>`<button class="filter ${state.filter===f[0]?'active':''}" data-filter="${f[0]}">${f[1]}</button>`).join('')}</div>${rows.length?renderTable(rows):`<div class="empty">Aucune commande pour ce filtre.</div>`}${pager}</section>`}

/* DnD limité à la réorganisation du FLUX (colonnes). Les commandes ne se déplacent jamais à la main. */
function setupProductionDnD(){const board=document.getElementById('prod-board');if(!board)return;let dragId=null;
board.addEventListener('dragstart',e=>{const nm=e.target.closest('[data-stage-name]');if(nm){e.preventDefault();return}const col=e.target.closest('.prod-col');if(col){dragId=col.dataset.stage;col.classList.add('col-drag')}try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId||'')}catch(_){}});
board.addEventListener('dragend',()=>{dragId=null;board.querySelectorAll('.col-drag,.drop-hint').forEach(x=>x.classList.remove('col-drag','drop-hint'))});
board.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const col=e.target.closest('.prod-col');board.querySelectorAll('.drop-hint').forEach(x=>x.classList.remove('drop-hint'));if(col&&col.dataset.stage!==dragId)col.classList.add('drop-hint')});
board.addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();const col=e.target.closest('.prod-col');const id=dragId;dragId=null;board.querySelectorAll('.drop-hint').forEach(x=>x.classList.remove('drop-hint'));if(!col)return;const target=col.dataset.stage;if(id!==target)reorderStages(id,target)});
board.addEventListener('blur',e=>{const nm=e.target.closest('[data-stage-name]');if(nm)renameStage(nm.dataset.stageName,nm.textContent)},true);
board.addEventListener('keydown',e=>{const nm=e.target.closest('[data-stage-name]');if(nm&&e.key==='Enter'){e.preventDefault();nm.blur()}});
board.addEventListener('click',e=>{if(e.target.closest('#prod-add-stage')){addStage();return}const del=e.target.closest('[data-stage-del]');if(del){e.stopPropagation();deleteStage(del.dataset.stageDel)}})}

const MAX_ATTACH=2*1024*1024; /* 2 Mo par fichier */
const MAX_FILES_PER_THREAD=5; /* 5 pièces jointes max par conversation */
function fmtSize(b){b=+b||0;if(b<1024)return b+' o';if(b<1048576)return (b/1024).toFixed(0)+' Ko';return (b/1048576).toFixed(1)+' Mo'}
function fileIco(type){return (type||'').startsWith('image/')?'🖼️':/pdf/.test(type||'')?'📄':/word|document|sheet|excel/.test(type||'')?'📑':'📎'}
function readAttachments(fileList,cb){let files=[...(fileList||[])];if(!files.length){cb([]);return}const tooBig=files.filter(f=>f.size>MAX_ATTACH);files=files.filter(f=>f.size<=MAX_ATTACH);if(tooBig.length)showToast(`${tooBig.length} fichier${tooBig.length>1?'s':''} > 2 Mo ignoré${tooBig.length>1?'s':''}`);if(!files.length){cb([]);return}const out=[];let done=0;files.forEach((f,idx)=>{const finish=obj=>{out[idx]=obj;if(++done===files.length)cb(out.filter(Boolean))};const r=new FileReader();r.onload=()=>finish({name:f.name,size:f.size,url:r.result,type:f.type});r.onerror=()=>finish({name:f.name,size:f.size,url:null,type:f.type});r.readAsDataURL(f)})}

const DENTIST_STEPS=[['received','Reçue'],['fab','Fabrication'],['control','Contrôle'],['ready','Prête'],['delivered','Livrée']];
function getDentistFacingStatus(o){if(isOrderCompleted(o))return{key:'delivered',label:'Livrée',color:'green'};if(isOrderReady(o))return{key:'ready',label:'Prête',color:'green'};const c=getConfirmedStage(o.id);if(!c.confirmed)return{key:'received',label:'Reçue',color:'blue'};const label=c.label||'';if(/pr[êe]t/i.test(label))return{key:'ready',label:'Prête',color:'green'};if(/contr[ôo]le|qualit/i.test(label))return{key:'control',label:'Contrôle',color:'blue'};if(/r[ée]ception|arriv/i.test(label))return{key:'received',label:'Reçue',color:'blue'};return{key:'fab',label:'Fabrication en cours',color:'orange'}}

function renderDentistMode(){const cabinets=[...new Set(state.orders.map(o=>o.cabinet))].filter(Boolean).sort();if(!cabinets.length)cabinets.push('Cabinet démo');if(!state.dentistCabinet||!cabinets.includes(state.dentistCabinet))state.dentistCabinet=cabinets[0];const cab=state.dentistCabinet;const tab=state.dentistView||'orders';const myOrders=state.orders.filter(o=>o.cabinet===cab);const content=tab==='orders'?dentistOrdersHTML(myOrders):tab==='new'?dentistNewHTML():dentistMessagesHTML(myOrders);document.body.innerHTML=`<div class="portal" id="portal"><header class="portal-header"><div class="portal-brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M7.8 3.4c1 0 1.9.5 2.7.9.6.3 1 .5 1.5.5s.9-.2 1.5-.5c.8-.4 1.7-.9 2.7-.9 2.3 0 3.9 1.9 3.9 4.6 0 1.5-.6 3.2-1.4 4.8-.6 1.3-1 2.7-1.3 4.1-.4 1.9-.9 3.4-2.2 3.4-.9 0-1.3-.9-1.8-2.6-.4-1.4-.8-2.3-1.5-2.3s-1.1.9-1.5 2.3c-.5 1.7-.9 2.6-1.8 2.6-1.3 0-1.8-1.5-2.2-3.4-.3-1.4-.7-2.8-1.3-4.1C4.5 11.2 4 9.5 4 8c0-2.7 1.5-4.6 3.8-4.6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>DentalFlow · Espace cabinet</span></div><div class="portal-cabsel"><label>Cabinet</label><select id="portal-cab">${cabinets.map(c=>`<option${c===cab?' selected':''}>${h(c)}</option>`).join('')}</select></div><button class="ghost" id="portal-back">Retour laboratoire</button></header><div class="portal-body"><div class="portal-tabs"><button class="ptab ${tab==='orders'?'active':''}" data-dtab="orders">Mes commandes</button><button class="ptab ${tab==='new'?'active':''}" data-dtab="new">Nouvelle commande</button></div>${content}</div>${state.dentistDetail&&myOrders.find(o=>o.id===state.dentistDetail)?dentistDetailHTML(myOrders.find(o=>o.id===state.dentistDetail)):''}<div class="toast" id="toast"></div></div>`;attachDentistHandlers()}
function attachDentistHandlers(){const root=document.getElementById('portal');if(!root)return;root.addEventListener('click',e=>{const cf=e.target.closest('[data-clear-files]');if(cf){const inp=document.getElementById(cf.dataset.clearFiles);if(inp){inp.value='';renderComposerFiles(inp)}return}const tab=e.target.closest('[data-dtab]');if(tab){state.dentistView=tab.dataset.dtab;state.dentistDetail=null;renderDentistMode();return}const thr=e.target.closest('[data-dthread]');if(thr){state.dentistThread=thr.dataset.dthread;state.dentistView='messages';state.dentistDetail=null;renderDentistMode();return}if(e.target.closest('[data-ddetail-close]')||e.target.id==='pdetail'){state.dentistDetail=null;renderDentistMode();return}const pf=e.target.closest('[data-print-fiche]');if(pf){printFiche(pf.dataset.printFiche);return}const det=e.target.closest('[data-ddetail]');if(det){state.dentistDetail=det.dataset.ddetail;renderDentistMode();return}if(e.target.closest('#portal-back')){location.href=location.pathname;return}const opt=e.target.closest('.deliv-opt');if(opt){const inp=opt.querySelector('input');if(inp){state.dentistDeliv=+inp.value;renderDentistMode()}return}});root.addEventListener('change',e=>{if(e.target.id==='portal-cab'){state.dentistCabinet=e.target.value;state.dentistThread=null;renderDentistMode()}if(e.target.id==='dentist-type'){state.dentistNewType=e.target.value;state.dentistDeliv=0;renderDentistMode()}});root.addEventListener('submit',e=>{if(e.target.id==='dentist-order-form'){e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form).entries());const fileInp=form.querySelector('.composer-file');readAttachments(fileInp&&fileInp.files,files=>createDentistOrder(data,files));return}if(e.target.id==='dentist-compose'){e.preventDefault();const form=e.target;const inp=form.querySelector('.composer-text');const fileInp=form.querySelector('.composer-file');const text=inp?inp.value.trim():'';readAttachments(fileInp&&fileInp.files,files=>addCabinetMessage(form.dataset.order,text,files))}});root.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('composer-file'))renderComposerFiles(e.target)})}
function createDentistOrder(data,files){const cab=state.dentistCabinet;const type=data.type||Object.keys(fabricationDays)[0];const id=generateOrderId();const deliveries=proposedDeliveries(type);const chosen=deliveries[Math.min(+data.deliv||0,deliveries.length-1)];const due=fmtDateShort(chosen.date);const o={id,patientRef:generatePatientRef(),type,cabinet:cab,status:'progress',due,tech:'',priority:'Normale',timeAtPost:0,avgTime:45,noInitialScan:true,createdByCabinet:true};deriveOrderModel(o);state.orders.unshift(o);const now=Clock.now().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});state.messages[id]=[{from:'cabinet',text:`Nouvelle commande ${type} — livraison souhaitée ${due}.${data.notes?' Indications : '+data.notes:''}`,at:now,readAt:null,unread:true,files:(files||[]).slice(0,MAX_FILES_PER_THREAD)}];logAudit(id,'Création',`Commande créée via l'espace cabinet (${cab})`);save();state.dentistView='orders';state.dentistThread=id;renderDentistMode();showToast(`${id} envoyée au laboratoire`)}
function addCabinetMessage(id,text,files){if(!text&&!(files&&files.length))return;if(!state.messages[id])state.messages[id]=[];files=capThreadFiles(id,files);const now=Clock.now().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});state.messages[id].push({from:'cabinet',text,at:now,readAt:null,unread:true,files:files||[]});save();renderDentistMode()}
/* ===== Plan de charge (GTA) ===== */
function weekStartOf(date){const d=new Date(date);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);d.setHours(0,0,0,0);return d}
function planningWeeks(count){const start=weekStartOf(Clock.now());const arr=[];for(let i=0;i<count;i++){const s=new Date(start);s.setDate(s.getDate()+i*7);const e=new Date(s);e.setDate(e.getDate()+4);arr.push({i,start:s,end:e})}return arr}
function grossWeeklyCapacity(){return state.users.reduce((a,u)=>a+(+u.capacity||0),0)}
function capacityLostInWeek(week,extra){let lost=0;state.absences.concat(extra||[]).forEach(ab=>{const u=state.users.find(x=>x.id===ab.userId);if(!u)return;let d=new Date(Math.max(new Date(ab.from).getTime(),week.start.getTime()));const end=new Date(Math.min(new Date(ab.to).getTime(),week.end.getTime()));while(d.getTime()<=end.getTime()){const wd=d.getDay();if(wd!==0&&wd!==6)lost+=(+u.capacity||0)/5;d.setDate(d.getDate()+1)}});return lost}
function netWeekCapacity(week,extra){return Math.max(0,Math.round(grossWeeklyCapacity()-capacityLostInWeek(week,extra)))}
function whatIfLeaves(){const sims=(state.whatIfSims||[]).slice();(state.whatIfInclude||[]).forEach(id=>{const r=(state.leaveRequests||[]).find(x=>x.id===id&&x.status==='pending');if(r)sims.push({userId:r.userId,from:r.from,to:r.to})});return sims}
function whatIfSectionHTML(){const weeks=planningWeeks(8);const sims=whatIfLeaves();const pend=(state.leaveRequests||[]).filter(r=>r.status==='pending');const rows=weeks.map(w=>{const capNow=netWeekCapacity(w);const capSim=netWeekCapacity(w,sims);const load=weekForecast(w.i);const soldeSim=capSim-load;const cls=soldeSim>=0?'green':soldeSim>=-6?'orange':'red';const delta=capSim-capNow;return `<tr><td><b>S${w.i+1}</b><div class="muted" style="font-size:12px">${h(fmtDateShort(w.start))}</div></td><td>${capNow}</td><td><b>${capSim}</b>${delta?` <span class="danger" style="font-weight:800">${delta}</span>`:''}</td><td>${load}</td><td><span class="pill ${cls}">${soldeSim>=0?'+':''}${soldeSim}</span></td></tr>`}).join('');const negWeeks=weeks.filter(w=>(netWeekCapacity(w,sims)-weekForecast(w.i))<0).length;const negBase=weeks.filter(w=>(netWeekCapacity(w)-weekForecast(w.i))<0).length;const totalImpact=weeks.reduce((s,w)=>s+(netWeekCapacity(w)-netWeekCapacity(w,sims)),0);const hasSim=sims.length>0;return `<section class="card section" style="margin-top:14px"><div class="section-head"><div><h2>Simulateur What‑If — congés</h2><div class="mini-sub">Évaluez l'impact de congés (demandes en attente ou hypothétiques) sur le plan de charge avant de décider.</div></div><button class="ghost" id="whatif-reset">Réinitialiser</button></div><div class="whatif-grid"><div class="whatif-controls"><div class="mini-label" style="margin-bottom:8px">Inclure des demandes en attente</div>${pend.length?pend.map(r=>{const u=state.users.find(x=>x.id===r.userId);const on=(state.whatIfInclude||[]).includes(r.id);return `<label class="whatif-req${on?' on':''}"><input type="checkbox" ${on?'checked':''} data-whatif-req="${h(r.id)}"><span><b>${h(u?u.name:'—')}</b> · ${h(fmtDateShort(new Date(r.from)))}→${h(fmtDateShort(new Date(r.to)))} · ${bizDays(r.from,r.to)} j</span></label>`}).join(''):'<div class="empty" style="padding:12px">Aucune demande en attente.</div>'}<div class="mini-label" style="margin:16px 0 8px">Congé hypothétique</div><form id="whatif-form" class="whatif-form"><select name="userId">${state.users.map(u=>`<option value="${h(u.id)}">${h(u.name)}</option>`).join('')}</select><input type="date" name="from" value="${isoDay(14)}"><input type="date" name="to" value="${isoDay(18)}"><button class="scan-mini" type="submit">＋ Ajouter</button></form>${(state.whatIfSims||[]).length?`<div style="margin-top:8px">${state.whatIfSims.map((s,i)=>{const u=state.users.find(x=>x.id===s.userId);return `<div class="whatif-sim"><span>${h(u?u.name:'—')} · ${h(fmtDateShort(new Date(s.from)))}→${h(fmtDateShort(new Date(s.to)))}</span><button class="whatif-x" data-whatif-remove="${i}">✕</button></div>`}).join('')}</div>`:''}</div><div><div class="whatif-summary ${negWeeks>negBase?'warn':'ok'}"><div class="whatif-sum-num">${hasSim?totalImpact:0} cmd</div><div class="mini-sub">capacité en moins sur 8 sem.${hasSim?` · ${negWeeks} semaine${negWeeks>1?'s':''} en sous‑capacité (${negBase} sans ces congés)`:''}</div>${(state.whatIfInclude||[]).length?`<button class="big-primary" id="whatif-approve" style="margin-top:12px;height:40px">Approuver la sélection (${state.whatIfInclude.length})</button>`:''}</div><button class="ghost" id="whatif-cal" style="margin-top:12px;width:100%">📅 Voir le calendrier du scénario</button><div class="mini-sub" style="margin-top:8px">Le détail semaine par semaine s’affiche dans le calendrier du scénario.</div></div></div></section>`}
const MONTH_KEYS=['janv','fevr','mars','avr','mai','juin','juil','aout','sept','oct','nov','dec'];
function orderDueDate(o){const raw=(o&&o.due)||'';const base=Clock.now();base.setHours(0,0,0,0);const low=String(raw).toLowerCase();if(/aujourd/.test(low))return base;if(/demain/.test(low)){const d=new Date(base);d.setDate(d.getDate()+1);return d}const s=low.normalize('NFD').replace(/[̀-ͯ]/g,'');const m=s.match(/(\d{1,2})\s+([a-z]+)/);if(m){const day=parseInt(m[1],10);const mon=m[2];const mi=MONTH_KEYS.findIndex(k=>mon.startsWith(k));if(mi>=0&&day>=1&&day<=31){let d=new Date(base.getFullYear(),mi,day);if(d.getTime()<base.getTime()-1000*60*60*24*200)d=new Date(base.getFullYear()+1,mi,day);d.setHours(0,0,0,0);return d}}return null}
let ORDER_BOOK=[];
function buildOrderBook(){ORDER_BOOK=[];const start=weekStartOf(Clock.now());const wip=state.orders.filter(o=>!isOrderCompleted(o)).map(o=>orderDueDate(o)).filter(Boolean);wip.forEach(d=>ORDER_BOOK.push(d));let seed=1934571>>>0;const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return seed/4294967296};const gross=grossWeeklyCapacity()||1;for(let w=0;w<8;w++){const wStart=new Date(start);wStart.setDate(wStart.getDate()+w*7);const wEnd=new Date(wStart);wEnd.setDate(wEnd.getDate()+6);const real=wip.filter(d=>d.getTime()>=wStart.getTime()&&d.getTime()<=wEnd.getTime()).length;const target=Math.round(gross*(0.82+rnd()*0.3));for(let k=real;k<target;k++){const d=new Date(wStart);d.setDate(d.getDate()+Math.floor(rnd()*5));d.setHours(0,0,0,0);ORDER_BOOK.push(d)}}}
function weekForecast(i){const start=weekStartOf(Clock.now());const s=new Date(start);s.setDate(s.getDate()+i*7);const e=new Date(s);e.setDate(e.getDate()+6);const s0=s.getTime(),e0=e.getTime();return ORDER_BOOK.filter(d=>d.getTime()>=s0&&d.getTime()<=e0).length}
function renderPlanning(){setPageMeta('Plan de charge','Capacité de l’équipe et projection à long terme');buildOrderBook();const weeks=planningWeeks(8);const gross=grossWeeklyCapacity();const upcoming=state.absences.filter(a=>new Date(a.to)>=Clock.now()).sort((x,y)=>new Date(x.from)-new Date(y.from));const nextAbs=upcoming[0];const nextU=nextAbs&&state.users.find(u=>u.id===nextAbs.userId);const absSub=nextAbs?`Prochaine : ${fmtDateShort(new Date(nextAbs.from))}${nextU?' · '+nextU.name.split(' ')[0]:''}`:'Aucune dans les 30 prochains jours';const pend=(state.leaveRequests||[]).filter(r=>r.status==='pending');

function openMonthCalendar(){const scenario=state.calMode==='whatif';const leaves=scenario?whatIfLeaves():[];buildOrderBook();const off=state.chargeMonth||0;const base=Clock.now();base.setDate(1);base.setMonth(base.getMonth()+off);const year=base.getFullYear(),month=base.getMonth();const title=base.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});const firstW=(new Date(year,month,1).getDay()+6)%7;const dcount=new Date(year,month+1,0).getDate();const dailyBase=grossWeeklyCapacity()/5||1;const counts={};ORDER_BOOK.forEach(d=>{if(d.getFullYear()===year&&d.getMonth()===month)counts[d.getDate()]=(counts[d.getDate()]||0)+1});const today=new Date(baseNow);today.setHours(0,0,0,0);let cells='';for(let i=0;i<firstW;i++)cells+='<div class="chg-cell empty"></div>';for(let dd=1;dd<=dcount;dd++){const cur=new Date(year,month,dd);cur.setHours(0,0,0,0);const wd=cur.getDay();const wknd=wd===0||wd===6;const load=counts[dd]||0;const lost=wknd?0:dayLeaveLoss(cur,leaves);const cap=Math.max(0,dailyBase-lost);const ratio=cap?load/cap:(load?2:0);const col=load===0?'var(--line)':ratio<0.9?'var(--green)':ratio<=1.05?'var(--orange)':'var(--red)';const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===dd;const absent=scenario&&lost>0;cells+=`<div class="chg-cell${wknd?' wknd':''}"${isToday?' style="border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)"':''}><div class="chg-d">${dd}${absent?' <span title="Congé simulé" style="color:var(--accent)">●</span>':''}</div>${wknd?'':`<div class="chg-load" style="color:${load?col:'var(--muted)'}">${load||'·'}</div><div class="chg-bar" style="background:${col};opacity:${load?1:.35}"></div>`}</div>`}const totalCells=firstW+dcount;for(let i=totalCells;i<42;i++)cells+='<div class="chg-cell empty"></div>';const legendExtra=scenario?`<span><i style="background:var(--accent)"></i>Jour avec congé simulé</span>`:'';const sub=scenario?`${h(title)} · scénario What‑If (${leaves.length} congé${leaves.length>1?'s':''} simulé function isStaffMode(){return new URLSearchParams(location.search).get('mode')==='staff'}
const ANNUAL_LEAVE=25;
/* ===================== STAFF — poste dérivé de l'identité ===================== */
/* Chaque identifiant collaborateur est associé à UN poste. Aucun choix manuel. */
/* Statut de l'affectation poste d'un collaborateur :
   'ok'       → assignedStageId pointe un poste actif ;
   'inactive' → le poste existe mais a été désactivé (affectation conservée) ;
   'none'     → aucune affectation, ou identifiant orphelin (poste supprimé/inconnu).
   Jamais de repli arbitraire vers un poste (ex. Réception). */
function getAssignedStageStatus(user){
  if(!user||!user.assignedStageId)return {status:'none',def:null};
  const d=stageDefById(user.assignedStageId);
  if(!d)return {status:'none',def:null};
  if(d.active===false)return {status:'inactive',def:d};
  return {status:'ok',def:d};
}
function getAssignedStage(user){const s=getAssignedStageStatus(user);return s.status==='ok'?s.def:null}
/* Validation au chargement : ne corrige que les cas sûrs (identifiant orphelin
   → réaligné sur la valeur de référence demoUsers, si elle-même valide dans le
   flux courant). Un poste désactivé reste tel quel (affectation conservée,
   scan bloqué avec message adapté) — jamais de réattribution automatique. */
function validateUserStageAssignments(){
  (state.users||[]).forEach(u=>{
    if(!u.assignedStageId)return;
    if(stageDefById(u.assignedStageId))return; // id valide (actif ou désactivé) : rien à faire
    const defaults=demoUsers.find(d=>d.id===u.id);
    if(defaults&&defaults.assignedStageId&&stageDefById(defaults.assignedStageId)){
      u.assignedStageId=defaults.assignedStageId;
    }
  });
}
/* Collaborateurs proposés dans le sélecteur Staff = profils configurés comme
   personnel de scan (un assignedStageId leur a été attribué), qu'il soit
   actuellement actif ou désactivé — sinon un poste désactivé (§6) redeviendrait
   invisible au lieu d'afficher son message dédié. Pas de repli vers l'équipe
   entière : un profil sans aucune affectation (Eric, Sophie, ou une
   affectation orpheline non réparable) n'est jamais proposé. */
function staffEligibleUsers(){return (state.users||[]).filter(u=>getAssignedStageStatus(u).status!=='none')}
/* Compteurs de congés par collaborateur (démo).
   leaveUsedYTD = jours déjà consommés avant les absences visibles dans le
   calendrier de démonstration (state.absences) ; le compteur affiché cumule
   les deux pour rester cohérent quand une nouvelle demande est approuvée. */
function getLeaveMetrics(userId){const u=(state.users||[]).find(x=>x.id===userId)||{};const allowance=u.leaveAllowance||ANNUAL_LEAVE;const used=(u.leaveUsedYTD||0)+leaveTaken(userId);const pending=leavePending(userId);return {allowance,used,pending,remaining:Math.max(0,allowance-used)}}
function bizDays(fromStr,toStr){let d=new Date(fromStr);const end=new Date(toStr);if(isNaN(d)||isNaN(end)||end<d)return 0;let n=0;while(d<=end){const w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1)}return n}
function leaveTaken(uid){return state.absences.filter(a=>a.userId===uid&&(a.reason||'').toLowerCase().indexOf('formation')<0).reduce((s,a)=>s+bizDays(a.from,a.to),0)}
function leavePending(uid){return (state.leaveRequests||[]).filter(r=>r.userId===uid&&r.status==='pending').reduce((s,r)=>s+bizDays(r.from,r.to),0)}
function submitLeaveRequest(uid,from,to,reason){if(!uid||!from||!to)return showToast('Champs requis');if(new Date(to)<new Date(from))return showToast('Dates invalides');const id='L'+Date.now().toString(36);state.leaveRequests.push({id,userId:uid,from,to,reason:reason||'Congés',status:'pending'});const u=state.users.find(x=>x.id===uid);logAudit(uid,'Utilisateur',`Demande de congés : ${u?u.name:''} (${from} → ${to})`);save()}
function approveLeave(id){const r=(state.leaveRequests||[]).find(x=>x.id===id);if(!r||r.status==='approved')return;r.status='approved';if(!state.absences.some(a=>a.id==='AB-'+id))state.absences.push({id:'AB-'+id,userId:r.userId,from:r.from,to:r.to,reason:r.reason||'Congés'});const u=state.users.find(x=>x.id===r.userId);logAudit(r.userId,'Utilisateur',`Congés approuvés : ${u?u.name:''} (${r.from} → ${r.to})`);save();render();showToast('Congés approuvés')}
function refuseLeave(id){const r=(state.leaveRequests||[]).find(x=>x.id===id);if(!r)return;r.status='refused';save();render();showToast('Demande refusée')}

<script id="dentalflow-v34-implementation">
(function(){
'use strict';
const V34_SCHEMA_VERSION=6;
const V34_STORAGE_KEY=typeof STORAGE_KEY==='string'?STORAGE_KEY:'dentalflow-next-mockup-state-v4';
const PURCHASE_STATUSES_OPEN=['ordered','confirmed','shipped','partially_received'];

const ENGINE_DEFAULTS={reviewPeriodDays:10,securityMarginDays:1,maxWaitDays:5,minSavings:10,maxCoverageDays:120,dormantCoverageDays:180,dormantNoConsumptionDays:120};
function uid(prefix){return prefix+'-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-'+Date.now().toString(36).toUpperCase()}
function today(){return Clock&&Clock.now?Clock.now():new Date('2026-08-21T10:42:00')}
function ymd(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function atNoon(d){const x=new Date(d);x.setHours(12,0,0,0);return x}
function money(n){return `${Math.round((+n||0)*100)/100} €`}
function dateLong(v){if(!v)return '—';return new Date(v).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'})}
function normId(s){return String(s||'').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'')}
function cloneDeep(x){return JSON.parse(JSON.stringify(x))}
function ensureArray(o,k){if(!Array.isArray(o[k]))o[k]=[];return o[k]}
function eventSeverityColor(s){return {INFO:'blue',WARNING:'orange',ERROR:'red',CRITICAL:'red'}[s]||'gray'}
function actionLabel(a){return {ORDER_NOW:'COMMANDER MAINTENANT',WAIT:'ATTENDRE',NO_ACTION:'AUCUNE ACTION',BLOCKED:'BLOQUÉ'}[a]||a}
function blockingReasonLabel(code){return {no_supplier:'Fournisseur manquant',missing_supplier:'Fournisseur manquant',missing_price:'Tarif fournisseur manquant',minimum_order:'Minimum fournisseur non atteint'}[code]||code}
function isLabWorkingDay(date){const d=new Date(date);const wd=d.getDay();return wd!==0&&wd!==6}
function addLabWorkingDays(date,n){const d=new Date(date);let left=Math.max(0,Number(n)||0);while(left>0){d.setDate(d.getDate()+1);if(isLabWorkingDay(d))left--}return d}
function subLabWorkingDays(date,n){const d=new Date(date);let left=Math.max(0,Number(n)||0);while(left>0){d.setDate(d.getDate()-1);if(isLabWorkingDay(d))left--}return d}
function businessDaysBetween(a,b){let d=new Date(a),end=new Date(b);d.setHours(0,0,0,0);end.setHours(0,0,0,0);let n=0;while(d<end){d.setDate(d.getDate()+1);if(isLabWorkingDay(d))n++}return n}
function coverageDays(stock,daily){daily=+daily||0;if(daily<=0)return stock>0?Infinity:0;return stock/daily}
function landedCost(subtotal,freeShippingThreshold,shippingCost){subtotal=+subtotal||0;shippingCost=+shippingCost||0;if(freeShippingThreshold===null||freeShippingThreshold===undefined)return {shipping:shippingCost,total:subtotal+shippingCost};const shipping=subtotal>=freeShippingThreshold?0:shippingCost;return {shipping,total:subtotal+shipping}}
function roundPack(rawOrderQty,minimumQty,packSize){const pack=Math.max(1,+packSize||1);const required=Math.max(Math.max(+rawOrderQty||0,0),+minimumQty||0);return Math.ceil(required/pack)*pack}
const DEMO_ARTICLES=[
 {id:'ART-ZIR-HT-001',reference:'ZIR-HT-001',label:'Zircone HT',category:'Zircone',unit:'disques',capacity:50,safetyStock:4,averageConsumption:{qty:1,periodWorkingDays:5},active:true,openingQty:5},

 {id:'ART-CER-EMX-003',reference:'CER-EMX-003',label:'Céramique IPS e.max',category:'Céramique',unit:'lingotins',capacity:30,safetyStock:6,averageConsumption:{qty:1,periodWorkingDays:1},active:true,openingQty:3},
 {id:'ART-PMM-TMP-004',reference:'PMM-TMP-004',label:'PMMA temporaire',category:'PMMA',unit:'disques',capacity:40,safetyStock:15,averageConsumption:{qty:3,periodWorkingDays:2},active:true,openingQty:30},

];
const DEMO_SUPPLIERS=[
 {id:'SUP-IVOCLAR',name:'Ivoclar',active:true,leadTimeDays:3,freeShippingThreshold:500,shippingCost:18,minimumOrder:0,notes:'Fournisseur préféré zircone/céramique'},
 {id:'SUP-HENRY',name:'Henry Schein',active:true,leadTimeDays:1,freeShippingThreshold:200,shippingCost:15,minimumOrder:0,notes:'Alternative rapide'},
 {id:'SUP-DENTAL-DIRECT',name:'Dental Direct',active:true,leadTimeDays:5,freeShippingThreshold:null,shippingCost:12,minimumOrder:150,notes:'Pas de franco — transport toujours dû'}
];
const DEMO_ARTICLE_SUPPLIERS=[
 ['ART-ZIR-HT-001','SUP-IVOCLAR','IVO-ZHT',42,1,0,3,true],['ART-ZIR-HT-001','SUP-HENRY','HS-ZHT',46,1,0,1,false],
 ['ART-ADH-CER-008','SUP-IVOCLAR','IVO-ADH',1.2,50,0,3,true],['ART-COL-ZIR-009','SUP-IVOCLAR','IVO-COL',17,4,0,3,true],['ART-DIS-FRA-007','SUP-IVOCLAR','IVO-DIS',18,5,0,3,true],['ART-GLA-LIQ-010','SUP-IVOCLAR','IVO-GLA',14,6,0,3,true],['ART-CER-EMX-003','SUP-IVOCLAR','IVO-EMX',31,10,0,3,true],['ART-PMM-TMP-004','SUP-DENTAL-DIRECT','DD-PMMA',22,10,0,5,true],['ART-CIR-MOD-005','SUP-DENTAL-DIRECT','DD-CIRE',6,10,0,5,true],['ART-ZIR-C4-011','SUP-IVOCLAR','IVO-C4',42,5,0,3,true]
].map(x=>({articleId:x[0],supplierId:x[1],supplierReference:x[2],unitPrice:x[3],packSize:x[4],minimumQty:x[5],leadTimeDays:x[6],preferred:x[7],active:true}));
const BILL_OF_MATERIALS={
 'Bridge 3 éléments':[{articleId:'ART-ZIR-HT-001',qty:2,consumeAtStageId:'STG-003'}],
 'Couronne zircone':[{articleId:'ART-ZIR-HT-001',qty:1,consumeAtStageId:'STG-003'}],
 'Couronne céramo-métallique':[{articleId:'ART-CER-EMX-003',qty:1,consumeAtStageId:'STG-004'},{articleId:'ART-ADH-CER-008',qty:1,consumeAtStageId:'STG-005'}],
 'Facette céramique':[{articleId:'ART-ADH-CER-008',qty:1,consumeAtStageId:'STG-004'}]
};
function findArticle(idOrRef,s=state){return (s.articles||[]).find(a=>a.id===idOrRef||a.reference===idOrRef)||(s.articles||[]).find(a=>normId(a.label)===normId(idOrRef))}
function articleLabel(id,s=state){const a=findArticle(id,s);return a?a.label:id}
function supplierName(id,s=state){if(!id)return 'Fournisseur inconnu';const sp=(s.suppliers||[]).find(x=>x.id===id);return sp?sp.name:id}
function supplierById(id,s=state){return (s.suppliers||[]).find(x=>x.id===id)||null}
function tariffsForArticle(articleId,s=state){return (s.articleSuppliers||[]).filter(x=>x.articleId===articleId&&x.active!==false).map(x=>({...x,supplier:supplierById(x.supplierId,s)})).filter(x=>x.supplier&&x.supplier.active!==false)}
function preferredTariff(articleId,s=state){const list=tariffsForArticle(articleId,s);return list.find(x=>x.preferred)||list[0]||null}
function physicalStock(articleId,s=state){return (s.stockMovements||[]).filter(m=>m.articleId===articleId).reduce((sum,m)=>sum+(+m.qty||0),0)}
function incomingStock(articleId,s=state,h=null){const target=h==null?null:addLabWorkingDays(today(),h).getTime();return (s.purchaseOrders||[]).filter(po=>PURCHASE_STATUSES_OPEN.includes(po.status)).reduce((sum,po)=>{if(target&&new Date(po.expectedAt).getTime()>target)return sum;return sum+(po.lines||[]).filter(l=>l.articleId===articleId).reduce((a,l)=>a+Math.max(0,(+l.orderedQty||0)-(+l.receivedQty||0)),0)},0)}
function dailyDemand(article){const c=article.averageConsumption||{};return (+c.periodWorkingDays||0)>0?(+c.qty||0)/(+c.periodWorkingDays):0}
/* knownDemand — entièrement générique (V3.4.2) : somme des besoins BILL_OF_MATERIALS
   des commandes actives dont l'échéance tombe dans l'horizon, moins les lignes déjà
   réellement consommées (StockMovement CONSUMPTION portant la consumptionKey de cette
   ligne). Aucun article ni scénario n'est traité différemment des autres. */
function knownDemand(articleId,h,s=state){h=+h||0;let total=0;const target=addLabWorkingDays(today(),h);(s.orders||[]).forEach(o=>{if(isOrderCompleted&&isOrderCompleted(o))return;const bom=BILL_OF_MATERIALS[o.type]||[];bom.filter(b=>b.articleId===articleId).forEach(b=>{const key=`${o.id}::${b.articleId}::${b.consumeAtStageId}`;const consumed=(s.stockMovements||[]).some(m=>m.type==='CONSUMPTION'&&m.consumptionKey===key);if(consumed)return;const d=orderDueDate?orderDueDate(o):null;if(!d||d<=target)total+=b.qty})});return total}
function baselineDemand(article,h){return dailyDemand(article)*(+h||0)}
function expectedDemand(articleId,h,s=state){const a=findArticle(articleId,s);if(!a)return 0;return Math.max(knownDemand(articleId,h,s),baselineDemand(a,h))}
function incomingArrivingWithin(articleId,h,s=state){return incomingStock(articleId,s,h)}
function projectedStock(articleId,h,s=state){return physicalStock(articleId,s)+incomingArrivingWithin(articleId,h,s)-expectedDemand(articleId,h,s)}
function stockoutWorkingDays(articleId,s=state,maxH=260){for(let h=0;h<=maxH;h++){if(projectedStock(articleId,h,s)<0)return h}return null}
function stockoutAt(articleId,s=state){const h=stockoutWorkingDays(articleId,s);return h==null?null:addLabWorkingDays(today(),h)}
function reservedStock(articleId,s=state){return knownDemand(articleId,999,s)}
function availableStock(articleId,s=state){return physicalStock(articleId,s)-reservedStock(articleId,s)}
/* slowMovingStock — règle canonique unique du stock dormant (V3.4.2) : couverture
   au-delà de dormantCoverageDays OU aucune consommation réelle dans les
   dormantNoConsumptionDays derniers jours. Tout filtre "Dormants" doit appeler
   cette fonction plutôt que réimplémenter le critère. */
function slowMovingStock(articleId,s=state){
  const a=findArticle(articleId,s);if(!a)return false;
  const cov=coverageDays(availableStock(articleId,s),dailyDemand(a));
  const overCoverage=cov>(s.engineSettings?.dormantCoverageDays??ENGINE_DEFAULTS.dormantCoverageDays);
  const window=(s.engineSettings?.dormantNoConsumptionDays??ENGINE_DEFAULTS.dormantNoConsumptionDays)*86400000;
  const cutoff=Clock.now().getTime()-window;
  const hasRecentConsumption=(s.stockMovements||[]).some(m=>m.articleId===articleId&&m.type==='CONSUMPTION'&&new Date(m.at).getTime()>=cutoff);
  return overCoverage||!hasRecentConsumption;
}
/* evaluateSupplierCandidate — définition CANONIQUE et UNIQUE de la viabilité
   commerciale d'un fournisseur candidat pour un article (V3.4.5). Utilisée à
   la fois par chooseSupplier() (bascule d'urgence quand le fournisseur
   préféré arrive trop tard) et par la seconde passe de computeNeeds()
   (minimum de commande du fournisseur préféré non atteint). Avant V3.4.5 ces
   deux endroits contenaient deux algorithmes différents : la seconde passe
   de computeNeeds() ne vérifiait ni le minimum de commande du candidat ni
   son coût rendu, et pouvait rerouter une ligne urgente vers le fournisseur
   le plus rapide même si CE fournisseur restait lui-même sous son propre
   minimum de commande (→ la proposition finissait BLOCKED alors qu'un autre
   fournisseur était réellement commandable). Un candidat n'est viable que
   si : le fournisseur et son tarif existent et sont actifs, le prix
   unitaire est un nombre fini connu, packSize/minimumQty sont des valeurs
   valides, il livre avant la date de rupture (si fournie), ET son
   sous-total — recalculé avec SES PROPRES leadTimeDays/minimumQty/packSize,
   jamais la quantité d'un autre fournisseur — atteint SON PROPRE
   minimumOrder. DentalFlow n'ajoute jamais d'article supplémentaire ni
   n'augmente artificiellement une quantité pour atteindre un minimum. */
function evaluateSupplierCandidate(articleId,tariff,stockoutAt,s=state){
  const article=findArticle(articleId,s);
  const supplier=tariff&&(tariff.supplier||supplierById(tariff.supplierId,s));
  if(!article||!tariff||!supplier||supplier.active===false||tariff.active===false){
    return {viable:false,supplierId:tariff?tariff.supplierId:null,tariff,supplier:supplier||null,leadTimeDays:null,suggestedQty:0,rawOrderQty:0,projectedStock:null,subtotal:0,shippingCost:0,landedCost:0,expectedAt:null,arrivesInTime:false,minimumOrderReached:false,priceOk:false,blockingReasons:['invalid_candidate']};
  }
  const blockingReasons=[];
  const leadTimeDays=tariff.leadTimeDays??supplier.leadTimeDays??0;
  const expectedAt=addLabWorkingDays(today(),leadTimeDays);
  const arrivesInTime=stockoutAt?expectedAt<=stockoutAt:true;
  if(!arrivesInTime)blockingReasons.push('too_late');
  const priceOk=tariff.unitPrice!=null&&Number.isFinite(+tariff.unitPrice);
  if(!priceOk)blockingReasons.push('missing_price');
  const packSizeOk=tariff.packSize==null||(Number.isFinite(+tariff.packSize)&&+tariff.packSize>0);
  if(!packSizeOk)blockingReasons.push('invalid_pack_size');
  const minimumQtyOk=tariff.minimumQty==null||(Number.isFinite(+tariff.minimumQty)&&+tariff.minimumQty>=0);
  if(!minimumQtyOk)blockingReasons.push('invalid_minimum_qty');
  const horizon=leadTimeDays+ENGINE_DEFAULTS.reviewPeriodDays;
  const projectedStockAtDelivery=projectedStock(articleId,horizon,s);
  const rawOrderQty=Math.max(0,article.safetyStock-projectedStockAtDelivery);
  const suggestedQty=(packSizeOk&&minimumQtyOk)?roundPack(rawOrderQty,tariff.minimumQty,tariff.packSize):0;
  const subtotal=suggestedQty*(priceOk?+tariff.unitPrice:0);
  const lc=landedCost(subtotal,supplier.freeShippingThreshold,supplier.shippingCost);
  const minimumOrderReached=!(supplier.minimumOrder>0)||subtotal>=supplier.minimumOrder;
  if(!minimumOrderReached)blockingReasons.push('minimum_order_not_reached');
  const viable=arrivesInTime&&priceOk&&packSizeOk&&minimumQtyOk&&minimumOrderReached;
  return {viable,supplierId:tariff.supplierId,tariff,supplier,leadTimeDays,suggestedQty,rawOrderQty,projectedStock:projectedStockAtDelivery,subtotal,shippingCost:lc.shipping,landedCost:lc.total,expectedAt,arrivesInTime,minimumOrderReached,priceOk,blockingReasons};
}
/* chooseSupplier — un fournisseur alternatif n'est retenu que s'il est
   réellement commandable (V3.4.4, viabilité canonique déplacée dans
   evaluateSupplierCandidate en V3.4.5) : prix connu, livraison à temps, ET
   son PROPRE minimum de commande respecté pour la quantité recalculée avec
   SES propres leadTimeDays/minimumQty/packSize (jamais la quantité du
   fournisseur préféré réutilisée aveuglément). Un candidat plus rapide qui
   ne respecte pas son minimum n'est PAS viable — DentalFlow n'ajoute pas de

/* approveProposal — une proposition BLOCKED (recommendedAction==='BLOCKED' ou
   blocking non vide) ne peut JAMAIS être convertie en PurchaseOrder (V3.4.3).
   L'ID de commande provient toujours de nextPOId() ; aucune correspondance
   spéciale id→numéro de commande n'existe côté moteur. */
function approveProposal(id){

  if(!p||!PROPOSAL_OPEN.includes(p.status))return null;
  if(p.recommendedAction==='BLOCKED'||(p.blocking&&p.blocking.length)){
    logActivity({type:'PURCHASE',severity:'WARNING',source:'USER_ACTION',entityType:'PurchaseProposal',entityId:p.id,title:'Validation refusée',message:`${p.id} bloquée (${(p.blocking||[]).join(', ')||'raison inconnue'}) — aucune commande créée.`});

    return {success:false,reason:'BLOCKED_PROPOSAL'};
  }
  const poId=nextPOId(state);
  const po={id:poId,supplierId:p.supplierId,proposalId:p.id,createdAt:Clock.iso(),expectedAt:addLabWorkingDays(today(),(supplierById(p.supplierId)||{}).leadTimeDays||3).toISOString(),status:'ordered',migrationSource:null,dataQualityFlags:[],lines:p.lines.map(l=>({articleId:l.articleId,orderedQty:l.suggestedQty,receivedQty:0,unitPrice:l.unitPrice,lineTotal:l.lineTotal})),subtotal:p.subtotal,shipping:p.shippingCost,total:p.total,userId:'U1'};

  reconcileProposals(state);save();render();showToast(`${po.id} créée`);return po;
}
/* receivePurchaseOrder — deux garde-fous indépendants s'appliquent (V3.4.4
   ajoute le premier, V3.4.3 avait déjà le second) :
   1) PO RECEIVABLE ? seul un statut de PURCHASE_STATUSES_OPEN peut encore
      recevoir quoi que ce soit — une PO cancelled ou received est un état
      terminal, aucune réception ne doit jamais la faire muter à nouveau.
   2) QTY VALID AND <= REMAINING ? (V3.4.3) l'invariant "reçu ne dépasse
      jamais le reliquat commandé" est appliqué ICI, dans la fonction
      métier, pas seulement via l'attribut max de l'input UI. Toute ligne
      demandant plus que orderedQty-receivedQty, ou une quantité non
      numérique/négative/NaN/Infinity, est REFUSÉE intégralement : aucun
      StockMovement RECEIPT n'est créé pour cette ligne, aucun stock
      artificiel. */
function receivePurchaseOrder(id,receipts){
  const po=state.purchaseOrders.find(x=>x.id===id);if(!po)return null;
  if(!PURCHASE_STATUSES_OPEN.includes(po.status)){
    logActivity({type:'STOCK',severity:'WARNING',source:'USER_ACTION',entityType:'PurchaseOrder',entityId:po.id,title:'Réception refusée',message:`${po.id} n'est plus réceptionnable (statut ${po.status}).`});
    save();
    return {success:false,reason:'PO_NOT_RECEIVABLE',status:po.status};
  }
  receipts=receipts||{};const rejected=[];
  (po.lines||[]).forEach(l=>{
    const raw=receipts[l.articleId]??receipts[l.articleId.replace('ART-','')];
    if(raw===undefined||raw===null||raw==='')return;
    const qty=Number(raw);
    const remainingLine=Math.max(0,(+l.orderedQty||0)-(+l.receivedQty||0));
    if(!Number.isFinite(qty)||qty<=0){rejected.push({articleId:l.articleId,requested:raw,reason:'INVALID_QTY'});return}
    if(qty>remainingLine){rejected.push({articleId:l.articleId,requested:qty,remaining:remainingLine,reason:'EXCEEDS_REMAINING'});return}
    l.receivedQty=(+l.receivedQty||0)+qty;
    state.stockMovements.push({id:uid('MOV'),at:Clock.iso(),articleId:l.articleId,type:'RECEIPT',qty,reason:`Réception ${po.id}`,sourceType:'purchaseOrder',sourceId:po.id,consumptionKey:null,userId:'U1'});
    logActivity({type:'STOCK',severity:'INFO',source:'USER_ACTION',entityType:'PurchaseOrder',entityId:po.id,title:'Réception fournisseur',message:`${qty}/${l.orderedQty} ${articleLabel(l.articleId)} reçus.`});
  });
  if(rejected.length){
    logActivity({type:'STOCK',severity:'WARNING',source:'USER_ACTION',entityType:'PurchaseOrder',entityId:po.id,title:'Réception refusée',message:`Quantité reçue supérieure au reliquat commandé ou invalide pour ${rejected.length} ligne(s) de ${po.id}.`,metadata:{rejected}});
  }
  const remaining=(po.lines||[]).reduce((s,l)=>s+Math.max(0,(+l.orderedQty||0)-(+l.receivedQty||0)),0);
  po.status=remaining>0?'partially_received':'received';
  reconcileProposals(state);save();render();
  return {...po,rejected};
}

function validateImportRows(type,rows){const errors=[];const valid=[];rows.forEach(r=>{const rowErrors=[];function req(k){if(!String(r[k]??'').trim())rowErrors.push({rowNumber:r.__row,column:k,rawValue:r[k],code:'MISSING_REQUIRED',message:`${k} requis`})}function num(k){if(r[k]!==undefined&&r[k]!==''&&isNaN(Number(String(r[k]).replace(',','.'))))rowErrors.push({rowNumber:r.__row,column:k,rawValue:r[k],code:'INVALID_NUMBER',message:`${k} doit être numérique`})}if(type==='articles'){req('reference');req('label');num('safetystock');if((state.articles||[]).some(a=>a.reference===r.reference))rowErrors.push({rowNumber:r.__row,column:'reference',rawValue:r.reference,code:'DUPLICATE_REFERENCE',message:'Référence déjà existante'})}if(type==='stocks'){req('reference');num('stock');if(!findArticle(r.reference))rowErrors.push({rowNumber:r.__row,column:'reference',rawValue:r.reference,code:'UNKNOWN_ARTICLE',message:'Article inconnu'});if(Number(r.stock)<0)rowErrors.push({rowNumber:r.__row,column:'stock',rawValue:r.stock,code:'NEGATIVE_QTY',message:'Stock négatif refusé'})}if(type==='fournisseurs'){req('name');num('leadtime');num('shippingcost')}if(type==='tarifs'){req('reference');req('supplier');num('unitprice');if(!findArticle(r.reference))rowErrors.push({rowNumber:r.__row,column:'reference',rawValue:r.reference,code:'UNKNOWN_ARTICLE',message:'Article inconnu'});if(!state.suppliers.some(s=>normId(s.name)===normId(r.supplier)||s.id===r.supplier))rowErrors.push({rowNumber:r.__row,column:'supplier',rawValue:r.supplier,code:'UNKNOWN_SUPPLIER',message:'Fournisseur inconnu'})}if(type==='commandes'){req('reference');req('type');if(r.reference&&(state.orders||[]).some(o=>o.id===r.reference))rowErrors.push({rowNumber:r.__row,column:'reference',rawValue:r.reference,code:'DUPLICATE_REFERENCE',message:'Commande déjà existante'})}if(type==='utilisateurs'){req('name');req('role');if(r.assignedstageid&&!(state.stageDefinitions||[]).some(sd=>sd.id===r.assignedstageid))rowErrors.push({rowNumbe /* Scénarios WAIT -> ORDER_NOW et retour au fournisseur préféré.
   Fixture isolée (§39) : le carnet réel de commandes du POC varie et ne doit
   jamais être un paramètre caché du moteur — on construit donc un jeu de
   VRAIES commandes contrôlé, on l'exécute avec le moteur générique tel quel
   (aucune branche spécifique à un article ou à un scénario), puis on restaure
   l'état exact. Les assertions portent sur des invariants structurels
   (bascule de fournisseur, hausse de quantité, dismissal) et non sur des
   constantes numériques recopiées d'une spec. */
function purchaseFixtureFor(articleId,fn){
  const bak=cloneDeep(serializableState());
  try{
    state.purchaseScenarioUrgent=false;
    state.orders=[];
    state.purchaseOrders=[];
    state.purchaseProposals=[];
    // Neutralise tous les AUTRES articles (une proposition regroupe tout le
    // panier d'un même fournisseur préféré — §1 du corrigendum — donc sans
    // cela l'urgence propre d'un autre article contaminerait le scénario)
    // en les remontant à une couverture confortable, puis ramène l'article
    // testé à un stock bas et contrôlé pour que le scénario soit
    // reproductible quel que soit le seed courant.
    (state.articles||[]).forEach(a=>{
      const target=a.id===articleId?2:Math.max(3*(a.safetyStock||0),10);
      const cur=physicalStock(a.id);
      if(cur!==target)state.stockMovements.push({id:uid('MOV'),at:Clock.iso(),articleId:a.id,type:'ADJUSTMENT',qty:target-cur,reason:'Fixture test achats',sourceType:'test',sourceId:'FIXTURE',consumptionKey:null,userId:null});
    });
    const out=fn();
    Object.assign(state,{...state,...bak});
    return out;
  }catch(e){Object.assign(state,{...state,...bak});return {pass:false,error:e.message}}
}
/* runDemoScenario — reproduit le scénario de référence V1.2.1 (WAIT chez le

   l'article testé sont fixés explicitement (comme physicalStock l'est déjà
   par purchaseFixtureFor), afin que le moteur générique produise strictement
   qtyBefore=5 puis qtyAfter=9 — jamais une comparaison ">=" qui masquerait
   une régression de quantité (V3.4.3, corrige un faux positif de l'audit).
   L'urgence ajoute réellement 2 commandes "Bridge 3 éléments" (BOM ×2 chacune

    const qtyBefore=pp1?(pp1.lines.find(l=>l.articleId==='ART-ZIR-HT-001')||{}).suggestedQty:null;
    const initial=!!pp1&&pp1.recommendedAction==='WAIT';

    deriveOrderModel(state.orders[state.orders.length-1]);
    reconcileProposals(state);
    const ppHenry=state.purchaseProposals.find(p=>p.supplierId==='SUP-HENRY'&&PROPOSAL_OPEN.includes(p.status)&&p.lines.some(l=>l.articleId==='ART-ZIR-HT-001'));
    const ppIvoAfter=state.purchaseProposals.find(p=>p.supplierId==='SUP-IVOCLAR'&&PROPOSAL_OPEN.includes(p.status));
    const qtyAfter=ppHenry?(ppHenry.lines.find(l=>l.articleId==='ART-ZIR-HT-001')||{}).suggestedQty:null;
    const strictQty=Number(qtyBefore)===5&&Number(qtyAfter)===9;

      received=!!po2&&po2.status==='partially_received'&&incomingStock('ART-ZIR-HT-001')===1&&physicalStock('ART-ZIR-HT-001')===2+(line.orderedQty-1);

  });

  state.articleSuppliers.push({articleId:artId,supplierId:supC,supplierReference:'C-PACK2',unitPrice:13,packSize:1,minimumQty:1,leadTimeDays:1,preferred:false,active:true});
  state.stockMovements.push({id:'MOV-PACK2-'+uid('T'),at:Clock.iso(),articleId:artId,type:'OPENING',qty:1,reason:'test',sourceType:'test',sourceId:'PACK2',consumptionKey:null,userId:null});

  const ppB=state.purchaseProposals.find(p=>p.supplierId===supB&&PROPOSAL_OPEN.includes(p.status)&&(p.lines||[]).some(l=>l.articleId===artId));

/* runV341PersistenceVerify — vérifie que chaque donnée custom a survécu au
